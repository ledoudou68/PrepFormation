<!DOCTYPE html>
<html lang="fr">

<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <?!= include('CSS'); ?>
</head>

<body>

  <div id="loader" class="loader-overlay masque">
    <div class="spinner"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div
    id="modalAccesAdministrateur"
    class="modal-overlay masque"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titreModalAccesAdministrateur"
  >
    <div class="modal-contenu modal-acces-administrateur">
      <div class="modal-entete">
        <div>
          <h2 id="titreModalAccesAdministrateur">
            Accès administrateur
          </h2>
          <p>
            La session sera verrouillée après 30 minutes d’inactivité.
          </p>
        </div>
        <button
          type="button"
          class="bouton-fermer-modal"
          onclick="fermerModalAccesAdministrateur()"
          aria-label="Fermer"
        >×</button>
      </div>

      <form onsubmit="soumettreAccesAdministrateur(event)">
        <div class="modal-corps">
          <div class="groupe-champ">
            <label for="motDePasseAdministrateur">
              Mot de passe administrateur
            </label>
            <input
              type="password"
              id="motDePasseAdministrateur"
              class="champ"
              autocomplete="off"
              required
            >
          </div>
        </div>

        <div class="modal-pied">
          <button
            type="button"
            class="bouton-secondaire"
            onclick="fermerModalAccesAdministrateur()"
          >Annuler</button>
          <button
            type="submit"
            id="boutonValiderAccesAdministrateur"
            class="bouton-principal"
          >Déverrouiller</button>
        </div>
      </form>
    </div>
  </div>

  <header class="topbar">

    <button
      type="button"
      id="boutonMenuMobile"
      class="bouton-menu-mobile"
      onclick="basculerMenu()"
      aria-label="Ouvrir le menu"
      aria-controls="menuLateral"
      aria-expanded="false"
    >
      ☰
    </button>

    <div>
      <div class="titre-application">
        <span class="titre-application-long">PrepFormation</span>
        <span class="titre-application-court" aria-hidden="true">Prep</span>
      </div>
      <div class="sous-titre">Suivi des préparations</div>
    </div>

    <div id="conteneurRechercheGlobale" class="conteneur-recherche-globale">
      <button
        type="button"
        class="bouton-ouvrir-recherche-mobile"
        onclick="ouvrirRechercheGlobaleMobile()"
        aria-label="Ouvrir la recherche globale"
      >⌕</button>

      <div class="champ-recherche-globale">
        <span class="icone-recherche-globale" aria-hidden="true">⌕</span>
        <input
          type="search"
          id="champRechercheGlobale"
          placeholder="Rechercher dans PrepFormation…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Rechercher dans PrepFormation"
          aria-controls="panneauRechercheGlobale"
          aria-expanded="false"
          aria-autocomplete="list"
          oninput="programmerRechercheGlobale()"
          onkeydown="gererClavierRechercheGlobale(event)"
          onfocus="gererFocusRechercheGlobale()"
        >
        <span
          id="chargementRechercheGlobale"
          class="chargement-recherche-globale masque"
          aria-label="Recherche en cours"
        ></span>
        <button
          type="button"
          class="bouton-fermer-recherche-globale"
          onclick="fermerRechercheGlobale()"
          aria-label="Fermer la recherche"
        >×</button>
      </div>

      <section
        id="panneauRechercheGlobale"
        class="panneau-recherche-globale masque"
        aria-label="Résultats de la recherche globale"
      >
        <header class="entete-recherche-mobile">
          <strong>Recherche globale</strong>
          <button
            type="button"
            onclick="fermerRechercheGlobale()"
            aria-label="Fermer"
          >×</button>
        </header>
        <div
          id="contenuRechercheGlobale"
          class="contenu-recherche-globale"
          role="listbox"
          aria-live="polite"
        >
          Saisissez au moins 2 caractères.
        </div>
      </section>
    </div>

    <div id="conteneurFavoris" class="conteneur-favoris">
      <button
        type="button"
        id="boutonOuvrirFavoris"
        class="bouton-ouvrir-favoris"
        onclick="basculerPanneauFavoris()"
        aria-controls="panneauFavoris"
        aria-expanded="false"
      >
        <span aria-hidden="true">★</span>
        <span class="libelle-bouton-favoris">Favoris</span>
        <span
          id="compteurFavorisTopbar"
          class="compteur-favoris-topbar masque"
        >0</span>
      </button>

      <aside
        id="panneauFavoris"
        class="panneau-favoris masque"
        aria-label="Mes favoris"
      >
        <header class="entete-panneau-favoris">
          <div>
            <strong>Mes favoris</strong>
            <small>Accès rapide depuis ce navigateur</small>
          </div>
          <button
            type="button"
            onclick="fermerPanneauFavoris()"
            aria-label="Fermer les favoris"
          >×</button>
        </header>
        <div
          id="contenuFavoris"
          class="contenu-favoris"
          aria-live="polite"
        >
          <div class="etat-favoris">Chargement des favoris…</div>
        </div>
      </aside>
    </div>

    <div class="actions-acces-administration">
      <button
        type="button"
        id="boutonAccesAdministrateur"
        class="bouton-acces-administrateur"
        onclick="ouvrirModalAccesAdministrateur()"
        aria-label="Accès administrateur"
      >
        <span class="icone-acces-administration" aria-hidden="true">🔒</span>
        <span class="libelle-acces-administration">Accès administrateur</span>
      </button>

      <button
        type="button"
        id="boutonVerrouillerAdministration"
        class="bouton-verrouiller-administration masque"
        onclick="verrouillerAdministrationInterface()"
        aria-label="Verrouiller l’administration"
      >
        <span class="icone-acces-administration" aria-hidden="true">🔓</span>
        <span class="libelle-acces-administration">Verrouiller l’administration</span>
      </button>
    </div>

    <div
      id="identiteUtilisateurApplication"
      class="identite-utilisateur-application"
      aria-live="polite"
    >Mode formateur</div>

  </header>

  <div class="application">

    <aside id="menuLateral" class="menu-lateral">

      <div
        id="identiteUtilisateurMenuMobile"
        class="identite-utilisateur-menu-mobile"
        aria-live="polite"
      >Mode formateur</div>

      <button
        type="button"
        class="menu-item actif"
        data-page="Accueil"
      >
        <span class="menu-icone">⌂</span>
        <span>Accueil</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="Stagiaires"
      >
        <span class="menu-icone">👨‍🚒</span>
        <span>Stagiaires</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="Formateurs"
      >
        <span class="menu-icone">👨‍🏫</span>
        <span>Formateurs</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="Sessions"
      >
        <span class="menu-icone">📅</span>
        <span>Sessions</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="Calendrier"
      >
        <span class="menu-icone">▦</span>
        <span>Calendrier</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="Statistiques"
      >
        <span class="menu-icone">▥</span>
        <span>Statistiques</span>
      </button>

      <button
        type="button"
        class="menu-item"
        data-page="AssistantPedagogique"
      >
        <span class="menu-icone">◎</span>
        <span>Assistant pédagogique</span>
      </button>

      <button
        type="button"
        class="menu-item masque"
        data-page="Referentiel"
        data-admin-only="true"
      >
        <span class="menu-icone">📚</span>
        <span>Référentiel</span>
      </button>

      <button
        type="button"
        class="menu-item masque"
        data-page="Indemnisation"
        data-admin-only="true"
      >
        <span class="menu-icone">€</span>
        <span>Indemnisations</span>
      </button>

      <button
        type="button"
        class="menu-item masque"
        data-page="Administration"
        data-admin-only="true"
      >
        <span class="menu-icone">⚙</span>
        <span>Administration</span>
      </button>

    </aside>

    <button
      type="button"
      id="voileMenuMobile"
      class="voile-menu-mobile masque"
      onclick="fermerMenuMobile()"
      aria-label="Fermer le menu"
      tabindex="-1"
    ></button>

    <main id="contenu" class="contenu-principal">
      <div class="chargement-page">
        Chargement…
      </div>
    </main>

  </div>

  <?!= include('JavaScript'); ?>

</body>

</html>

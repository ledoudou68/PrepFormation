function changerOngletFicheStagiaire(nomOnglet) {
  const modal = document.getElementById('modalFicheStagiaire');
  const onglet = nomOnglet === 'analyse' ? 'analyse' : 'parcours';

  if (!modal) {
    return;
  }

  modal
    .querySelectorAll('[data-onglet-fiche-stagiaire]')
    .forEach(function (bouton) {
      const actif = bouton.dataset.ongletFicheStagiaire === onglet;
      bouton.classList.toggle('actif', actif);
      bouton.setAttribute('aria-selected', actif ? 'true' : 'false');
    });

  modal
    .querySelectorAll('[data-contenu-onglet-fiche-stagiaire]')
    .forEach(function (contenu) {
      contenu.classList.toggle(
        'masque',
        contenu.dataset.contenuOngletFicheStagiaire !== onglet
      );
    });

  if (onglet === 'analyse') {
    chargerAnalysePedagogiqueFicheStagiaire(false);
  }
}


function actualiserAnalysePedagogiqueFicheStagiaire() {
  chargerAnalysePedagogiqueFicheStagiaire(true);
}


function chargerAnalysePedagogiqueFicheStagiaire(
  forcerActualisation
) {
  const modal = document.getElementById('modalFicheStagiaire');
  const etat = etatApplication.analysePedagogiqueFicheStagiaire;

  if (
    !modal ||
    !etat ||
    modal.dataset.uuid !== etat.uuid ||
    etat.chargement ||
    (etat.chargee && !forcerActualisation)
  ) {
    return;
  }

  const generation = ++etat.generation;
  etat.chargement = true;
  basculerChargementAnalysePedagogiqueFicheStagiaire_(true);
  masquerErreurAnalysePedagogiqueFicheStagiaire_();

  google.script.run
    .withSuccessHandler(function (donnees) {
      const modalCourante = document.getElementById(
        'modalFicheStagiaire'
      );
      const etatCourant =
        etatApplication.analysePedagogiqueFicheStagiaire;

      if (
        !modalCourante ||
        !etatCourant ||
        etatCourant !== etat ||
        modalCourante.dataset.uuid !== etat.uuid ||
        generation !== etat.generation
      ) {
        return;
      }

      etat.chargement = false;
      etat.chargee = true;
      etat.donnees = donnees || {};
      etat.filtreDetail = 'TOUS';
      basculerChargementAnalysePedagogiqueFicheStagiaire_(false);
      afficherAnalysePedagogiqueFicheStagiaire(etat.donnees);
    })
    .withFailureHandler(function (erreur) {
      const modalCourante = document.getElementById(
        'modalFicheStagiaire'
      );
      const etatCourant =
        etatApplication.analysePedagogiqueFicheStagiaire;

      if (
        !modalCourante ||
        !etatCourant ||
        etatCourant !== etat ||
        generation !== etat.generation
      ) {
        return;
      }

      etat.chargement = false;
      basculerChargementAnalysePedagogiqueFicheStagiaire_(false);
      afficherErreurAnalysePedagogiqueFicheStagiaire_(erreur);
    })
    .getAnalysePedagogiqueStagiaire(
      etat.uuid,
      {
        forcerActualisation: Boolean(forcerActualisation)
      },
      obtenirJetonUtilisateurApplication()
    );
}


function basculerChargementAnalysePedagogiqueFicheStagiaire_(actif) {
  const chargement = document.getElementById(
    'chargementAnalysePedagogiqueFiche'
  );
  const bouton = document.getElementById(
    'boutonActualiserAnalysePedagogiqueFiche'
  );

  chargement?.classList.toggle('masque', !actif);
  if (bouton) {
    bouton.disabled = actif;
    bouton.textContent = actif
      ? 'Calcul en cours…'
      : 'Actualiser l’analyse';
  }
}


function masquerErreurAnalysePedagogiqueFicheStagiaire_() {
  const zone = document.getElementById(
    'erreurAnalysePedagogiqueFiche'
  );
  if (zone) {
    zone.classList.add('masque');
    zone.innerHTML = '';
  }
}


function afficherErreurAnalysePedagogiqueFicheStagiaire_(erreur) {
  const zone = document.getElementById(
    'erreurAnalysePedagogiqueFiche'
  );
  const contenu = document.getElementById(
    'contenuAnalysePedagogiqueFiche'
  );
  const etatVide = document.getElementById(
    'etatVideAnalysePedagogiqueFiche'
  );
  const etat = etatApplication.analysePedagogiqueFicheStagiaire;
  const message = extraireMessageErreur(erreur);

  if (zone) {
    zone.classList.remove('masque');
    zone.innerHTML = `
      <strong>Analyse pédagogique indisponible</strong>
      <p>${echapperHtml(message)}</p>
      <button
        type="button"
        class="bouton-secondaire"
        onclick="actualiserAnalysePedagogiqueFicheStagiaire()"
      >
        Réessayer
      </button>
    `;
  }

  if (!etat || !etat.chargee || !etat.donnees) {
    contenu?.classList.add('masque');
    etatVide?.classList.add('masque');
  }
}


function afficherAnalysePedagogiqueFicheStagiaire(donnees) {
  const synthese = donnees && donnees.synthese
    ? donnees.synthese
    : {};
  const sansDonnees = analysePedagogiqueSansDonnees_(donnees);
  const contenu = document.getElementById(
    'contenuAnalysePedagogiqueFiche'
  );
  const etatVide = document.getElementById(
    'etatVideAnalysePedagogiqueFiche'
  );

  afficherMetadonneesAnalysePedagogiqueFiche_(donnees.meta || {});
  afficherAvertissementsAnalysePedagogiqueFiche_(donnees);
  masquerErreurAnalysePedagogiqueFicheStagiaire_();
  contenu?.classList.toggle('masque', sansDonnees);
  etatVide?.classList.toggle('masque', !sansDonnees);

  if (sansDonnees) {
    return;
  }

  definirTexteAnalysePedagogique_(
    'phraseSyntheseAnalysePedagogiqueFiche',
    construirePhraseSyntheseAnalysePedagogique_(donnees)
  );
  definirTexteAnalysePedagogique_(
    'analyseNombreSeances',
    Number(synthese.nombreSeances) || 0
  );
  definirTexteAnalysePedagogique_(
    'analysePremiereSeance',
    afficherDateFrancaise(synthese.premiereSeance) || '—'
  );
  definirTexteAnalysePedagogique_(
    'analyseDerniereSeance',
    afficherDateFrancaise(synthese.derniereSeance) || '—'
  );
  definirTexteAnalysePedagogique_(
    'analyseJoursDerniereSeance',
    formaterJoursAnalysePedagogique_(
      synthese.joursDepuisDerniereSeance
    )
  );
  definirTexteAnalysePedagogique_(
    'analyseItemsActifs',
    Number(synthese.nombreItemsReferentielActifs) || 0
  );
  definirTexteAnalysePedagogique_(
    'analyseItemsTravailles',
    Number(synthese.nombreItemsTravailles) || 0
  );
  definirTexteAnalysePedagogique_(
    'analyseItemsAcquis',
    Number(synthese.nombreItemsAcquis) || 0
  );
  definirTexteAnalysePedagogique_(
    'analyseItemsJamaisTravailles',
    Array.isArray(synthese.itemsJamaisTravailles)
      ? synthese.itemsJamaisTravailles.length
      : 0
  );
  definirTexteAnalysePedagogique_(
    'analyseItemsJamaisAcquis',
    Array.isArray(synthese.itemsJamaisAcquis)
      ? synthese.itemsJamaisAcquis.length
      : 0
  );

  afficherResumeVisuelAnalysePedagogiqueFiche_(donnees);
  afficherVisualisationCategoriesAnalysePedagogiqueFiche_(donnees);
  afficherProgressionChronologiqueAnalysePedagogiqueFiche_(donnees);
  afficherActiviteMensuelleAnalysePedagogiqueFiche_(donnees);
  afficherRecommandationsAnalysePedagogiqueFiche_(donnees);
  afficherPointsFortsAnalysePedagogiqueFiche_(
    Array.isArray(donnees.pointsForts) ? donnees.pointsForts : []
  );
  afficherPointsFaiblesAnalysePedagogiqueFiche_(
    Array.isArray(donnees.pointsFaibles) ? donnees.pointsFaibles : []
  );
  afficherItemsOubliesAnalysePedagogiqueFiche_(donnees);
  appliquerFiltreDetailAnalysePedagogique('TOUS');
}


function naviguerVersSectionAnalysePedagogique_(identifiant) {
  const section = document.getElementById(identifiant);

  if (section && typeof section.scrollIntoView === 'function') {
    section.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
  }
}


function afficherResumeVisuelAnalysePedagogiqueFiche_(donnees) {
  const zone = document.getElementById(
    'resumeVisuelAnalysePedagogiqueFiche'
  );
  if (!zone) {
    return;
  }

  const synthese = donnees && donnees.synthese
    ? donnees.synthese
    : {};
  const total = Math.max(
    0,
    Number(synthese.nombreItemsReferentielActifs) || 0
  );
  const valeurs = [
    {
      libelle: 'Items travaillés',
      valeur: Number(synthese.nombreItemsTravailles) || 0,
      classe: 'jauge-travail-analyse'
    },
    {
      libelle: 'Items acquis',
      valeur: Number(synthese.nombreItemsAcquis) || 0,
      classe: 'jauge-acquis-analyse'
    },
    {
      libelle: 'Items prioritaires',
      valeur: Array.isArray(donnees.itemsPrioritaires)
        ? donnees.itemsPrioritaires.length
        : 0,
      classe: 'jauge-priorite-analyse'
    },
    {
      libelle: 'Items oubliés',
      valeur: Array.isArray(donnees.itemsOublies)
        ? donnees.itemsOublies.length
        : 0,
      classe: 'jauge-oubli-analyse'
    }
  ];

  zone.innerHTML = `
    <div class="grille-jauges-analyse-pedagogique">
      ${valeurs.map(function (indicateur) {
        return creerJaugeAnalysePedagogique_(
          indicateur.libelle,
          indicateur.valeur,
          total,
          indicateur.classe
        );
      }).join('')}
    </div>
  `;
}


function creerJaugeAnalysePedagogique_(libelle, valeur, total, classe) {
  const nombre = Math.max(0, Number(valeur) || 0);
  const pourcentage = total > 0
    ? Math.min(100, Math.round(nombre / total * 1000) / 10)
    : null;
  const textePourcentage = pourcentage === null
    ? 'Non calculable'
    : formaterTauxAnalysePedagogique_(pourcentage);

  return `
    <article class="jauge-analyse-pedagogique ${classe}">
      <header>
        <span>${echapperHtml(libelle)}</span>
        <strong>${nombre} / ${total} · ${echapperHtml(textePourcentage)}</strong>
      </header>
      <div
        class="piste-jauge-analyse-pedagogique"
        role="progressbar"
        aria-label="${echapperHtml(libelle)}"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="${pourcentage === null ? 0 : pourcentage}"
        aria-valuetext="${nombre} sur ${total}, ${echapperHtml(textePourcentage)}"
      >
        <span style="width: ${pourcentage === null ? 0 : pourcentage}%"></span>
      </div>
    </article>
  `;
}


function afficherVisualisationCategoriesAnalysePedagogiqueFiche_(donnees) {
  const zone = document.getElementById(
    'visualisationCategoriesAnalysePedagogiqueFiche'
  );
  if (!zone) {
    return;
  }

  const agregats = Array.isArray(donnees.agregatsParCategorie)
    ? donnees.agregatsParCategorie.map(function (agregat) {
      const valeurBrute = agregat.pourcentageAcquisition;
      return Object.assign({}, agregat, {
        pourcentageAcquisition:
          valeurBrute === null || valeurBrute === undefined
            ? null
            : Math.max(0, Math.min(100, Number(valeurBrute) || 0))
      });
    })
    : [];

  if (!agregats.length) {
    zone.innerHTML = creerEtatVideAnalysePedagogique_(
      'Aucune catégorie active n’est disponible pour cette formation.'
    );
    return;
  }

  const valeursExploitables = agregats.filter(function (agregat) {
    return agregat.pourcentageAcquisition !== null;
  });
  const afficherRadar = agregats.length >= 3 &&
    agregats.length <= 10 &&
    valeursExploitables.length > 0;
  const graphique = afficherRadar
    ? creerRadarCategoriesAnalysePedagogique_(agregats)
    : creerBarresCategoriesAnalysePedagogique_(agregats);
  const explication = agregats.length > 10
    ? '<p class="note-visualisation-analyse">Les barres sont utilisées pour préserver la lisibilité des nombreuses catégories.</p>'
    : agregats.length < 3
      ? '<p class="note-visualisation-analyse">Moins de trois catégories : présentation en barres horizontales.</p>'
      : !valeursExploitables.length
        ? '<p class="note-visualisation-analyse">Aucun pourcentage calculable : le radar n’est pas affiché.</p>'
        : '';

  zone.innerHTML = `
    ${explication}
    ${graphique}
    ${creerTableauCategoriesAnalysePedagogique_(agregats)}
  `;
}


function creerRadarCategoriesAnalysePedagogique_(agregats) {
  const largeur = 720;
  const hauteur = 520;
  const centreX = 360;
  const centreY = 250;
  const rayon = 170;

  function point(position, proportion, marge) {
    const angle = -Math.PI / 2 +
      position * Math.PI * 2 / agregats.length;
    const distance = rayon * proportion + (marge || 0);
    return {
      x: centreX + Math.cos(angle) * distance,
      y: centreY + Math.sin(angle) * distance,
      cosinus: Math.cos(angle)
    };
  }

  const niveaux = [25, 50, 75, 100].map(function (niveau) {
    const points = agregats.map(function (_agregat, position) {
      const coordonnees = point(position, niveau / 100, 0);
      return coordonnees.x.toFixed(1) + ',' +
        coordonnees.y.toFixed(1);
    }).join(' ');
    return `<polygon points="${points}" class="grille-radar-analyse"></polygon>`;
  }).join('');
  const axes = agregats.map(function (_agregat, position) {
    const extremite = point(position, 1, 0);
    return `<line x1="${centreX}" y1="${centreY}" x2="${extremite.x.toFixed(1)}" y2="${extremite.y.toFixed(1)}" class="axe-radar-analyse"></line>`;
  }).join('');
  const pointsValeurs = agregats.map(function (agregat, position) {
    const pourcentage = agregat.pourcentageAcquisition === null
      ? 0
      : agregat.pourcentageAcquisition;
    const coordonnees = point(position, pourcentage / 100, 0);
    return coordonnees.x.toFixed(1) + ',' +
      coordonnees.y.toFixed(1);
  }).join(' ');
  const marqueurs = agregats.map(function (agregat, position) {
    const pourcentage = agregat.pourcentageAcquisition === null
      ? 0
      : agregat.pourcentageAcquisition;
    const coordonnees = point(position, pourcentage / 100, 0);
    const titre = agregat.categorie + ' : ' +
      (agregat.pourcentageAcquisition === null
        ? 'non calculable'
        : formaterTauxAnalysePedagogique_(pourcentage)) +
      ', ' + agregat.nombreItemsAcquis + ' acquis sur ' +
      agregat.nombreItemsActifs + ' items actifs';
    return `
      <circle
        cx="${coordonnees.x.toFixed(1)}"
        cy="${coordonnees.y.toFixed(1)}"
        r="6"
        class="point-radar-analyse"
        tabindex="0"
        aria-label="${echapperHtml(titre)}"
      ><title>${echapperHtml(titre)}</title></circle>
    `;
  }).join('');
  const libelles = agregats.map(function (agregat, position) {
    const coordonnees = point(position, 1, 34);
    const ancrage = coordonnees.cosinus > 0.2
      ? 'start'
      : coordonnees.cosinus < -0.2
        ? 'end'
        : 'middle';
    const libelle = String(agregat.categorie || 'Catégorie');
    const libelleCourt = libelle.length > 24
      ? libelle.slice(0, 22) + '…'
      : libelle;
    return `
      <text
        x="${coordonnees.x.toFixed(1)}"
        y="${coordonnees.y.toFixed(1)}"
        text-anchor="${ancrage}"
        class="libelle-radar-analyse"
      ><title>${echapperHtml(libelle)}</title>${echapperHtml(libelleCourt)}</text>
    `;
  }).join('');

  return `
    <div class="conteneur-svg-analyse conteneur-radar-analyse">
      <svg
        class="svg-radar-analyse"
        viewBox="0 0 ${largeur} ${hauteur}"
        role="img"
        aria-label="Radar du pourcentage d’acquisition par catégorie"
        data-visualisation-analyse="radar"
      >
        <title>Pourcentage d’items actifs acquis par catégorie</title>
        ${niveaux}
        ${axes}
        <polygon points="${pointsValeurs}" class="surface-radar-analyse"></polygon>
        ${marqueurs}
        ${libelles}
        <text x="${centreX + 8}" y="${centreY - rayon * 0.25}" class="niveau-radar-analyse">25 %</text>
        <text x="${centreX + 8}" y="${centreY - rayon * 0.5}" class="niveau-radar-analyse">50 %</text>
        <text x="${centreX + 8}" y="${centreY - rayon * 0.75}" class="niveau-radar-analyse">75 %</text>
        <text x="${centreX + 8}" y="${centreY - rayon}" class="niveau-radar-analyse">100 %</text>
      </svg>
    </div>
    <div class="legende-visualisation-analyse">
      <span><i class="legende-acquis-analyse"></i>Items acquis / items actifs</span>
      <span>Échelle fixe : 0 à 100 %</span>
    </div>
  `;
}


function creerBarresCategoriesAnalysePedagogique_(agregats) {
  return `
    <div
      class="barres-categories-analyse-pedagogique"
      data-visualisation-analyse="barres-categories"
    >
      ${agregats.map(function (agregat) {
        const pourcentage = agregat.pourcentageAcquisition;
        const largeur = pourcentage === null ? 0 : pourcentage;
        const texte = pourcentage === null
          ? 'Non calculable'
          : formaterTauxAnalysePedagogique_(pourcentage);
        const titre = agregat.categorie + ' : ' + texte + ', ' +
          agregat.nombreItemsAcquis + ' acquis sur ' +
          agregat.nombreItemsActifs + ' items actifs';
        return `
          <div class="barre-categorie-analyse">
            <header>
              <strong>${echapperHtml(agregat.categorie)}</strong>
              <span>${agregat.nombreItemsAcquis} / ${agregat.nombreItemsActifs} · ${echapperHtml(texte)}</span>
            </header>
            <div
              class="piste-barre-categorie-analyse"
              role="progressbar"
              tabindex="0"
              aria-label="${echapperHtml(titre)}"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="${pourcentage === null ? 0 : pourcentage}"
              title="${echapperHtml(titre)}"
            ><span style="width: ${largeur}%"></span></div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}


function creerTableauCategoriesAnalysePedagogique_(agregats) {
  return `
    <div class="tableau-responsive tableau-reference-visualisation-analyse">
      <table class="tableau tableau-compact-analyse-pedagogique">
        <caption class="texte-visuellement-cache">
          Données du graphique de progression par catégorie
        </caption>
        <thead><tr>
          <th>Catégorie</th>
          <th>Items actifs</th>
          <th>Travaillés</th>
          <th>Acquis</th>
          <th>Acquisition</th>
        </tr></thead>
        <tbody>
          ${agregats.map(function (agregat) {
            return `<tr>
              <td><strong>${echapperHtml(agregat.categorie)}</strong></td>
              <td>${Number(agregat.nombreItemsActifs) || 0}</td>
              <td>${Number(agregat.nombreItemsTravailles) || 0}</td>
              <td>${Number(agregat.nombreItemsAcquis) || 0}</td>
              <td>${echapperHtml(formaterTauxAnalysePedagogique_(agregat.pourcentageAcquisition))}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>

  `;

function afficherProgressionChronologiqueAnalysePedagogiqueFiche_(donnees) {
  const zone = document.getElementById(
    'progressionChronologiqueAnalysePedagogiqueFiche'
  );
  if (!zone) {
    return;
  }

  const progression = Array.isArray(donnees.progressionChronologique)
    ? donnees.progressionChronologique
    : [];
  const tableau = creerTableauProgressionAnalysePedagogique_(progression);

  if (progression.length < 2) {
    zone.innerHTML = creerEtatVideAnalysePedagogique_(
      progression.length
        ? 'Une deuxième date de séance est nécessaire pour tracer une évolution.'
        : 'Aucune date de séance exploitable pour tracer la progression.'
    ) + tableau;
    return;
  }

  zone.innerHTML = `
    ${creerCourbeProgressionAnalysePedagogique_(progression)}
    <div class="legende-visualisation-analyse">
      <span><i class="legende-progression-analyse"></i>Items acquis pour la première fois, en cumul</span>
    </div>
    ${tableau}
  `;
}


function creerCourbeProgressionAnalysePedagogique_(progression) {
  const largeur = 860;
  const hauteur = 330;
  const marge = { gauche: 58, droite: 26, haut: 24, bas: 58 };
  const largeurUtile = largeur - marge.gauche - marge.droite;
  const hauteurUtile = hauteur - marge.haut - marge.bas;
  const maximum = Math.max(
    1,
    ...progression.map(function (point) {
      return Number(point.cumulItemsAcquis) || 0;
    })
  );

  function coordonneeX(position) {
    return marge.gauche +
      position * largeurUtile / Math.max(1, progression.length - 1);
  }

  function coordonneeY(valeur) {
    return marge.haut + hauteurUtile -
      (Number(valeur) || 0) / maximum * hauteurUtile;
  }

  const niveaux = [0, 0.25, 0.5, 0.75, 1].map(function (ratio) {
    const valeur = Math.round(maximum * ratio);
    const y = coordonneeY(valeur);
    return `
      <line x1="${marge.gauche}" y1="${y.toFixed(1)}" x2="${largeur - marge.droite}" y2="${y.toFixed(1)}" class="grille-courbe-analyse"></line>
      <text x="${marge.gauche - 10}" y="${(y + 4).toFixed(1)}" text-anchor="end" class="libelle-axe-analyse">${valeur}</text>
    `;
  }).join('');
  const points = progression.map(function (point, position) {
    return coordonneeX(position).toFixed(1) + ',' +
      coordonneeY(point.cumulItemsAcquis).toFixed(1);
  }).join(' ');
  const pasLibelle = Math.max(1, Math.ceil(progression.length / 8));
  const marqueurs = progression.map(function (point, position) {
    const x = coordonneeX(position);
    const y = coordonneeY(point.cumulItemsAcquis);
    const titre = afficherDateFrancaise(point.date) + ' : ' +
      Number(point.cumulItemsAcquis || 0) + ' item(s) acquis au total, ' +
      Number(point.nouvellesAcquisitions || 0) + ' nouvelle(s) acquisition(s)';
    const libelle = position % pasLibelle === 0 ||
      position === progression.length - 1
      ? `<text x="${x.toFixed(1)}" y="${hauteur - 25}" text-anchor="middle" class="libelle-axe-analyse">${echapperHtml(afficherDateFrancaise(point.date))}</text>`
      : '';
    return `
      <circle
        cx="${x.toFixed(1)}"
        cy="${y.toFixed(1)}"
        r="5"
        class="point-courbe-analyse"
        tabindex="0"
        aria-label="${echapperHtml(titre)}"
      ><title>${echapperHtml(titre)}</title></circle>
      ${libelle}
    `;
  }).join('');

  return `
    <div class="conteneur-svg-analyse conteneur-courbe-analyse">
      <svg
        viewBox="0 0 ${largeur} ${hauteur}"
        role="img"
        aria-label="Évolution chronologique du cumul d’items acquis"
        data-visualisation-analyse="courbe-progression"
      >
        <title>Cumul des premières acquisitions à chaque date de séance</title>
        ${niveaux}
        <polyline points="${points}" class="ligne-progression-analyse"></polyline>
        ${marqueurs}
      </svg>
    </div>
  `;
}


function creerTableauProgressionAnalysePedagogique_(progression) {
  if (!progression.length) {
    return '';
  }

  return `
    <div class="tableau-responsive tableau-reference-visualisation-analyse">
      <table class="tableau tableau-compact-analyse-pedagogique">
        <caption class="texte-visuellement-cache">
          Données de la courbe de progression chronologique
        </caption>
        <thead><tr>
          <th>Date</th>
          <th>Séances ce jour</th>
          <th>Nouvelles acquisitions</th>
          <th>Cumul acquis</th>
        </tr></thead>
        <tbody>
          ${progression.map(function (point) {
            return `<tr>
              <td>${echapperHtml(afficherDateFrancaise(point.date) || '—')}</td>
              <td>${Number(point.nombreSeances) || 0}</td>
              <td>${Number(point.nouvellesAcquisitions) || 0}</td>
              <td><strong>${Number(point.cumulItemsAcquis) || 0}</strong></td>
            </tr>`;

function creerGraphiqueBarresMensuellesAnalysePedagogique_(
  activite,
  champ,
  libelle,
  variante
) {
  const largeur = 860;
  const hauteur = 290;
  const marge = { gauche: 50, droite: 18, haut: 20, bas: 52 };
  const largeurUtile = largeur - marge.gauche - marge.droite;
  const hauteurUtile = hauteur - marge.haut - marge.bas;
  const valeurs = activite.map(function (mois) {
    return Math.max(0, Number(mois[champ]) || 0);
  });
  const maximum = Math.max(1, ...valeurs);
  const largeurGroupe = largeurUtile / Math.max(1, activite.length);
  const largeurBarre = Math.max(8, Math.min(38, largeurGroupe * 0.58));
  const grille = [0, 0.5, 1].map(function (ratio) {
    const valeur = Math.round(maximum * ratio);
    const y = marge.haut + hauteurUtile - valeur / maximum * hauteurUtile;
    return `
      <line x1="${marge.gauche}" y1="${y.toFixed(1)}" x2="${largeur - marge.droite}" y2="${y.toFixed(1)}" class="grille-courbe-analyse"></line>
      <text x="${marge.gauche - 9}" y="${(y + 4).toFixed(1)}" text-anchor="end" class="libelle-axe-analyse">${valeur}</text>
    `;
  }).join('');
  const barres = activite.map(function (mois, position) {
    const valeur = valeurs[position];
    const hauteurBarre = valeur / maximum * hauteurUtile;
    const x = marge.gauche + position * largeurGroupe +
      (largeurGroupe - largeurBarre) / 2;
    const y = marge.haut + hauteurUtile - hauteurBarre;
    const moisLisible = formaterMoisAnalysePedagogique_(mois.mois, false);
    const moisCourt = formaterMoisAnalysePedagogique_(mois.mois, true);
    const titre = moisLisible + ' : ' + valeur + ' ' +
      libelle.toLowerCase();
    return `
      <rect
        x="${x.toFixed(1)}"
        y="${y.toFixed(1)}"
        width="${largeurBarre.toFixed(1)}"
        height="${hauteurBarre.toFixed(1)}"
        class="barre-mensuelle-analyse barre-mensuelle-${variante}-analyse"
        tabindex="0"
        aria-label="${echapperHtml(titre)}"
      ><title>${echapperHtml(titre)}</title></rect>
      <text x="${(x + largeurBarre / 2).toFixed(1)}" y="${hauteur - 24}" text-anchor="middle" class="libelle-axe-analyse">${echapperHtml(moisCourt)}</text>
    `;
  }).join('');

  return `
    <div class="conteneur-svg-analyse conteneur-activite-analyse">
      <svg
        viewBox="0 0 ${largeur} ${hauteur}"
        role="img"
        aria-label="${echapperHtml(libelle)} sur les douze derniers mois"
        data-visualisation-analyse="activite-${variante}"
      >
        <title>${echapperHtml(libelle)} sur les douze derniers mois</title>
        ${grille}
        ${barres}
      </svg>
    </div>
  `;
}

function formaterMoisAnalysePedagogique_(cleMois, court) {
  const correspondance = /^([0-9]{4})-([0-9]{2})$/.exec(
    String(cleMois || '')
  );
  const noms = [
    'janvier', 'février', 'mars', 'avril', 'mai', 'juin',
    'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'
  ];

  if (!correspondance) {
    return String(cleMois || 'Mois inconnu');
  }

  const mois = noms[Number(correspondance[2]) - 1];
  return court
    ? mois.slice(0, 3) + '. ' + correspondance[1].slice(2)
    : mois.charAt(0).toUpperCase() + mois.slice(1) + ' ' + correspondance[1];
}


function analysePedagogiqueSansDonnees_(donnees) {
  return !donnees ||
    !donnees.synthese ||
    Number(donnees.synthese.nombreSeances || 0) === 0;
}


function construirePhraseSyntheseAnalysePedagogique_(donnees) {
  const synthese = donnees && donnees.synthese
    ? donnees.synthese
    : {};
  const pointsFaibles = Array.isArray(donnees && donnees.pointsFaibles)
    ? donnees.pointsFaibles
    : [];
  const jamaisTravailles = Array.isArray(
    synthese.itemsJamaisTravailles
  )
    ? synthese.itemsJamaisTravailles.length
    : 0;

  if (!Number(synthese.nombreSeances || 0)) {
    return 'Aucune séance pédagogique exploitable n’est encore enregistrée.';
  }
  if (jamaisTravailles || pointsFaibles.length) {
    return 'Plusieurs items restent à travailler ou à consolider.';
  }
  if (Number(synthese.nombreItemsAcquis || 0) > 0) {
    return 'Le stagiaire dispose d’acquisitions enregistrées sur les items travaillés.';
  }
  return 'Des séances sont enregistrées, mais aucune acquisition n’est encore validée.';
}

    `;
  }).join('');

function construireIndexClassificationsAnalysePedagogique_(donnees) {
  const index = {};
  const correspondances = [
    ['pointsForts', 'fort'],
    ['pointsFaibles', 'faible'],
    ['itemsOublies', 'oublie'],
    ['itemsPrioritaires', 'prioritaire']
  ];

  correspondances.forEach(function (correspondance) {
    const liste = Array.isArray(donnees && donnees[correspondance[0]])
      ? donnees[correspondance[0]]
      : [];
    liste.forEach(function (item) {
      if (!item || !item.idItem) {
        return;
      }
      index[item.idItem] = index[item.idItem] || {};
      index[item.idItem][correspondance[1]] = true;
    });
  });
  return index;
}


function obtenirClassificationsItemAnalysePedagogique_(
  idItem,
  index
) {
  const valeur = index[idItem] || {};
  const ordre = ['prioritaire', 'faible', 'oublie', 'fort'];
  const classes = ordre.filter(function (classification) {
    return Boolean(valeur[classification]);
  });
  return classes.length ? classes : ['neutre'];
}


function filtrerItemsDetailAnalysePedagogique_(
  donnees,
  filtre,
  classificationsOptionnelles
) {
  const items = Array.isArray(donnees && donnees.items)
    ? donnees.items
    : [];
  const classifications = classificationsOptionnelles ||
    construireIndexClassificationsAnalysePedagogique_(donnees);

  return items.filter(function (item) {
    const valeur = classifications[item.idItem] || {};
    if (filtre === 'PRIORITAIRES') {
      return Boolean(valeur.prioritaire);
    }
    if (filtre === 'FORTS') {
      return Boolean(valeur.fort);
    }
    if (filtre === 'FAIBLES') {
      return Boolean(valeur.faible);
    }
    if (filtre === 'JAMAIS_TRAVAILLES') {
      return Number(item.nombreFoisTravaille || 0) === 0;
    }
    if (filtre === 'HISTORIQUES') {
      return Boolean(item.historique);
    }
    return true;
  });
}


function obtenirPresentationNiveauPrioriteAnalysePedagogique_(niveau) {
  const presentations = {
    CRITIQUE: {
      libelle: 'Priorité très élevée',
      classe: 'priorite-tres-elevee',
      symbole: '!!'
    },
    ELEVEE: {
      libelle: 'Priorité élevée',
      classe: 'priorite-elevee',
      symbole: '!'
    },
    MODEREE: {
      libelle: 'Priorité moyenne',
      classe: 'priorite-moyenne',
      symbole: '•'
    },
    FAIBLE: {
      libelle: 'Priorité faible',
      classe: 'priorite-faible',
      symbole: '○'
    }
  };
  return presentations[String(niveau || '').toUpperCase()] ||
    presentations.FAIBLE;
}


function obtenirLibelleClassificationAnalysePedagogique_(classification) {
  return {
    prioritaire: 'Prioritaire',
    fort: 'Fort',
    faible: 'À renforcer',
    oublie: 'Oublié',
    neutre: 'Neutre'
  }[classification] || 'Neutre';
}


function indexerItemsAnalysePedagogique_(items) {
  const index = {};
  (Array.isArray(items) ? items : []).forEach(function (item) {
    if (item && item.idItem) {
      index[item.idItem] = item;
    }
  });
  return index;
}


function formaterTauxAnalysePedagogique_(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') {
    return 'Non calculable';
  }
  const nombre = Number(valeur);
  return Number.isFinite(nombre)
    ? nombre.toLocaleString('fr-FR', {
      maximumFractionDigits: 1
    }) + ' %'
    : 'Non calculable';
}


function formaterJoursAnalysePedagogique_(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') {
    return 'Jamais';
  }
  const nombre = Math.max(0, Math.round(Number(valeur) || 0));
  if (nombre === 0) {
    return 'Aujourd’hui';
  }

function afficherTableauBordPedagogiqueFicheStagiaire(
  tableauBord
) {
  const pourcentage = Math.max(
    0,

      100,

        Number(tableauBord.progressionGenerale) || 0
      )
    )
  );

  const elementPourcentage = document.getElementById(
    'pourcentageProgressionGeneraleStagiaire'
  );
  const barre = document.getElementById(
    'barreProgressionGeneraleStagiaire'
  );

  if (elementPourcentage) {
    elementPourcentage.textContent = pourcentage + ' %';
  }

  if (barre) {
    barre.setAttribute('aria-valuenow', String(pourcentage));

    const remplissage = barre.querySelector('span');

    if (remplissage) {
      remplissage.style.width = pourcentage + '%';
    }
  }

  const compteurs = {
    nombreItemsFormationStagiaire:
      tableauBord.nombreItems,
    nombreItemsTravaillesStagiaire:
      tableauBord.nombreTravailles,
    nombreItemsAcquisStagiaire:
      tableauBord.nombreAcquis,
    nombreItemsRestantsStagiaire:
      tableauBord.nombreRestantATravailler
  };

  Object.keys(compteurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = String(
        Number(compteurs[identifiant]) || 0
      );
    }
  });

  afficherProgressionCategoriesFicheStagiaire(
    Array.isArray(tableauBord.progressionCategories)
      ? tableauBord.progressionCategories
      : []
  );

  afficherItemsPrioritairesFicheStagiaire(
    Array.isArray(tableauBord.itemsPrioritaires)
      ? tableauBord.itemsPrioritaires

  if (!Number.isFinite(nombre)) {

    'fr-FR',
    {

}

function calculerEcheanceStage(dateIso) {
  if (!dateIso) {
    return '—';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return '—';
  }

  const dateStage = new Date(
    Number(parties[0]),
    Number(parties[1]) - 1,
    Number(parties[2])
  );

  const aujourdHui = new Date();
  aujourdHui.setHours(0, 0, 0, 0);

  const difference = Math.ceil(
    (
      dateStage.getTime() -
      aujourdHui.getTime()
    ) / 86400000
  );

  if (difference > 0) {
    return 'J-' + difference;
  }

  if (difference === 0) {
    return 'J';
  }

  return 'J+' + Math.abs(difference);
}

function initialiserEtatPhotoStagiaire(stagiaire) {
  const generation = ++etatApplication.generationPhotoFormulaire;
  etatApplication.photoStagiaireEnCours = null;
  etatApplication.photoStagiaireExistante = Boolean(
    stagiaire && (stagiaire.aUnePhoto || stagiaire.photoUrl)
  );

  ['stagiairePhotoCamera', 'stagiairePhotoFichier'].forEach(
    function (identifiant) {
      const champ = document.getElementById(identifiant);
      if (champ) {
        champ.value = '';
      }
    }
  );

  const zone = document.getElementById('apercuPhotoStagiaire');
  const informations = document.getElementById(
    'informationsPhotoStagiaire'
  );

  if (zone) {
    zone.innerHTML = '<span>Photo</span>';
  }

  if (informations) {
    informations.textContent = stagiaire && stagiaire.photoNom
      ? stagiaire.photoNom + (
        stagiaire.photoDateModification
          ? ' · modifiée le ' + stagiaire.photoDateModification
          : ''
      )
      : '';
  }

  mettreAJourActionsPhotoStagiaire_();

  if (!stagiaire) {
    return;
  }

  if (stagiaire.aUnePhoto) {
    zone.innerHTML = '<span>Chargement…</span>';
    google.script.run
      .withSuccessHandler(function (photo) {
        if (generation !== etatApplication.generationPhotoFormulaire) {
          return;
        }
        if (!photo || !photo.disponible) {
          zone.innerHTML = '<span>Photo indisponible</span>';
          return;
        }
        afficherImagePhotoStagiaire_(
          zone,
          photo.dataUrl,
          'Photo du stagiaire'
        );
      })
      .withFailureHandler(function () {
        if (generation !== etatApplication.generationPhotoFormulaire) {
          return;
        }
        zone.innerHTML = '<span>Photo indisponible</span>';
      })
      .getPhotoStagiaire(
        stagiaire.uuid,
        obtenirJetonUtilisateurApplication()
      );
    return;
  }

  if (stagiaire.photoUrl) {
    afficherImagePhotoStagiaire_(
      zone,
      stagiaire.photoUrl,
      'Photo historique du stagiaire'
    );
  }
}

async function traiterFichierPhotoStagiaire(champ) {
  const fichier = champ && champ.files && champ.files[0];
  const generation = etatApplication.generationPhotoFormulaire;

  if (!fichier) {
    return;
  }

  try {
    validerFichierPhotoStagiaireClient_(fichier);
    const resultat = await compresserPhotoStagiaireClient_(fichier);

    if (generation !== etatApplication.generationPhotoFormulaire) {
      return;
    }

    etatApplication.photoStagiaireEnCours = {
      contenuBase64: resultat.dataUrl.split(',')[1],

      formaterTailleFichierPhotoStagiaire_(resultat.taille) + ')';

  } catch (erreur) {
    if (generation !== etatApplication.generationPhotoFormulaire) {
      return;
    }
    champ.value = '';
    afficherToast(
      String(erreur.message || erreur || 'Image illisible.'),

    );
  }
}


function validerFichierPhotoStagiaireClient_(fichier) {
  const types = [
    'image/jpeg',
    'image/png',
    'image/webp',
    'image/heic',
    'image/heif'
  ];
  const extensionValide = /\.(jpe?g|png|webp|heic|heif)$/i.test(
    String(fichier.name || '')
  );
  const type = String(fichier.type || '').toLowerCase();

  if ((type && !types.includes(type)) || (!type && !extensionValide)) {
    throw new Error(
      'Formats acceptés : JPEG, PNG, WEBP et HEIC si le navigateur peut le lire.'
    );
  }

  if (!Number(fichier.size) || fichier.size > 15 * 1024 * 1024) {
    throw new Error('La photo doit peser au maximum 15 Mo.');
  }
}


function calculerDimensionsPhotoStagiaire_(largeur, hauteur, maximum) {
  const facteur = Math.min(
    1,
    Number(maximum || 1200) / Math.max(largeur, hauteur)
  );
  return {
    largeur: Math.max(1, Math.round(largeur * facteur)),
    hauteur: Math.max(1, Math.round(hauteur * facteur))
  };
}


async function compresserPhotoStagiaireClient_(fichier) {
  const image = await decoderPhotoStagiaireClient_(fichier);
  const dimensions = calculerDimensionsPhotoStagiaire_(
    image.largeur,
    image.hauteur,
    1200
  );
  const canvas = document.createElement('canvas');
  canvas.width = dimensions.largeur;
  canvas.height = dimensions.hauteur;
  const contexte = canvas.getContext('2d', { alpha: false });
  contexte.fillStyle = '#ffffff';
  contexte.fillRect(0, 0, canvas.width, canvas.height);
  contexte.drawImage(
    image.source,
    0,
    0,
    dimensions.largeur,
    dimensions.hauteur
  );
  image.fermer();

  const blob = await new Promise(function (resolve, reject) {
    canvas.toBlob(function (resultat) {
      if (resultat) {
        resolve(resultat);
      } else {
        reject(new Error('Le navigateur ne peut pas convertir cette image.'));
      }
    }, 'image/jpeg', 0.8);
  });

  if (blob.size > 4 * 1024 * 1024) {
    throw new Error(
      'La photo reste trop volumineuse après redimensionnement.'
    );
  }

  const dataUrl = await lireBlobCommeDataUrlPhotoStagiaire_(blob);
  return {
    dataUrl: dataUrl,
    taille: blob.size,
    largeur: dimensions.largeur,
    hauteur: dimensions.hauteur
  };
}


async function decoderPhotoStagiaireClient_(fichier) {
  if ('createImageBitmap' in window) {
    try {
      const bitmap = await createImageBitmap(
        fichier,
        { imageOrientation: 'from-image' }
      );
      return {
        source: bitmap,
        largeur: bitmap.width,
        hauteur: bitmap.height,
        fermer: function () { bitmap.close(); }
      };
    } catch (erreurBitmap) {
      // Le décodeur HTML ci-dessous couvre notamment Safari.
    }
  }

  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(fichier);
    const image = new Image();
    image.onload = function () {
      resolve({
        source: image,
        largeur: image.naturalWidth,
        hauteur: image.naturalHeight,
        fermer: function () { URL.revokeObjectURL(url); }
      });
    };
    image.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error(
        'Image illisible. Le format HEIC dépend des capacités du navigateur.'
      ));
    };
    image.src = url;
  });
}


function lireBlobCommeDataUrlPhotoStagiaire_(blob) {
  return new Promise(function (resolve, reject) {
    const lecteur = new FileReader();
    lecteur.onload = function () { resolve(String(lecteur.result || '')); };
    lecteur.onerror = function () {
      reject(new Error('Impossible de préparer la photo.'));
    };
    lecteur.readAsDataURL(blob);
  });
}


function formaterTailleFichierPhotoStagiaire_(taille) {
  const octets = Number(taille || 0);
  if (octets < 1024) {
    return octets + ' o';
  }
  if (octets < 1024 * 1024) {
    return Math.round(octets / 1024) + ' Ko';
  }
  return (octets / 1024 / 1024).toFixed(1) + ' Mo';
}

function mettreAJourZoneCycleVieStagiaire(stagiaire) {
  const bouton = document.getElementById(
    'boutonCloturerStagiaire'

  const boutonReactiver = document.getElementById(
    'boutonReactiverStagiaire'
  );
  const resume = document.getElementById(
    'resumeCycleVieStagiaire'
  );

  if (!bouton || !boutonReactiver || !resume) {
    return;
  }

  if (!stagiaire || !stagiaire.uuid) {
    bouton.classList.add('masque');
    boutonReactiver.classList.add('masque');
    resume.textContent =
      'Enregistre d\'abord le stagiaire pour pouvoir clôturer sa préparation.';
    return;
  }

  const preparationFermee = [
    'Clôturé',
    'Abandon'
  ].includes(stagiaire.statut);

  const administrateur = estAdministrateurApplication();

  bouton.classList.toggle(
    'masque',
    preparationFermee || !administrateur
  );
  boutonReactiver.classList.toggle(
    'masque',
    !preparationFermee || !administrateur
  );

  if (preparationFermee) {
    resume.textContent =
      stagiaire.statut +
      (stagiaire.dateCloture
        ? ' le ' + afficherDateFrancaise(stagiaire.dateCloture)
        : '') +
      (stagiaire.motifCloture
        ? ' · ' + stagiaire.motifCloture
        : '');
  } else {
    resume.textContent =
      'Le statut est calculé automatiquement. Seules la clôture et l\'abandon sont des décisions manuelles.';
  }
}

function obtenirClasseStatut(statut) {
  const correspondances = {
    'À préparer': 'badge-bleu',
    'En préparation': 'badge-orange',
    'Stage aujourd\'hui': 'badge-rouge',
    'Stage passé': 'badge-rouge',
    'Clôturé': 'badge-vert',
    'Abandon': 'badge-gris'
  };

  return correspondances[statut] || 'badge-gris';
}

function afficherDateFrancaise(dateIso) {
  if (!dateIso) {
    return '';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return dateIso;
  }

  return (
    parties[2] +
    '/' +
    parties[1] +
    '/' +
    parties[0]
  );
}

function dateDuJourPourChamp() {
  const date = new Date();

  const annee = date.getFullYear();
  const mois = String(date.getMonth() + 1)
    .padStart(2, '0');

  const jour = String(date.getDate())
    .padStart(2, '0');

  return annee + '-' + mois + '-' + jour;
}

function echapperHtml(valeur) {
  return String(valeur ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function afficherListeFormateurs() {
  const corps = document.getElementById(
    'corpsTableauFormateurs'
  );

  if (!corps) {
    return;
  }

  const formateurs = etatApplication.formateurs;
  const compteur = document.getElementById(
    'compteurFormateurs'
  );

  if (compteur) {
    const nombreActifs = formateurs.filter(
      function (formateur) {
        return formateur.actif;
      }
    ).length;

    compteur.textContent =
      formateurs.length +
      (formateurs.length > 1
        ? ' formateurs enregistrés'
        : ' formateur enregistré') +
      ' · ' +
      nombreActifs +
      (nombreActifs > 1 ? ' actifs' : ' actif');
  }

  if (!formateurs.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="5" class="etat-vide">
          Aucun formateur enregistré pour le moment.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = formateurs
    .map(function (formateur) {
      const actionModifier = estAdministrateurApplication()
        ? `
          <button
            type="button"
            class="bouton-icone"
            onclick="modifierFormateur('${formateur.idFormateur}')"
            title="Modifier"
            aria-label="Modifier ${echapperHtml(formateur.prenom)} ${echapperHtml(formateur.nom)}"
          >
            ✎
          </button>
        `
        : '';
      const compte = formateur.compteAcces || null;
      const libelleAcces = !compte
        ? 'Aucun accès'
        : (compte.bloque
          ? 'Bloqué'
          : (compte.actif ? 'Actif' : 'Désactivé'));
      const classeAcces = !compte || !compte.actif
        ? 'badge-gris'
        : (compte.bloque ? 'badge-rouge' : 'badge-vert');
      const colonneAcces = estAdministrateurApplication()
        ? `
          <td>
            <span class="badge-statut ${classeAcces}">
              ${libelleAcces}
            </span>
            ${compte && compte.doitChangerMotDePasse
              ? '<small class="detail-acces-formateur">Changement requis</small>'
              : ''}
          </td>
        `
        : '';
      const actionAcces = estAdministrateurApplication()
        ? `
          <button
            type="button"
            class="bouton-secondaire bouton-compact"
            onclick="ouvrirGestionAccesFormateur('${formateur.idFormateur}')"
          >${compte ? 'Gérer l’accès' : 'Créer un accès'}</button>
        `
        : '';

      return `
        <tr data-formateur-id="${echapperHtml(formateur.idFormateur)}">
          <td>
            <strong>${echapperHtml(formateur.nom)}</strong>
          </td>
          <td>${echapperHtml(formateur.prenom)}</td>
          <td>
            <span class="badge-statut ${formateur.actif ? 'badge-vert' : 'badge-gris'}">
              ${formateur.actif ? 'Actif' : 'Inactif'}
            </span>
          </td>
          ${colonneAcces}
          <td class="colonne-actions">
            ${creerBoutonFavori_(
              'FORMATEUR',
              formateur.idFormateur,
              'bouton-favori-tableau'
            )}
            ${actionModifier}
            ${actionAcces}
          </td>
        </tr>
      `;
    })

      const contenu = document.getElementById(
        'contenuMonRecapitulatifFormateur'
      );

      if (contenu) {
        contenu.innerHTML = `
          <div class="etat-vide">
            ${echapperHtml(extraireMessageErreur(erreur))}
          </div>
        `;
      }
    })
    .getMonRecapitulatifHeuresFormateur(
      obtenirJetonUtilisateurApplication()
    );
}

function afficherMonRecapitulatifFormateur(donnees) {
  const resume = document.getElementById(
    'resumeMonRecapitulatifFormateur'
  );
  const contenu = document.getElementById(
    'contenuMonRecapitulatifFormateur'
  );

  if (!resume || !contenu) {
    return;
  }

  if (!donnees.estIdentifie) {
    resume.textContent = 'Session formateur non identifiée.';
    contenu.innerHTML = `
      <div class="etat-vide etat-acces-limite">
        Ton récapitulatif n’est pas disponible dans cette session.
      </div>
    `;
    return;
  }

  if (!donnees.formateurAssocie) {
    resume.textContent = 'Compte formateur sans fiche associée';
    contenu.innerHTML = `
      <div class="etat-vide">
        Aucun formateur n’est associé à ce compte.
      </div>
    `;
    return;
  }

  resume.textContent =
    donnees.nombrePrestations +
    (donnees.nombrePrestations > 1
      ? ' prestations · '
      : ' prestation · ') +
    formaterHeuresFormation(donnees.totalHeures);

  contenu.innerHTML = `
    <div class="tableau-responsive">
      <table class="tableau">
        <thead>
          <tr>
            <th>Date</th>
            <th>Formation</th>
            <th>Durée</th>
            <th>Indemnisation</th>
          </tr>
        </thead>
        <tbody>
          ${(donnees.prestations || []).length
            ? donnees.prestations.map(function (prestation) {
              return `
                <tr>
                  <td>${afficherDateFrancaise(prestation.date) || '—'}</td>
                  <td>${echapperHtml(prestation.formation || '—')}</td>
                  <td>${formaterHeuresFormation(prestation.dureeHeures)}</td>
                  <td>${echapperHtml(prestation.statut)}</td>
                </tr>
              `;
            }).join('')
            : '<tr><td colspan="4" class="etat-vide">Aucune prestation.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function rechargerFormateurs() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (formateurs) {
      etatApplication.formateurs =
        Array.isArray(formateurs) ? formateurs : [];

      afficherListeFormateurs();
      masquerLoader();
    })
    .withFailureHandler(gererErreurServeur)
    .getFormateurs(
      obtenirJetonUtilisateurApplication()
    );
}


function ouvrirGestionAccesFormateur(idFormateur) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }
  const formateur = etatApplication.formateurs.find(function (element) {
    return element.idFormateur === idFormateur;
  });
  if (!formateur) {
    afficherToast('Formateur introuvable.', true);
    return;
  }

  const compte = formateur.compteAcces || null;
  document.getElementById('accesFormateurId').value = idFormateur;
  document.getElementById('sousTitreModalAccesFormateur').textContent =
    [formateur.prenom, formateur.nom].filter(Boolean).join(' ');
  document.getElementById('resultatSecretAccesFormateur')
    ?.classList.add('masque');
  document.getElementById('motDePasseTemporaireAccesFormateur').value = '';
  document.getElementById('creationAccesFormateur')
    ?.classList.toggle('masque', Boolean(compte));
  document.getElementById('gestionAccesFormateur')
    ?.classList.toggle('masque', !compte);

  if (compte) {
    afficherResumeAccesFormateur_(compte);
  } else {
    document.getElementById('identifiantAccesFormateur').value = '';
    google.script.run
      .withSuccessHandler(function (resultat) {
        const modal = document.getElementById('modalAccesFormateur');
        if (!modal || modal.classList.contains('masque')) return;
        document.getElementById('identifiantAccesFormateur').value =
          resultat.identifiant || '';
      })
      .withFailureHandler(function (erreur) {
        afficherToast(extraireMessageErreur(erreur), true);
      })
      .proposerIdentifiantCompteFormateur(
        idFormateur,
        obtenirJetonAdministrateurApplication()
      );
  }

  document.getElementById('modalAccesFormateur')?.classList.remove('masque');
  document.body.classList.add('modal-ouverte');
}


function fermerModalAccesFormateur() {
  const secret = document.getElementById('resultatMotDePasseAccesFormateur');
  if (secret) secret.textContent = '';
  const champ = document.getElementById('motDePasseTemporaireAccesFormateur');
  if (champ) champ.value = '';
  document.getElementById('modalAccesFormateur')?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
}


function afficherResumeAccesFormateur_(compte) {
  const zone = document.getElementById('resumeAccesFormateur');
  if (!zone) return;
  const statut = compte.bloque
    ? 'Bloqué jusqu’au ' + formaterDateHeureInterface_(compte.bloqueJusqua)
    : (compte.actif ? 'Actif' : 'Désactivé');
  zone.innerHTML = `
    <dl>
      <div><dt>Identifiant</dt><dd>${echapperHtml(compte.identifiant)}</dd></div>
      <div><dt>État</dt><dd>${echapperHtml(statut)}</dd></div>
      <div><dt>Dernière connexion</dt><dd>${echapperHtml(formaterDateHeureInterface_(compte.derniereConnexion) || 'Jamais')}</dd></div>
      <div><dt>Changement requis</dt><dd>${compte.doitChangerMotDePasse ? 'Oui' : 'Non'}</dd></div>
      <div><dt>Échecs récents</dt><dd>${Number(compte.nombreEchecs || 0)}</dd></div>
    </dl>
  `;
  document.querySelectorAll('#gestionAccesFormateur [data-action-acces]')
    .forEach(function (bouton) {
      const action = bouton.dataset.actionAcces;
      bouton.classList.toggle(
        'masque',
        (action === 'DESACTIVER' && !compte.actif) ||
        (action === 'REACTIVER' && compte.actif) ||
        (action === 'DEBLOQUER' && !compte.bloque && !compte.nombreEchecs)
      );
    });
}


function formaterDateHeureInterface_(valeur) {
  if (!valeur) return '';
  const date = new Date(valeur);
  if (Number.isNaN(date.getTime())) return String(valeur);
  return date.toLocaleString('fr-FR');
}


function creerAccesFormateurInterface_() {
  const bouton = document.getElementById('boutonCreerAccesFormateur');
  const donnees = {
    idFormateur: document.getElementById('accesFormateurId').value,
    identifiant: document.getElementById('identifiantAccesFormateur').value,
    motDePasse: document.getElementById(
      'motDePasseTemporaireAccesFormateur'
    ).value
  };
  bouton.disabled = true;
  bouton.textContent = 'Création…';
  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Créer l’accès';
      document.getElementById('motDePasseTemporaireAccesFormateur').value = '';
      afficherResultatSecretAccesFormateur_(resultat, donnees.motDePasse);
      rechargerFormateurs();
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent = 'Créer l’accès';
      document.getElementById('motDePasseTemporaireAccesFormateur').value = '';
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .creerAccesFormateur(
      donnees,
      obtenirJetonAdministrateurApplication()
    );
  donnees.motDePasse = '';
}


function executerActionAccesFormateurInterface_(action) {
  const idFormateur = document.getElementById('accesFormateurId').value;
  const libelles = {
    DESACTIVER: 'désactiver cet accès',
    REACTIVER: 'réactiver cet accès',
    DEBLOQUER: 'débloquer cet accès',
    FORCER_CHANGEMENT_MOT_DE_PASSE: 'forcer un changement de mot de passe',
    REINITIALISER_MOT_DE_PASSE: 'réinitialiser le mot de passe'
  };
  if (!window.confirm('Confirmer : ' + (libelles[action] || action) + ' ?')) {
    return;
  }
  document.querySelectorAll('#gestionAccesFormateur button')
    .forEach(function (bouton) { bouton.disabled = true; });
  google.script.run
    .withSuccessHandler(function (resultat) {
      document.querySelectorAll('#gestionAccesFormateur button')
        .forEach(function (bouton) { bouton.disabled = false; });
      afficherResumeAccesFormateur_(resultat.compte || {});
      if (resultat.motDePasseAfficheUneSeuleFois) {
        afficherResultatSecretAccesFormateur_(resultat, '');
      }
      afficherToast('Accès formateur mis à jour.', false);
      rechargerFormateurs();
    })
    .withFailureHandler(function (erreur) {
      document.querySelectorAll('#gestionAccesFormateur button')
        .forEach(function (bouton) { bouton.disabled = false; });
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .executerActionAccesFormateur(
      idFormateur,
      action,
      {},
      obtenirJetonAdministrateurApplication()
    );
}


function afficherResultatSecretAccesFormateur_(resultat, motDePasseSaisi) {
  const compte = resultat.compte || {};
  const secret = resultat.motDePasseTemporaire || motDePasseSaisi || '';
  document.getElementById('resultatIdentifiantAccesFormateur').textContent =
    compte.identifiant || '';
  document.getElementById('resultatMotDePasseAccesFormateur').textContent =
    secret || 'Mot de passe saisi par l’administrateur';
  document.getElementById('resultatSecretAccesFormateur')
    ?.classList.remove('masque');
  document.getElementById('creationAccesFormateur')?.classList.add('masque');
  document.getElementById('gestionAccesFormateur')?.classList.remove('masque');
  afficherResumeAccesFormateur_(compte);
}

function initialiserPageReferentiel() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (formations) {
      etatApplication.formationsReferentiel =
        Array.isArray(formations) ? formations : [];

      remplirSelect(
        'formationReferentiel',
        etatApplication.formationsReferentiel,
        'Sélectionner une formation'
      );

      const select = document.getElementById(
        'formationReferentiel'
      );

      if (!etatApplication.formationsReferentiel.length) {
        etatApplication.formationReferentielActive = '';
        etatApplication.categoriesReferentiel = [];
        etatApplication.itemsReferentiel = [];
        afficherListeCategoriesReferentiel();
        afficherListeItemsReferentiel();
        masquerLoader();
        return;
      }

      const formationRecherche =
        etatApplication.referentielFormationDepuisRechercheGlobale;
      etatApplication.referentielFormationDepuisRechercheGlobale = '';
      select.value = etatApplication.formationsReferentiel.includes(
        formationRecherche
      )
        ? formationRecherche
        : etatApplication.formationsReferentiel[0];

      changerFormationReferentiel();
    })
    .withFailureHandler(gererErreurServeur)
    .getFormations(obtenirJetonUtilisateurApplication());
}

function changerFormationReferentiel() {
  const formation = String(
    document.getElementById('formationReferentiel')
      ?.value || ''
  );

  etatApplication.formationReferentielActive = formation;
  etatApplication.categoriesReferentiel = [];
  etatApplication.itemsReferentiel = [];

  const boutonCategorie = document.getElementById(
    'boutonNouvelleCategorieReferentiel'
  );

  const boutonItem = document.getElementById(
    'boutonNouvelItemReferentiel'
  );

  if (boutonCategorie) {
    boutonCategorie.disabled = !formation;
  }

  if (boutonItem) {
    boutonItem.disabled = true;
  }

  if (!formation) {
    afficherListeCategoriesReferentiel();
    afficherListeItemsReferentiel();
    masquerLoader();
    return;
  }

  chargerDonneesReferentiel();
}

function chargerDonneesReferentiel() {
  const formation =
    etatApplication.formationReferentielActive;

  if (!formation) {
    return;
  }

  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargementReferentiel() {
    chargementsTermines++;

    if (
      chargementsTermines === 2 &&
      !erreurRencontree &&
      etatApplication.formationReferentielActive ===
        formation
    ) {
      afficherListeCategoriesReferentiel();
      afficherListeItemsReferentiel();
      mettreEnEvidenceItemReferentielFavori_();

      const boutonItem = document.getElementById(
        'boutonNouvelItemReferentiel'
      );

      if (boutonItem) {
        boutonItem.disabled =
          !etatApplication.categoriesReferentiel.length;
      }

      masquerLoader();
    }
  }

  function erreurChargementReferentiel(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (categories) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.categoriesReferentiel =
        Array.isArray(categories) ? categories : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getCategoriesReferentiel(
      formation,
      obtenirJetonUtilisateurApplication()
    );

  google.script.run
    .withSuccessHandler(function (items) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.itemsReferentiel =
        Array.isArray(items) ? items : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getItemsReferentiel(
      formation,
      obtenirJetonUtilisateurApplication()
    );
}

    'corpsTableauCategoriesReferentiel'

  if (!corps) {

  }

    etatApplication.categoriesReferentiel;

    'compteurCategoriesReferentiel'
  );

    compteur.textContent = formation
      ? categories.length +
        (categories.length > 1
          ? ' catégories'

    corps.innerHTML = `

        <td colspan="5" class="etat-vide">

            : 'Sélectionne une formation.'}
        </td>

      const suppression = categorie.utilisee

            onclick="supprimerCategorieReferentielInterface('${categorie.idCategorie}')"
            title="Supprimer"

          >🗑</button>
        `;

      return `
        <tr>
          <td class="colonne-ordre-referentiel">
            <span class="ordre-item-referentiel">
              ${categorie.ordre}
            </span>
          </td>
          <td>
            <strong>${echapperHtml(categorie.intitule)}</strong>
            ${categorie.utilisee
              ? '<small class="indicateur-historique-referentiel">Utilisée dans l’historique</small>'
              : ''}
          </td>
          <td>${categorie.nombreItems}</td>
          <td>
            <span class="badge-statut ${categorie.actif ? 'badge-vert' : 'badge-gris'}">
              ${categorie.actif ? 'Active' : 'Inactive'}
            </span>
          </td>
          <td class="colonne-actions-referentiel">
            <button
              type="button"
              class="bouton-icone action-referentiel"
              onclick="deplacerCategorieReferentielInterface('${categorie.idCategorie}', -1)"
              title="Monter"
              ${position === 0 ? 'disabled' : ''}
            >↑</button>
            <button
              type="button"
              class="bouton-icone action-referentiel"
              onclick="deplacerCategorieReferentielInterface('${categorie.idCategorie}', 1)"
              title="Descendre"
              ${position === categories.length - 1 ? 'disabled' : ''}
            >↓</button>
            <button
              type="button"
              class="bouton-icone action-referentiel"
              onclick="modifierCategorieReferentiel('${categorie.idCategorie}')"
              title="Modifier"
            >✎</button>
            <button
              type="button"
              class="bouton-icone action-referentiel"
              onclick="basculerCategorieReferentiel('${categorie.idCategorie}', ${!categorie.actif})"
              title="${categorie.actif ? 'Désactiver' : 'Activer'}"
            >${categorie.actif ? '⏸' : '▶'}</button>
            ${suppression}
          </td>
        </tr>
      `;
    })
    .join('');
}


function mettreEnEvidenceItemReferentielFavori_() {
  const idItem = etatApplication.referentielItemASelectionner;
  if (!idItem) {
    return;
  }
  const ligne = Array.from(
    document.querySelectorAll('[data-item-favori-id]')
  ).find(function (element) {
    return element.dataset.itemFavoriId === idItem;
  });
  if (!ligne) {
    return;
  }
  etatApplication.referentielItemASelectionner = '';
  ligne.classList.add('resultat-recherche-surligne');
  ligne.scrollIntoView({ behavior: 'smooth', block: 'center' });
  window.setTimeout(function () {
    ligne.classList.remove('resultat-recherche-surligne');
  }, 2200);
}

function afficherListeItemsReferentiel() {
  const corps = document.getElementById(
    'corpsTableauReferentiel'
  );

  if (!corps) {
    return;
  }

  const formation =
    etatApplication.formationReferentielActive;

  const items = etatApplication.itemsReferentiel;
  const compteur = document.getElementById(
    'compteurItemsReferentiel'
  );

  if (compteur) {
    if (!formation) {
      compteur.textContent = '';
    } else {
      const nombreActifs = items.filter(function (item) {
        return item.actif && item.categorieActive;
      }).length;

      compteur.textContent =
        items.length +
        (items.length > 1 ? ' items' : ' item') +
        ' · ' +
        nombreActifs +
        (nombreActifs > 1 ? ' actifs' : ' actif');
    }
  }

  if (!formation) {
    corps.innerHTML = `
      <tr>
        <td colspan="7" class="etat-vide">
          Sélectionne une formation pour afficher ses items.
        </td>
      </tr>
    `;
    return;
  }

  if (!items.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="7" class="etat-vide">
          Aucun item pédagogique configuré pour cette formation.
        </td>
      </tr>

          <td class="description-item-referentiel">

            ${item.nature
              ? `<span class="badge-categorie-referentiel">${echapperHtml(item.nature)}</span>`

            <span class="badge-statut ${itemDisponible ? 'badge-vert' : 'badge-gris'}">
              ${libelleStatut}
            </span>
          </td>
          <td
            class="colonne-actions-referentiel colonne-actions-item-referentiel"

          >
            ${creerBoutonFavori_(

            <button

              class="bouton-icone action-referentiel"
              data-item-id="${echapperHtml(item.idItem)}"

              title="Monter"

              ${position === 0 ? 'disabled' : ''}
            >
              ↑
            </button>

            <button
              type="button"
              class="bouton-icone action-referentiel"
              data-item-id="${echapperHtml(item.idItem)}"
              onclick="deplacerItemReferentiel(this.dataset.itemId, 1)"
              title="Descendre"
              aria-label="Descendre ${echapperHtml(item.intitule)}"
              ${position === itemsCategorie.length - 1 ? 'disabled' : ''}

              ↓
            </button>

            <button

                  ? 'Désactiver'
                  : 'Activer'}

            ${suppression}
          </td>
        </tr>
      `;
    })
    .join('');

function nouvelleCategorieReferentiel() {
  const formation =
    etatApplication.formationReferentielActive;

function basculerItemReferentiel(cible, actifExplicite) {
  const element = cible && cible.dataset
    ? cible
    : null;

  const idItem = String(
    element ? element.dataset.itemId : cible || ''
  ).trim();

  const item = etatApplication.itemsReferentiel.find(
    function (elementItem) {
      return elementItem.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (etatApplication.itemsReferentielEnCours[idItem]) {
    return;
  }

  const nouvelEtat = element
    ? element.dataset.actifCible === 'true'
    : Boolean(actifExplicite);

  const ancienEtat = Boolean(item.actif);

  etatApplication.itemsReferentielEnCours[idItem] = true;
  item.actif = nouvelEtat;
  afficherListeItemsReferentiel();

  google.script.run
    .withSuccessHandler(function (resultat) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = Boolean(resultat.actif);
      afficherListeItemsReferentiel();

      afficherToast(
        resultat.message || 'Item mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(function (erreur) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = ancienEtat;
      afficherListeItemsReferentiel();

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .basculerActifItemReferentiel(
      idItem,
      nouvelEtat,
      obtenirJetonAdministrateurApplication()
    );
}

function supprimerCategorieReferentielInterface(
  idCategorie
) {
  const categorie =
    etatApplication.categoriesReferentiel.find(
      function (element) {
        return element.idCategorie === idCategorie;
      }
    );

  if (!categorie) {
    afficherToast('Catégorie introuvable.', true);
    return;
  }

  if (categorie.utilisee) {
    basculerCategorieReferentiel(idCategorie, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement la catégorie « ' +
    categorie.intitule +
    ' » et ses items jamais utilisés ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerCategorieReferentiel',
    [idCategorie]
  );
}

function supprimerItemReferentielInterface(idItem) {
  const item = etatApplication.itemsReferentiel.find(
    function (element) {
      return element.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (item.utilise) {
    basculerItemReferentiel(idItem, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement l’item « ' +
    item.intitule +
    ' » ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerItemReferentiel',
    [idItem]
  );
}

function executerActionReferentiel(nomFonction, parametres) {
  afficherLoader();

  const execution = google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(
        resultat.message || 'Référentiel mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(gererErreurServeur);

  if (nomFonction === 'deplacerItemReferentiel') {
    execution.deplacerItemReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (nomFonction === 'deplacerCategorieReferentiel') {
    execution.deplacerCategorieReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (
    nomFonction === 'basculerActifCategorieReferentiel'
  ) {
    execution.basculerActifCategorieReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (nomFonction === 'supprimerCategorieReferentiel') {
    execution.supprimerCategorieReferentiel(
      parametres[0],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  execution.supprimerItemReferentiel(
    parametres[0],
    obtenirJetonAdministrateurApplication()
  );
}

function initialiserDepotImportReferentiel_() {
  const zone = document.getElementById('zoneDepotImportReferentiel');
  if (!zone || zone.dataset.initialise === 'true') {
    return;
  }

  zone.dataset.initialise = 'true';
  ['dragenter', 'dragover'].forEach(function (nomEvenement) {
    zone.addEventListener(nomEvenement, function (evenement) {
      evenement.preventDefault();
      zone.classList.add('depot-actif');
    });
  });
  ['dragleave', 'drop'].forEach(function (nomEvenement) {
    zone.addEventListener(nomEvenement, function (evenement) {
      evenement.preventDefault();
      zone.classList.remove('depot-actif');
    });
  });
  zone.addEventListener('drop', function (evenement) {
    const fichier = evenement.dataTransfer &&
      evenement.dataTransfer.files[0];
    selectionnerFichierImportReferentiel(fichier);
  });
}


function selectionnerFichierImportReferentiel(fichier) {
  const etat = etatApplication.importReferentiel;
  if (!etat || etat.enCours || !fichier) {
    return;
  }

  const nom = String(fichier.name || '');
  const typeAttendu =
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const resume = document.getElementById('resumeFichierImportReferentiel');

  if (!/\.xlsx$/i.test(nom)) {
    etat.fichier = null;
    resume.innerHTML = '<span class="message-erreur">Seuls les fichiers .xlsx sont autorisés.</span>';
    mettreAJourBoutonImportReferentiel();
    return;
  }
  if (fichier.type && fichier.type !== typeAttendu) {
    etat.fichier = null;
    resume.innerHTML = '<span class="message-erreur">Le type du fichier Excel est invalide.</span>';
    mettreAJourBoutonImportReferentiel();
    return;
  }
  if (!fichier.size || fichier.size > 5 * 1024 * 1024) {
    etat.fichier = null;
    resume.innerHTML = '<span class="message-erreur">Le fichier doit être non vide et ne pas dépasser 5 Mo.</span>';
    mettreAJourBoutonImportReferentiel();
    return;
  }

  etat.fichier = fichier;
  resume.innerHTML = `
    <span>✓ ${echapperHtml(nom)} · ${formaterTailleImportReferentiel_(fichier.size)}</span>
  `;
  mettreAJourBoutonImportReferentiel();
}


function executerEtapeImportReferentiel() {
  const etat = etatApplication.importReferentiel;
  if (!etat || etat.enCours) {
    return;
  }

  if (etat.etape === 1) {
    analyserFichierImportReferentiel_();
  } else if (etat.etape === 2) {
    afficherEtapeImportReferentiel_(3);
  } else if (etat.etape === 3) {
    demanderPrevisualisationImportReferentiel_();
  } else if (etat.etape === 4) {
    afficherConfirmationImportReferentiel_();
    afficherEtapeImportReferentiel_(5);
  } else if (etat.etape === 5) {
    confirmerImportReferentiel_();
  } else if (etat.etape === 6) {
    voirReferentielApresImport_();
  }
}


function reculerImportReferentiel() {
  const etat = etatApplication.importReferentiel;
  if (!etat || etat.enCours || etat.etape <= 1 || etat.etape >= 6) {
    return;
  }
  afficherEtapeImportReferentiel_(etat.etape - 1);
}


function afficherEtapeImportReferentiel_(etape) {
  const etat = etatApplication.importReferentiel;
  if (!etat) return;
  etat.etape = etape;

  document.querySelectorAll('[data-panneau-import]').forEach(
    function (panneau) {
      panneau.classList.toggle(
        'masque',
        Number(panneau.dataset.panneauImport) !== etape
      );
    }
  );
  document.querySelectorAll('[data-etape-import]').forEach(
    function (indicateur) {
      const numero = Number(indicateur.dataset.etapeImport);
      indicateur.classList.toggle('etape-active', numero === etape);
      indicateur.classList.toggle('etape-terminee', numero < etape);
    }
  );

  if (etape === 3) {
    afficherCorrespondancesImportReferentiel_();
  }
  mettreAJourBoutonImportReferentiel();
}


function mettreAJourBoutonImportReferentiel() {
  const etat = etatApplication.importReferentiel;
  const bouton = document.getElementById('boutonActionImportReferentiel');
  const retour = document.getElementById('boutonRetourImportReferentiel');
  if (!etat || !bouton || !retour) return;

  const libelles = {
    1: 'Analyser le fichier',
    2: 'Continuer',
    3: 'Prévisualiser',
    4: 'Continuer',
    5: 'Importer',
    6: 'Voir le référentiel'
  };
  bouton.textContent = etat.enCours
    ? 'Traitement en cours…'
    : libelles[etat.etape];

  let autorise = !etat.enCours;
  if (etat.etape === 1) autorise = autorise && Boolean(etat.fichier);
  if (etat.etape === 2) autorise = autorise && Boolean(etat.analyse);
  if (etat.etape === 3) {
    const selects = Array.from(
      document.querySelectorAll('[data-correspondance-formation]')
    );
    autorise = autorise && selects.length > 0 &&
      selects.every(function (select) { return Boolean(select.value); });
  }
  if (etat.etape === 4) {
    autorise = autorise && Boolean(etat.previsualisation);
  }
  if (etat.etape === 5) {
    autorise = autorise &&
      document.getElementById('confirmationTexteImportReferentiel').value
        .trim() === 'IMPORTER';
  }
  bouton.disabled = !autorise;
  retour.disabled = etat.enCours;
  retour.classList.toggle('masque', etat.etape === 1 || etat.etape === 6);
}


function analyserFichierImportReferentiel_() {
  const etat = etatApplication.importReferentiel;
  if (!etat || !etat.fichier) return;

  const fichier = etat.fichier;
  const lecteur = new FileReader();
  etat.enCours = true;
  mettreAJourBoutonImportReferentiel();

  lecteur.onerror = function () {
    etat.enCours = false;
    mettreAJourBoutonImportReferentiel();
    afficherToast('Impossible de lire le fichier sélectionné.', true);
  };
  lecteur.onload = function () {
    const contenu = String(lecteur.result || '');
    const base64 = contenu.includes(',') ? contenu.split(',')[1] : contenu;

    google.script.run
      .withSuccessHandler(function (analyse) {
        if (!etatApplication.importReferentiel) return;
        etat.fichier = null;
        etat.analyse = analyse;
        etat.enCours = false;
        afficherAnalyseImportReferentiel_(analyse);
        afficherEtapeImportReferentiel_(2);
      })
      .withFailureHandler(function (erreur) {
        if (!etatApplication.importReferentiel) return;
        etat.enCours = false;
        mettreAJourBoutonImportReferentiel();
        afficherToast(extraireMessageErreur(erreur), true);
      })
      .analyserFichierXlsxReferentiel(
        {
          nom: fichier.name,
          type: fichier.type,
          taille: fichier.size,
          base64: base64
        },
        obtenirJetonAdministrateurApplication()
      );
  };
  lecteur.readAsDataURL(fichier);
}


function afficherAnalyseImportReferentiel_(analyse) {
  const cible = document.getElementById('contenuAnalyseImportReferentiel');
  const anomalies = Array.isArray(analyse.anomalies) ? analyse.anomalies : [];
  cible.innerHTML = `
    <div class="bloc-import-referentiel">
      <strong>${echapperHtml(analyse.nomFichier)}</strong><br>
      <span>${echapperHtml(analyse.nomFeuille)} · ${formaterTailleImportReferentiel_(analyse.tailleOctets)}</span>
    </div>
    <div class="grille-indicateurs-import-referentiel">
      ${indicateurImportReferentiel_('Lignes', analyse.nombreLignes)}
      ${indicateurImportReferentiel_('Lignes valides', analyse.nombreLignesValides)}
      ${indicateurImportReferentiel_('Formations', analyse.typesFormation.length)}
      ${indicateurImportReferentiel_('Catégories', analyse.nombreCategories)}
      ${indicateurImportReferentiel_('Items', analyse.nombreItems)}
      ${indicateurImportReferentiel_('Théorie', analyse.theories)}
      ${indicateurImportReferentiel_('Technique', analyse.techniques)}

function afficherCorrespondancesImportReferentiel_() {
  const etat = etatApplication.importReferentiel;
  if (!etat || !etat.analyse) return;
  const cible = document.getElementById('listeCorrespondancesImportReferentiel');
  const formations = etat.analyse.formationsActives || [];

  cible.innerHTML = etat.analyse.typesFormation.map(function (source, index) {
    const correspondanceExistante = etat.correspondances.find(
      function (element) {
        return element.source === source;
      }
    );
    const options = formations.map(function (formation) {
      const selectionnee = correspondanceExistante &&
        !correspondanceExistante.ignore &&
        correspondanceExistante.cible === formation;
      return `<option value="${echapperHtml(formation)}" ${selectionnee ? 'selected' : ''}>${echapperHtml(formation)}</option>`;
    }).join('');
    return `
      <div class="ligne-correspondance-import-referentiel">
        <strong>${echapperHtml(source)}</strong>
        <span>→</span>
        <select
          class="champ"
          data-correspondance-formation
          data-source-index="${index}"
          onchange="mettreAJourBoutonImportReferentiel()"
        >
          <option value="">Choisir une formation</option>
          ${options}
          <option value="__IGNORER__" ${correspondanceExistante && correspondanceExistante.ignore ? 'selected' : ''}>Ignorer ce type</option>
        </select>
      </div>
    `;
  }).join('');
  mettreAJourBoutonImportReferentiel();
}


function lireCorrespondancesImportReferentiel_() {
  const etat = etatApplication.importReferentiel;
  return Array.from(
    document.querySelectorAll('[data-correspondance-formation]')
  ).map(function (select) {
    const source = etat.analyse.typesFormation[
      Number(select.dataset.sourceIndex)
    ];
    return {
      source: source,
      cible: select.value === '__IGNORER__' ? '' : select.value,
      ignore: select.value === '__IGNORER__'
    };
  });
}

  if (!anomalies.length) {

  }
  return `
    <h4>Anomalies signalées</h4>
    <ul class="liste-anomalies-import-referentiel">
      ${anomalies.map(function (anomalie) {
        return `<li>Ligne ${Number(anomalie.ligne) || '—'} — ${echapperHtml(anomalie.message || anomalie.code || 'Anomalie')}</li>`;
      }).join('')}
    </ul>
  `;
}


function formaterTailleImportReferentiel_(octets) {
  const valeur = Number(octets) || 0;
  if (valeur < 1024) return valeur + ' o';
  if (valeur < 1024 * 1024) return (valeur / 1024).toFixed(1) + ' Ko';
  return (valeur / (1024 * 1024)).toFixed(2) + ' Mo';
}

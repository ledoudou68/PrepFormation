<script>

'use strict';

const CLE_JETON_ADMINISTRATION =
  'prepformation.jetonAdministration';
const DUREE_INACTIVITE_ADMINISTRATION_MS = 30 * 60 * 1000;
const INTERVALLE_RENOUVELLEMENT_ADMINISTRATION_MS = 60 * 1000;

const etatApplication = {
  pageActive: 'Accueil',
  sessionUtilisateur: null,
  stagiaires: [],
  formateurs: [],
  formations: [],
  statutsStagiaires: [],
  sessions: [],
  stagiairesSession: [],
  formateursSession: [],
  formationsSession: [],
  referentielSession: [],
  formationReferentielSession: '',
  itemsTravaillesSession: {},
  validationsSession: {},
  sessionDetaillee: null,
  modeFormulaireSession: 'creation',
  idSessionSourceFormulaire: '',
  idsFormateursHistoriquesSession: {},
  idsStagiairesHistoriquesSession: {},
  confirmationsStagiairesFermesSession: {},
  formationsReferentiel: [],
  categoriesReferentiel: [],
  itemsReferentiel: [],
  itemsReferentielEnCours: {},
  formationReferentielActive: '',
  prestationsIndemnisation: [],
  prestationsFiltreesIndemnisation: [],
  formateursIndemnisation: [],
  formationsIndemnisation: [],
  statutsIndemnisation: [],
  selectionPrestationsIndemnisation: {},
  donneesAccueil: null,
  sessionAConsulterDepuisAccueil: '',
  stagiaireAConsulterDepuisAccueil: '',
  formationsAdministration: [],
  diagnosticAdministration: null,
  sauvegardesAdministration: null,
  restaurationAdministration: null,
  previewRestaurationActive: null,
  minuterieProgressionRestauration: null,
  generationSuiviRestauration: 0,
  restaurationModaleFermable: false,
  rafraichirRestaurationApresFermeture: false,
  backupIdRestaurabiliteActif: '',
  consultationRestaurabiliteActive: null,
  derniereActiviteAdministration: 0,
  minuterieAdministration: null,
  renouvellementAdministrationEnCours: false
};

document.addEventListener(
  'DOMContentLoaded',
  initialiserInterface
);

function initialiserInterface() {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.addEventListener('click', function () {
        chargerPage(bouton.dataset.page);
      });
    });

  afficherLoader();

  ['pointerdown', 'keydown', 'touchstart'].forEach(
    function (nomEvenement) {
      document.addEventListener(
        nomEvenement,
        noterActiviteAdministration,
        { passive: true }
      );
    }
  );

  google.script.run
    .withSuccessHandler(function (sessionUtilisateur) {
      etatApplication.sessionUtilisateur =
        sessionUtilisateur || {
          email: '',
          estIdentifie: false,
          estAdministrateur: false,
          droits: {}
        };

      if (!etatApplication.sessionUtilisateur.estAdministrateur) {
        retirerJetonAdministrateurApplication();
      } else {
        etatApplication.derniereActiviteAdministration = Date.now();
      }

      appliquerDroitsInterface();
      demarrerSurveillanceAdministration();
      chargerPage('Accueil');
    })
    .withFailureHandler(function (erreur) {
      masquerLoader();
      gererErreurServeur(erreur);
    })
    .getSessionUtilisateur(
      obtenirJetonAdministrateurApplication()
    );
}

function chargerPage(nomPage) {
  if (
    ['Referentiel', 'Indemnisation', 'Administration']
      .includes(nomPage) &&
    !estAdministrateurApplication()
  ) {
    afficherToast(
      'Accès réservé à l’administrateur.',
      true
    );
    return;
  }

  afficherLoader();

  google.script.run
    .withSuccessHandler(function (html) {
      document.getElementById('contenu').innerHTML = html;

      etatApplication.pageActive = nomPage;

      appliquerDroitsInterface();
      activerBoutonMenu(nomPage);
      fermerMenuMobile();
      masquerLoader();
      initialiserPageActive(nomPage);
    })
    .withFailureHandler(gererErreurServeur)
    .getPage(
      nomPage,
      obtenirJetonAdministrateurApplication()
    );
}

function initialiserPageActive(nomPage) {
  if (nomPage === 'Accueil') {
    initialiserPageAccueil();
  }

  if (nomPage === 'Stagiaires') {
    initialiserPageStagiaires();
  }

  if (nomPage === 'Formateurs') {
    initialiserPageFormateurs();
  }

  if (nomPage === 'Sessions') {
    initialiserPageSessions();
  }

  if (nomPage === 'Referentiel') {
    initialiserPageReferentiel();
  }

  if (nomPage === 'Indemnisation') {
    initialiserPageIndemnisations();
  }

  if (nomPage === 'Administration') {
    initialiserPageAdministration();
  }
}

function estAdministrateurApplication() {
  return Boolean(
    etatApplication.sessionUtilisateur &&
    etatApplication.sessionUtilisateur.estAdministrateur
  );
}

function appliquerDroitsInterface() {
  const administrateur = estAdministrateurApplication();

  document
    .querySelectorAll('[data-admin-only="true"]')
    .forEach(function (element) {
      element.classList.toggle('masque', !administrateur);
    });

  const boutonAcces = document.getElementById(
    'boutonAccesAdministrateur'
  );
  const boutonVerrouiller = document.getElementById(
    'boutonVerrouillerAdministration'
  );

  boutonAcces?.classList.toggle('masque', administrateur);
  boutonVerrouiller?.classList.toggle('masque', !administrateur);

  document
    .querySelectorAll('[data-formateur-only="true"]')
    .forEach(function (element) {
      element.classList.toggle('masque', administrateur);
    });

  const identite = document.getElementById(
    'identiteUtilisateurApplication'
  );

  if (identite) {
    const session = etatApplication.sessionUtilisateur || {};

    identite.textContent = administrateur
      ? 'Mode administrateur'
      : 'Mode formateur';

    if (session.email) {
      identite.textContent += ' · ' + session.email;
    }

  }
}

function peutGererSessionsApplication() {
  return Boolean(
    etatApplication.sessionUtilisateur &&
    etatApplication.sessionUtilisateur.droits &&
    etatApplication.sessionUtilisateur.droits.gererSessions
  );
}

function obtenirJetonAdministrateurApplication() {
  try {
    return sessionStorage.getItem(
      CLE_JETON_ADMINISTRATION
    ) || '';
  } catch (erreur) {
    return '';
  }
}

function enregistrerJetonAdministrateurApplication(jeton) {
  try {
    sessionStorage.setItem(
      CLE_JETON_ADMINISTRATION,
      String(jeton || '')
    );
  } catch (erreur) {
    throw new Error(
      'Le navigateur refuse le stockage temporaire de la session administrateur.'
    );
  }
}

function retirerJetonAdministrateurApplication() {
  try {
    sessionStorage.removeItem(CLE_JETON_ADMINISTRATION);
  } catch (erreur) {
    console.error(erreur);
  }
}

function ouvrirModalAccesAdministrateur() {
  const modal = document.getElementById(
    'modalAccesAdministrateur'
  );
  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );

  if (!modal || !champ) {
    return;
  }

  champ.value = '';
  modal.classList.remove('masque');
  document.body.classList.add('modal-ouverte');
  window.setTimeout(function () {
    champ.focus();
  }, 50);
}

function fermerModalAccesAdministrateur() {
  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );

  if (champ) {
    champ.value = '';
  }

  document.getElementById(
    'modalAccesAdministrateur'
  )?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
}

function soumettreAccesAdministrateur(evenement) {
  evenement.preventDefault();

  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );
  const bouton = document.getElementById(
    'boutonValiderAccesAdministrateur'
  );
  let motDePasse = champ ? champ.value : '';

  if (champ) {
    champ.value = '';
  }

  bouton.disabled = true;
  bouton.textContent = 'Vérification…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Déverrouiller';

      try {
        enregistrerJetonAdministrateurApplication(
          resultat.jeton
        );
      } catch (erreur) {
        afficherToast(extraireMessageErreur(erreur), true);
        return;
      }

      etatApplication.sessionUtilisateur =
        resultat.sessionUtilisateur;
      etatApplication.derniereActiviteAdministration = Date.now();
      fermerModalAccesAdministrateur();
      appliquerDroitsInterface();
      rafraichirInterfaceApresChangementDroits();
      afficherToast('Administration déverrouillée.', false);
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent = 'Déverrouiller';
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .deverrouillerAdministration(motDePasse);

  motDePasse = '';
}

function verrouillerAdministrationInterface() {
  const jeton = obtenirJetonAdministrateurApplication();

  verrouillerAdministrationLocale();

  if (!jeton) {
    return;
  }

  google.script.run
    .withFailureHandler(function (erreur) {
      console.error(erreur);
    })
    .verrouillerAdministration(jeton);
}

function verrouillerAdministrationLocale() {
  retirerJetonAdministrateurApplication();
  etatApplication.sessionUtilisateur = {
    email: etatApplication.sessionUtilisateur?.email || '',
    estIdentifie: Boolean(
      etatApplication.sessionUtilisateur?.email
    ),
    estAdministrateur: false,
    droits: {
      consulterStagiaires: true,
      consulterSuiviPedagogique: true,
      gererSessions: true,
      consulterFormateurs: true,
      consulterMonRecapitulatifHeures: Boolean(
        etatApplication.sessionUtilisateur?.email
      )
    }
  };
  etatApplication.derniereActiviteAdministration = 0;
  fermerModalAccesAdministrateur();
  appliquerDroitsInterface();

  if ([
    'Referentiel',
    'Indemnisation',
    'Administration'
  ].includes(etatApplication.pageActive)) {
    chargerPage('Accueil');
  } else {
    rafraichirInterfaceApresChangementDroits();
  }
}

function rafraichirInterfaceApresChangementDroits() {
  appliquerDroitsInterface();

  if (etatApplication.pageActive === 'Stagiaires') {
    afficherListeStagiaires();
  }

  if (etatApplication.pageActive === 'Formateurs') {
    rechargerFormateurs();
  }

  if (etatApplication.pageActive === 'Accueil') {
    initialiserPageAccueil();
  }
}

function noterActiviteAdministration() {
  if (estAdministrateurApplication()) {
    etatApplication.derniereActiviteAdministration = Date.now();
  }
}

function demarrerSurveillanceAdministration() {
  window.clearInterval(etatApplication.minuterieAdministration);

  etatApplication.minuterieAdministration = window.setInterval(
    verifierActiviteAdministration,
    INTERVALLE_RENOUVELLEMENT_ADMINISTRATION_MS
  );
}

function verifierActiviteAdministration() {
  if (!estAdministrateurApplication()) {
    return;
  }

  const derniereActivite = Number(
    etatApplication.derniereActiviteAdministration || 0
  );

  if (
    !derniereActivite ||
    Date.now() - derniereActivite >=
      DUREE_INACTIVITE_ADMINISTRATION_MS
  ) {
    verrouillerAdministrationInterface();
    afficherToast(
      'Administration verrouillée après 30 minutes d’inactivité.',
      false
    );
    return;
  }

  if (etatApplication.renouvellementAdministrationEnCours) {
    return;
  }

  etatApplication.renouvellementAdministrationEnCours = true;

  google.script.run
    .withSuccessHandler(function (sessionUtilisateur) {
      etatApplication.renouvellementAdministrationEnCours = false;
      etatApplication.sessionUtilisateur = sessionUtilisateur;
      appliquerDroitsInterface();
    })
    .withFailureHandler(function () {
      etatApplication.renouvellementAdministrationEnCours = false;
      verrouillerAdministrationLocale();
      afficherToast(
        'La session administrateur a expiré.',
        true
      );
    })
    .renouvelerSessionAdministration(
      obtenirJetonAdministrateurApplication()
    );
}

function activerBoutonMenu(nomPage) {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.classList.toggle(
        'actif',
        bouton.dataset.page === nomPage
      );
    });
}

function afficherLoader() {
  document
    .getElementById('loader')
    .classList
    .remove('masque');
}

function masquerLoader() {
  document
    .getElementById('loader')
    .classList
    .add('masque');
}

function afficherToast(message, erreur) {
  const toast = document.getElementById('toast');

  toast.textContent = message;
  toast.classList.toggle('erreur', Boolean(erreur));
  toast.classList.add('visible');

  window.clearTimeout(afficherToast.timer);

  afficherToast.timer = window.setTimeout(function () {
    toast.classList.remove('visible');
  }, 3500);
}

function extraireMessageErreur(erreur) {
  if (!erreur) {
    return 'Une erreur inconnue est survenue.';
  }

  const message = erreur.message || String(erreur);

  if (
    estAdministrateurApplication() &&
    message.includes('Accès réservé à l’administrateur.')
  ) {
    verrouillerAdministrationLocale();
  }

  return message;
}

function gererErreurServeur(erreur) {
  masquerLoader();

  afficherToast(
    extraireMessageErreur(erreur),
    true
  );
}

function basculerMenu() {
  document
    .getElementById('menuLateral')
    .classList
    .toggle('ouvert');
}

function fermerMenuMobile() {
  document
    .getElementById('menuLateral')
    .classList
    .remove('ouvert');
}

/* =====================================================
   ACCUEIL
===================================================== */

function initialiserPageAccueil() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (donnees) {
      if (etatApplication.pageActive !== 'Accueil') {
        return;
      }

      etatApplication.donneesAccueil = donnees || {};
      afficherTableauBordAccueil(
        etatApplication.donneesAccueil
      );
      masquerLoader();
    })
    .withFailureHandler(function (erreur) {
      if (etatApplication.pageActive === 'Accueil') {
        gererErreurServeur(erreur);
      }
    })
    .getDonneesTableauBordAccueil(
      obtenirJetonAdministrateurApplication()
    );
}

function afficherTableauBordAccueil(donnees) {
  const indicateurs = donnees.indicateurs || {};

  const valeurs = {
    indicateurStagiairesAccueil:
      Number(indicateurs.stagiairesAPreparer) || 0,
    indicateurSessionsMoisAccueil:
      Number(indicateurs.sessionsMois) || 0,
    indicateurHeuresMoisAccueil:
      formaterHeuresFormation(
        indicateurs.heuresFormateursMois
      ),
    indicateurPrestationsAccueil:
      Number(indicateurs.prestationsADemander) || 0,
    indicateurEnPreparationAccueil:
      Number(indicateurs.stagiairesEnPreparation) || 0,
    indicateurStagesAujourdhuiAccueil:
      Number(indicateurs.stagesAujourdhui) || 0,
    indicateurStagesPassesAccueil:
      Number(indicateurs.stagesPassesNonClotures) || 0
  };

  Object.keys(valeurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = valeurs[identifiant];
    }
  });

  const dateActualisation = document.getElementById(
    'dateActualisationAccueil'
  );

  if (dateActualisation) {
    dateActualisation.textContent = donnees.dateActualisation
      ? 'Actualisé le ' + donnees.dateActualisation
      : 'Données actualisées';
  }

  afficherEcheancesProchesAccueil(
    Array.isArray(donnees.echeancesProches)
      ? donnees.echeancesProches
      : []
  );

  afficherAlertesPedagogiquesAccueil(
    Array.isArray(donnees.alertesPedagogiques)
      ? donnees.alertesPedagogiques
      : []
  );

  afficherDernieresSessionsAccueil(
    Array.isArray(donnees.dernieresSessions)
      ? donnees.dernieresSessions
      : []
  );

  afficherIndemnisationsAttenteAccueil(
    Array.isArray(donnees.indemnisationsEnAttente)
      ? donnees.indemnisationsEnAttente
      : []
  );
}

function afficherEcheancesProchesAccueil(echeances) {
  const zone = document.getElementById(
    'echeancesProchesAccueil'
  );

  if (!zone) {
    return;
  }

  if (!echeances.length) {
    zone.innerHTML = creerEtatVideAccueil(
      '✓',
      'Aucune échéance dans les 30 prochains jours',
      'Les dates de stage à venir apparaîtront ici.'
    );
    return;
  }

  zone.innerHTML = `
    <div class="liste-echeances-accueil">
      ${echeances.map(function (echeance) {
        const progression = Math.max(
          0,
          Math.min(
            100,
            Math.round(Number(echeance.progression) || 0)
          )
        );

        return `
          <button
            type="button"
            class="ligne-echeance-accueil"
            data-id-stagiaire="${echapperHtml(echeance.idStagiaire)}"
            onclick="ouvrirStagiaireDepuisAccueil(this.dataset.idStagiaire)"
          >
            <span class="date-echeance-accueil">
              <strong>J-${Number(echeance.joursRestants) || 0}</strong>
              <small>${echapperHtml(afficherDateFrancaise(echeance.dateStage))}</small>
            </span>
            <span class="identite-echeance-accueil">
              <strong>
                ${echapperHtml(echeance.prenom)}
                ${echapperHtml(echeance.nom)}
              </strong>
              <small>${echapperHtml(echeance.formation || 'Formation non renseignée')}</small>
            </span>
            <span class="progression-echeance-accueil">
              <span>
                <small>Progression</small>
                <strong>${progression} %</strong>
              </span>
              <span class="mini-barre-progression-accueil">
                <i
                  class="${obtenirClasseProgressionAccueil(progression)}"
                  style="width: ${progression}%"
                ></i>
              </span>
            </span>
            <span class="fleche-liste-accueil">›</span>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function afficherAlertesPedagogiquesAccueil(alertes) {
  const zone = document.getElementById(
    'alertesPedagogiquesAccueil'
  );
  const compteur = document.getElementById(
    'nombreAlertesAccueil'
  );

  if (compteur) {
    compteur.textContent = String(alertes.length);
  }

  if (!zone) {
    return;
  }

  if (!alertes.length) {
    zone.innerHTML = creerEtatVideAccueil(
      '✓',
      'Aucune alerte pédagogique',
      'Toutes les préparations ouvertes sont dans une situation normale.'
    );
    return;
  }

  const configurations = {
    progression: {
      icone: '!',
      classe: 'alerte-accueil-critique'
    },
    inactivite: {
      icone: '⏱',
      classe: 'alerte-accueil-inactivite'
    },
    aucun_acquis: {
      icone: '○',
      classe: 'alerte-accueil-acquis'
    }
  };

  zone.innerHTML = `
    <div class="liste-alertes-accueil">
      ${alertes.map(function (alerte) {
        const configuration = configurations[alerte.type] ||
          configurations.inactivite;

        let detail =
          Math.round(Number(alerte.progression) || 0) +
          ' % de progression';

        if (alerte.type === 'progression') {
          detail = 'J-' + (Number(alerte.valeur) || 0) +
            ' · ' + detail;
        }

        if (alerte.type === 'inactivite') {
          detail = (Number(alerte.valeur) || 0) +
            ' jours sans séance';
        }

        if (alerte.type === 'aucun_acquis') {
          detail = '0 / ' + (Number(alerte.valeur) || 0) +
            ' item(s) acquis';
        }

        return `
          <button
            type="button"
            class="ligne-alerte-accueil ${configuration.classe}"
            data-id-stagiaire="${echapperHtml(alerte.idStagiaire)}"
            onclick="ouvrirStagiaireDepuisAccueil(this.dataset.idStagiaire)"
          >
            <span class="icone-alerte-accueil">
              ${configuration.icone}
            </span>
            <span class="contenu-alerte-accueil">
              <strong>
                ${echapperHtml(alerte.prenom)}
                ${echapperHtml(alerte.nom)}
              </strong>
              <span>${echapperHtml(alerte.message)}</span>
              <small>
                ${echapperHtml(alerte.formation || 'Formation non renseignée')}
                · ${echapperHtml(detail)}
              </small>
            </span>
            <span class="fleche-liste-accueil">›</span>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function afficherDernieresSessionsAccueil(sessions) {
  const corps = document.getElementById(
    'dernieresSessionsAccueil'
  );

  if (!corps) {
    return;
  }

  if (!sessions.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="6" class="etat-vide">
          Aucune séance réalisée pour le moment.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = sessions.map(function (session) {
    const formateurs = Array.isArray(session.formateurs) &&
      session.formateurs.length
      ? session.formateurs.map(echapperHtml).join('<br>')
      : '—';

    const stagiaires = Array.isArray(session.stagiaires) &&
      session.stagiaires.length
      ? session.stagiaires.map(echapperHtml).join(', ')
      : '—';

    return `
      <tr
        class="ligne-cliquable-accueil"
        data-id-session="${echapperHtml(session.idSession)}"
        onclick="ouvrirSessionDepuisAccueil(this.dataset.idSession)"
      >
        <td>
          <strong>${echapperHtml(afficherDateFrancaise(session.date) || '—')}</strong>
        </td>
        <td>
          <span class="badge-formation-session">
            ${echapperHtml(session.formation || '—')}
          </span>
        </td>
        <td>${formateurs}</td>
        <td class="stagiaires-session-accueil">${stagiaires}</td>
        <td>${echapperHtml(formaterHeuresFormation(session.dureeHeures))}</td>
        <td class="colonne-actions-accueil">
          <button
            type="button"
            class="bouton-consulter-session"
            data-id-session="${echapperHtml(session.idSession)}"
            onclick="event.stopPropagation(); ouvrirSessionDepuisAccueil(this.dataset.idSession)"
          >
            <span aria-hidden="true">👁</span>
            Consulter
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

function afficherIndemnisationsAttenteAccueil(groupes) {
  const zone = document.getElementById(
    'indemnisationsAttenteAccueil'
  );

  if (!zone) {
    return;
  }

  if (!groupes.length) {
    zone.innerHTML = creerEtatVideAccueil(
      '✓',
      'Aucune indemnisation à demander',
      'Toutes les prestations ont déjà été traitées.'
    );
    return;
  }

  zone.innerHTML = `
    <div class="grille-indemnisations-accueil">
      ${groupes.map(function (groupe) {
        return `
          <button
            type="button"
            class="carte-indemnisation-accueil"
            onclick="ouvrirModuleDepuisAccueil('Indemnisation')"
          >
            <span class="avatar-formateur-accueil">€</span>
            <span class="contenu-indemnisation-accueil">
              <strong>${echapperHtml(groupe.formateur)}</strong>
              <small>
                ${Number(groupe.nombrePrestations) || 0}
                prestation${Number(groupe.nombrePrestations) > 1 ? 's' : ''}
              </small>
            </span>

function initialiserPageStagiaires() {
  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargement() {
    chargementsTermines++;

    if (
      chargementsTermines === 3 &&
      !erreurRencontree
    ) {
      remplirFiltresStagiaires();
      afficherListeStagiaires();
      masquerLoader();

      const idStagiaire =
        etatApplication.stagiaireAConsulterDepuisAccueil;

      if (idStagiaire) {
        etatApplication.stagiaireAConsulterDepuisAccueil = '';

        window.setTimeout(function () {
          consulterStagiaire(idStagiaire);
        }, 50);
      }
    }
  }

  function erreurChargement(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (stagiaires) {
      etatApplication.stagiaires =
        Array.isArray(stagiaires) ? stagiaires : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStagiaires();

  google.script.run
    .withSuccessHandler(function (formations) {
      etatApplication.formations =
        Array.isArray(formations) ? formations : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getFormations();

  google.script.run
    .withSuccessHandler(function (statuts) {
      etatApplication.statutsStagiaires =
        Array.isArray(statuts) ? statuts : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStatutsStagiaires();
}

function remplirFiltresStagiaires() {
  remplirSelect(
    'filtreFormationStagiaire',

    'Toutes les formations'
  );

  remplirSelect(
    'filtreStatutStagiaire',
    etatApplication.statutsStagiaires,
    'Tous les statuts'
  );

  remplirSelect(

    etatApplication.formations,

  );

}

function remplirSelect(
  identifiant,
  valeurs,
  premiereOption
) {
  const select = document.getElementById(identifiant);

  if (!select) {
    return;
  }

  const valeurActuelle = select.value;

  select.innerHTML = '';

  if (premiereOption !== null) {
    const optionInitiale =
      document.createElement('option');

    optionInitiale.value = '';
    optionInitiale.textContent = premiereOption;

    select.appendChild(optionInitiale);
  }

  valeurs.forEach(function (valeur) {
    const option = document.createElement('option');

    option.value = valeur;
    option.textContent = valeur;

    select.appendChild(option);
  });

  if (
    [...select.options].some(function (option) {
      return option.value === valeurActuelle;
    })
  ) {
    select.value = valeurActuelle;
  }
}

function afficherListeStagiaires() {
  const corps = document.getElementById(
    'corpsTableauStagiaires'
  );

  if (!corps) {
    return;
  }

  const stagiaires = obtenirStagiairesFiltres();

  const compteur = document.getElementById(
    'compteurStagiaires'
  );

  if (compteur) {
    compteur.textContent =
      stagiaires.length +
      (stagiaires.length > 1
        ? ' stagiaires affichés'
        : ' stagiaire affiché');
  }

  if (stagiaires.length === 0) {
    corps.innerHTML = `
      <tr>
        <td colspan="6" class="etat-vide">
          Aucun stagiaire ne correspond aux critères.
        </td>
      </tr>
    `;

    return;
  }

  corps.innerHTML = stagiaires
    .map(function (stagiaire) {
      return creerLigneStagiaire(stagiaire);
    })
    .join('');
}

function obtenirStagiairesFiltres() {
  const recherche = String(
    document.getElementById('rechercheStagiaire')
      ?.value || ''
  )
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');

  const formation = String(
    document.getElementById(
      'filtreFormationStagiaire'
    )?.value || ''
  );

  const statut = String(
    document.getElementById(
      'filtreStatutStagiaire'
    )?.value || ''
  );

  return etatApplication.stagiaires.filter(
    function (stagiaire) {
      const identite =
        (stagiaire.nom + ' ' + stagiaire.prenom)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');

      const correspondRecherche =
        !recherche || identite.includes(recherche);

      const correspondFormation =
        !formation ||
        stagiaire.formation === formation;

      const correspondStatut =
        !statut ||
        stagiaire.statut === statut;

      return (
        correspondRecherche &&
        correspondFormation &&
        correspondStatut
      );
    }
  );
}

function mettreAJourSuiviFicheStagiaire(
  uuid,
  suivi
) {
  const modal = document.getElementById(
    'modalFicheStagiaire'
  );

  if (!modal || modal.dataset.uuid !== uuid) {
    return;
  }

  const synthese = suivi && suivi.synthese
    ? suivi.synthese
    : {};

  document.getElementById(
    'valeurSessionsRealisees'
  ).textContent = String(
    Number(synthese.sessionsRealisees) || 0
  );

  document.getElementById(
    'valeurHeuresFormation'
  ).textContent = formaterHeuresFormation(
    synthese.heuresFormation
  );

  document.getElementById(
    'valeurTauxPresence'
  ).textContent = synthese.tauxPresence === null ||
    synthese.tauxPresence === undefined
    ? '—'
    : Math.round(Number(synthese.tauxPresence)) + ' %';

  document.getElementById(
    'valeurEvaluations'
  ).textContent = String(
    Number(synthese.evaluations) || 0
  );

  afficherSessionsFicheStagiaire(
    Array.isArray(suivi && suivi.sessions)
      ? suivi.sessions
      : []
  );

  afficherSuiviPedagogiqueFicheStagiaire(
    Array.isArray(suivi && suivi.suiviPedagogique)
      ? suivi.suiviPedagogique
      : []
  );

  afficherTableauBordPedagogiqueFicheStagiaire(
    suivi && suivi.tableauBordPedagogique
      ? suivi.tableauBordPedagogique
      : {}
  );

  afficherChronologiePedagogiqueFicheStagiaire(
    Array.isArray(
      suivi && suivi.chronologiePedagogique
    )
      ? suivi.chronologiePedagogique
      : []
  );
}

function afficherTableauBordPedagogiqueFicheStagiaire(
  tableauBord
) {
  const pourcentage = Math.max(
    0,
    Math.min(
      100,
      Math.round(
        Number(tableauBord.progressionGenerale) || 0
      )
    )
  );

  const elementPourcentage = document.getElementById(
    'pourcentageProgressionGeneraleStagiaire'
  );
  const barre = document.getElementById(
    'barreProgressionGeneraleStagiaire'
  );

  if (elementPourcentage) {
    elementPourcentage.textContent = pourcentage + ' %';
  }

  if (barre) {
    barre.setAttribute('aria-valuenow', String(pourcentage));

    const remplissage = barre.querySelector('span');

    if (remplissage) {
      remplissage.style.width = pourcentage + '%';
    }
  }

  const compteurs = {
    nombreItemsFormationStagiaire:
      tableauBord.nombreItems,
    nombreItemsTravaillesStagiaire:
      tableauBord.nombreTravailles,
    nombreItemsAcquisStagiaire:
      tableauBord.nombreAcquis,
    nombreItemsRestantsStagiaire:
      tableauBord.nombreRestantATravailler
  };

  Object.keys(compteurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = String(
        Number(compteurs[identifiant]) || 0
      );
    }
  });

  afficherProgressionCategoriesFicheStagiaire(
    Array.isArray(tableauBord.progressionCategories)
      ? tableauBord.progressionCategories
      : []
  );

function formaterHeuresFormation(valeur) {
  const nombre = Number(valeur);

  if (!Number.isFinite(nombre)) {
    return '0 h';
  }

  return nombre.toLocaleString(
    'fr-FR',
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  ) + ' h';
}

function calculerEcheanceStage(dateIso) {
  if (!dateIso) {
    return '—';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return '—';
  }

  const dateStage = new Date(
    Number(parties[0]),
    Number(parties[1]) - 1,
    Number(parties[2])
  );

  const aujourdHui = new Date();
  aujourdHui.setHours(0, 0, 0, 0);

  const difference = Math.ceil(
    (
      dateStage.getTime() -
      aujourdHui.getTime()
    ) / 86400000
  );

  if (difference > 0) {
    return 'J-' + difference;
  }

  if (difference === 0) {
    return 'J';
  }

  return 'J+' + Math.abs(difference);
}

function mettreAJourZoneCycleVieStagiaire(stagiaire) {
  const bouton = document.getElementById(
    'boutonCloturerStagiaire'
  );
  const boutonReactiver = document.getElementById(
    'boutonReactiverStagiaire'
  );
  const resume = document.getElementById(
    'resumeCycleVieStagiaire'
  );

  if (!bouton || !boutonReactiver || !resume) {
    return;
  }

  if (!stagiaire || !stagiaire.uuid) {
    bouton.classList.add('masque');
    boutonReactiver.classList.add('masque');
    resume.textContent =
      'Enregistre d\'abord le stagiaire pour pouvoir clôturer sa préparation.';
    return;
  }

  const preparationFermee = [
    'Clôturé',
    'Abandon'
  ].includes(stagiaire.statut);

  const administrateur = estAdministrateurApplication();

  bouton.classList.toggle(
    'masque',
    preparationFermee || !administrateur
  );
  boutonReactiver.classList.toggle(
    'masque',
    !preparationFermee || !administrateur
  );

  if (preparationFermee) {
    resume.textContent =
      stagiaire.statut +
      (stagiaire.dateCloture
        ? ' le ' + afficherDateFrancaise(stagiaire.dateCloture)
        : '') +
      (stagiaire.motifCloture
        ? ' · ' + stagiaire.motifCloture
        : '');
  } else {
    resume.textContent =
      'Le statut est calculé automatiquement. Seules la clôture et l\'abandon sont des décisions manuelles.';
  }
}

function obtenirClasseStatut(statut) {
  const correspondances = {
    'À préparer': 'badge-bleu',
    'En préparation': 'badge-orange',
    'Stage aujourd\'hui': 'badge-rouge',
    'Stage passé': 'badge-rouge',
    'Clôturé': 'badge-vert',
    'Abandon': 'badge-gris'
  };

  return correspondances[statut] || 'badge-gris';
}

function afficherDateFrancaise(dateIso) {
  if (!dateIso) {
    return '';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return dateIso;
  }

  return (
    parties[2] +
    '/' +
    parties[1] +
    '/' +
    parties[0]
  );
}

function dateDuJourPourChamp() {
  const date = new Date();

  const annee = date.getFullYear();
  const mois = String(date.getMonth() + 1)
    .padStart(2, '0');

  const jour = String(date.getDate())
    .padStart(2, '0');

  return annee + '-' + mois + '-' + jour;
}

function echapperHtml(valeur) {
  return String(valeur ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function changerFormationReferentiel() {
  const formation = String(
    document.getElementById('formationReferentiel')
      ?.value || ''
  );

  etatApplication.formationReferentielActive = formation;
  etatApplication.categoriesReferentiel = [];
  etatApplication.itemsReferentiel = [];

  const boutonCategorie = document.getElementById(
    'boutonNouvelleCategorieReferentiel'
  );

  const boutonItem = document.getElementById(
    'boutonNouvelItemReferentiel'
  );

  if (boutonCategorie) {
    boutonCategorie.disabled = !formation;
  }

  if (boutonItem) {
    boutonItem.disabled = true;
  }

  if (!formation) {
    afficherListeCategoriesReferentiel();
    afficherListeItemsReferentiel();
    masquerLoader();
    return;
  }

  chargerDonneesReferentiel();
}

function chargerDonneesReferentiel() {
  const formation =
    etatApplication.formationReferentielActive;

  if (!formation) {
    return;
  }

  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargementReferentiel() {
    chargementsTermines++;

    if (
      chargementsTermines === 2 &&
      !erreurRencontree &&
      etatApplication.formationReferentielActive ===
        formation
    ) {
      afficherListeCategoriesReferentiel();
      afficherListeItemsReferentiel();

      const boutonItem = document.getElementById(
        'boutonNouvelItemReferentiel'
      );

      if (boutonItem) {
        boutonItem.disabled =
          !etatApplication.categoriesReferentiel.length;
      }

      masquerLoader();
    }
  }

  function erreurChargementReferentiel(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (categories) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.categoriesReferentiel =
        Array.isArray(categories) ? categories : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getCategoriesReferentiel(formation);

  google.script.run
    .withSuccessHandler(function (items) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.itemsReferentiel =
        Array.isArray(items) ? items : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getItemsReferentiel(formation);
}

function basculerItemReferentiel(cible, actifExplicite) {
  const element = cible && cible.dataset
    ? cible
    : null;

  const idItem = String(
    element ? element.dataset.itemId : cible || ''
  ).trim();

  const item = etatApplication.itemsReferentiel.find(
    function (elementItem) {
      return elementItem.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (etatApplication.itemsReferentielEnCours[idItem]) {
    return;
  }

  const nouvelEtat = element
    ? element.dataset.actifCible === 'true'
    : Boolean(actifExplicite);

  const ancienEtat = Boolean(item.actif);

  etatApplication.itemsReferentielEnCours[idItem] = true;
  item.actif = nouvelEtat;
  afficherListeItemsReferentiel();

  google.script.run
    .withSuccessHandler(function (resultat) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = Boolean(resultat.actif);
      afficherListeItemsReferentiel();

      afficherToast(
        resultat.message || 'Item mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(function (erreur) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = ancienEtat;
      afficherListeItemsReferentiel();

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .basculerActifItemReferentiel(
      idItem,
      nouvelEtat,
      obtenirJetonAdministrateurApplication()
    );
}

function supprimerCategorieReferentielInterface(
  idCategorie
) {
  const categorie =
    etatApplication.categoriesReferentiel.find(
      function (element) {
        return element.idCategorie === idCategorie;
      }
    );

  if (!categorie) {
    afficherToast('Catégorie introuvable.', true);
    return;
  }

  if (categorie.utilisee) {
    basculerCategorieReferentiel(idCategorie, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement la catégorie « ' +
    categorie.intitule +
    ' » et ses items jamais utilisés ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerCategorieReferentiel',
    [idCategorie]
  );
}

function supprimerItemReferentielInterface(idItem) {
  const item = etatApplication.itemsReferentiel.find(
    function (element) {
      return element.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (item.utilise) {
    basculerItemReferentiel(idItem, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement l’item « ' +
    item.intitule +
    ' » ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerItemReferentiel',
    [idItem]
  );
}

function executerActionReferentiel(nomFonction, parametres) {
  afficherLoader();

  const execution = google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(
        resultat.message || 'Référentiel mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(gererErreurServeur);

  if (nomFonction === 'deplacerItemReferentiel') {
    execution.deplacerItemReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (nomFonction === 'deplacerCategorieReferentiel') {
    execution.deplacerCategorieReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (
    nomFonction === 'basculerActifCategorieReferentiel'
  ) {
    execution.basculerActifCategorieReferentiel(
      parametres[0],
      parametres[1],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  if (nomFonction === 'supprimerCategorieReferentiel') {
    execution.supprimerCategorieReferentiel(
      parametres[0],
      obtenirJetonAdministrateurApplication()
    );
    return;
  }

  execution.supprimerItemReferentiel(
    parametres[0],
    obtenirJetonAdministrateurApplication()
  );
}

function initialiserPageSessions() {
  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargementSession() {
    chargementsTermines++;

    if (
      chargementsTermines === 2 &&
      !erreurRencontree
    ) {
      afficherListeSessions();
      preparerFormulaireSession();
      masquerLoader();

      const idSession =
        etatApplication.sessionAConsulterDepuisAccueil;

      if (idSession) {
        etatApplication.sessionAConsulterDepuisAccueil = '';

        window.setTimeout(function () {
          consulterSession(idSession);
        }, 50);
      }
    }
  }

  function erreurChargementSession(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (sessions) {
      etatApplication.sessions =
        Array.isArray(sessions) ? sessions : [];

      terminerChargementSession();
    })
    .withFailureHandler(erreurChargementSession)
    .getSessions();

  google.script.run
    .withSuccessHandler(function (preparation) {
      const donnees = preparation || {};

      etatApplication.stagiairesSession =
        Array.isArray(donnees.stagiaires)
          ? donnees.stagiaires
          : [];

      etatApplication.formateursSession =
        Array.isArray(donnees.formateurs)
          ? donnees.formateurs
          : [];

      etatApplication.formationsSession =
        Array.isArray(donnees.formations)
          ? donnees.formations
          : [];

      terminerChargementSession();
    })
    .withFailureHandler(erreurChargementSession)
    .getPreparationSession();
}

function afficherListeSessions() {
  const corps = document.getElementById(
    'corpsTableauSessions'
  );

  if (!corps) {
    return;
  }

  const sessions = etatApplication.sessions;
  const compteur = document.getElementById(
    'compteurSessions'
  );

  if (compteur) {
    compteur.textContent =
      sessions.length +
      (sessions.length > 1
        ? ' séances enregistrées'
        : ' séance enregistrée');
  }

  if (!sessions.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="8" class="etat-vide">
          Aucune séance enregistrée pour le moment.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = sessions
    .map(function (session) {
      const horaires = [
        session.heureDebut,
        session.heureFin
      ]
        .filter(Boolean)
        .join(' – ');

      const formateurs = Array.isArray(
        session.formateurs
      ) && session.formateurs.length
        ? session.formateurs
          .map(echapperHtml)
          .join('<br>')
        : '—';

      return `
        <tr>
          <td>
            <strong>
              ${echapperHtml(
                afficherDateFrancaise(session.date) || '—'
              )}
            </strong>
          </td>
          <td>${echapperHtml(horaires || '—')}</td>
          <td>
            <span class="badge-formation-session">
              ${echapperHtml(session.formation || '—')}
            </span>
          </td>
          <td>${formateurs}</td>
          <td>
            <span class="nombre-participants-session">
              ${Number(session.nombreStagiaires) || 0}
            </span>
          </td>
          <td>
            ${echapperHtml(
              formaterHeuresFormation(
                session.dureeHeures
              )
            )}
          </td>
          <td class="remarques-tableau-session">
            ${echapperHtml(session.remarques || '—')}
          </td>
          <td class="colonne-actions-session">
            <button
              type="button"
              class="bouton-consulter-session"
              data-session-id="${echapperHtml(session.idSession)}"
              onclick="consulterSession(this.dataset.sessionId)"
              aria-label="Consulter la séance du ${echapperHtml(afficherDateFrancaise(session.date) || '')}"
            >
              <span aria-hidden="true">👁</span>
              Consulter
            </button>
          </td>
        </tr>
      `;
    })
    .join('');
}

function consulterSession(idSession) {
  const identifiant = String(idSession || '').trim();

  if (!identifiant) {
    afficherToast('Séance introuvable.', true);
    return;
  }

  afficherLoader();

  google.script.run
    .withSuccessHandler(function (session) {
      masquerLoader();
      etatApplication.sessionDetaillee = session;
      afficherFicheSession(session);
    })
    .withFailureHandler(function (erreur) {
      masquerLoader();
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .getSessionDetaillee(identifiant);
}

function afficherFicheSession(session) {
  fermerFicheSession();

  const validationsParCle = {};

  (Array.isArray(session.validations)
    ? session.validations
    : []
  ).forEach(function (validation) {
    validationsParCle[
      validation.idStagiaire + '::' + validation.idItem
    ] = validation;
  });

  const stagiaires = Array.isArray(session.stagiaires)
    ? session.stagiaires
    : [];

  const formateurs = Array.isArray(session.formateurs)
    ? session.formateurs
    : [];

  const categories = Array.isArray(session.categories)
    ? session.categories
    : [];

  const categoriesHtml = categories.length
    ? categories.map(function (categorie) {
      return creerCategorieFicheSession(
        categorie,
        stagiaires,
        validationsParCle
      );
    }).join('')
    : `
      <div class="etat-referentiel-session">
        Aucun item travaillé pendant cette séance.
      </div>
    `;

  const formateursHtml = formateurs.length
    ? formateurs.map(function (formateur) {
      return `
        <span class="puce-participant-fiche-session">
          👨‍🏫
          ${echapperHtml(
            [formateur.prenom, formateur.nom]
              .filter(Boolean)
              .join(' ')
          )}
        </span>
      `;
    }).join('')
    : '<span class="valeur-absente-session">Aucun formateur</span>';

  const stagiairesHtml = stagiaires.length
    ? stagiaires.map(function (stagiaire) {
      return `
        <span class="puce-participant-fiche-session">
          👨‍🚒
          ${echapperHtml(
            [stagiaire.prenom, stagiaire.nom]
              .filter(Boolean)
              .join(' ')
          )}
        </span>
      `;
    }).join('')
    : '<span class="valeur-absente-session">Aucun stagiaire</span>';

  const modal = document.createElement('div');
  modal.id = 'modalFicheSession';
  modal.className = 'fiche-consultation-overlay fiche-session-overlay';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-labelledby', 'titreFicheSession');
  modal.dataset.sessionId = session.idSession;

  const actionsEditionSession = peutGererSessionsApplication()
    ? `
      <button
        type="button"
        class="bouton-secondaire"
        onclick="modifierSessionDepuisFiche()"
      >
        ✎ Modifier la séance
      </button>
      <button
        type="button"
        class="bouton-secondaire"
        onclick="dupliquerSessionDepuisFiche()"
      >
        ⧉ Dupliquer la séance
      </button>
    `
    : '';

  modal.innerHTML = `
    <article class="fiche-consultation fiche-session-consultation">
      <header class="fiche-consultation-barre fiche-session-barre">
        <div class="fiche-consultation-titre">
          <span class="fiche-consultation-icone">📅</span>
          <div>
            <h2 id="titreFicheSession">Détail de la séance</h2>
            <p>
              ${echapperHtml(afficherDateFrancaise(session.date) || 'Date non renseignée')}
              · ${echapperHtml(session.formation || 'Formation non renseignée')}
            </p>
          </div>
        </div>

        <div class="actions-fiche-session">
          ${actionsEditionSession}
          <button
            type="button"
            class="bouton-principal bouton-fermer-fiche-session"
            onclick="fermerFicheSession()"
          >
            Fermer
          </button>
        </div>
      </header>

      <main class="fiche-consultation-corps fiche-session-corps">
        <section class="grille-informations-fiche-session">
          ${creerInformationFicheSession('Date', afficherDateFrancaise(session.date))}
          ${creerInformationFicheSession('Heure de début', session.heureDebut)}
          ${creerInformationFicheSession('Heure de fin', session.heureFin)}
          ${creerInformationFicheSession('Durée', formaterHeuresFormation(session.dureeHeures))}
          ${creerInformationFicheSession('Formation', session.formation)}
        </section>

        <section class="bloc fiche-bloc fiche-section-session">
          <div class="fiche-bloc-entete">
            <div>
              <h2>Participants</h2>
              <p>Formateurs et stagiaires présents.</p>
            </div>
          </div>
          <div class="participants-fiche-session">
            <div>
              <h3>Formateur(s)</h3>
              <div class="liste-puces-fiche-session">${formateursHtml}</div>
            </div>
            <div>
              <h3>Stagiaires présents</h3>
              <div class="liste-puces-fiche-session">${stagiairesHtml}</div>
            </div>
          </div>
        </section>

        <section class="bloc fiche-bloc fiche-section-session">
          <div class="fiche-bloc-entete">
            <div>
              <h2>Items travaillés et validations</h2>

  document.body.appendChild(modal);

function creerInformationFicheSession(libelle, valeur) {
  return `
    <div class="information-fiche-session">
      <span>${echapperHtml(libelle)}</span>
      <strong>${echapperHtml(valeur || '—')}</strong>
    </div>
  `;
}

function creerCategorieFicheSession(
  categorie,
  stagiaires,
  validationsParCle
) {
  const items = (categorie.items || []).map(
    function (item) {
      const lignes = stagiaires.map(function (stagiaire) {
        const validation = validationsParCle[
          stagiaire.idStagiaire + '::' + item.idItem
        ] || {};

        const acquis = Boolean(validation.acquis);

        return `
          <tr>
            <td>
              <strong>${echapperHtml(stagiaire.nom)}</strong>
              ${echapperHtml(stagiaire.prenom)}
            </td>
            <td>
              <span class="badge-statut ${acquis ? 'badge-vert' : 'badge-orange'}">
                ${acquis ? 'Acquis' : 'Non acquis'}
              </span>
              ${validation.vuHistorique
                ? '<small class="indicateur-vu-historique-session">Ancienne donnée VU conservée</small>'
                : ''}
            </td>
            <td class="commentaire-validation-fiche-session">
              ${echapperHtml(validation.commentaire || '—')}
            </td>
          </tr>
        `;
      }).join('');

      return `
        <article class="item-fiche-session">
          <div class="entete-item-fiche-session">
            <div>
              <h4>${echapperHtml(item.libelle)}</h4>
              ${item.description
                ? `<p>${echapperHtml(item.description)}</p>`
                : ''}
            </div>
            ${item.actif
              ? ''
              : '<span class="badge-statut badge-gris">Item historique</span>'}
          </div>
          <div class="tableau-responsive">
            <table class="tableau tableau-validations-fiche-session">
              <thead>
                <tr>
                  <th>Stagiaire</th>
                  <th>Validation</th>
                  <th>Commentaire individuel</th>
                </tr>
              </thead>
              <tbody>${lignes}</tbody>
            </table>
          </div>
        </article>
      `;
    }
  ).join('');

  return `
    <section class="categorie-fiche-session">
      <h3>${echapperHtml(categorie.libelle)}</h3>
      <div class="contenu-categorie-fiche-session">${items}</div>
    </section>
  `;
}

function fermerFicheSession() {
  const modal = document.getElementById('modalFicheSession');

  if (modal) {
    modal.remove();
  }

  if (
    !document.querySelector(
      '.modal-overlay:not(.masque), .fiche-consultation-overlay'
    )
  ) {
    document.body.classList.remove('modal-ouverte');
  }
}

function modifierSessionDepuisFiche() {
  const session = etatApplication.sessionDetaillee;

  if (!session) {
    afficherToast('Séance introuvable.', true);
    return;
  }

  ouvrirFormulaireDepuisSession(session, 'modification');
}

function dupliquerSessionDepuisFiche() {
  const session = etatApplication.sessionDetaillee;

  if (!session) {
    afficherToast('Séance introuvable.', true);
    return;
  }

  ouvrirFormulaireDepuisSession(session, 'duplication');
}

function preparerFormulaireSession() {
  remplirSelect(
    'sessionFormation',
    etatApplication.formationsSession,
    'Sélectionner une formation'
  );

  afficherFormateursSession();
}

function afficherFormateursSession() {
  const zone = document.getElementById(
    'listeFormateursSession'
  );

  if (!zone) {
    return;
  }

  const formateurs = etatApplication.formateursSession;

  if (!formateurs.length) {
    zone.innerHTML = `
      <div class="etat-selection-session">
        Aucun formateur actif disponible.
      </div>
    `;
    mettreAJourCompteursParticipantsSession();
    return;
  }

  zone.innerHTML = formateurs
    .map(function (formateur) {
      const historique = Boolean(
        etatApplication.idsFormateursHistoriquesSession[
          formateur.idFormateur
        ]
      );

      const identite = [
        formateur.prenom,
        formateur.nom
      ]
        .filter(Boolean)
        .join(' ');

      return `
        <label class="option-selection-session">
          <input
            type="checkbox"
            name="formateurSession"
            value="${echapperHtml(formateur.idFormateur)}"
            onchange="mettreAJourCompteursParticipantsSession()"
          >
          <span>${echapperHtml(identite)}</span>
          ${historique && !formateur.actif
            ? '<small class="indicateur-participant-historique-session">Historique · inactif</small>'
            : ''}
        </label>
      `;
    })
    .join('');

  mettreAJourCompteursParticipantsSession();
}

function nouvelleSession() {
  if (!peutGererSessionsApplication()) {
    afficherToast(
      'Utilisateur Google non identifiable. Vérifie le déploiement.',
      true
    );
    return;
  }

  const formulaire = document.getElementById(
    'formulaireSession'
  );

  formulaire.reset();

  reinitialiserEtatFormulaireSession();

  etatApplication.referentielSession = [];
  etatApplication.formationReferentielSession = '';
  etatApplication.itemsTravaillesSession = {};
  etatApplication.validationsSession = {};

  document.getElementById('sessionId').value = '';
  document.getElementById('sessionSourceId').value = '';
  document.getElementById('sessionOperationId').value =
    creerIdentifiantOperationSession();

  document.getElementById('titreModalSession').textContent =
    'Nouvelle séance';

  document.getElementById('sousTitreModalSession').textContent =
    'Prépare la séance puis valide les acquis individuels.';

  document.getElementById('boutonEnregistrerSession').textContent =
    'Enregistrer la séance';

  document.getElementById('sessionFormation').disabled = false;

  document.getElementById('sessionDate').value =
    dateDuJourPourChamp();

  document.getElementById('sessionHeureDebut').value =
    '09:00';

  document.getElementById('sessionHeureFin').value =
    '11:00';

  preparerFormulaireSession();
  afficherStagiairesSession();
  afficherItemsTravaillesSession();
  afficherValidationsSession();
  mettreAJourDureeSession();

  document
    .getElementById('modalSession')
    .classList
    .remove('masque');

  document.body.classList.add('modal-ouverte');

  window.setTimeout(function () {
    document.getElementById('sessionDate').focus();
  }, 100);
}

function reinitialiserEtatFormulaireSession() {
  etatApplication.modeFormulaireSession = 'creation';
  etatApplication.idSessionSourceFormulaire = '';
  etatApplication.idsFormateursHistoriquesSession = {};
  etatApplication.idsStagiairesHistoriquesSession = {};
  etatApplication.confirmationsStagiairesFermesSession = {};
}

function creerIdentifiantOperationSession() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === 'function'
  ) {
    return window.crypto.randomUUID();
  }

  return 'session-' + Date.now() + '-' +
    Math.random().toString(36).slice(2, 12);
}

function ouvrirFormulaireDepuisSession(session, mode) {
  if (!peutGererSessionsApplication()) {
    afficherToast(
      'Utilisateur Google non identifiable. Vérifie le déploiement.',
      true
    );
    return;
  }

  if (!['modification', 'duplication'].includes(mode)) {
    afficherToast('Mode de séance invalide.', true);
    return;
  }

  fermerFicheSession();

  const formulaire = document.getElementById(
    'formulaireSession'
  );

  formulaire.reset();
  reinitialiserEtatFormulaireSession();

  etatApplication.modeFormulaireSession = mode;
  etatApplication.idSessionSourceFormulaire =
    session.idSession;
  etatApplication.referentielSession = [];
  etatApplication.formationReferentielSession = '';
  etatApplication.itemsTravaillesSession = {};
  etatApplication.validationsSession = {};

  (session.itemsTravailles || []).forEach(
    function (idItem) {
      etatApplication.itemsTravaillesSession[idItem] = true;
    }
  );

  (session.validations || []).forEach(
    function (validation) {
      etatApplication.validationsSession[
        validation.idStagiaire + '::' + validation.idItem
      ] = {
        idStagiaire: validation.idStagiaire,
        idItem: validation.idItem,
        acquis: Boolean(validation.acquis),
        commentaire: validation.commentaire || '',
        vuHistorique: Boolean(validation.vuHistorique)
      };
    }
  );

  preparerOptionsHistoriquesSession(session);
  preparerFormulaireSession();

  document.getElementById('sessionId').value =
    mode === 'modification' ? session.idSession : '';

  document.getElementById('sessionSourceId').value =
    session.idSession;

  document.getElementById('sessionOperationId').value =
    creerIdentifiantOperationSession();

  document.getElementById('sessionDate').value =
    mode === 'duplication'
      ? dateDuJourPourChamp()
      : session.date;

  document.getElementById('sessionHeureDebut').value =
    mode === 'duplication' ? '' : session.heureDebut;

  document.getElementById('sessionHeureFin').value =
    mode === 'duplication' ? '' : session.heureFin;

  document.getElementById('sessionRemarques').value =
    session.remarques || '';

  const selectFormation = document.getElementById(
    'sessionFormation'
  );

  selectFormation.value = session.formation;
  selectFormation.disabled = true;

  afficherStagiairesSession();

  selectionnerParticipantsSession(
    (session.formateurs || []).map(function (formateur) {
      return formateur.idFormateur;
    }),
    (session.stagiaires || []).map(function (stagiaire) {
      return stagiaire.idStagiaire;
    })
  );

  document.getElementById('titreModalSession').textContent =
    mode === 'modification'
      ? 'Modifier la séance'
      : 'Dupliquer la séance';

  document.getElementById('sousTitreModalSession').textContent =
    mode === 'modification'
      ? 'Les données existantes seront mises à jour sans créer une nouvelle séance.'
      : 'La date est positionnée à aujourd’hui. Renseigne les nouveaux horaires avant l’enregistrement.';

  document.getElementById('boutonEnregistrerSession').textContent =
    mode === 'modification'
      ? 'Enregistrer les modifications'
      : 'Créer la séance dupliquée';

  mettreAJourDureeSession();
  chargerReferentielSession(
    session.formation,
    session.idSession
  );

  document
    .getElementById('modalSession')
    .classList
    .remove('masque');

  document.body.classList.add('modal-ouverte');

  window.setTimeout(function () {
    document.getElementById(
      mode === 'duplication'
        ? 'sessionHeureDebut'
        : 'sessionDate'
    ).focus();
  }, 100);
}

function preparerOptionsHistoriquesSession(session) {
  if (
    session.formation &&
    !etatApplication.formationsSession.includes(
      session.formation
    )
  ) {
    etatApplication.formationsSession.push(session.formation);
  }

  (session.formateurs || []).forEach(function (formateur) {
    etatApplication.idsFormateursHistoriquesSession[
      formateur.idFormateur
    ] = true;

    if (!etatApplication.formateursSession.some(
      function (element) {
        return element.idFormateur ===
          formateur.idFormateur;
      }
    )) {
      etatApplication.formateursSession.push(formateur);
    }
  });

  (session.stagiaires || []).forEach(function (stagiaire) {
    etatApplication.idsStagiairesHistoriquesSession[
      stagiaire.idStagiaire
    ] = true;

    if (!etatApplication.stagiairesSession.some(
      function (element) {
        return element.uuid === stagiaire.idStagiaire;
      }
    )) {
      etatApplication.stagiairesSession.push({
        uuid: stagiaire.idStagiaire,
        nom: stagiaire.nom,
        prenom: stagiaire.prenom,
        formation: stagiaire.formation,
        statut: stagiaire.statut
      });
    }
  });
}

function selectionnerParticipantsSession(
  idsFormateurs,
  idsStagiaires
) {
  const formateurs = new Set(idsFormateurs || []);
  const stagiaires = new Set(idsStagiaires || []);

  document.querySelectorAll(
    'input[name="formateurSession"]'
  ).forEach(function (champ) {
    champ.checked = formateurs.has(champ.value);
  });

  document.querySelectorAll(
    'input[name="stagiaireSession"]'
  ).forEach(function (champ) {
    champ.checked = stagiaires.has(champ.value);
  });

  mettreAJourCompteursParticipantsSession();
  afficherValidationsSession();
}

function fermerModalSession() {
  const modal = document.getElementById('modalSession');

  if (modal) {
    modal.classList.add('masque');
  }

  document.body.classList.remove('modal-ouverte');
}

function changerFormationSession() {
  const formation = document.getElementById(
    'sessionFormation'
  ).value;

  etatApplication.validationsSession = {};
  etatApplication.itemsTravaillesSession = {};
  etatApplication.referentielSession = [];
  etatApplication.formationReferentielSession = '';

  afficherStagiairesSession();
  afficherItemsTravaillesSession();
  afficherValidationsSession();

  if (!formation) {
    return;
  }

  chargerReferentielSession(formation, '');
}

function chargerReferentielSession(
  formation,
  idSessionHistorique
) {
  const zone = document.getElementById(
    'zoneItemsTravaillesSession'
  );

  zone.innerHTML = `
    <div class="etat-referentiel-session">
      Chargement du référentiel…
    </div>
  `;

  google.script.run
    .withSuccessHandler(function (referentiel) {
      const formationActuelle = document.getElementById(
        'sessionFormation'
      )?.value;

      if (formationActuelle !== formation) {
        return;
      }

      etatApplication.referentielSession =
        Array.isArray(referentiel) ? referentiel : [];

      etatApplication.formationReferentielSession =
        formation;

      afficherItemsTravaillesSession();
      afficherValidationsSession();
    })
    .withFailureHandler(function (erreur) {
      const formationActuelle = document.getElementById(
        'sessionFormation'
      )?.value;

      if (formationActuelle !== formation) {
        return;
      }

      zone.innerHTML = `
        <div class="etat-referentiel-session erreur">
          Impossible de charger le référentiel.
        </div>
      `;

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .getReferentielSession(
      formation,
      idSessionHistorique || ''
    );
}

function afficherStagiairesSession() {
  const zone = document.getElementById(
    'listeStagiairesSession'
  );

  if (!zone) {
    return;
  }

  const formation = String(
    document.getElementById('sessionFormation')
      ?.value || ''
  );

  if (!formation) {
    zone.innerHTML = `
      <div class="etat-selection-session">
        Choisis d’abord une formation.
      </div>
    `;
    mettreAJourCompteursParticipantsSession();
    return;
  }

  const stagiaires = etatApplication.stagiairesSession
    .filter(function (stagiaire) {
      return (
        stagiaire.formation === formation
      );
    });

  if (!stagiaires.length) {
    zone.innerHTML = `
      <div class="etat-selection-session">
        Aucun stagiaire pour cette formation.
      </div>
    `;
    mettreAJourCompteursParticipantsSession();
    return;
  }

  zone.innerHTML = stagiaires
    .map(function (stagiaire) {
      return `
        <label class="option-selection-session">
          <input
            type="checkbox"
            name="stagiaireSession"
            value="${echapperHtml(stagiaire.uuid)}"
            onchange="changerStagiairesSession(this)"
          >
          <span>
            <strong>${echapperHtml(stagiaire.nom)}</strong>
            ${echapperHtml(stagiaire.prenom)}
            <small class="indicateur-participant-historique-session">
              ${echapperHtml(stagiaire.statut)}
            </small>
          </span>
        </label>
      `;
    })
    .join('');

  mettreAJourCompteursParticipantsSession();
}

function changerStagiairesSession(champ) {
  if (champ) {
    const stagiaire = etatApplication.stagiairesSession.find(
      function (element) {
        return element.uuid === champ.value;
      }
    );

    if (!champ.checked) {
      delete etatApplication
        .confirmationsStagiairesFermesSession[champ.value];
    } else if (stagiaire) {
      if (stagiaire.statut === 'Stage passé') {
        window.alert(
          'Attention : la date de stage de ' +
          stagiaire.prenom + ' ' + stagiaire.nom +
          ' est passée. Le stagiaire peut tout de même être ajouté.'
        );
      }

      if (['Clôturé', 'Abandon'].includes(stagiaire.statut)) {
        const confirme = window.confirm(
          stagiaire.prenom + ' ' + stagiaire.nom +
          ' est au statut « ' + stagiaire.statut +
          ' ». Confirmer explicitement son ajout à cette séance ?'
        );

        if (!confirme) {
          champ.checked = false;
          delete etatApplication
            .confirmationsStagiairesFermesSession[champ.value];
        } else {
          etatApplication
            .confirmationsStagiairesFermesSession[champ.value] = true;
        }
      }
    }
  }

  capturerValidationsSession();
  mettreAJourCompteursParticipantsSession();
  afficherValidationsSession();
}

function mettreAJourCompteursParticipantsSession() {
  const nombreFormateurs = document.querySelectorAll(
    'input[name="formateurSession"]:checked'
  ).length;

  const nombreStagiaires = document.querySelectorAll(
    'input[name="stagiaireSession"]:checked'
  ).length;

  const compteurFormateurs = document.getElementById(
    'compteurFormateursSession'
  );

  const compteurStagiaires = document.getElementById(
    'compteurStagiairesSession'
  );

  if (compteurFormateurs) {
    compteurFormateurs.textContent =
      nombreFormateurs +
      (nombreFormateurs > 1
        ? ' sélectionnés'
        : ' sélectionné');
  }

  if (compteurStagiaires) {
    compteurStagiaires.textContent =
      nombreStagiaires +
      (nombreStagiaires > 1
        ? ' sélectionnés'
        : ' sélectionné');
  }
}

function obtenirIdsStagiairesSession() {
  return [...document.querySelectorAll(
    'input[name="stagiaireSession"]:checked'
  )].map(function (champ) {
    return champ.value;
  });
}

function obtenirItemsTravaillesSession() {
  const items = [];

  etatApplication.referentielSession.forEach(
    function (categorie) {
      categorie.items.forEach(function (item) {
        if (
          etatApplication.itemsTravaillesSession[
            item.idItem
          ]
        ) {
          items.push(item);
        }
      });
    }
  );

  return items;
}

function afficherItemsTravaillesSession() {
  const zone = document.getElementById(
    'zoneItemsTravaillesSession'
  );

  const aide = document.getElementById(
    'aideItemsTravaillesSession'
  );

  if (!zone || !aide) {
    return;
  }

  const formation = String(
    document.getElementById('sessionFormation')
      ?.value || ''
  );

  if (!formation) {
    aide.textContent =
      'Choisis une formation pour charger son référentiel.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item à afficher.
      </div>
    `;
    return;
  }

  if (
    etatApplication.formationReferentielSession !==
    formation
  ) {
    aide.textContent = 'Chargement du référentiel…';
    return;
  }

  if (!etatApplication.referentielSession.length) {
    aide.textContent =
      'La séance peut être enregistrée sans item travaillé.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item pédagogique configuré pour cette formation.
      </div>
    `;
    return;
  }

  const nombreSelectionne =
    obtenirItemsTravaillesSession().length;

  aide.textContent = nombreSelectionne
    ? nombreSelectionne +
      (nombreSelectionne > 1
        ? ' items sélectionnés pour toute la séance.'
        : ' item sélectionné pour toute la séance.')
    : 'Coche uniquement les items réellement travaillés pendant la séance.';

  zone.innerHTML = etatApplication.referentielSession
    .map(function (categorie) {
      return creerCategorieItemsTravaillesSession(
        categorie
      );
    })
    .join('');
}

function creerCategorieItemsTravaillesSession(categorie) {
  const toutSelectionne = categorie.items.every(
    function (item) {
      return Boolean(
        etatApplication.itemsTravaillesSession[
          item.idItem
        ]
      );
    }
  );

  const nombreSelectionne = categorie.items.filter(
    function (item) {
      return Boolean(
        etatApplication.itemsTravaillesSession[
          item.idItem
        ]
      );
    }
  ).length;

  const items = categorie.items
    .map(function (item) {
      const description = item.description
        ? `
          <small>${echapperHtml(item.description)}</small>
        `
        : '';

      const historique = item.historique && !item.actif
        ? '<small class="indicateur-participant-historique-session">Item historique · inactif</small>'
        : '';

      return `
        <label class="ligne-item-travaille-session">
          <input
            type="checkbox"
            value="${echapperHtml(item.idItem)}"
            ${etatApplication.itemsTravaillesSession[item.idItem]
              ? 'checked'
              : ''}
            onchange="changerItemTravailleSession(this)"
          >
          <span class="libelle-item-referentiel-session">
            <span>${echapperHtml(item.libelle)}</span>
            ${description}
            ${historique}
          </span>
        </label>
      `;
    })
    .join('');

  return `
    <div class="categorie-referentiel-session categorie-items-travailles-session">
      <div class="entete-categorie-items-session">
        <h4>${echapperHtml(categorie.libelle)}</h4>
        <div>
          <span class="compteur-categorie-items-session">
            ${nombreSelectionne}/${categorie.items.length}
          </span>
          <button
            type="button"
            class="bouton-lien-session"
            onclick="basculerCategorieItemsSession('${echapperHtml(categorie.idCategorie)}', ${!toutSelectionne})"
          >
            ${toutSelectionne ? 'Tout décocher' : 'Tout cocher'}
          </button>
        </div>
      </div>
      <div class="liste-items-referentiel-session">
        ${items}
      </div>
    </div>
  `;
}

function changerItemTravailleSession(champ) {
  capturerValidationsSession();

  if (champ.checked) {
    etatApplication.itemsTravaillesSession[
      champ.value
    ] = true;
  } else {
    delete etatApplication.itemsTravaillesSession[
      champ.value
    ];
  }

  afficherItemsTravaillesSession();
  afficherValidationsSession();
}

function basculerCategorieItemsSession(
  idCategorie,
  selectionner
) {
  capturerValidationsSession();

  const categorie =
    etatApplication.referentielSession.find(
      function (element) {
        return element.idCategorie === idCategorie;
      }
    );

  if (!categorie) {
    return;
  }

  categorie.items.forEach(function (item) {
    if (selectionner) {
      etatApplication.itemsTravaillesSession[
        item.idItem
      ] = true;
    } else {
      delete etatApplication.itemsTravaillesSession[
        item.idItem
      ];
    }
  });

  afficherItemsTravaillesSession();
  afficherValidationsSession();
}

function afficherValidationsSession() {
  const zone = document.getElementById(
    'zoneValidationsSession'
  );

  const aide = document.getElementById(
    'aideValidationsSession'
  );

  if (!zone || !aide) {
    return;
  }

  const idsStagiaires = obtenirIdsStagiairesSession();
  const itemsTravailles = obtenirItemsTravaillesSession();

  if (!idsStagiaires.length) {
    aide.textContent =
      'Sélectionne les stagiaires présents.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun stagiaire présent sélectionné.
      </div>
    `;
    return;
  }

  if (!itemsTravailles.length) {
    aide.textContent =
      'Sélectionne les items travaillés pendant la séance.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item travaillé sélectionné.
      </div>
    `;
    return;
  }

  const idsItems = new Set(
    itemsTravailles.map(function (item) {
      return item.idItem;
    })
  );

  const categories = etatApplication.referentielSession
    .map(function (categorie) {
      return {
        idCategorie: categorie.idCategorie,
        libelle: categorie.libelle,
        items: categorie.items.filter(function (item) {
          return idsItems.has(item.idItem);
        })
      };
    })
    .filter(function (categorie) {
      return categorie.items.length;
    });

  const stagiaires = idsStagiaires
    .map(function (idStagiaire) {
      return etatApplication.stagiairesSession.find(
        function (stagiaire) {
          return stagiaire.uuid === idStagiaire;
        }
      );
    })
    .filter(Boolean);

  aide.textContent =
    'Pour chaque présent, indique seulement les acquis et les commentaires utiles.';

  zone.innerHTML = stagiaires
    .map(function (stagiaire, indexStagiaire) {
      return creerValidationsStagiaireSession(
        stagiaire,
        categories,
        indexStagiaire === 0
      );
    })
    .join('');
}

function creerValidationsStagiaireSession(
  stagiaire,
  categories,
  ouvert
) {
  const contenu = categories
    .map(function (categorie) {
      const items = categorie.items
        .map(function (item) {
          return creerItemValidationSession(
            stagiaire.uuid,
            item
          );
        })
        .join('');

      return `
        <div class="categorie-referentiel-session">
          <h4>${echapperHtml(categorie.libelle)}</h4>
          <div class="liste-items-referentiel-session">
            ${items}
          </div>
        </div>
      `;
    })
    .join('');

  const nombreItems = categories.reduce(
    function (total, categorie) {
      return total + categorie.items.length;
    },
    0
  );

  return `
    <details
      class="referentiel-stagiaire-session"
      data-stagiaire-id="${echapperHtml(stagiaire.uuid)}"
      ${ouvert ? 'open' : ''}
    >
      <summary>
        <span>
          ${echapperHtml(stagiaire.prenom)}
          <strong>${echapperHtml(stagiaire.nom)}</strong>
        </span>
        <span class="resume-referentiel-stagiaire">
          ${nombreItems}
          ${nombreItems > 1 ? 'items travaillés' : 'item travaillé'}
        </span>
      </summary>
      <div class="contenu-referentiel-stagiaire">
        ${contenu}
      </div>
    </details>
  `;
}

function creerItemValidationSession(
  idStagiaire,
  item
) {
  const cle = idStagiaire + '::' + item.idItem;
  const validation =
    etatApplication.validationsSession[cle] || {};

  const description = item.description
    ? `
      <small>
        ${echapperHtml(item.description)}
      </small>
    `
    : '';

  return `
    <div
      class="ligne-item-referentiel-session"
      data-item-id="${echapperHtml(item.idItem)}"
    >
      <div class="libelle-item-referentiel-session">
        <span>${echapperHtml(item.libelle)}</span>
        ${description}
      </div>

      <label class="validation-item-session validation-acquis-session">
        <input
          type="checkbox"
          class="validation-acquis-session-champ"
          ${validation.acquis ? 'checked' : ''}
          onchange="synchroniserValidationItemSession(this)"
        >
        <span>Acquis</span>
      </label>

      <input
        type="text"
        class="champ commentaire-item-session"
        value="${echapperHtml(validation.commentaire || '')}"
        placeholder="Commentaire facultatif"
        oninput="synchroniserValidationItemSession(this)"
      >
    </div>
  `;
}

function synchroniserValidationItemSession(champ) {
  const ligne = champ.closest(
    '.ligne-item-referentiel-session'
  );

  if (!ligne) {
    return;
  }

  const blocStagiaire = ligne.closest(
    '.referentiel-stagiaire-session'
  );

  if (!blocStagiaire) {
    return;
  }

  const idStagiaire = blocStagiaire.dataset.stagiaireId;
  const idItem = ligne.dataset.itemId;
  const acquis = ligne.querySelector(
    '.validation-acquis-session-champ'
  ).checked;

  const commentaire = ligne.querySelector(
    '.commentaire-item-session'
  ).value.trim();

  const cle = idStagiaire + '::' + idItem;
  const validationPrecedente =
    etatApplication.validationsSession[cle] || {};
  const vuHistorique = Boolean(
    validationPrecedente.vuHistorique
  );

  if (acquis || commentaire || vuHistorique) {
    etatApplication.validationsSession[cle] = {
      idStagiaire: idStagiaire,
      idItem: idItem,
      acquis: acquis,
      commentaire: commentaire,
      vuHistorique: vuHistorique
    };
  } else {
    delete etatApplication.validationsSession[cle];
  }
}

function capturerValidationsSession() {
  document
    .querySelectorAll('.referentiel-stagiaire-session')
    .forEach(function (blocStagiaire) {
      const idStagiaire =
        blocStagiaire.dataset.stagiaireId;

      blocStagiaire
        .querySelectorAll(
          '.ligne-item-referentiel-session'
        )
        .forEach(function (ligne) {
          const idItem = ligne.dataset.itemId;
          const cle = idStagiaire + '::' + idItem;
          const validationPrecedente =
            etatApplication.validationsSession[cle] || {};
          const vuHistorique = Boolean(
            validationPrecedente.vuHistorique
          );

          const acquis = ligne.querySelector(
            '.validation-acquis-session-champ'
          ).checked;

          const commentaire = ligne.querySelector(
            '.commentaire-item-session'
          ).value.trim();

          if (acquis || commentaire || vuHistorique) {
            etatApplication.validationsSession[cle] = {
              idStagiaire: idStagiaire,
              idItem: idItem,
              acquis: acquis,
              commentaire: commentaire,
              vuHistorique: vuHistorique
            };
          } else {
            delete etatApplication.validationsSession[cle];
          }
        });
    });
}

function mettreAJourDureeSession() {
  const zone = document.getElementById(
    'indicationDureeSession'
  );

  if (!zone) {
    return;
  }

  const debut = String(
    document.getElementById('sessionHeureDebut')
      ?.value || ''
  );

  const fin = String(
    document.getElementById('sessionHeureFin')
      ?.value || ''
  );

  if (!debut || !fin) {
    zone.textContent = 'Durée calculée : —';
    zone.classList.remove('erreur');
    return;
  }

  const minutesDebut = convertirHeureEnMinutes(debut);
  const minutesFin = convertirHeureEnMinutes(fin);
  const duree = (minutesFin - minutesDebut) / 60;

  if (duree <= 0) {
    zone.textContent =
      'L’heure de fin doit être postérieure au début.';
    zone.classList.add('erreur');
    return;
  }

  zone.textContent =
    'Durée calculée : ' +
    formaterHeuresFormation(duree);

  zone.classList.remove('erreur');
}

function convertirHeureEnMinutes(heure) {
  const parties = String(heure).split(':');

  return (
    Number(parties[0]) * 60 +
    Number(parties[1])
  );
}

function soumettreSession(evenement) {
  evenement.preventDefault();

  if (!peutGererSessionsApplication()) {
    afficherToast(
      'Utilisateur Google non identifiable. Vérifie le déploiement.',
      true
    );
    return;
  }

  capturerValidationsSession();

  const formateurs = [...document.querySelectorAll(
    'input[name="formateurSession"]:checked'
  )].map(function (champ) {
    return champ.value;
  });

  const stagiaires = obtenirIdsStagiairesSession();

  const stagiairesFermesSansConfirmation =
    stagiaires.filter(function (idStagiaire) {
      const stagiaire = etatApplication.stagiairesSession.find(
        function (element) {
          return element.uuid === idStagiaire;
        }
      );

      return (
        stagiaire &&
        ['Clôturé', 'Abandon'].includes(stagiaire.statut) &&
        !etatApplication.confirmationsStagiairesFermesSession[
          idStagiaire
        ] &&
        !(
          etatApplication.modeFormulaireSession === 'modification' &&
          etatApplication.idsStagiairesHistoriquesSession[
            idStagiaire
          ]
        )
      );
    });

  if (stagiairesFermesSansConfirmation.length) {
    const confirme = window.confirm(
      'Cette séance contient un ou plusieurs stagiaires clôturés ou en abandon. Confirmer explicitement leur ajout ?'
    );

    if (!confirme) {
      return;
    }

    stagiairesFermesSansConfirmation.forEach(
      function (idStagiaire) {
        etatApplication.confirmationsStagiairesFermesSession[
          idStagiaire
        ] = true;
      }
    );
  }

  if (!formateurs.length) {
    afficherToast(
      'Sélectionne au moins un formateur.',
      true
    );
    return;
  }

  if (!stagiaires.length) {
    afficherToast(
      'Sélectionne au moins un stagiaire.',
      true
    );
    return;
  }

  const idsStagiaires = new Set(stagiaires);
  const itemsTravailles = obtenirItemsTravaillesSession();
  const idsItemsTravailles = new Set(
    itemsTravailles.map(function (item) {
      return item.idItem;
    })
  );

  const validations = Object.keys(
    etatApplication.validationsSession
  )
    .map(function (cle) {
      return etatApplication.validationsSession[cle];
    })
    .filter(function (validation) {
      return (
        idsStagiaires.has(validation.idStagiaire) &&
        idsItemsTravailles.has(validation.idItem)
      );
    });

  const donnees = {
    idSession: document.getElementById('sessionId').value,
    idSessionSource: document.getElementById(
      'sessionSourceId'
    ).value,
    idOperation: document.getElementById(
      'sessionOperationId'
    ).value,
    date: document.getElementById('sessionDate').value,
    formation: document.getElementById(
      'sessionFormation'
    ).value,
    heureDebut: document.getElementById(
      'sessionHeureDebut'
    ).value,
    heureFin: document.getElementById(
      'sessionHeureFin'
    ).value,
    formateurs: formateurs,
    stagiaires: stagiaires,
    confirmationsStagiairesFermes: Object.keys(
      etatApplication.confirmationsStagiairesFermesSession
    ).filter(function (idStagiaire) {
      return stagiaires.includes(idStagiaire);
    }),
    itemsTravailles: itemsTravailles.map(
      function (item) {
        return item.idItem;
      }
    ),
    remarques: document.getElementById(
      'sessionRemarques'
    ).value,
    validations: validations
  };

  const bouton = document.getElementById(
    'boutonEnregistrerSession'
  );

  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent =
        obtenirLibelleBoutonEnregistrementSession();

      fermerModalSession();
      etatApplication.sessionDetaillee = null;
      afficherToast(
        resultat.message || 'Séance enregistrée.',
        false
      );

      rechargerSessions();
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent =
        obtenirLibelleBoutonEnregistrementSession();

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .enregistrerSession(donnees);
}

function obtenirLibelleBoutonEnregistrementSession() {
  if (etatApplication.modeFormulaireSession === 'modification') {
    return 'Enregistrer les modifications';
  }

  if (etatApplication.modeFormulaireSession === 'duplication') {
    return 'Créer la séance dupliquée';
  }

  return 'Enregistrer la séance';
}

function rechargerSessions() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (sessions) {
      etatApplication.sessions =
        Array.isArray(sessions) ? sessions : [];

      afficherListeSessions();
      masquerLoader();
    })
    .withFailureHandler(gererErreurServeur)
    .getSessions();
}

function initialiserPageIndemnisations() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (donnees) {
      appliquerDonneesIndemnisations(donnees);
      masquerLoader();
    })
    .withFailureHandler(gererErreurServeur)
    .getDonneesIndemnisations(
      obtenirJetonAdministrateurApplication()
    );
}

function appliquerDonneesIndemnisations(donnees) {
  donnees = donnees || {};

  etatApplication.prestationsIndemnisation =
    Array.isArray(donnees.prestations)
      ? donnees.prestations
      : [];

  etatApplication.formateursIndemnisation =
    Array.isArray(donnees.formateurs)
      ? donnees.formateurs
      : [];

  etatApplication.formationsIndemnisation =
    Array.isArray(donnees.formations)
      ? donnees.formations
      : [];

  etatApplication.statutsIndemnisation =
    Array.isArray(donnees.statuts)
      ? donnees.statuts
      : [];

  remplirFiltresIndemnisations();
  filtrerIndemnisations();
}

function remplirFiltresIndemnisations() {
  remplirSelectIndemnisation(
    'filtreFormateurIndemnisation',
    etatApplication.formateursIndemnisation.map(
      function (formateur) {
        return {
          valeur: formateur.idFormateur,
          libelle: formateur.libelle
        };
      }
    ),
    'Tous les formateurs'
  );

  remplirSelectIndemnisation(
    'filtreFormationIndemnisation',
    etatApplication.formationsIndemnisation.map(
      function (formation) {
        return {
          valeur: formation,
          libelle: formation
        };
      }
    ),
    'Toutes les formations'
  );

  remplirSelectIndemnisation(
    'filtreStatutIndemnisation',
    etatApplication.statutsIndemnisation.map(
      function (statut) {
        return {
          valeur: statut,
          libelle: statut
        };
      }
    ),
    'Tous les statuts'
  );
}

function remplirSelectIndemnisation(
  identifiant,
  options,
  libelleInitial
) {
  const select = document.getElementById(identifiant);

  if (!select) {
    return;
  }

  const valeurActuelle = select.value;

  select.innerHTML = [
    '<option value="">' +
      echapperHtml(libelleInitial) +
    '</option>'
  ].concat(
    options.map(function (option) {
      return (
        '<option value="' +
          echapperHtml(option.valeur) +
        '">' +
          echapperHtml(option.libelle) +
        '</option>'
      );
    })
  ).join('');

  if (
    [...select.options].some(function (option) {
      return option.value === valeurActuelle;
    })
  ) {
    select.value = valeurActuelle;
  }
}

function filtrerIndemnisations() {
  const champDateDebut = document.getElementById(
    'filtreDateDebutIndemnisation'
  );
  const champDateFin = document.getElementById(
    'filtreDateFinIndemnisation'
  );
  const champFormateur = document.getElementById(
    'filtreFormateurIndemnisation'
  );
  const champFormation = document.getElementById(
    'filtreFormationIndemnisation'
  );
  const champStatut = document.getElementById(
    'filtreStatutIndemnisation'
  );
  const champNonDemandees = document.getElementById(
    'filtreNonDemandeesIndemnisation'
  );

  if (
    !champDateDebut ||
    !champDateFin ||
    !champFormateur ||
    !champFormation ||
    !champStatut ||
    !champNonDemandees
  ) {
    return;
  }

  const dateDebut = champDateDebut.value;
  const dateFin = champDateFin.value;
  const idFormateur = champFormateur.value;
  const formation = champFormation.value;
  const statut = champStatut.value;
  const uniquementNonDemandees = champNonDemandees.checked;

  champStatut.disabled = uniquementNonDemandees;

  const prestationsFiltrees =
    etatApplication.prestationsIndemnisation.filter(
      function (prestation) {
        return (
          (!dateDebut || prestation.dateSession >= dateDebut) &&
          (!dateFin || prestation.dateSession <= dateFin) &&
          (!idFormateur ||
            prestation.idFormateur === idFormateur) &&
          (!formation || prestation.formation === formation) &&
          (uniquementNonDemandees
            ? prestation.statut === 'À demander'
            : (!statut || prestation.statut === statut))
        );
      }
    );

  etatApplication.prestationsFiltreesIndemnisation =
    prestationsFiltrees;

  const idsVisibles = new Set(
    prestationsFiltrees.map(function (prestation) {
      return prestation.idPrestation;
    })
  );

  Object.keys(
    etatApplication.selectionPrestationsIndemnisation
  ).forEach(function (idPrestation) {
    if (!idsVisibles.has(idPrestation)) {
      delete etatApplication
        .selectionPrestationsIndemnisation[idPrestation];
    }
  });

  afficherListeIndemnisations();
  mettreAJourSyntheseIndemnisations();
  mettreAJourSelectionIndemnisations();
}

function afficherListeIndemnisations() {
  const corps = document.getElementById(
    'corpsTableauIndemnisations'
  );
  const compteur = document.getElementById(
    'compteurIndemnisations'
  );

  if (!corps || !compteur) {
    return;
  }

  const prestations =
    etatApplication.prestationsFiltreesIndemnisation;

  compteur.textContent = prestations.length +
    (prestations.length > 1
      ? ' prestations affichées'
      : ' prestation affichée');

  if (!prestations.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="11" class="etat-vide">
          Aucune prestation ne correspond aux filtres sélectionnés.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = prestations.map(function (prestation) {
    const selectionnee = Boolean(
      etatApplication.selectionPrestationsIndemnisation[
        prestation.idPrestation
      ]
    );

    const avertissementDoublon = prestation.doublonPotentiel
      ? '<span class="alerte-doublon-indemnisation" ' +
        'title="Plusieurs lignes existent pour cette séance et ce formateur">⚠</span>'
      : '';

    return `
      <tr class="${selectionnee ? 'ligne-selectionnee-indemnisation' : ''}">
        <td class="colonne-selection-indemnisation">
          <input
            type="checkbox"
            class="case-prestation-indemnisation"
            data-id-prestation="${echapperHtml(prestation.idPrestation)}"
            ${selectionnee ? 'checked' : ''}
            onchange="changerSelectionPrestationIndemnisation(this)"
            aria-label="Sélectionner la prestation de ${echapperHtml(prestation.formateur)}"
          >
        </td>
        <td>${echapperHtml(afficherDateFrancaise(prestation.dateSession) || '—')}</td>
        <td><strong>${echapperHtml(prestation.formation || '—')}</strong></td>
        <td>
          ${echapperHtml(prestation.formateur || '—')}
          ${avertissementDoublon}
        </td>
        <td>${echapperHtml(prestation.heureDebut || '—')}</td>
        <td>${echapperHtml(prestation.heureFin || '—')}</td>
        <td>${echapperHtml(formaterHeuresFormation(prestation.dureeHeures))}</td>
        <td>
          <span class="badge-statut ${obtenirClasseStatutIndemnisation(prestation.statut)}">
            ${echapperHtml(prestation.statut)}
          </span>
        </td>
        <td>${echapperHtml(afficherDateFrancaise(prestation.dateDemande) || '—')}</td>
        <td class="cellule-reference-indemnisation">
          ${echapperHtml(prestation.referenceDemande || '—')}
        </td>
        <td class="cellule-remarque-indemnisation">
          ${echapperHtml(prestation.remarqueAdministrative || '—')}
        </td>
      </tr>
    `;
  }).join('');
}

function obtenirClasseStatutIndemnisation(statut) {
  const classes = {
    'À demander': 'badge-orange',
    'Demande envoyée': 'badge-bleu',
    'Indemnisée': 'badge-vert',
    'À corriger': 'badge-rouge'
  };

  return classes[statut] || 'badge-gris';
}

function selectionnerToutesIndemnisations(champ) {
  etatApplication.prestationsFiltreesIndemnisation.forEach(
    function (prestation) {
      if (champ.checked) {
        etatApplication.selectionPrestationsIndemnisation[
          prestation.idPrestation
        ] = true;
      } else {
        delete etatApplication
          .selectionPrestationsIndemnisation[
            prestation.idPrestation
          ];
      }
    }
  );

  afficherListeIndemnisations();
  mettreAJourSelectionIndemnisations();
}

function changerSelectionPrestationIndemnisation(champ) {
  const idPrestation = champ.dataset.idPrestation;

  if (!idPrestation) {
    return;
  }

  if (champ.checked) {
    etatApplication.selectionPrestationsIndemnisation[
      idPrestation
    ] = true;
  } else {
    delete etatApplication
      .selectionPrestationsIndemnisation[idPrestation];
  }

  const ligne = champ.closest('tr');

  if (ligne) {
    ligne.classList.toggle(
      'ligne-selectionnee-indemnisation',
      champ.checked
    );
  }

  mettreAJourSelectionIndemnisations();
}

function obtenirPrestationsSelectionneesIndemnisation() {
  const idsSelectionnes = new Set(
    Object.keys(
      etatApplication.selectionPrestationsIndemnisation
    ).filter(function (idPrestation) {
      return etatApplication
        .selectionPrestationsIndemnisation[idPrestation];
    })
  );

  return etatApplication.prestationsIndemnisation.filter(
    function (prestation) {
      return idsSelectionnes.has(prestation.idPrestation);
    }
  );
}

function mettreAJourSelectionIndemnisations() {
  const prestationsSelectionnees =
    obtenirPrestationsSelectionneesIndemnisation();

  const idsSelectionnes = new Set(
    prestationsSelectionnees.map(function (prestation) {
      return prestation.idPrestation;
    })
  );

  const caseGlobale = document.getElementById(
    'selectionToutesIndemnisations'
  );

  if (caseGlobale) {
    const nombreVisibles =
      etatApplication.prestationsFiltreesIndemnisation.length;
    const nombreVisiblesSelectionnees =
      etatApplication.prestationsFiltreesIndemnisation.filter(
        function (prestation) {
          return idsSelectionnes.has(prestation.idPrestation);
        }
      ).length;

    caseGlobale.checked = nombreVisibles > 0 &&
      nombreVisiblesSelectionnees === nombreVisibles;
    caseGlobale.indeterminate = nombreVisiblesSelectionnees > 0 &&
      nombreVisiblesSelectionnees < nombreVisibles;
  }

  document
    .querySelectorAll('.action-selection-indemnisation')
    .forEach(function (bouton) {
      bouton.disabled = !prestationsSelectionnees.length;
    });

  const heures = prestationsSelectionnees.reduce(
    function (total, prestation) {
      return total + Number(prestation.dureeHeures || 0);
    },
    0
  );

  const nombre = document.getElementById(
    'nombreSelectionIndemnisation'
  );
  const heuresElement = document.getElementById(
    'heuresSelectionIndemnisation'
  );

  if (nombre) {
    nombre.textContent = prestationsSelectionnees.length;
  }

  if (heuresElement) {
    heuresElement.textContent = formaterHeuresFormation(heures);
  }

  afficherRecapitulatifFormateursIndemnisation(
    prestationsSelectionnees
  );
}

function mettreAJourSyntheseIndemnisations() {
  const prestations =
    etatApplication.prestationsFiltreesIndemnisation;

  const prestationsADemander = prestations.filter(
    function (prestation) {
      return prestation.statut === 'À demander';
    }
  );

  const heures = prestations.reduce(
    function (total, prestation) {
      return total + Number(prestation.dureeHeures || 0);
    },
    0
  );

  const heuresADemander = prestationsADemander.reduce(
    function (total, prestation) {
      return total + Number(prestation.dureeHeures || 0);
    },
    0
  );

  const valeurs = {
    nombrePrestationsIndemnisation: prestations.length,
    heuresPrestationsIndemnisation:
      formaterHeuresFormation(heures),
    prestationsADemanderIndemnisation:
      prestationsADemander.length,
    heuresADemanderIndemnisation:
      formaterHeuresFormation(heuresADemander)
  };

  Object.keys(valeurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = valeurs[identifiant];
    }
  });
}

function grouperPrestationsParFormateurIndemnisation(
  prestations
) {
  const groupes = {};

  prestations.forEach(function (prestation) {
    const cle = prestation.idFormateur ||
      prestation.formateur || 'sans-formateur';

    if (!groupes[cle]) {
      groupes[cle] = {
        idFormateur: prestation.idFormateur,
        formateur: prestation.formateur ||
          'Formateur non identifié',
        prestations: []
      };
    }

    groupes[cle].prestations.push(prestation);
  });

  return Object.keys(groupes)
    .map(function (cle) {
      const groupe = groupes[cle];
      const idsSessions = new Set(
        groupe.prestations.map(function (prestation) {
          return prestation.idSession;
        }).filter(Boolean)
      );

      groupe.nombreSeances = idsSessions.size ||
        groupe.prestations.length;
      groupe.totalHeures = groupe.prestations.reduce(
        function (total, prestation) {
          return total + Number(prestation.dureeHeures || 0);
        },
        0
      );

      groupe.prestations.sort(function (a, b) {
        return String(b.dateSession).localeCompare(
          String(a.dateSession)
        );
      });

      return groupe;
    })
    .sort(function (a, b) {
      return a.formateur.localeCompare(
        b.formateur,
        'fr',
        { sensitivity: 'base' }
      );
    });
}

function ouvrirActionIndemnisation(statut) {
  const prestations =
    obtenirPrestationsSelectionneesIndemnisation();

  if (!prestations.length) {
    afficherToast(
      'Sélectionne au moins une prestation.',
      true
    );
    return;
  }

  const statutsAutorises = [
    'À demander',
    'Demande envoyée',
    'Indemnisée',
    'À corriger'
  ];

  if (!statutsAutorises.includes(statut)) {
    afficherToast('Le statut demandé est invalide.', true);
    return;
  }

  const contientIndemnisee = prestations.some(
    function (prestation) {
      return prestation.statut === 'Indemnisée';
    }
  );

  document.getElementById(
    'statutCibleIndemnisation'
  ).value = statut;

  document.getElementById(
    'titreActionIndemnisation'
  ).textContent = statut === 'À demander'
    ? 'Revenir à « À demander »'
    : 'Marquer comme « ' + statut + ' »';

  document.getElementById(
    'sousTitreActionIndemnisation'
  ).textContent = prestations.length +
    (prestations.length > 1
      ? ' prestations sélectionnées.'
      : ' prestation sélectionnée.');

  document.getElementById(
    'referenceActionIndemnisation'
  ).value = '';

  document.getElementById(
    'remarqueActionIndemnisation'
  ).value = '';

  document.getElementById(
    'confirmationIndemnisee'
  ).checked = false;

  document.getElementById(
    'groupeReferenceIndemnisation'
  ).classList.toggle(
    'masque',
    statut !== 'Demande envoyée'
  );

  document.getElementById(
    'groupeConfirmationIndemnisee'
  ).classList.toggle(
    'masque',
    !(contientIndemnisee && statut !== 'Indemnisée')
  );

  document.getElementById(
    'modalActionIndemnisation'
  ).classList.remove('masque');

  document.body.classList.add('modal-ouverte');

  window.setTimeout(function () {
    const cible = statut === 'Demande envoyée'
      ? document.getElementById(
        'referenceActionIndemnisation'
      )
      : document.getElementById(
        'remarqueActionIndemnisation'
      );

    if (cible) {
      cible.focus();
    }
  }, 100);
}

function fermerActionIndemnisation() {
  const modal = document.getElementById(
    'modalActionIndemnisation'
  );

  if (modal) {
    modal.classList.add('masque');
  }

  document.body.classList.remove('modal-ouverte');
}

function soumettreActionIndemnisation(evenement) {
  evenement.preventDefault();

  const prestations =
    obtenirPrestationsSelectionneesIndemnisation();
  const statut = document.getElementById(
    'statutCibleIndemnisation'
  ).value;
  const confirmationVisible = !document.getElementById(
    'groupeConfirmationIndemnisee'
  ).classList.contains('masque');
  const confirmation = document.getElementById(
    'confirmationIndemnisee'
  ).checked;

  if (!prestations.length) {
    fermerActionIndemnisation();
    afficherToast(
      'La sélection est vide. Aucune prestation modifiée.',
      true
    );
    return;
  }

  if (confirmationVisible && !confirmation) {
    afficherToast(
      'Confirme explicitement la modification de la prestation déjà indemnisée.',
      true
    );
    return;
  }

  const bouton = document.getElementById(
    'boutonConfirmerActionIndemnisation'
  );

  bouton.disabled = true;
  bouton.textContent = 'Mise à jour…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Confirmer';
      fermerActionIndemnisation();

      etatApplication.selectionPrestationsIndemnisation = {};

      afficherToast(
        resultat.message || 'Prestations mises à jour.',
        false
      );

      rechargerIndemnisations();
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent = 'Confirmer';

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .changerStatutPrestationsIndemnisation(
      {
        idsPrestations: prestations.map(
          function (prestation) {
            return prestation.idPrestation;
          }
        ),
        statut: statut,
        reference: document.getElementById(
          'referenceActionIndemnisation'
        ).value,
        remarque: document.getElementById(
          'remarqueActionIndemnisation'
        ).value,
        confirmationIndemnisee: confirmation,
        idOperation: creerIdentifiantOperationIndemnisation()
      },
      obtenirJetonAdministrateurApplication()
    );
}

function creerIdentifiantOperationIndemnisation() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === 'function'
  ) {
    return window.crypto.randomUUID();
  }

  return 'indem-' + Date.now() + '-' +
    Math.random().toString(36).slice(2, 12);
}

        donnees.restauration || null;

      afficherDiagnosticAdministration(donnees.session || {});
      afficherDiagnosticBaseAdministration(
        etatApplication.diagnosticAdministration
      );
      afficherSauvegardesAdministration(
        etatApplication.sauvegardesAdministration
      );
      afficherInventaireSauvegardesAdministration(

      );

      );

    })
    .withFailureHandler(gererErreurServeur)
    .getDonneesAdministration(
      obtenirJetonAdministrateurApplication()
    );
}

function afficherDiagnosticAdministration(session) {
  const zone = document.getElementById(
    'diagnosticIdentificationAdministration'
  );

  if (!zone) {
    return;
  }

  zone.innerHTML = `
    <strong>Administration déverrouillée</strong>
    <span>
      Session ${echapperHtml(
        session.identifiantSessionAdministration || 'active'
      )} · expiration après 30 minutes d’inactivité
    </span>
  `;
}

function afficherDiagnosticBaseAdministration(rapport) {
  rapport = rapport || {};
  const resume = rapport.resume || {};
  const migrations = Array.isArray(rapport.migrations)
    ? rapport.migrations
    : [];
  const feuilles = Array.isArray(rapport.feuilles)
    ? rapport.feuilles
    : [];
  const erreurs = Array.isArray(rapport.erreurs)
    ? rapport.erreurs
    : [];
  const valeurs = {
    versionSchemaAdministration:
      String(rapport.versionSchema || 0) +
      ' / ' + String(rapport.versionCible || 0),
    nombreMigrationsAdministration:
      migrations.filter(function (migration) {
        return migration.executee;
      }).length + ' / ' + migrations.length,
    integriteFeuillesAdministration:
      Number(resume.feuillesConformes || 0) +
      ' / ' + Number(resume.nombreFeuilles || feuilles.length),
    nombreErreursAdministration:
      String(Number(resume.totalErreurs || erreurs.length))
  };

  Object.keys(valeurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = valeurs[identifiant];
    }
  });

  const listeMigrations = document.getElementById(
    'listeMigrationsAdministration'
  );

  if (listeMigrations) {
    listeMigrations.innerHTML = migrations.length
      ? migrations.map(function (migration) {
        return `
          <div class="ligne-diagnostic-administration ${migration.executee ? 'diagnostic-ok' : 'diagnostic-attente'}">
            <span>${migration.executee ? '✔' : '○'}</span>
            <span>
              <strong>Migration ${Number(migration.version) || 0}</strong>
              <small>${echapperHtml(migration.nom || '')}</small>
            </span>
          </div>
        `;
      }).join('')
      : '<div class="etat-vide">Aucune migration déclarée.</div>';
  }

  const listeFeuilles = document.getElementById(
    'listeFeuillesAdministration'
  );

  if (listeFeuilles) {
    listeFeuilles.innerHTML = feuilles.map(function (feuille) {
      return `
        <div class="ligne-diagnostic-administration ${feuille.conforme ? 'diagnostic-ok' : 'diagnostic-erreur'}">
          <span>${feuille.conforme ? '✔' : '!'}</span>
          <span>
            <strong>${echapperHtml(feuille.nom || '')}</strong>
            <small>
              ${feuille.conforme
                ? Number(feuille.nombreLignes || 0) + ' ligne(s) de données'
                : 'Colonnes manquantes : ' + echapperHtml(
                  (feuille.colonnesManquantes || []).join(', ')
                )}
            </small>
          </span>
        </div>
      `;
    }).join('');
  }

  const listeErreurs = document.getElementById(
    'listeErreursAdministration'
  );

  if (listeErreurs) {
    if (!erreurs.length) {
      listeErreurs.innerHTML = `
        <div class="etat-integrite-valide-administration">
          ✔ Aucune erreur d’intégrité détectée.
        </div>
      `;
    } else {
      listeErreurs.innerHTML = `
        <div class="liste-erreurs-integrite-administration">
          ${erreurs.map(function (erreur) {
            return `
              <div>
                <strong>${echapperHtml(erreur.feuille || erreur.type || 'Erreur')}</strong>
                <span>${echapperHtml(erreur.message || '')}</span>
              </div>
            `;
          }).join('')}
        </div>
        ${rapport.limiteErreursAtteinte
          ? '<p class="avertissement-diagnostic-administration">Le rapport est limité aux 500 premières erreurs.</p>'
          : ''}
      `;
    }
  }
}

function lancerDiagnosticAdministration() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  afficherLoader();

  google.script.run

function creerSauvegardeAdministration() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const champ = document.getElementById(
    'commentaireSauvegardeAdministration'
  );
  const bouton = document.getElementById(
    'boutonCreerSauvegardeAdministration'
  );
  const commentaire = champ ? champ.value.trim() : '';

  if (commentaire.length > 500) {
    afficherToast(
      'Le commentaire est limité à 500 caractères.',
      true
    );
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Sauvegarde en cours…';
  }

  definirEtatProgressionSauvegardeAdministration_(
    'Lecture des feuilles, signature et vérification du fichier Drive…',
    'en-cours'
  );

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Créer une sauvegarde';
      }

      if (champ) {
        champ.value = '';
        mettreAJourCompteurCommentaireSauvegarde();
      }

      etatApplication.sauvegardesAdministration = {
        disponible: true,
        derniereSauvegarde: resultat,
        erreur: ''
      };

      afficherSauvegardesAdministration(
        etatApplication.sauvegardesAdministration
      );
      definirEtatProgressionSauvegardeAdministration_(
        resultat.message,
        resultat.integrityStatus === 'CONFORME'
          ? 'succes'
          : 'avertissement'
      );
      afficherToast(resultat.message, false);
      actualiserInventaireSauvegardesAdministration(false);
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Créer une sauvegarde';
      }

      const message = extraireMessageErreur(erreur);
      definirEtatProgressionSauvegardeAdministration_(
        message,
        'erreur'
      );
      afficherToast(message, true);
    })
    .creerSauvegardeManuelle(
      commentaire,
      obtenirJetonAdministrateurApplication()
    );
}


function telechargerDerniereSauvegardeAdministration() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const etat = etatApplication.sauvegardesAdministration || {};
  const sauvegarde = etat.derniereSauvegarde;
  const bouton = document.getElementById(
    'boutonTelechargerDerniereSauvegarde'
  );

  if (!sauvegarde || !sauvegarde.backupId) {
    afficherToast('Aucune sauvegarde à télécharger.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Vérification…';
  }

  definirEtatProgressionSauvegardeAdministration_(
    'Vérification du fichier et création du jeton temporaire…',
    'en-cours'
  );

  google.script.run
    .withSuccessHandler(function (autorisation) {
      definirEtatProgressionSauvegardeAdministration_(
        'Téléchargement sécurisé du JSON original…',
        'en-cours'
      );

      google.script.run
        .withSuccessHandler(function (fichier) {
          try {
            declencherTelechargementSauvegarde_(fichier);
            definirEtatProgressionSauvegardeAdministration_(
              'Téléchargement préparé. Le jeton à usage unique a été invalidé.',
              'succes'
            );
            afficherToast('Téléchargement prêt.', false);
          } catch (erreur) {
            const message = extraireMessageErreur(erreur);
            definirEtatProgressionSauvegardeAdministration_(
              message,
              'erreur'
            );
            afficherToast(message, true);
          } finally {
            if (bouton) {
              bouton.disabled = false;
              bouton.textContent =
                'Télécharger la dernière sauvegarde';
            }
          }
        })
        .withFailureHandler(function (erreur) {
          if (bouton) {
            bouton.disabled = false;
            bouton.textContent =
              'Télécharger la dernière sauvegarde';
          }

          const message = extraireMessageErreur(erreur);
          definirEtatProgressionSauvegardeAdministration_(
            message,
            'erreur'
          );
          afficherToast(message, true);
        })
        .telechargerSauvegarde(
          autorisation.token,
          obtenirJetonAdministrateurApplication()
        );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent =
          'Télécharger la dernière sauvegarde';
      }

      const message = extraireMessageErreur(erreur);
      definirEtatProgressionSauvegardeAdministration_(
        message,
        'erreur'
      );
      afficherToast(message, true);
    })
    .preparerTelechargementSauvegarde(
      sauvegarde.backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function declencherTelechargementSauvegarde_(fichier) {
  const binaire = window.atob(fichier.contentBase64 || '');
  const octets = new Uint8Array(binaire.length);

  for (let i = 0; i < binaire.length; i++) {
    octets[i] = binaire.charCodeAt(i);
  }

  const blob = new Blob(
    [octets],
    { type: fichier.mimeType || 'application/json' }
  );
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');

  lien.href = url;
  lien.download = fichier.fileName || 'PrepFormation.json';
  lien.style.display = 'none';
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  window.setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 1000);
}


function definirEtatProgressionSauvegardeAdministration_(
  message,
  statut
) {
  const zone = document.getElementById(

  zone.textContent = message;
  zone.dataset.statut = statut || '';
}


function formaterTailleSauvegardeAdministration_(octets) {
  const taille = Math.max(0, Number(octets) || 0);

  if (taille < 1024) {
    return taille + ' octet' + (taille > 1 ? 's' : '');
  }

  if (taille < 1024 * 1024) {
    return (taille / 1024).toFixed(1).replace('.', ',') + ' Ko';
  }

  return (taille / (1024 * 1024))
    .toFixed(2)
    .replace('.', ',') + ' Mo';
}


function formaterDateSauvegardeAdministration_(valeur) {
  const date = new Date(valeur);

  if (Number.isNaN(date.getTime())) {
    return String(valeur || 'Date inconnue');
  }

  return date.toLocaleString('fr-FR', {
    dateStyle: 'short',
    timeStyle: 'short'
  });
}

function testerSauvegardeRestaurabiliteAdministration(
  backupId,
  bouton
) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);

    bouton.disabled = true;
    bouton.textContent = 'Test en cours…';

    'Test de restaurabilité en lecture seule…',

    .withSuccessHandler(function (rapport) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Tester la restauration';

function afficherRapportRestaurabiliteSauvegarde_(rapport) {

      </div>

          return `<div class="${validation[cle] ? 'validation-ok' : 'validation-erreur'}"><strong>${validation[cle] ? '✓' : '!'}</strong><span>${echapperHtml(cle)}</span></div>`;

    <section class="section-rapport-restaurabilite grille-alertes-rapport-restaurabilite">

        <h3>Avertissements (${avertissements.length})</h3>
        ${construireListeAlertesRestaurabilite_(avertissements, false)}
      </div>

    <section class="section-rapport-restaurabilite">
      <h3>Migrations simulées (${migrations.length})</h3>

function construireListeAlertesRestaurabilite_(elements, erreur) {
  if (!elements.length) {
    return `<div class="${erreur ? 'etat-vide' : 'etat-integrite-valide-administration'}">${erreur ? 'Aucune erreur bloquante.' : '✓ Aucun avertissement.'}</div>`;
  }

  return `<div class="liste-alertes-restaurabilite ${erreur ? 'liste-alertes-restaurabilite-erreurs' : ''}">${elements.map(function (element) {
    return `<div><strong>${echapperHtml(element.code || 'Information')}</strong><span>${echapperHtml(element.message || '')}</span></div>`;
  }).join('')}</div>`;
}


function construireDetailIdentifiantsRestaurabilite_(detail) {
  detail = detail || {};
  const exemples = Array.isArray(detail.exemples)
    ? detail.exemples
    : [];

  if (!Number(detail.total || 0)) {
    return '0';
  }

  return `
    <details>
      <summary>${Number(detail.total)} identifiant(s)</summary>
      <small>${echapperHtml(exemples.join(', '))}${Number(detail.total) > exemples.length ? '…' : ''}</small>
    </details>
  `;
}


function construireDetailColonnesRestaurabilite_(feuille) {
  if (feuille.entetesIdentiques) {
    return 'Identiques';
  }

  const absentes = feuille.colonnesAbsentesActuelles || [];
  const supplementaires =
    feuille.colonnesSupplementairesActuelles || [];

  return `
    <details>
      <summary>Différentes</summary>
      <small>
        Absentes actuellement : ${echapperHtml(absentes.join(', ') || 'aucune')}<br>
        Supplémentaires actuellement : ${echapperHtml(supplementaires.join(', ') || 'aucune')}
      </small>
    </details>
  `;
}


function mettreAJourBoutonRestaurationConsultation_(rapport) {
  const bouton = document.getElementById(
    'boutonRestaurerDepuisConsultation'
  );

  if (!bouton) {
    return;
  }

  const autorise = Boolean(
    rapport &&
    rapport.obsolete !== true &&
    [
      'RESTAURABLE',
      'RESTAURABLE_AVEC_MIGRATIONS'
    ].includes(rapport.statut)
  );

  bouton.disabled = !autorise;
  bouton.title = autorise
    ? 'Prévisualiser puis confirmer la restauration'
    : 'Un test concluant et actuel est obligatoire';
}


function preparerRestaurationDepuisConsultationAdministration() {
  const backupId = etatApplication.backupIdRestaurabiliteActif;

  if (!backupId) {
    afficherToast('Aucune sauvegarde sélectionnée.', true);
    return;
  }

  fermerModalRestaurabiliteSauvegarde();
  preparerRestaurationAdministration(backupId, null);
}


function preparerRestaurationAdministration(backupId, bouton) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Préparation…';
  }

  ouvrirModalPreparationRestaurationAdministration_();

  google.script.run
    .withSuccessHandler(function (previsualisation) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Préparer la restauration';
      }

      etatApplication.previewRestaurationActive = previsualisation;
      afficherPrevisualisationRestaurationAdministration_(
        previsualisation
      );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Préparer la restauration';
      }

      const message = extraireMessageErreur(erreur);
      afficherErreurPreparationRestaurationAdministration_(message);
      afficherToast(message, true);
    })
    .preparerRestaurationSauvegarde(
      backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function ouvrirModalPreparationRestaurationAdministration_() {
  const modal = document.getElementById(
    'modalPreparationRestaurationAdministration'
  );
  const contenu = document.getElementById(
    'contenuPreparationRestaurationAdministration'
  );
  const confirmation = document.getElementById(
    'confirmationRestaurationAdministration'
  );
  const bouton = document.getElementById(
    'boutonConfirmerRestaurationAdministration'
  );

  etatApplication.restaurationModaleFermable = false;
  etatApplication.rafraichirRestaurationApresFermeture = false;

  if (contenu) {
    contenu.innerHTML = `
      <div class="etat-vide">
        Validation du rapport, du JSON signé et de son empreinte…
      </div>
    `;
  }

  confirmation?.classList.add('masque');

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Confirmer et restaurer';
    bouton.classList.remove('bouton-principal');
    bouton.classList.add('bouton-danger');
    bouton.onclick = confirmerEtExecuterRestaurationAdministration;
  }

  if (modal) {
    modal.classList.remove('masque');
  }
}


function fermerModalPreparationRestaurationAdministration() {
  const etat = etatApplication.restaurationAdministration || {};

  if (
    etat.operationActive &&
    !etatApplication.restaurationModaleFermable
  ) {
    afficherToast(
      'La fenêtre reste disponible pendant la restauration.',
      true
    );
    return;
  }

  const actualiserApresFermeture =
    etatApplication.rafraichirRestaurationApresFermeture;

  arreterSuiviRestaurationAdministration_();

  document.getElementById(
    'modalPreparationRestaurationAdministration'
  )?.classList.add('masque');
  etatApplication.previewRestaurationActive = null;
  const motDePasse = document.getElementById(
    'motDePasseConfirmationRestauration'
  );

  if (motDePasse) {
    motDePasse.value = '';
  }

  reinitialiserControlesModalRestaurationAdministration_();
  etatApplication.restaurationModaleFermable = false;
  etatApplication.rafraichirRestaurationApresFermeture = false;

  if (actualiserApresFermeture) {
    actualiserInventaireSauvegardesAdministration(false);
    actualiserEtatRestaurationAdministration_(true);
  }
}

    'contenuPreparationRestaurationAdministration'
  );

  if (contenu) {

      <div class="erreur-sauvegarde-administration">
        <strong>Restauration impossible</strong>
        <span>${echapperHtml(message)}</span>
      </div>
    `;

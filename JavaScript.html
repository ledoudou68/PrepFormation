const CLE_JETON_ADMINISTRATION =

const CLE_JETON_FORMATEUR =
  'prepformation.jetonFormateur';
const CLE_DIAGNOSTIC_CONNEXION_PROCHAINE_ =
  'prepformation.diagnosticConnexionProchaine';
const CLE_UTILISATEUR_FAVORIS =
  'prepformation.utilisateurFavoris';
const MODE_DIAGNOSTIC_CONNEXION_CLIENT_ = false;
const DUREE_INACTIVITE_ADMINISTRATION_MS = 30 * 60 * 1000;
const INTERVALLE_RENOUVELLEMENT_ADMINISTRATION_MS = 60 * 1000;

const etatApplication = {
  pageActive: 'Accueil',
  sessionUtilisateur: null,
  stagiaires: [],
  formateurs: [],
  formations: [],
  statutsStagiaires: [],
  sessions: [],
  stagiairesSession: [],
  formateursSession: [],
  formationsSession: [],
  statistiques: null,
  chargementStatistiquesEnCours: false,
  generationStatistiques: 0,
  assistantPedagogique: null,
  donneesCalendrier: null,
  moisCalendrierActif: null,
  chargementCalendrierEnCours: false,
  generationCalendrier: 0,
  filtresCalendrier: {
    formationId: '',
    formateurId: '',
    stagiaireId: '',
    temporalite: 'TOUTES'
  },
  sessionAConsulterDepuisCalendrier: '',
  dateNouvelleSessionDepuisCalendrier: '',
  referentielSession: [],
  formationReferentielSession: '',
  itemsTravaillesSession: {},
  validationsSession: {},
  sessionDetaillee: null,
  modeFormulaireSession: 'creation',
  idSessionSourceFormulaire: '',
  idsFormateursHistoriquesSession: {},
  idsStagiairesHistoriquesSession: {},

  formationsReferentiel: [],
  categoriesReferentiel: [],

  formationReferentielActive: '',
  importReferentiel: null,
  prestationsIndemnisation: [],
  prestationsFiltreesIndemnisation: [],
  formateursIndemnisation: [],
  formationsIndemnisation: [],

  derniersEnvoisIndemnisation: [],

  stagiaireAConsulterDepuisAccueil: '',
  formationStagiairesDepuisRechercheGlobale: '',
  formateurDepuisRechercheGlobale: '',
  referentielFormationDepuisRechercheGlobale: '',
  referentielItemASelectionner: '',
  rechercheGlobale: null,
  favoris: null,

  backupSuppressionAdministration: null,

  diagnosticConnexionEnCours: null,
  dernierDiagnosticConnexion: null,
  derniereActiviteAdministration: 0,

  renouvellementAdministrationEnCours: false,
  jetonChangementMotDePasseFormateur: '',

};

document.addEventListener(
  'DOMContentLoaded',
  initialiserInterface
);

function initialiserInterface() {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.addEventListener('click', function () {
        chargerPage(bouton.dataset.page);
      });
    });

  afficherLoader();

  ['pointerdown', 'keydown', 'touchstart'].forEach(
    function (nomEvenement) {
      document.addEventListener(
        nomEvenement,
        noterActiviteAdministration,
        { passive: true }
      );
    }
  );

  document.addEventListener(
    'click',
    gererClicExterieurRechercheGlobale
  );

  document.addEventListener(
    'click',
    gererClicExterieurFavoris
  );

  resoudreSessionUtilisateurAuDemarrage_();
}


function resoudreSessionUtilisateurAuDemarrage_() {
  const jetonAdministrateur = obtenirJetonAdministrateurApplication();
  const jetonFormateur = obtenirJetonFormateurApplication();
  const candidats = [];
  if (jetonAdministrateur) {
    candidats.push({ type: 'ADMINISTRATEUR', jeton: jetonAdministrateur });
  }
  if (jetonFormateur) {
    candidats.push({ type: 'FORMATEUR', jeton: jetonFormateur });
  }

  function essayer(position) {
    if (position >= candidats.length) {
      afficherEcranConnexionFormateur_();
      return;
    }
    const candidat = candidats[position];
    google.script.run
      .withSuccessHandler(function (sessionUtilisateur) {
        if (
          sessionUtilisateur &&
          sessionUtilisateur.contexte !== 'NON_CONNECTE'
        ) {
          demarrerApplicationAuthentifiee_(sessionUtilisateur);
          return;
        }
        if (candidat.type === 'ADMINISTRATEUR') {
          retirerJetonAdministrateurApplication();
        } else {
          retirerJetonFormateurApplication();
        }
        essayer(position + 1);
      })
      .withFailureHandler(function () {
        if (candidat.type === 'ADMINISTRATEUR') {
          retirerJetonAdministrateurApplication();
        } else {
          retirerJetonFormateurApplication();
        }
        essayer(position + 1);
      })
      .getSessionUtilisateur(candidat.jeton);
  }

  if (!candidats.length) {
    afficherEcranConnexionFormateur_();
    return;
  }
  essayer(0);
}


function demarrerApplicationAuthentifiee_(
  sessionUtilisateur,
  diagnosticConnexion
) {
  const debutContexte = diagnosticConnexion
    ? maintenantDiagnosticConnexionClient_()
    : 0;
  etatApplication.sessionUtilisateur = sessionUtilisateur;
  document.body.classList.add('application-authentifiee');
  etatApplication.jetonChangementMotDePasseFormateur = '';
  document.getElementById('ecranConnexion')?.classList.add('masque');
  document.getElementById(
    'formulaireConnexionFormateur'
  )?.classList.remove('masque');
  document.getElementById(
    'formulairePremiereConnexionFormateur'
  )?.classList.add('masque');

  if (sessionUtilisateur.estAdministrateur) {
    etatApplication.derniereActiviteAdministration = Date.now();
  }

  etatApplication.favoris = null;
  initialiserFavorisInterface_();
  appliquerDroitsInterface();
  demarrerSurveillanceAdministration();
  masquerLoader();

  if (diagnosticConnexion) {
    diagnosticConnexion.client.chargementContexteUtilisateurMs =
      maintenantDiagnosticConnexionClient_() - debutContexte;
    diagnosticConnexion.debutChargementAccueil =
      maintenantDiagnosticConnexionClient_();
    etatApplication.diagnosticConnexionEnCours = diagnosticConnexion;
  }

  if (!etatApplication.interfaceAuthentifieeInitialisee) {
    etatApplication.interfaceAuthentifieeInitialisee = true;
    chargerPage('Accueil');
  } else {
    rafraichirInterfaceApresChangementDroits();
  }
}


function afficherEcranConnexionFormateur_() {
  etatApplication.sessionUtilisateur = {
    contexte: 'NON_CONNECTE',
    estIdentifie: false,
    estAdministrateur: false,
    estFormateur: false,
    droits: {}
  };
  etatApplication.interfaceAuthentifieeInitialisee = false;
  etatApplication.favoris = null;
  etatApplication.jetonChangementMotDePasseFormateur = '';
  retirerJetonAdministrateurApplication();
  retirerJetonFormateurApplication();
  document.body.classList.remove('application-authentifiee');
  document.getElementById('contenu').innerHTML = '';
  document.getElementById('ecranConnexion')?.classList.remove('masque');
  document.getElementById(
    'formulaireConnexionFormateur'
  )?.classList.remove('masque');
  document.getElementById(
    'formulairePremiereConnexionFormateur'
  )?.classList.add('masque');
  [
    'motDePasseConnexionFormateur',
    'nouveauMotDePassePremiereConnexion',
    'confirmationMotDePassePremiereConnexion'
  ].forEach(masquerMotDePasseInterface_);
  fermerMenuMobile();
  masquerLoader();
  window.setTimeout(function () {
    document.getElementById('identifiantConnexionFormateur')?.focus();
  }, 50);
}


function basculerVisibiliteMotDePasse_(idChamp, bouton) {
  const champ = document.getElementById(idChamp);
  if (!champ) return;
  const afficher = champ.type === 'password';
  champ.type = afficher ? 'text' : 'password';
  if (bouton) {
    bouton.textContent = afficher ? 'Masquer' : 'Afficher';
    bouton.setAttribute('aria-pressed', afficher ? 'true' : 'false');
  }
  try {
    champ.focus({ preventScroll: true });
  } catch (erreur) {
    champ.focus();
  }
}


function masquerMotDePasseInterface_(idChamp) {
  const champ = document.getElementById(idChamp);
  if (!champ) return;
  champ.type = 'password';
  const bouton = document.querySelector(
    '.bouton-visibilite-mot-de-passe[aria-controls="' + idChamp + '"]'
  );
  if (bouton) {
    bouton.textContent = 'Afficher';
    bouton.setAttribute('aria-pressed', 'false');
  }
}


function maintenantDiagnosticConnexionClient_() {
  if (
    typeof performance !== 'undefined' &&
    performance &&
    typeof performance.now === 'function'
  ) {
    return performance.now();
  }
  return Date.now();
}


function demarrerDiagnosticConnexionClient_() {
  let activePourProchaineConnexion = false;
  try {
    activePourProchaineConnexion = sessionStorage.getItem(
      CLE_DIAGNOSTIC_CONNEXION_PROCHAINE_
    ) === '1';
    if (activePourProchaineConnexion) {
      sessionStorage.removeItem(CLE_DIAGNOSTIC_CONNEXION_PROCHAINE_);
    }
  } catch (erreur) {
    activePourProchaineConnexion = false;
  }

  if (
    !MODE_DIAGNOSTIC_CONNEXION_CLIENT_ &&
    !activePourProchaineConnexion
  ) {
    return null;
  }

  return {
    debutClic: maintenantDiagnosticConnexionClient_(),
    debutAppelServeur: 0,
    debutChargementAccueil: 0,
    serveur: {},
    client: {},
    interfaceUtilisable: false
  };
}


function normaliserMetriquesDiagnosticConnexion_(metriques, origine) {
  const clesServeur = [
    'normalisationIdentifiantMs',
    'rechercheCompteUtilisateurMs',
    'controleBlocageMs',
    'lectureSelHashMs',
    'derivationPbkdf2PepperMs',
    'comparaisonVerificateurMs',
    'miseAJourConnexionMs',
    'creationSessionMs',
    'ecritureScriptPropertiesMs',
    'constructionContexteUtilisateurMs',
    'totalServeurMs'
  ];
  const clesClient = [
    'googleScriptRunMs',
    'receptionReponseMs',
    'stockageJetonSessionMs',
    'chargementContexteUtilisateurMs',
    'chargementAccueilMs',
    'renduClientMs',
    'totalJusquaInterfaceUtilisableMs'
  ];
  const source = metriques || {};
  const resultat = {};
  const cles = origine === 'serveur' ? clesServeur : clesClient;

  cles.forEach(function (cle) {
    const valeur = Number(source[cle]);
    if (Number.isFinite(valeur) && valeur >= 0) {
      resultat[cle] = Math.round(valeur * 100) / 100;
    }
  });
  return resultat;
}


function finaliserDiagnosticConnexionClient_(
  diagnosticConnexion,
  interfaceUtilisable
) {
  if (!diagnosticConnexion) return;
  diagnosticConnexion.interfaceUtilisable = Boolean(interfaceUtilisable);
  const rapport = {
    date: new Date().toISOString(),
    interfaceUtilisable: diagnosticConnexion.interfaceUtilisable,
    serveur: normaliserMetriquesDiagnosticConnexion_(
      diagnosticConnexion.serveur,
      'serveur'
    ),
    client: normaliserMetriquesDiagnosticConnexion_(
      diagnosticConnexion.client,
      'client'
    )
  };

  etatApplication.dernierDiagnosticConnexion = rapport;
  if (etatApplication.diagnosticConnexionEnCours === diagnosticConnexion) {
    etatApplication.diagnosticConnexionEnCours = null;
  }

  if (typeof console !== 'undefined' && console.info) {
    console.info('Diagnostic connexion PrepFormation', rapport);
  }
  if (typeof afficherDiagnosticConnexionAdministration_ === 'function') {
    afficherDiagnosticConnexionAdministration_();
  }
}


function soumettreConnexionFormateur(evenement) {
  evenement.preventDefault();
  const diagnosticConnexion = demarrerDiagnosticConnexionClient_();
  const champIdentifiant = document.getElementById(
    'identifiantConnexionFormateur'
  );
  const champMotDePasse = document.getElementById(
    'motDePasseConnexionFormateur'
  );
  const bouton = document.getElementById('boutonConnexionFormateur');
  const zoneErreur = document.getElementById('erreurConnexionFormateur');
  const identifiant = String(champIdentifiant?.value || '');
  let motDePasse = String(champMotDePasse?.value || '');

  if (champMotDePasse) champMotDePasse.value = '';
  masquerMotDePasseInterface_('motDePasseConnexionFormateur');
  if (zoneErreur) zoneErreur.classList.add('masque');
  bouton.disabled = true;
  bouton.textContent = 'Connexion…';

  const appelServeur = google.script.run
    .withSuccessHandler(function (resultat) {
      if (diagnosticConnexion) {
        const reception = maintenantDiagnosticConnexionClient_();
        diagnosticConnexion.client.googleScriptRunMs =
          reception - diagnosticConnexion.debutAppelServeur;
        diagnosticConnexion.client.receptionReponseMs =
          reception - diagnosticConnexion.debutClic;
        diagnosticConnexion.serveur = normaliserMetriquesDiagnosticConnexion_(
          resultat && resultat.diagnosticConnexion
            ? resultat.diagnosticConnexion.serveur
            : null,
          'serveur'
        );
      }
      motDePasse = '';
      bouton.disabled = false;
      bouton.textContent = 'Se connecter';
      if (resultat.changementMotDePasseRequis) {
        etatApplication.jetonChangementMotDePasseFormateur =
          resultat.jetonChangementMotDePasse;
        document.getElementById(
          'formulaireConnexionFormateur'
        ).classList.add('masque');
        document.getElementById(
          'formulairePremiereConnexionFormateur'
        ).classList.remove('masque');
        document.getElementById(
          'nouveauMotDePassePremiereConnexion'
        ).focus();
        finaliserDiagnosticConnexionClient_(
          diagnosticConnexion,
          false
        );
        return;
      }
      const debutStockageJeton = diagnosticConnexion
        ? maintenantDiagnosticConnexionClient_()
        : 0;
      enregistrerJetonFormateurApplication(resultat.jeton);
      if (diagnosticConnexion) {
        diagnosticConnexion.client.stockageJetonSessionMs =
          maintenantDiagnosticConnexionClient_() - debutStockageJeton;
      }
      demarrerApplicationAuthentifiee_(
        resultat.sessionUtilisateur,
        diagnosticConnexion
      );
    })
    .withFailureHandler(function (erreur) {
      if (diagnosticConnexion) {
        diagnosticConnexion.client.googleScriptRunMs =
          maintenantDiagnosticConnexionClient_() -
          diagnosticConnexion.debutAppelServeur;
        finaliserDiagnosticConnexionClient_(
          diagnosticConnexion,
          false
        );
      }
      motDePasse = '';
      bouton.disabled = false;
      bouton.textContent = 'Se connecter';
      if (zoneErreur) {
        zoneErreur.textContent = extraireMessageErreur(erreur);
        zoneErreur.classList.remove('masque');
      }
    });

  if (diagnosticConnexion) {
    diagnosticConnexion.debutAppelServeur =
      maintenantDiagnosticConnexionClient_();
    appelServeur.connecterFormateur(
      identifiant,
      motDePasse,
      {
        actif: true,
        modeClientExplicite: true,
        jetonAdministrateur:
          obtenirJetonAdministrateurApplication()
      }
    );
  } else {
    appelServeur.connecterFormateur(identifiant, motDePasse);
  }
  motDePasse = '';
}


function soumettrePremiereConnexionFormateur(evenement) {
  evenement.preventDefault();
  const nouveauChamp = document.getElementById(
    'nouveauMotDePassePremiereConnexion'
  );
  const confirmationChamp = document.getElementById(
    'confirmationMotDePassePremiereConnexion'
  );
  const bouton = document.getElementById(
    'boutonPremiereConnexionFormateur'
  );
  const zoneErreur = document.getElementById(
    'erreurPremiereConnexionFormateur'
  );
  let nouveau = String(nouveauChamp?.value || '');
  let confirmation = String(confirmationChamp?.value || '');
  if (nouveauChamp) nouveauChamp.value = '';
  if (confirmationChamp) confirmationChamp.value = '';
  masquerMotDePasseInterface_('nouveauMotDePassePremiereConnexion');
  masquerMotDePasseInterface_('confirmationMotDePassePremiereConnexion');
  zoneErreur?.classList.add('masque');
  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      nouveau = '';
      confirmation = '';
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer et continuer';
      enregistrerJetonFormateurApplication(resultat.jeton);
      demarrerApplicationAuthentifiee_(resultat.sessionUtilisateur);
    })
    .withFailureHandler(function (erreur) {
      nouveau = '';
      confirmation = '';
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer et continuer';
      zoneErreur.textContent = extraireMessageErreur(erreur);
      zoneErreur.classList.remove('masque');
    })
    .terminerPremiereConnexionFormateur(
      etatApplication.jetonChangementMotDePasseFormateur,
      nouveau,
      confirmation
    );
  nouveau = '';
  confirmation = '';
}

function chargerPage(nomPage) {
  if (
    ['Referentiel', 'Indemnisation', 'Administration']
      .includes(nomPage) &&
    !estAdministrateurApplication()
  ) {
    afficherToast(
      'Accès réservé à l’administrateur.',
      true
    );
    return;
  }

  afficherLoader();

  google.script.run
    .withSuccessHandler(function (html) {
      document.getElementById('contenu').innerHTML = html;

      etatApplication.pageActive = nomPage;

      appliquerDroitsInterface();
      activerBoutonMenu(nomPage);
      fermerMenuMobile();
      masquerLoader();
      initialiserPageActive(nomPage);
      preparerErgonomieResponsivePage_(
        document.getElementById('contenu')
      );
    })
    .withFailureHandler(function (erreur) {
      if (
        nomPage === 'Accueil' &&
        etatApplication.diagnosticConnexionEnCours
      ) {
        finaliserDiagnosticConnexionClient_(
          etatApplication.diagnosticConnexionEnCours,
          false
        );
      }
      gererErreurServeur(erreur);
    })
    .getPage(
      nomPage,
      obtenirJetonUtilisateurApplication()
    );
}

function initialiserPageActive(nomPage) {
  if (nomPage === 'Accueil') {
    initialiserPageAccueil();
  }

  if (nomPage === 'Stagiaires') {
    initialiserPageStagiaires();
  }

  if (nomPage === 'Formateurs') {
    initialiserPageFormateurs();
  }

  if (nomPage === 'Sessions') {
    initialiserPageSessions();
  }

  if (nomPage === 'Calendrier') {
    initialiserPageCalendrier();
  }

  if (nomPage === 'Statistiques') {
    initialiserPageStatistiques();
  }

  if (nomPage === 'AssistantPedagogique') {
    initialiserPageAssistantPedagogique();
  }

  if (nomPage === 'Referentiel') {
    initialiserPageReferentiel();
  }

  if (nomPage === 'Indemnisation') {
    initialiserPageIndemnisations();
  }

  if (nomPage === 'Administration') {
    initialiserPageAdministration();
  }
}

function estAdministrateurApplication() {
  return Boolean(
    etatApplication.sessionUtilisateur &&
    etatApplication.sessionUtilisateur.estAdministrateur
  );
}

function estFormateurAuthentifieApplication() {
  return Boolean(
    etatApplication.sessionUtilisateur &&
    etatApplication.sessionUtilisateur.estFormateur
  );
}

function appliquerDroitsInterface() {
  const administrateur = estAdministrateurApplication();

  document
    .querySelectorAll('[data-admin-only="true"]')
    .forEach(function (element) {
      element.classList.toggle('masque', !administrateur);
    });

  const boutonAcces = document.getElementById(
    'boutonAccesAdministrateur'
  );
  const boutonVerrouiller = document.getElementById(
    'boutonVerrouillerAdministration'
  );

  boutonAcces?.classList.toggle('masque', administrateur);
  boutonVerrouiller?.classList.toggle('masque', !administrateur);

  document
    .querySelectorAll('[data-formateur-only="true"]')
    .forEach(function (element) {
      element.classList.toggle(
        'masque',
        !estFormateurAuthentifieApplication()
      );
    });

  const identite = document.getElementById(
    'identiteUtilisateurApplication'
  );

  if (identite) {
    const session = etatApplication.sessionUtilisateur || {};

    identite.textContent = administrateur && session.estFormateur
      ? (session.nomComplet || session.identifiant) +
        ' — Formateur + Administrateur'
      : (
        administrateur
          ? 'Administrateur — accès direct'
          : (
            session.estFormateur
              ? (session.nomComplet || session.identifiant) + ' — Formateur'
              : ''
          )
      );

    const identiteMenuMobile = document.getElementById(
      'identiteUtilisateurMenuMobile'
    );

    if (identiteMenuMobile) {
      identiteMenuMobile.textContent = identite.textContent;
    }

  }

  const origineFavoris = document.getElementById(
    'origineFavorisUtilisateur'
  );
  if (origineFavoris) {
    origineFavoris.textContent = estFormateurAuthentifieApplication()
      ? 'Synchronisés avec votre compte formateur'
      : 'Liés à ce navigateur administrateur';
  }

  if (etatApplication.favoris) {
    afficherPanneauFavoris_();
    synchroniserBoutonsFavoris_();
  }
}

function obtenirJetonUtilisateurApplication() {
  return obtenirJetonAdministrateurApplication() ||
    obtenirJetonFormateurApplication();
}

function obtenirJetonFormateurApplication() {
  try {
    return sessionStorage.getItem(CLE_JETON_FORMATEUR) || '';
  } catch (erreur) {
    return '';
  }
}

function enregistrerJetonFormateurApplication(jeton) {
  try {
    sessionStorage.setItem(CLE_JETON_FORMATEUR, String(jeton || ''));
  } catch (erreur) {
    throw new Error(
      'Le navigateur refuse le stockage temporaire de la session formateur.'
    );
  }
}

function retirerJetonFormateurApplication() {
  try {
    sessionStorage.removeItem(CLE_JETON_FORMATEUR);
  } catch (erreur) {
    console.error(erreur);
  }
}

function peutGererSessionsApplication() {
  return Boolean(
    etatApplication.sessionUtilisateur &&
    etatApplication.sessionUtilisateur.droits &&
    etatApplication.sessionUtilisateur.droits.gererSessions
  );
}

function obtenirJetonAdministrateurApplication() {
  try {
    return sessionStorage.getItem(
      CLE_JETON_ADMINISTRATION
    ) || '';
  } catch (erreur) {
    return '';
  }
}

function enregistrerJetonAdministrateurApplication(jeton) {
  try {
    sessionStorage.setItem(
      CLE_JETON_ADMINISTRATION,
      String(jeton || '')
    );
  } catch (erreur) {
    throw new Error(
      'Le navigateur refuse le stockage temporaire de la session administrateur.'
    );
  }
}

function retirerJetonAdministrateurApplication() {
  try {
    sessionStorage.removeItem(CLE_JETON_ADMINISTRATION);
  } catch (erreur) {
    console.error(erreur);
  }
}

function ouvrirModalAccesAdministrateur() {
  const modal = document.getElementById(
    'modalAccesAdministrateur'
  );
  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );

  if (!modal || !champ) {
    return;
  }

  champ.value = '';
  masquerMotDePasseInterface_('motDePasseAdministrateur');
  modal.classList.remove('masque');
  document.body.classList.add('modal-ouverte');
  window.setTimeout(function () {
    champ.focus();
  }, 50);
}

function fermerModalAccesAdministrateur() {
  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );

  if (champ) {
    champ.value = '';
  }
  masquerMotDePasseInterface_('motDePasseAdministrateur');

  document.getElementById(
    'modalAccesAdministrateur'
  )?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
}

function soumettreAccesAdministrateur(evenement) {
  evenement.preventDefault();

  const champ = document.getElementById(
    'motDePasseAdministrateur'
  );
  const bouton = document.getElementById(
    'boutonValiderAccesAdministrateur'
  );
  let motDePasse = champ ? champ.value : '';

  if (champ) {
    champ.value = '';
  }
  masquerMotDePasseInterface_('motDePasseAdministrateur');

  bouton.disabled = true;
  bouton.textContent = 'Vérification…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Déverrouiller';

      try {
        enregistrerJetonAdministrateurApplication(
          resultat.jeton
        );
      } catch (erreur) {
        afficherToast(extraireMessageErreur(erreur), true);
        return;
      }

      etatApplication.sessionUtilisateur =
        resultat.sessionUtilisateur;
      etatApplication.derniereActiviteAdministration = Date.now();
      fermerModalAccesAdministrateur();
      demarrerApplicationAuthentifiee_(resultat.sessionUtilisateur);
      afficherToast('Administration déverrouillée.', false);
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent = 'Déverrouiller';
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .deverrouillerAdministration(
      motDePasse,
      obtenirJetonFormateurApplication()
    );

  motDePasse = '';
}

function verrouillerAdministrationInterface() {
  const jeton = obtenirJetonAdministrateurApplication();

  verrouillerAdministrationLocale();

  if (!jeton) {
    return;
  }

  google.script.run
    .withFailureHandler(function (erreur) {
      console.error(erreur);
    })
    .verrouillerAdministration(jeton);
}

function verrouillerAdministrationLocale() {
  retirerJetonAdministrateurApplication();
  etatApplication.derniereActiviteAdministration = 0;
  fermerModalAccesAdministrateur();
  const jetonFormateur = obtenirJetonFormateurApplication();
  if (!jetonFormateur) {
    afficherEcranConnexionFormateur_();
    return;
  }
  google.script.run
    .withSuccessHandler(function (sessionUtilisateur) {
      if (sessionUtilisateur && sessionUtilisateur.estFormateur) {
        demarrerApplicationAuthentifiee_(sessionUtilisateur);
      } else {
        afficherEcranConnexionFormateur_();
      }
    })
    .withFailureHandler(afficherEcranConnexionFormateur_)
    .getSessionUtilisateur(jetonFormateur);
}


function deconnecterFormateurInterface() {
  const jeton = obtenirJetonFormateurApplication();
  const jetonAdministrateur = obtenirJetonAdministrateurApplication();
  retirerJetonFormateurApplication();
  retirerJetonAdministrateurApplication();
  afficherEcranConnexionFormateur_();
  if (jeton) {
    google.script.run
      .withFailureHandler(function () {})
      .deconnecterFormateur(jeton, jetonAdministrateur);
  } else if (jetonAdministrateur) {
    google.script.run
      .withFailureHandler(function () {})
      .verrouillerAdministration(jetonAdministrateur);
  }
}


function ouvrirModalMotDePasseFormateur() {
  if (!estFormateurAuthentifieApplication()) return;
  [
    'motDePasseActuelFormateur',
    'nouveauMotDePasseFormateur',
    'confirmationNouveauMotDePasseFormateur'
  ].forEach(function (id) {
    const champ = document.getElementById(id);
    if (champ) champ.value = '';
  });
  document.getElementById('modalMotDePasseFormateur')
    ?.classList.remove('masque');
  document.body.classList.add('modal-ouverte');
  window.setTimeout(function () {
    document.getElementById('motDePasseActuelFormateur')?.focus();
  }, 50);
}


function fermerModalMotDePasseFormateur() {
  [
    'motDePasseActuelFormateur',
    'nouveauMotDePasseFormateur',
    'confirmationNouveauMotDePasseFormateur'
  ].forEach(function (id) {
    const champ = document.getElementById(id);
    if (champ) champ.value = '';
    masquerMotDePasseInterface_(id);
  });
  document.getElementById('modalMotDePasseFormateur')
    ?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
}


function soumettreChangementMotDePasseFormateur(evenement) {
  evenement.preventDefault();
  const bouton = document.getElementById(
    'boutonChangerMotDePasseFormateur'
  );
  let actuel = document.getElementById(
    'motDePasseActuelFormateur'
  ).value;
  let nouveau = document.getElementById(
    'nouveauMotDePasseFormateur'
  ).value;
  let confirmation = document.getElementById(
    'confirmationNouveauMotDePasseFormateur'
  ).value;
  bouton.disabled = true;
  bouton.textContent = 'Modification…';
  document.getElementById('motDePasseActuelFormateur').value = '';
  document.getElementById('nouveauMotDePasseFormateur').value = '';
  document.getElementById(
    'confirmationNouveauMotDePasseFormateur'
  ).value = '';
  [
    'motDePasseActuelFormateur',
    'nouveauMotDePasseFormateur',
    'confirmationNouveauMotDePasseFormateur'
  ].forEach(masquerMotDePasseInterface_);

  google.script.run
    .withSuccessHandler(function (resultat) {
      actuel = '';
      nouveau = '';
      confirmation = '';
      bouton.disabled = false;
      bouton.textContent = 'Modifier';
      enregistrerJetonFormateurApplication(resultat.jeton);
      fermerModalMotDePasseFormateur();
      etatApplication.sessionUtilisateur = resultat.sessionUtilisateur;
      appliquerDroitsInterface();
      afficherToast('Mot de passe modifié.', false);
    })
    .withFailureHandler(function (erreur) {
      actuel = '';
      nouveau = '';
      confirmation = '';
      bouton.disabled = false;
      bouton.textContent = 'Modifier';
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .changerMotDePasseFormateur(
      obtenirJetonFormateurApplication(),
      actuel,
      nouveau,
      confirmation
    );
  actuel = '';
  nouveau = '';
  confirmation = '';
}

function rafraichirInterfaceApresChangementDroits() {
  appliquerDroitsInterface();

  if (
    !estAdministrateurApplication() &&
    ['Referentiel', 'Indemnisation', 'Administration'].includes(
      etatApplication.pageActive
    )
  ) {
    chargerPage('Accueil');
    return;
  }

  if (etatApplication.pageActive === 'Stagiaires') {
    afficherListeStagiaires();
  }

  if (etatApplication.pageActive === 'Formateurs') {
    rechargerFormateurs();
  }

  if (etatApplication.pageActive === 'Accueil') {
    initialiserPageAccueil();
  }
}

function noterActiviteAdministration() {
  if (estAdministrateurApplication()) {
    etatApplication.derniereActiviteAdministration = Date.now();
  }
}

function demarrerSurveillanceAdministration() {
  window.clearInterval(etatApplication.minuterieAdministration);

  etatApplication.minuterieAdministration = window.setInterval(
    verifierActiviteAdministration,
    INTERVALLE_RENOUVELLEMENT_ADMINISTRATION_MS
  );
}

function verifierActiviteAdministration() {
  if (!estAdministrateurApplication()) {
    return;
  }

  const derniereActivite = Number(
    etatApplication.derniereActiviteAdministration || 0
  );

  if (
    !derniereActivite ||
    Date.now() - derniereActivite >=
      DUREE_INACTIVITE_ADMINISTRATION_MS
  ) {
    verrouillerAdministrationInterface();
    afficherToast(
      'Administration verrouillée après 30 minutes d’inactivité.',
      false
    );
    return;
  }

  if (etatApplication.renouvellementAdministrationEnCours) {
    return;
  }

  etatApplication.renouvellementAdministrationEnCours = true;

  google.script.run
    .withSuccessHandler(function (sessionUtilisateur) {
      etatApplication.renouvellementAdministrationEnCours = false;
      etatApplication.sessionUtilisateur = sessionUtilisateur;
      appliquerDroitsInterface();
    })
    .withFailureHandler(function () {
      etatApplication.renouvellementAdministrationEnCours = false;
      verrouillerAdministrationLocale();
      afficherToast(
        'La session administrateur a expiré.',
        true
      );
    })
    .renouvelerSessionAdministration(
      obtenirJetonAdministrateurApplication()
    );
}

function activerBoutonMenu(nomPage) {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.classList.toggle(
        'actif',
        bouton.dataset.page === nomPage
      );

}

function afficherLoader() {
  document
    .getElementById('loader')
    .classList
    .remove('masque');
}

function masquerLoader() {
  document
    .getElementById('loader')
    .classList
    .add('masque');
}

function afficherToast(message, erreur) {
  const toast = document.getElementById('toast');

  toast.textContent = message;
  toast.classList.toggle('erreur', Boolean(erreur));
  toast.classList.add('visible');

  window.clearTimeout(afficherToast.timer);

  afficherToast.timer = window.setTimeout(function () {
    toast.classList.remove('visible');
  }, 3500);
}

function extraireMessageErreur(erreur) {
  if (!erreur) {
    return 'Une erreur inconnue est survenue.';
  }

  const message = erreur.message || String(erreur);

  if (
    estAdministrateurApplication() &&
    message.includes('Accès réservé à l’administrateur.')
  ) {
    verrouillerAdministrationLocale();
  }

  if (message.includes('Authentification requise.')) {
    if (estAdministrateurApplication()) {
      verrouillerAdministrationLocale();
    } else {
      afficherEcranConnexionFormateur_();
    }
  }

  return message;
}

function gererErreurServeur(erreur) {
  masquerLoader();

  afficherToast(
    extraireMessageErreur(erreur),
    true
  );
}

function basculerMenu() {

  const bouton = document.getElementById('boutonMenuMobile');
  const voile = document.getElementById('voileMenuMobile');

function preparerErgonomieResponsivePage_(racine) {
  const contexte = racine || document;

  contexte.querySelectorAll('.tableau-responsive').forEach(
    function (conteneur) {
      if (!conteneur.hasAttribute('tabindex')) {
        conteneur.setAttribute('tabindex', '0');
      }
      if (!conteneur.hasAttribute('role')) {
        conteneur.setAttribute('role', 'region');
      }
      if (!conteneur.hasAttribute('aria-label')) {
        conteneur.setAttribute(
          'aria-label',
          'Tableau défilant horizontalement'
        );
      }
    }
  );
}

/* =====================================================
   FAVORIS
===================================================== */

function obtenirEtatFavoris_() {
  if (!etatApplication.favoris) {
    etatApplication.favoris = {
      utilisateurCle: '',
      charges: false,
      chargement: false,
      liste: [],
      parCle: {},
      mutations: {},
      rechargementRestaurationEffectue: false
    };
  }
  return etatApplication.favoris;
}


function initialiserFavorisInterface_() {
  const etat = obtenirEtatFavoris_();
  etat.utilisateurCle = obtenirOuCreerCleUtilisateurFavoris_();
  chargerFavorisUtilisateur_(false);
}


function obtenirOuCreerCleUtilisateurFavoris_() {
  let cleExistante = '';
  try {
    cleExistante = String(
      window.localStorage.getItem(CLE_UTILISATEUR_FAVORIS) || ''
    ).trim();
  } catch (erreurLecture) {
    cleExistante = '';
  }

  if (/^pfav_[a-z0-9._:-]{15,115}$/i.test(cleExistante)) {
    return cleExistante;
  }

  const cryptoNavigateur = window.crypto || {};
  let partieAleatoire = '';
  if (typeof cryptoNavigateur.randomUUID === 'function') {
    partieAleatoire = cryptoNavigateur.randomUUID();
  } else if (typeof cryptoNavigateur.getRandomValues === 'function') {
    const octets = new Uint32Array(4);
    cryptoNavigateur.getRandomValues(octets);
    partieAleatoire = Array.from(octets).map(function (valeur) {
      return valeur.toString(36);
    }).join('-');
  } else {
    partieAleatoire = Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2) + '-' +
      Math.random().toString(36).slice(2);
  }

  const nouvelleCle = 'pfav_' + partieAleatoire;
  try {
    window.localStorage.setItem(
      CLE_UTILISATEUR_FAVORIS,
      nouvelleCle
    );
  } catch (erreurEcriture) {
    // Le favori reste utilisable pour la durée de cette page.
  }
  return nouvelleCle;
}


function chargerFavorisUtilisateur_(forcer) {
  const etat = obtenirEtatFavoris_();
  if (etat.chargement || (etat.charges && !forcer)) {
    return;
  }

  etat.chargement = true;
  afficherPanneauFavoris_();

  google.script.run
    .withSuccessHandler(function (favoris) {
      etat.chargement = false;
      etat.charges = true;
      remplacerFavorisClient_(favoris);
    })
    .withFailureHandler(function (erreur) {
      etat.chargement = false;
      etat.charges = false;
      afficherPanneauFavoris_(
        'Favoris indisponibles : ' + extraireMessageErreur(erreur),
        true
      );
    })
    .getFavoris(
      etat.utilisateurCle,
      obtenirJetonUtilisateurApplication()
    );
}


function remplacerFavorisClient_(favoris) {
  const etat = obtenirEtatFavoris_();
  etat.liste = Array.isArray(favoris) ? favoris.slice() : [];
  etat.parCle = {};
  etat.liste.forEach(function (favori) {
    etat.parCle[creerCleFavoriClient_(
      favori.type,
      favori.identifiant
    )] = favori;
  });
  trierFavorisClient_();
  synchroniserInterfaceFavoris_();
}


function definirFavoriClient_(cle, favori) {
  const etat = obtenirEtatFavoris_();
  etat.liste = etat.liste.filter(function (element) {
    return creerCleFavoriClient_(
      element.type,
      element.identifiant
    ) !== cle;
  });
  delete etat.parCle[cle];

  if (favori) {
    etat.liste.push(favori);
    etat.parCle[cle] = favori;
  }
  trierFavorisClient_();
}


function trierFavorisClient_() {
  obtenirEtatFavoris_().liste.sort(function (a, b) {
    return String(b.dateCreation || '').localeCompare(
      String(a.dateCreation || '')
    ) || String(a.cleResultat || '').localeCompare(
      String(b.cleResultat || '')
    );
  });
}


function creerCleFavoriClient_(type, identifiant) {
  return String(type || '').trim().toUpperCase() + ':' +
    String(identifiant || '').trim();
}


function estFavoriClient_(type, identifiant) {
  return Boolean(obtenirEtatFavoris_().parCle[
    creerCleFavoriClient_(type, identifiant)
  ]);
}


function creerBoutonFavori_(type, identifiant, classeSupplementaire) {
  const typeNormalise = String(type || '').trim().toUpperCase();
  if (![
    'STAGIAIRE', 'FORMATEUR', 'SESSION', 'FORMATION', 'ITEM'
  ].includes(typeNormalise)) {
    return '';
  }

  const id = String(identifiant || '').trim();
  if (!id) {
    return '';
  }
  const etat = obtenirEtatFavoris_();
  const cle = creerCleFavoriClient_(typeNormalise, id);
  const actif = Boolean(etat.parCle[cle]);
  const desactive = !etat.charges || Boolean(etat.mutations[cle]);
  const libelle = actif ? 'Retirer des favoris' : 'Ajouter aux favoris';

  return `
    <button
      type="button"
      class="bouton-favori ${classeSupplementaire || ''} ${actif ? 'est-favori' : ''}"
      data-favori-cle="${echapperHtml(cle)}"
      data-favori-type="${echapperHtml(typeNormalise)}"
      data-favori-identifiant="${echapperHtml(id)}"
      aria-label="${libelle}"
      aria-pressed="${actif ? 'true' : 'false'}"
      title="${libelle}"
      onclick="basculerFavoriDepuisBouton(event, this)"
      ${desactive ? 'disabled' : ''}
    >${actif ? '★' : '☆'}</button>
  `;
}


function basculerFavoriDepuisBouton(evenement, bouton) {
  evenement?.preventDefault();
  evenement?.stopPropagation();

  const etat = obtenirEtatFavoris_();
  if (!etat.charges) {
    afficherToast('Les favoris sont encore en cours de chargement.', true);
    return;
  }

  const type = String(bouton?.dataset.favoriType || '').trim();
  const identifiant = String(
    bouton?.dataset.favoriIdentifiant || ''
  ).trim();
  const cle = creerCleFavoriClient_(type, identifiant);
  if (!type || !identifiant || etat.mutations[cle]) {
    return;
  }

  const favoriAvant = etat.parCle[cle] || null;
  const favoriTemporaire = favoriAvant ||
    construireFavoriTemporaireClient_(type, identifiant);
  etat.mutations[cle] = true;
  definirFavoriClient_(cle, favoriAvant ? null : favoriTemporaire);
  synchroniserInterfaceFavoris_();

  const succes = function (favoriServeur) {
    delete etat.mutations[cle];
    definirFavoriClient_(
      cle,
      favoriAvant ? null : favoriServeur
    );
    synchroniserInterfaceFavoris_();
  };
  const echec = function (erreur) {
    delete etat.mutations[cle];
    definirFavoriClient_(cle, favoriAvant);
    synchroniserInterfaceFavoris_();
    afficherToast(extraireMessageErreur(erreur), true);
  };
  const appel = google.script.run
    .withSuccessHandler(succes)
    .withFailureHandler(echec);

  if (favoriAvant) {
    appel.supprimerFavori(
      type,
      identifiant,
      etat.utilisateurCle,
      obtenirJetonUtilisateurApplication()
    );
  } else {
    appel.ajouterFavori(
      type,
      identifiant,
      etat.utilisateurCle,
      obtenirJetonUtilisateurApplication()
    );
  }
}


function construireFavoriTemporaireClient_(type, identifiant) {
  const resultatRecherche = ((obtenirEtatRechercheGlobale_().resultat || {})
    .groupes || []).reduce(function (trouve, groupe) {
      return trouve || (groupe.resultats || []).find(function (resultat) {
        return creerCleFavoriClient_(
          resultat.type,
          resultat.id || resultat.uuid || resultat.idSession ||
            resultat.idFormateur || resultat.idFormation ||
            resultat.idItem
        ) === creerCleFavoriClient_(type, identifiant);
      });
    }, null);
  let libelle = identifiant;
  let sousLibelle = '';

  if (resultatRecherche) {
    libelle = resultatRecherche.item || resultatRecherche.libelle ||
      [resultatRecherche.nom, resultatRecherche.prenom]
        .filter(Boolean).join(' ') ||
      (type === 'SESSION'
        ? 'Séance du ' + afficherDateFrancaise(resultatRecherche.date)
        : identifiant);
    sousLibelle = resultatRecherche.categorie ||
      resultatRecherche.formation || '';
  }

  return {
    idFavori: 'temporaire:' + creerCleFavoriClient_(type, identifiant),
    type: type,
    identifiant: identifiant,
    cleResultat: creerCleFavoriClient_(type, identifiant),
    libelle: libelle,
    sousLibelle: sousLibelle,
    disponible: true,
    actif: true,
    dateCreation: new Date().toISOString(),
    temporaire: true
  };
}


function synchroniserInterfaceFavoris_() {
  synchroniserBoutonsFavoris_();
  afficherPanneauFavoris_();
  const compteur = document.getElementById('compteurFavorisTopbar');
  if (compteur) {
    const nombre = obtenirEtatFavoris_().liste.length;
    compteur.textContent = String(nombre);
    compteur.classList.toggle('masque', nombre === 0);
  }
}


function synchroniserBoutonsFavoris_() {
  const etat = obtenirEtatFavoris_();
  document.querySelectorAll('[data-favori-cle]').forEach(function (bouton) {
    const cle = bouton.dataset.favoriCle;
    const actif = Boolean(etat.parCle[cle]);
    const mutation = Boolean(etat.mutations[cle]);
    const libelle = actif ? 'Retirer des favoris' : 'Ajouter aux favoris';
    bouton.classList.toggle('est-favori', actif);
    bouton.textContent = actif ? '★' : '☆';
    bouton.setAttribute('aria-pressed', actif ? 'true' : 'false');
    bouton.setAttribute('aria-label', libelle);
    bouton.title = libelle;
    bouton.disabled = !etat.charges || mutation;
  });
}


function basculerPanneauFavoris() {
  const panneau = document.getElementById('panneauFavoris');
  if (!panneau) {
    return;
  }
  if (panneau.classList.contains('masque')) {
    afficherPanneauFavoris_();
    panneau.classList.remove('masque');
    document.getElementById('boutonOuvrirFavoris')
      ?.setAttribute('aria-expanded', 'true');
    return;
  }
  fermerPanneauFavoris();
}


function fermerPanneauFavoris() {
  document.getElementById('panneauFavoris')?.classList.add('masque');
  document.getElementById('boutonOuvrirFavoris')
    ?.setAttribute('aria-expanded', 'false');
}


function gererClicExterieurFavoris(evenement) {
  const conteneur = document.getElementById('conteneurFavoris');
  if (conteneur && !conteneur.contains(evenement.target)) {
    fermerPanneauFavoris();
  }
}


function afficherPanneauFavoris_(message, erreur) {
  const zone = document.getElementById('contenuFavoris');
  const etat = obtenirEtatFavoris_();
  if (!zone) {
    return;
  }

  if (message) {
    zone.innerHTML = `<div class="etat-favoris ${erreur ? 'erreur' : ''}">${echapperHtml(message)}</div>`;
    return;
  }
  if (etat.chargement && !etat.charges) {
    zone.innerHTML = '<div class="etat-favoris">Chargement des favoris…</div>';
    return;
  }
  const actionImport = estFormateurAuthentifieApplication()
    ? `
      <div class="import-favoris-locaux">
        <button
          type="button"
          class="bouton-lien"
          onclick="importerFavorisLocauxFormateurInterface_()"
        >Importer les favoris de cet appareil</button>
        <small>Import volontaire, sans supprimer les favoris locaux.</small>
      </div>
    `
    : '';
  if (!etat.liste.length) {
    zone.innerHTML =
      '<div class="etat-favoris">Aucun favori pour le moment</div>' +
      actionImport;
    return;
  }

  const groupes = [
    ['STAGIAIRE', 'Stagiaires', '👨‍🚒'],
    ['SESSION', 'Séances', '📅'],
    ['FORMATEUR', 'Formateurs', '👨‍🏫'],
    ['FORMATION', 'Formations', '🎓'],
    ['ITEM', 'Items pédagogiques', '📚']
  ];
  zone.innerHTML = groupes.map(function (configuration) {
    const favoris = etat.liste.filter(function (favori) {
      return favori.type === configuration[0];
    });
    if (!favoris.length) {
      return '';
    }
    return `
      <section class="groupe-favoris">
        <h3><span aria-hidden="true">${configuration[2]}</span>${configuration[1]}</h3>
        <div>${favoris.map(creerLignePanneauFavori_).join('')}</div>
      </section>
    `;
  }).join('') + actionImport;
}


function importerFavorisLocauxFormateurInterface_() {
  if (!estFormateurAuthentifieApplication()) {
    afficherToast('Cette importation est réservée au formateur connecté.', true);
    return;
  }
  const etat = obtenirEtatFavoris_();
  const cleLocale = String(etat.utilisateurCle || '').trim();
  if (!cleLocale) {
    afficherToast('Aucune clé locale de favoris n’est disponible.', true);
    return;
  }
  google.script.run
    .withSuccessHandler(function (resultat) {
      const nombre = Number(resultat?.importes || 0);
      afficherToast(
        nombre
          ? nombre + ' favori(s) importé(s).'
          : 'Aucun nouveau favori local à importer.',
        false
      );
      chargerFavorisUtilisateur_(true);
    })
    .withFailureHandler(function (erreur) {
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .importerFavorisLocauxFormateur(
      cleLocale,
      obtenirJetonUtilisateurApplication()
    );
}


function creerLignePanneauFavori_(favori) {
  const restriction = favori.type === 'ITEM' &&
    !estAdministrateurApplication();
  const ouvrable = favori.disponible && !restriction && !favori.temporaire;
  const badge = !favori.disponible
    ? '<span class="badge-favori badge-favori-indisponible">Indisponible</span>'
    : (!favori.actif
      ? '<span class="badge-favori">Inactif</span>'
      : (restriction
        ? '<span class="badge-favori">Lecture seule</span>'
        : ''));

  return `
    <div class="ligne-panneau-favori ${favori.disponible ? '' : 'favori-indisponible'}">
      <button
        type="button"
        class="ouvrir-favori"
        data-id-favori="${echapperHtml(favori.idFavori)}"
        onclick="ouvrirFavoriDepuisPanneau(this.dataset.idFavori)"
        ${ouvrable ? '' : 'disabled'}
      >
        <strong>${echapperHtml(favori.libelle)}</strong>
        <small>${echapperHtml(favori.sousLibelle || '')}</small>
        ${badge}
      </button>
      <button
        type="button"
        class="retirer-favori"
        data-favori-type="${echapperHtml(favori.type)}"
        data-favori-identifiant="${echapperHtml(favori.identifiant)}"
        onclick="basculerFavoriDepuisBouton(event, this)"
        aria-label="Retirer ${echapperHtml(favori.libelle)} des favoris"
        title="Retirer des favoris"
      >×</button>
    </div>
  `;
}


function ouvrirFavoriDepuisPanneau(idFavori) {
  const favori = obtenirEtatFavoris_().liste.find(function (element) {
    return element.idFavori === idFavori;
  });
  if (!favori || !favori.disponible) {
    afficherToast('Ce favori est indisponible.', true);
    return;
  }
  if (favori.type === 'ITEM' && !estAdministrateurApplication()) {
    afficherToast(
      'La gestion du Référentiel est réservée à l’administrateur.',
      true
    );
    return;
  }
  fermerPanneauFavoris();
  ouvrirObjetApplication_(favori.type, favori.identifiant, {
    formation: favori.formation,
    libelle: favori.libelle
  });
}


function rechargerFavorisApresRestauration_() {
  const etat = obtenirEtatFavoris_();
  if (etat.rechargementRestaurationEffectue) {
    return;
  }
  etat.rechargementRestaurationEffectue = true;
  chargerFavorisUtilisateur_(true);
}

/* =====================================================
   RECHERCHE GLOBALE
===================================================== */

function obtenirEtatRechercheGlobale_() {
  if (!etatApplication.rechercheGlobale) {
    etatApplication.rechercheGlobale = {
      minuterie: null,
      generation: 0,
      resultat: null,
      resultatsNavigables: [],
      indexActif: -1,
      chargement: false,
      requete: ''
    };
  }
  return etatApplication.rechercheGlobale;
}


function programmerRechercheGlobale() {
  const champ = document.getElementById('champRechercheGlobale');
  const etat = obtenirEtatRechercheGlobale_();
  const texte = String(champ?.value || '');
  const requete = normaliserRechercheGlobaleClient_(texte);

  window.clearTimeout(etat.minuterie);
  etat.generation++;
  etat.requete = texte;
  etat.indexActif = -1;

  if (requete.length < 2) {
    etat.chargement = false;
    etat.resultatsNavigables = [];
    basculerChargementRechercheGlobale_(false);
    if (requete.length) {
      afficherMessageRechercheGlobale_(
        'Saisissez au moins 2 caractères.'
      );
      ouvrirPanneauRechercheGlobale_();
    } else {
      fermerPanneauRechercheGlobale_();
    }
    return;
  }

  ouvrirPanneauRechercheGlobale_();
  basculerChargementRechercheGlobale_(true);
  afficherMessageRechercheGlobale_('Recherche en cours…');
  const generationProgramme = etat.generation;
  etat.minuterie = window.setTimeout(function () {
    executerRechercheGlobale_(texte, generationProgramme);
  }, 250);
}


function executerRechercheGlobale_(texte, generationProgramme) {
  const etat = obtenirEtatRechercheGlobale_();
  if (generationProgramme !== etat.generation) {
    return;
  }

  etat.chargement = true;
  google.script.run
    .withSuccessHandler(function (resultat) {
      const etatActuel = obtenirEtatRechercheGlobale_();
      if (generationProgramme !== etatActuel.generation) {
        return;
      }
      etatActuel.chargement = false;
      etatActuel.resultat = resultat || {};
      basculerChargementRechercheGlobale_(false);
      afficherResultatsRechercheGlobale_(etatActuel.resultat);
    })
    .withFailureHandler(function (erreur) {
      const etatActuel = obtenirEtatRechercheGlobale_();
      if (generationProgramme !== etatActuel.generation) {
        return;
      }
      etatActuel.chargement = false;
      basculerChargementRechercheGlobale_(false);
      afficherMessageRechercheGlobale_(
        'Recherche indisponible : ' + extraireMessageErreur(erreur),
        true
      );
    })
    .rechercherGlobalement(
      texte,
      {},
      obtenirJetonUtilisateurApplication()
    );
}


function normaliserRechercheGlobaleClient_(valeur) {
  return String(valeur || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}


function afficherResultatsRechercheGlobale_(resultat) {
  const zone = document.getElementById('contenuRechercheGlobale');
  const etat = obtenirEtatRechercheGlobale_();
  const groupes = Array.isArray(resultat.groupes) ? resultat.groupes : [];

  if (!zone) {
    return;
  }

  etat.resultatsNavigables = [];
  etat.indexActif = -1;

  if (!Number(resultat.nombreResultats || 0)) {
    zone.innerHTML = `
      <div class="etat-recherche-globale">
        Aucun résultat pour « ${echapperHtml(resultat.requete || etat.requete)} »
      </div>
    `;
    ouvrirPanneauRechercheGlobale_();
    return;
  }

  zone.innerHTML = groupes.filter(function (groupe) {
    return Number(groupe.total || 0) > 0;
  }).map(function (groupe) {
    const resultats = Array.isArray(groupe.resultats)
      ? groupe.resultats
      : [];
    const lignes = resultats.map(function (resultatGroupe) {
      const accessible = resultatRechercheGlobaleAccessible_(resultatGroupe);
      const index = accessible ? etat.resultatsNavigables.length : -1;
      if (accessible) {
        etat.resultatsNavigables.push(resultatGroupe);
      }
      return creerLigneResultatRechercheGlobale_(
        resultatGroupe,
        index,
        accessible
      );
    }).join('');
    const supplement = Number(groupe.total) > resultats.length
      ? '<span>' + (Number(groupe.total) - resultats.length) +
        ' autre(s)</span>'
      : '';
    return `
      <section class="groupe-resultats-recherche-globale">
        <header>
          <strong>${echapperHtml(groupe.libelle)}</strong>
          <span>${echapperHtml(groupe.total)} résultat(s)</span>
          ${supplement}
        </header>
        <div>${lignes}</div>
      </section>
    `;
  }).join('');

  ouvrirPanneauRechercheGlobale_();
  chargerMiniaturesRechercheGlobale_();
}


function resultatRechercheGlobaleAccessible_(resultat) {
  if (
    ['CATEGORIE', 'ITEM'].includes(String(resultat.type || '')) &&
    !estAdministrateurApplication()
  ) {
    return false;
  }
  return true;
}


function creerLigneResultatRechercheGlobale_(resultat, index, accessible) {
  const contenu = creerContenuResultatRechercheGlobale_(resultat);
  const classe = 'resultat-recherche-globale' +
    (accessible ? '' : ' resultat-recherche-non-accessible');
  const identifiant = resultat.uuid || resultat.idSession ||
    resultat.idFormateur || resultat.idFormation || resultat.idItem || '';
  const boutonFavori = creerBoutonFavori_(
    resultat.type,
    identifiant,
    'bouton-favori-recherche'
  );

  if (!accessible) {
    return `
      <div class="${classe}" aria-disabled="true">
        ${contenu}
        ${boutonFavori}
        <span class="restriction-resultat-recherche">Consultation du Référentiel réservée à l’administrateur</span>
      </div>
    `;
  }

  return `
    <div
      id="resultatRechercheGlobale${index}"
      class="${classe}"
      data-index-recherche="${index}"
      role="option"
      aria-selected="false"
      onclick="ouvrirResultatRechercheGlobale(${index})"
    >${contenu}${boutonFavori}</div>
  `;
}


function creerContenuResultatRechercheGlobale_(resultat) {
  const type = String(resultat.type || '');

  if (type === 'STAGIAIRE') {
    const initiales =
      (resultat.prenom || '').charAt(0) + (resultat.nom || '').charAt(0);
    return `
      <span
        class="miniature-recherche-globale"
        data-photo-recherche-id="${echapperHtml(resultat.uuid)}"
        data-photo-disponible="${resultat.aUnePhoto ? 'true' : 'false'}"
      >${echapperHtml(initiales || 'ST')}</span>
      <span class="texte-resultat-recherche">
        <strong>${echapperHtml(resultat.nom)} ${echapperHtml(resultat.prenom)}</strong>
        <small>${echapperHtml(resultat.formation || 'Formation non renseignée')} · ${echapperHtml(resultat.statut || 'Statut inconnu')}</small>
      </span>
      <span class="type-resultat-recherche">Stagiaire</span>
    `;
  }

  if (type === 'FORMATEUR') {
    return `
      <span class="icone-type-recherche" aria-hidden="true">👨‍🏫</span>
      <span class="texte-resultat-recherche">
        <strong>${echapperHtml(resultat.nom)} ${echapperHtml(resultat.prenom)}</strong>
        <small>${resultat.actif ? 'Actif' : 'Inactif'}</small>
      </span>
      <span class="type-resultat-recherche">Formateur</span>
    `;
  }

  if (type === 'SESSION') {
    const participants = (resultat.participantsPrincipaux || []).join(', ');
    return `
      <span class="icone-type-recherche" aria-hidden="true">📅</span>
      <span class="texte-resultat-recherche">
        <strong>${echapperHtml(afficherDateFrancaise(resultat.date) || 'Date inconnue')} · ${echapperHtml(resultat.heureDebut || '—')}–${echapperHtml(resultat.heureFin || '—')}</strong>
        <small>${echapperHtml(resultat.formation || 'Formation non renseignée')}${participants ? ' · ' + echapperHtml(participants) : ''}</small>
      </span>
      <span class="type-resultat-recherche">Séance</span>
    `;
  }

  if (type === 'FORMATION') {
    return `
      <span class="icone-type-recherche" aria-hidden="true">🎓</span>
      <span class="texte-resultat-recherche">
        <strong>${echapperHtml(resultat.libelle)}</strong>
        <small>Formation</small>
      </span>
      <span class="type-resultat-recherche">Formation</span>
    `;
  }

  return `
    <span class="icone-type-recherche" aria-hidden="true">📚</span>
    <span class="texte-resultat-recherche">
      <strong>${echapperHtml(resultat.item || resultat.categorie)}</strong>
      <small>${echapperHtml(resultat.formation || 'Formation non renseignée')} · ${echapperHtml(resultat.categorie || 'Catégorie non renseignée')}</small>
    </span>
    <span class="type-resultat-recherche">${resultat.sousType === 'ITEM' ? 'Item' : 'Catégorie'}</span>
  `;
}


function chargerMiniaturesRechercheGlobale_() {
  const etat = obtenirEtatRechercheGlobale_();
  const generation = etat.generation;
  document.querySelectorAll(
    '.miniature-recherche-globale[data-photo-disponible="true"]'
  ).forEach(function (zone) {
    const uuid = zone.dataset.photoRechercheId;
    google.script.run
      .withSuccessHandler(function (photo) {
        if (
          generation !== obtenirEtatRechercheGlobale_().generation ||
          !photo || !photo.disponible
        ) {
          return;
        }
        const image = document.createElement('img');
        image.src = photo.dataUrl;
        image.alt = '';
        zone.innerHTML = '';
        zone.appendChild(image);
      })
      .withFailureHandler(function () {})
      .getPhotoStagiaire(
        uuid,
        obtenirJetonUtilisateurApplication()
      );
  });
}


function ouvrirResultatRechercheGlobale(index) {
  const etat = obtenirEtatRechercheGlobale_();
  const resultat = etat.resultatsNavigables[Number(index)];
  if (!resultat) {
    return;
  }

  fermerRechercheGlobale();
  ouvrirObjetApplication_(
    resultat.type,
    resultat.uuid || resultat.idSession || resultat.idFormateur ||
      resultat.idFormation || resultat.idItem || resultat.idCategorie ||
      resultat.id,
    {
      formation: resultat.formation,
      libelle: resultat.libelle
    }
  );
}


function ouvrirObjetApplication_(type, identifiant, contexte) {
  const typeNormalise = String(type || '').trim().toUpperCase();
  const id = String(identifiant || '').trim();
  const donnees = contexte || {};

  if (!id) {
    afficherToast('Élément introuvable.', true);
    return;
  }

  if (typeNormalise === 'STAGIAIRE') {
    etatApplication.stagiaireAConsulterDepuisAccueil = id;
    chargerPage('Stagiaires');
    return;
  }

  if (typeNormalise === 'SESSION') {
    consulterSession(id);
    return;
  }

  if (typeNormalise === 'FORMATEUR') {
    etatApplication.formateurDepuisRechercheGlobale = id;
    chargerPage('Formateurs');
    return;
  }

  if (typeNormalise === 'FORMATION') {
    etatApplication.formationStagiairesDepuisRechercheGlobale =
      donnees.libelle || donnees.formation || id;
    chargerPage('Stagiaires');
    return;
  }

  if (['ITEM', 'CATEGORIE'].includes(typeNormalise)) {
    if (!estAdministrateurApplication()) {
      afficherToast(
        'La gestion du Référentiel est réservée à l’administrateur.',
        true
      );
      return;
    }
    etatApplication.referentielFormationDepuisRechercheGlobale =
      donnees.formation || '';
    etatApplication.referentielItemASelectionner =
      typeNormalise === 'ITEM' ? id : '';
    chargerPage('Referentiel');
  }
}


function mettreEnEvidenceFormateurRechercheGlobale_() {
  const idFormateur = etatApplication.formateurDepuisRechercheGlobale;
  if (!idFormateur) {
    return;
  }
  etatApplication.formateurDepuisRechercheGlobale = '';
  const ligne = Array.from(document.querySelectorAll('[data-formateur-id]'))
    .find(function (element) {
      return element.dataset.formateurId === idFormateur;
    });
  if (!ligne) {
    return;
  }
  ligne.classList.add('resultat-recherche-surligne');
  ligne.scrollIntoView({ behavior: 'smooth', block: 'center' });
  window.setTimeout(function () {
    ligne.classList.remove('resultat-recherche-surligne');
  }, 2200);
}


function gererClavierRechercheGlobale(evenement) {
  const etat = obtenirEtatRechercheGlobale_();
  const nombre = etat.resultatsNavigables.length;

  if (evenement.key === 'Escape') {
    evenement.preventDefault();
    fermerRechercheGlobale();
    return;
  }

  if (!nombre) {
    return;
  }

  if (evenement.key === 'ArrowDown') {
    evenement.preventDefault();
    definirResultatActifRechercheGlobale_(
      etat.indexActif < nombre - 1 ? etat.indexActif + 1 : 0
    );
    return;
  }

  if (evenement.key === 'ArrowUp') {
    evenement.preventDefault();
    definirResultatActifRechercheGlobale_(
      etat.indexActif > 0 ? etat.indexActif - 1 : nombre - 1
    );
    return;
  }

  if (evenement.key === 'Enter') {
    evenement.preventDefault();
    ouvrirResultatRechercheGlobale(
      etat.indexActif >= 0 ? etat.indexActif : 0
    );
  }
}


function definirResultatActifRechercheGlobale_(index) {
  const etat = obtenirEtatRechercheGlobale_();
  etat.indexActif = index;
  document.querySelectorAll('[data-index-recherche]').forEach(
    function (element) {
      const actif = Number(element.dataset.indexRecherche) === index;
      element.classList.toggle('actif', actif);
      element.setAttribute('aria-selected', actif ? 'true' : 'false');
      if (actif) {
        element.scrollIntoView({ block: 'nearest' });
      }
    }
  );
}


function gererFocusRechercheGlobale() {
  const champ = document.getElementById('champRechercheGlobale');
  if (normaliserRechercheGlobaleClient_(champ?.value || '').length >= 2) {
    ouvrirPanneauRechercheGlobale_();
  }
}


function gererClicExterieurRechercheGlobale(evenement) {
  const conteneur = document.getElementById('conteneurRechercheGlobale');
  if (conteneur && !conteneur.contains(evenement.target)) {
    fermerPanneauRechercheGlobale_();
  }
}


function ouvrirRechercheGlobaleMobile() {
  const conteneur = document.getElementById('conteneurRechercheGlobale');
  conteneur?.classList.add('recherche-globale-mobile-ouverte');
  document.body.classList.add('recherche-globale-ouverte');
  ouvrirPanneauRechercheGlobale_();
  window.setTimeout(function () {
    document.getElementById('champRechercheGlobale')?.focus();
  }, 30);
}


function fermerRechercheGlobale() {
  fermerPanneauRechercheGlobale_();
  document.getElementById('conteneurRechercheGlobale')
    ?.classList.remove('recherche-globale-mobile-ouverte');
  document.body.classList.remove('recherche-globale-ouverte');
}


function ouvrirPanneauRechercheGlobale_() {
  document.getElementById('panneauRechercheGlobale')
    ?.classList.remove('masque');
  document.getElementById('champRechercheGlobale')
    ?.setAttribute('aria-expanded', 'true');
}


function fermerPanneauRechercheGlobale_() {
  document.getElementById('panneauRechercheGlobale')
    ?.classList.add('masque');
  document.getElementById('champRechercheGlobale')
    ?.setAttribute('aria-expanded', 'false');
}


function basculerChargementRechercheGlobale_(actif) {
  document.getElementById('chargementRechercheGlobale')
    ?.classList.toggle('masque', !actif);
}


function afficherMessageRechercheGlobale_(message, erreur) {
  const zone = document.getElementById('contenuRechercheGlobale');
  if (!zone) {
    return;
  }
  zone.innerHTML = `
    <div class="etat-recherche-globale ${erreur ? 'erreur' : ''}">
      ${echapperHtml(message)}
    </div>
  `;
}


/* =====================================================
   ACCUEIL
===================================================== */

function initialiserPageAccueil() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (donnees) {
      if (etatApplication.pageActive !== 'Accueil') {
        if (etatApplication.diagnosticConnexionEnCours) {
          finaliserDiagnosticConnexionClient_(
            etatApplication.diagnosticConnexionEnCours,
            false
          );
        }
        return;
      }

      etatApplication.donneesAccueil = donnees || {};
      const debutRenduDiagnostic =
        etatApplication.diagnosticConnexionEnCours
          ? maintenantDiagnosticConnexionClient_()
          : 0;
      afficherTableauBordAccueil(
        etatApplication.donneesAccueil
      );
      masquerLoader();
      if (etatApplication.diagnosticConnexionEnCours) {
        const diagnosticConnexion =
          etatApplication.diagnosticConnexionEnCours;
        const finRendu = maintenantDiagnosticConnexionClient_();
        diagnosticConnexion.client.chargementAccueilMs = Math.max(
          0,
          debutRenduDiagnostic -
            diagnosticConnexion.debutChargementAccueil
        );
        diagnosticConnexion.client.renduClientMs = Math.max(
          0,
          finRendu - debutRenduDiagnostic
        );
        diagnosticConnexion.client.totalJusquaInterfaceUtilisableMs =
          Math.max(0, finRendu - diagnosticConnexion.debutClic);
        finaliserDiagnosticConnexionClient_(
          diagnosticConnexion,
          true
        );
      }
    })
    .withFailureHandler(function (erreur) {
      if (etatApplication.pageActive === 'Accueil') {
        if (etatApplication.diagnosticConnexionEnCours) {
          finaliserDiagnosticConnexionClient_(
            etatApplication.diagnosticConnexionEnCours,
            false
          );
        }
        gererErreurServeur(erreur);
      }
    })
    .getDonneesTableauBordAccueil(
      obtenirJetonUtilisateurApplication()
    );
}

function afficherTableauBordAccueil(donnees) {
  const indicateurs = donnees.indicateurs || {};

  const valeurs = {
    indicateurStagiairesAccueil:
      Number(indicateurs.stagiairesAPreparer) || 0,
    indicateurSessionsMoisAccueil:
      Number(indicateurs.sessionsMois) || 0,
    indicateurHeuresMoisAccueil:
      formaterHeuresFormation(
        indicateurs.heuresFormateursMois
      ),
    indicateurPrestationsAccueil:
      Number(indicateurs.prestationsADemander) || 0,
    indicateurEnPreparationAccueil:
      Number(indicateurs.stagiairesEnPreparation) || 0,
    indicateurStagesAujourdhuiAccueil:
      Number(indicateurs.stagesAujourdhui) || 0,
    indicateurStagesPassesAccueil:
      Number(indicateurs.stagesPassesNonClotures) || 0
  };

  Object.keys(valeurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {

    Array.isArray(donnees.echeancesProches)

  );

  afficherAlertesPedagogiquesAccueil(

  );

  );

  );
}

function initialiserPageStagiaires() {
  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargement() {
    chargementsTermines++;

    if (
      chargementsTermines === 3 &&
      !erreurRencontree
    ) {
      remplirFiltresStagiaires();

      const formationRecherche =
        etatApplication.formationStagiairesDepuisRechercheGlobale;
      if (formationRecherche) {
        etatApplication.formationStagiairesDepuisRechercheGlobale = '';
        const filtreFormation = document.getElementById(
          'filtreFormationStagiaire'
        );
        if (filtreFormation) {
          filtreFormation.value = formationRecherche;
        }
      }
      afficherListeStagiaires();
      masquerLoader();

      const idStagiaire =
        etatApplication.stagiaireAConsulterDepuisAccueil;

      if (idStagiaire) {
        etatApplication.stagiaireAConsulterDepuisAccueil = '';

        window.setTimeout(function () {
          consulterStagiaire(idStagiaire);
        }, 50);
      }
    }
  }

  function erreurChargement(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (stagiaires) {
      etatApplication.stagiaires =
        Array.isArray(stagiaires) ? stagiaires : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStagiaires(obtenirJetonUtilisateurApplication());

  google.script.run
    .withSuccessHandler(function (formations) {
      etatApplication.formations =
        Array.isArray(formations) ? formations : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getFormations(obtenirJetonUtilisateurApplication());

  google.script.run
    .withSuccessHandler(function (statuts) {
      etatApplication.statutsStagiaires =
        Array.isArray(statuts) ? statuts : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStatutsStagiaires(obtenirJetonUtilisateurApplication());
}

function remplirSelect(
  identifiant,
  valeurs,
  premiereOption
) {
  const select = document.getElementById(identifiant);

  if (!select) {
    return;
  }

  const valeurActuelle = select.value;

  select.innerHTML = '';

  if (premiereOption !== null) {
    const optionInitiale =
      document.createElement('option');

    optionInitiale.value = '';
    optionInitiale.textContent = premiereOption;

    select.appendChild(optionInitiale);
  }

  valeurs.forEach(function (valeur) {
    const option = document.createElement('option');

    option.value = valeur;
    option.textContent = valeur;

    select.appendChild(option);
  });

  if (
    [...select.options].some(function (option) {
      return option.value === valeurActuelle;
    })
  ) {
    select.value = valeurActuelle;
  }
}

  const corps = document.getElementById(
    'corpsTableauStagiaires'

  if (!corps) {

  const compteur = document.getElementById(

  if (compteur) {
    compteur.textContent =
      stagiaires.length +
      (stagiaires.length > 1
        ? ' stagiaires affichés'
        : ' stagiaire affiché');
  }

  if (stagiaires.length === 0) {
    corps.innerHTML = `
      <tr>
        <td colspan="7" class="etat-vide">
          Aucun stagiaire ne correspond aux critères.
        </td>
      </tr>
    `;

  corps.innerHTML = stagiaires

function obtenirStagiairesFiltres() {
  const recherche = String(
    document.getElementById('rechercheStagiaire')
      ?.value || ''
  )
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');

  const formation = String(
    document.getElementById(
      'filtreFormationStagiaire'
    )?.value || ''
  );

  const statut = String(
    document.getElementById(
      'filtreStatutStagiaire'
    )?.value || ''
  );

  return etatApplication.stagiaires.filter(
    function (stagiaire) {
      const identite =
        (stagiaire.nom + ' ' + stagiaire.prenom)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');

      const correspondRecherche =
        !recherche || identite.includes(recherche);

      const correspondFormation =
        !formation ||
        stagiaire.formation === formation;

      const correspondStatut =
        !statut ||
        stagiaire.statut === statut;

      return (
        correspondRecherche &&
        correspondFormation &&
        correspondStatut
      );
    }
  );
}

function initialiserMiniaturesStagiaires() {
  const generation = ++etatApplication.generationChargementPhotos;
  const elements = Array.from(document.querySelectorAll(
    '.miniature-liste-stagiaire[data-photo-disponible="true"]'
  ));

  function charger(element) {
    if (
      !element ||
      element.dataset.photoChargee === 'true' ||
      generation !== etatApplication.generationChargementPhotos
    ) {
      return;
    }

    element.dataset.photoChargee = 'true';
    const uuid = String(element.dataset.photoUuid || '');

    google.script.run
      .withSuccessHandler(function (photo) {
        if (
          generation !== etatApplication.generationChargementPhotos ||
          !element.isConnected ||
          !photo ||
          !photo.disponible
        ) {
          return;
        }

        const image = document.createElement('img');
        image.src = photo.dataUrl;
        image.alt = '';
        element.innerHTML = '';
        element.appendChild(image);
      })
      .withFailureHandler(function () {
        // Les initiales restent visibles si le fichier Drive manque.
      })
      .getPhotoStagiaire(
        uuid,
        obtenirJetonUtilisateurApplication()
      );
  }

  if (!('IntersectionObserver' in window)) {
    elements.forEach(charger);
    return;
  }

  const observateur = new IntersectionObserver(function (entrees) {
    entrees.forEach(function (entree) {
      if (!entree.isIntersecting) {
        return;
      }
      observateur.unobserve(entree.target);
      charger(entree.target);
    });
  }, { rootMargin: '120px' });

  elements.forEach(function (element) {
    observateur.observe(element);
  });
}


function chargerPhotoFicheStagiaire(uuid, stagiaire) {
  const zone = document.getElementById('photoFicheStagiaire');

  if (!zone) {
    return;
  }

  if (!stagiaire.aUnePhoto) {
    if (stagiaire.photoUrl) {
      afficherImagePhotoStagiaire_(
        zone,
        stagiaire.photoUrl,
        'Photo historique du stagiaire'
      );
    }
    return;
  }

  zone.classList.add('photo-en-chargement');

  google.script.run
    .withSuccessHandler(function (photo) {
      const modal = document.getElementById('modalFicheStagiaire');

      if (!modal || modal.dataset.uuid !== uuid) {
        return;
      }

      zone.classList.remove('photo-en-chargement');

      if (!photo || !photo.disponible) {
        zone.innerHTML = '<span>Photo indisponible</span>';
        return;
      }

      afficherImagePhotoStagiaire_(
        zone,
        photo.dataUrl,
        'Photo du stagiaire'
      );
    })
    .withFailureHandler(function () {
      zone.classList.remove('photo-en-chargement');
      zone.innerHTML = '<span>Photo indisponible</span>';
    })
    .getPhotoStagiaire(
      uuid,
      obtenirJetonUtilisateurApplication()
    );
}


function afficherImagePhotoStagiaire_(zone, source, texteAlternatif) {
  const image = document.createElement('img');
  image.src = source;
  image.alt = texteAlternatif;
  image.addEventListener('error', function () {
    zone.innerHTML = '<span>Photo indisponible</span>';
  });
  zone.innerHTML = '';
  zone.appendChild(image);
}

    })
    .enregistrerFormationAdministration(
      donnees,
      obtenirJetonAdministrateurApplication()
    );
}

function basculerFormationAdministration(idFormation, actif) {
  google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(resultat.message, false);
      initialiserPageAdministration();
    })
    .withFailureHandler(gererErreurServeur)
    .basculerActifFormationAdministration(
      idFormation,
      actif,
      obtenirJetonAdministrateurApplication()
    );
}

function supprimerFormationAdministration(idFormation) {
  const formation = etatApplication.formationsAdministration.find(
    function (element) {
      return element.idFormation === idFormation;
    }
  );

  if (!formation) {
    afficherToast('Formation introuvable.', true);
    return;
  }

  const message = formation.utilisee
    ? 'Cette formation est utilisée. Elle sera uniquement désactivée. Continuer ?'
    : 'Supprimer définitivement cette formation inutilisée ?';

  if (!window.confirm(message)) {
    return;
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(resultat.message, false);
      initialiserPageAdministration();
    })
    .withFailureHandler(gererErreurServeur)
    .supprimerFormationAdministration(
      idFormation,
      obtenirJetonAdministrateurApplication()
    );
}

/* =====================================================
   ASSISTANT PÉDAGOGIQUE DE GROUPE
===================================================== */

function initialiserPageAssistantPedagogique() {
  etatApplication.assistantPedagogique = {
    preparation: null,
    selection: {},
    resultat: null,
    signatureAnalyse: '',
    analyseObsolete: false,
    chargementPreparation: true,
    chargementAnalyse: false,
    generation: 0,
    filtresPriorites: {
      niveau: 'TOUS',
      categorie: ''
    }
  };

  basculerChargementPreparationAssistant_(true);
  masquerErreurAssistantPedagogique_();

  google.script.run
    .withSuccessHandler(function (preparation) {
      if (etatApplication.pageActive !== 'AssistantPedagogique') {
        return;
      }

      const etat = etatApplication.assistantPedagogique;
      if (!etat) {
        return;
      }

      etat.chargementPreparation = false;
      etat.preparation = preparation || {
        stagiaires: [],
        formations: [],
        sessions: []
      };
      basculerChargementPreparationAssistant_(false);
      remplirPreparationAssistantPedagogique_();
      afficherAvertissementsPreparationAssistant_(
        etat.preparation.avertissements || []
      );
    })
    .withFailureHandler(function (erreur) {
      const etat = etatApplication.assistantPedagogique;
      if (etat) {
        etat.chargementPreparation = false;
      }
      basculerChargementPreparationAssistant_(false);
      afficherErreurAssistantPedagogique_(
        extraireMessageErreur(erreur),
        true
      );
    })
    .getPreparationAssistantPedagogique(
      obtenirJetonUtilisateurApplication()
    );
}


function basculerChargementPreparationAssistant_(actif) {
  document.getElementById('chargementPreparationAssistant')
    ?.classList.toggle('masque', !actif);
  document.getElementById('contenuSelectionAssistant')
    ?.classList.toggle('masque', actif);
}


function remplirPreparationAssistantPedagogique_() {
  const etat = etatApplication.assistantPedagogique;
  if (!etat || !etat.preparation) {
    return;
  }

  const selectFormation = document.getElementById(
    'formationStagiaireAssistant'
  );
  const selectSession = document.getElementById('sessionSourceAssistant');

  if (selectFormation) {
    selectFormation.innerHTML =
      '<option value="">Toutes les formations</option>' +
      (etat.preparation.formations || []).map(function (formation) {
        return '<option value="' + echapperHtml(formation.idFormation) + '">' +
          echapperHtml(formation.libelle) + '</option>';
      }).join('');
  }

  if (selectSession) {
    selectSession.innerHTML =
      '<option value="">Choisir une séance…</option>' +
      (etat.preparation.sessions || []).map(function (session) {
        const libelle = [
          afficherDateFrancaise(session.date) || 'Date inconnue',
          session.formation || 'Formation non renseignée',
          session.nombreStagiaires + ' stagiaire(s)'
        ].join(' · ');
        return '<option value="' + echapperHtml(session.idSession) + '">' +
          echapperHtml(libelle) + '</option>';
      }).join('');
  }

  afficherListeStagiairesAssistant_();
  mettreAJourSelectionAssistant_();
}


function afficherAvertissementsPreparationAssistant_(avertissements) {
  if (!avertissements.length) {
    return;
  }
  afficherErreurAssistantPedagogique_(
    avertissements.slice(0, 3).join(' '),
    false
  );
}


function normaliserRechercheAssistant_(valeur) {
  return String(valeur || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}


function obtenirStagiairesFiltresAssistant_() {
  const etat = etatApplication.assistantPedagogique;
  const stagiaires = etat?.preparation?.stagiaires || [];
  const recherche = normaliserRechercheAssistant_(
    document.getElementById('rechercheStagiaireAssistant')?.value || ''
  );
  const formationId = String(
    document.getElementById('formationStagiaireAssistant')?.value || ''
  );

  return stagiaires.filter(function (stagiaire) {
    const identite = normaliserRechercheAssistant_(
      (stagiaire.nom || '') + ' ' + (stagiaire.prenom || '')
    );
    return (!recherche || identite.includes(recherche)) &&
      (!formationId || stagiaire.formationId === formationId);
  });
}


function filtrerStagiairesAssistantPedagogique() {
  afficherListeStagiairesAssistant_();
}


function afficherListeStagiairesAssistant_() {
  const zone = document.getElementById('listeStagiairesAssistant');
  const etat = etatApplication.assistantPedagogique;

  if (!zone || !etat) {
    return;
  }

  const stagiaires = obtenirStagiairesFiltresAssistant_();
  if (!stagiaires.length) {
    zone.innerHTML = `
      <div class="etat-vide etat-vide-assistant">
        Aucun stagiaire non clôturé ne correspond aux filtres.
      </div>
    `;
    return;
  }

  zone.innerHTML = stagiaires.map(function (stagiaire) {
    const selectionne = Boolean(etat.selection[stagiaire.uuid]);
    return `
      <label class="carte-stagiaire-assistant ${selectionne ? 'selectionnee' : ''}">
        <input
          type="checkbox"
          data-stagiaire-id="${echapperHtml(stagiaire.uuid)}"
          ${selectionne ? 'checked' : ''}
          onchange="basculerSelectionStagiaireAssistant(this.dataset.stagiaireId, this.checked)"
        >
        <span class="initiales-assistant" aria-hidden="true">
          ${echapperHtml(
            (stagiaire.prenom || '').charAt(0) +
            (stagiaire.nom || '').charAt(0)
          )}
        </span>
        <span class="identite-stagiaire-assistant">
          <strong>${echapperHtml(stagiaire.nom)} ${echapperHtml(stagiaire.prenom)}</strong>
          <small>${echapperHtml(stagiaire.formation || 'Formation non renseignée')} · ${echapperHtml(stagiaire.statut)}</small>
        </span>
      </label>
    `;
  }).join('');
}


function basculerSelectionStagiaireAssistant(uuid, selectionne) {
  const etat = etatApplication.assistantPedagogique;
  const identifiant = String(uuid || '');

  if (!etat || !identifiant) {
    return;
  }

  if (selectionne) {
    etat.selection[identifiant] = true;
  } else {
    delete etat.selection[identifiant];
  }

  selectionModifieeAssistant_();
  afficherListeStagiairesAssistant_();
}


function selectionnerResultatFiltreAssistant(selectionner) {
  const etat = etatApplication.assistantPedagogique;
  if (!etat) {
    return;
  }

  obtenirStagiairesFiltresAssistant_().forEach(function (stagiaire) {
    if (selectionner) {
      etat.selection[stagiaire.uuid] = true;
    } else {
      delete etat.selection[stagiaire.uuid];
    }
  });

  selectionModifieeAssistant_();
  afficherListeStagiairesAssistant_();
}


function selectionnerDepuisSessionAssistant() {
  const etat = etatApplication.assistantPedagogique;
  const idSession = String(
    document.getElementById('sessionSourceAssistant')?.value || ''
  );

  if (!etat || !idSession) {
    return;
  }

  const session = (etat.preparation.sessions || []).find(
    function (element) {
      return element.idSession === idSession;
    }
  );

  if (!session) {
    afficherErreurAssistantPedagogique_('Séance introuvable.', true);
    return;
  }

  etat.selection = {};
  (session.idsStagiaires || []).forEach(function (uuid) {
    etat.selection[uuid] = true;
  });

  selectionModifieeAssistant_();
  afficherListeStagiairesAssistant_();
}


function obtenirIdsSelectionAssistant_() {
  const etat = etatApplication.assistantPedagogique;
  return Object.keys(etat?.selection || {}).filter(function (uuid) {
    return Boolean(etat.selection[uuid]);
  }).sort();
}


function construireSignatureSelectionAssistant_() {
  return obtenirIdsSelectionAssistant_().join('|');
}


function selectionModifieeAssistant_() {
  const etat = etatApplication.assistantPedagogique;
  if (!etat) {
    return;
  }

  const signature = construireSignatureSelectionAssistant_();
  etat.analyseObsolete = Boolean(
    etat.resultat && signature !== etat.signatureAnalyse
  );
  mettreAJourSelectionAssistant_();
}


function mettreAJourSelectionAssistant_() {
  const etat = etatApplication.assistantPedagogique;
  if (!etat) {
    return;
  }

  const nombre = obtenirIdsSelectionAssistant_().length;
  const compteur = document.getElementById('compteurSelectionAssistant');
  const bouton = document.getElementById('boutonAnalyserGroupe');
  const obsolete = document.getElementById('analyseObsoleteAssistant');
  const analyseAJour = Boolean(
    etat.resultat &&
    construireSignatureSelectionAssistant_() === etat.signatureAnalyse
  );

  if (compteur) {
    compteur.textContent = nombre + ' sélectionné' + (nombre > 1 ? 's' : '');
  }
  if (bouton) {
    bouton.disabled = !nombre || etat.chargementAnalyse || analyseAJour;
    bouton.textContent = etat.chargementAnalyse
      ? 'Analyse en cours…'
      : analyseAJour
        ? 'Analyse à jour'
        : 'Analyser le groupe';
  }
  obsolete?.classList.toggle('masque', !etat.analyseObsolete);
}


function analyserGroupeAssistantPedagogique() {
  const etat = etatApplication.assistantPedagogique;
  const ids = obtenirIdsSelectionAssistant_();

  if (!etat || etat.chargementAnalyse) {
    return;
  }
  if (!ids.length) {
    afficherErreurAssistantPedagogique_(
      'Sélectionnez au moins un stagiaire avant de lancer l’analyse.',
      true
    );
    return;
  }

  const signature = ids.join('|');
  if (etat.resultat && signature === etat.signatureAnalyse) {
    document.getElementById('resultatAssistantPedagogique')
      ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  const generation = ++etat.generation;
  etat.chargementAnalyse = true;
  masquerErreurAssistantPedagogique_();
  basculerChargementAnalyseAssistant_(true);
  mettreAJourSelectionAssistant_();

  google.script.run
    .withSuccessHandler(function (resultat) {
      const etatActuel = etatApplication.assistantPedagogique;
      if (
        !etatActuel ||
        generation !== etatActuel.generation ||
        etatApplication.pageActive !== 'AssistantPedagogique'
      ) {
        return;
      }

      etatActuel.chargementAnalyse = false;
      etatActuel.resultat = resultat || {};
      etatActuel.signatureAnalyse = signature;
      etatActuel.analyseObsolete =
        construireSignatureSelectionAssistant_() !== signature;
      basculerChargementAnalyseAssistant_(false);
      afficherResultatAssistantPedagogique_();
      mettreAJourSelectionAssistant_();
    })
    .withFailureHandler(function (erreur) {
      const etatActuel = etatApplication.assistantPedagogique;
      if (!etatActuel || generation !== etatActuel.generation) {
        return;
      }
      etatActuel.chargementAnalyse = false;
      basculerChargementAnalyseAssistant_(false);
      mettreAJourSelectionAssistant_();
      afficherErreurAssistantPedagogique_(
        extraireMessageErreur(erreur),
        true
      );
    })
    .getAnalyseGroupe(
      ids,
      {},
      obtenirJetonUtilisateurApplication()
    );
}


function basculerChargementAnalyseAssistant_(actif) {
  document.getElementById('chargementAnalyseGroupe')
    ?.classList.toggle('masque', !actif);
}


function afficherResultatAssistantPedagogique_() {
  const etat = etatApplication.assistantPedagogique;
  const resultat = etat?.resultat;
  const zone = document.getElementById('resultatAssistantPedagogique');

  if (!resultat || !zone) {
    return;
  }

  zone.classList.remove('masque');
  afficherMetadonneesAssistant_(resultat.meta || {});
  afficherSyntheseAssistant_(resultat);
  remplirFiltresPrioritesAssistant_(resultat.priorites || []);
  appliquerFiltresPrioritesAssistant();
  afficherRecommandationsAssistant_(resultat.recommandations || []);
  afficherDetailsStagiairesAssistant_(resultat.detailsStagiaires || []);
  afficherItemsGroupeAssistant_(
    'listeMaitrisesAssistant',
    resultat.statistiques?.itemsMaitrisesParToutLeGroupe || [],
    'Aucun item n’est actuellement maîtrisé par tout le groupe.'
  );
  afficherItemsGroupeAssistant_(
    'listeCritiquesAssistant',
    resultat.statistiques?.itemsCritiques || [],
    'Aucun item critique n’est retourné par le moteur.'
  );
}


function afficherMetadonneesAssistant_(meta) {
  const zone = document.getElementById('metadonneesAssistantPedagogique');
  if (!zone) {
    return;
  }

  const date = meta.calculeA ? new Date(meta.calculeA) : null;
  const dateLisible = date && !isNaN(date.getTime())
    ? date.toLocaleString('fr-FR')
    : 'date inconnue';
  zone.textContent = 'Calcul du ' + dateLisible +
    ' · ' + (Number(meta.dureeCalculMs) || 0) + ' ms';
}


function afficherSyntheseAssistant_(resultat) {
  const globale = resultat.analyseGlobale || {};
  const statistiques = resultat.statistiques || {};
  const cartes = [
    ['Stagiaires', globale.nombreStagiaires],
    ['Items actifs', globale.nombreItemsActifs],
    ['Items travaillés', globale.nombreItemsTravailles],
    ['Items acquis', globale.nombreItemsAcquis],
    ['Jamais acquis', globale.nombreItemsJamaisAcquis],
    ['Score moyen', formaterScoreAssistant_(statistiques.moyenneScores)],
    ['Médiane', formaterScoreAssistant_(statistiques.medianeScores)],
    ['Dispersion', formaterScoreAssistant_(statistiques.dispersionScores)]
  ];
  const zone = document.getElementById('cartesSyntheseAssistant');

  if (zone) {
    zone.innerHTML = cartes.map(function (carte) {
      return `
        <article class="carte carte-synthese-assistant">
          <span>${echapperHtml(carte[0])}</span>
          <strong>${echapperHtml(carte[1] ?? 0)}</strong>
        </article>
      `;
    }).join('');
  }

  const homogeneite = Math.max(
    0,
    Math.min(100, Number(globale.homogeneite) || 0)
  );
  const valeur = document.getElementById('valeurHomogeneiteAssistant');
  const remplissage = document.getElementById(
    'remplissageHomogeneiteAssistant'
  );
  const barre = remplissage?.parentElement;

  if (valeur) {
    valeur.textContent = formaterScoreAssistant_(homogeneite) + ' %';
  }
  if (remplissage) {
    remplissage.style.width = homogeneite + '%';
  }
  barre?.setAttribute('aria-valuenow', String(homogeneite));

  afficherRepartitionBesoinsAssistant_(resultat.priorites || []);
}


function afficherRepartitionBesoinsAssistant_(priorites) {
  const zone = document.getElementById('graphiqueRepartitionAssistant');
  if (!zone) {
    return;
  }

  const niveaux = [
    ['CRITIQUE', 'Très prioritaires', 'tres-elevee'],
    ['ELEVEE', 'Prioritaires', 'elevee'],
    ['MODEREE', 'À surveiller', 'moyenne'],
    ['FAIBLE', 'Faibles', 'faible']
  ];
  const total = priorites.length;

  zone.innerHTML = niveaux.map(function (niveau) {
    const nombre = priorites.filter(function (priorite) {
      return priorite.niveauPriorite === niveau[0];
    }).length;
    const largeur = total ? nombre / total * 100 : 0;
    return `
      <div class="ligne-repartition-assistant">
        <span>${echapperHtml(niveau[1])}</span>
        <div><i class="niveau-${niveau[2]}" style="width:${largeur}%"></i></div>
        <strong>${nombre}</strong>
      </div>
    `;
  }).join('');

  const nonClasses = priorites.filter(function (priorite) {
    return !priorite.niveauPriorite;
  }).length;
  if (nonClasses) {
    zone.innerHTML += `
      <p class="note-repartition-assistant">
        ${nonClasses} priorité(s) sans niveau disponible dans les analyses individuelles.
      </p>
    `;
  }
}


function remplirFiltresPrioritesAssistant_(priorites) {
  const select = document.getElementById('categoriePrioriteAssistant');
  if (!select) {
    return;
  }

  const categories = Array.from(new Set(priorites.map(function (priorite) {
    return priorite.categorie || '';
  }).filter(Boolean))).sort(function (a, b) {
    return a.localeCompare(b, 'fr', { sensitivity: 'base' });
  });

  select.innerHTML = '<option value="">Toutes les catégories</option>' +
    categories.map(function (categorie) {
      return '<option value="' + echapperHtml(categorie) + '">' +
        echapperHtml(categorie) + '</option>';
    }).join('');
}


function appliquerFiltresPrioritesAssistant() {
  const etat = etatApplication.assistantPedagogique;
  const resultat = etat?.resultat;
  if (!resultat) {
    return;
  }

  const niveau = String(
    document.getElementById('niveauPrioriteAssistant')?.value || 'TOUS'
  );
  const categorie = String(
    document.getElementById('categoriePrioriteAssistant')?.value || ''
  );
  etat.filtresPriorites = { niveau: niveau, categorie: categorie };

  const priorites = (resultat.priorites || []).filter(function (priorite) {
    return (niveau === 'TOUS' || priorite.niveauPriorite === niveau) &&
      (!categorie || priorite.categorie === categorie);
  });
  afficherPrioritesAssistant_(priorites);
}


function afficherPrioritesAssistant_(priorites) {
  const corps = document.getElementById('corpsPrioritesAssistant');
  const compteur = document.getElementById('compteurPrioritesAssistant');
  if (!corps) {
    return;
  }

  if (compteur) {
    compteur.textContent = priorites.length + ' priorité' +
      (priorites.length > 1 ? 's' : '');
  }
  if (!priorites.length) {
    corps.innerHTML = `
      <tr><td colspan="12" class="etat-vide">
        Aucune priorité ne correspond aux filtres.
      </td></tr>
    `;
    return;
  }

  corps.innerHTML = priorites.slice(0, 15).map(function (priorite) {
    const niveau = obtenirPresentationNiveauAssistant_(
      priorite.niveauPriorite
    );
    const motifs = (priorite.motifs || []).length
      ? priorite.motifs.join(' · ')
      : 'Aucun motif détaillé disponible';
    return `
      <tr>
        <td><strong>#${echapperHtml(priorite.rang)}</strong></td>
        <td><strong>${echapperHtml(priorite.item)}</strong></td>
        <td>${echapperHtml(priorite.categorie || '—')}</td>
        <td><span class="badge-priorite-assistant ${niveau.classe}">${echapperHtml(niveau.libelle)}</span></td>
        <td>${echapperHtml(priorite.nombreStagiairesConcernes)}</td>
        <td>${formaterScoreAssistant_(priorite.scoreMoyen)}</td>
        <td>${formaterScoreAssistant_(priorite.scoreMaximum)}</td>
        <td>${echapperHtml(priorite.nombreJamaisAcquis)}</td>
        <td>${echapperHtml(priorite.nombreOublies)}</td>
        <td>${echapperHtml(priorite.nombreEchecs)}</td>
        <td>${formaterAncienneteAssistant_(priorite.ancienneteMoyenne)}</td>
        <td class="motifs-priorite-assistant">${echapperHtml(motifs)}</td>
      </tr>
    `;
  }).join('');
}


function obtenirPresentationNiveauAssistant_(niveau) {
  const presentations = {
    CRITIQUE: { libelle: 'Très élevée', classe: 'niveau-tres-elevee' },
    ELEVEE: { libelle: 'Élevée', classe: 'niveau-elevee' },
    MODEREE: { libelle: 'Moyenne', classe: 'niveau-moyenne' },
    FAIBLE: { libelle: 'Faible', classe: 'niveau-faible' }
  };
  return presentations[niveau] || {
    libelle: 'Non classée',
    classe: 'niveau-non-classee'
  };
}


function afficherRecommandationsAssistant_(recommandations) {
  const zone = document.getElementById('listeRecommandationsAssistant');
  if (!zone) {
    return;
  }
  if (!recommandations.length) {
    zone.innerHTML = `
      <div class="bloc etat-vide etat-vide-assistant">
        Aucune recommandation n’est retournée pour ce groupe.
      </div>
    `;
    return;
  }

  zone.innerHTML = recommandations.slice(0, 10).map(
    function (recommandation) {
      const niveau = obtenirPresentationNiveauAssistant_(
        recommandation.niveau
      );
      const compteurs = [
        [recommandation.nombreStagiairesConcernes, 'stagiaire(s) concerné(s)'],
        [recommandation.nombreJamaisAcquis, 'jamais acquis'],
        [recommandation.nombreOublies, 'item(s) oublié(s)'],
        [recommandation.nombreEchecs, 'échec(s) enregistré(s)']
      ].filter(function (ligne) {
        return Number(ligne[0]) > 0;
      });
      return `
        <article class="bloc recommandation-groupe-assistant">
          <header>
            <span class="rang-recommandation-assistant">#${echapperHtml(recommandation.rang)}</span>
            <div>
              <h3>${echapperHtml(recommandation.item)}</h3>
              <p>${echapperHtml(recommandation.categorie || 'Catégorie non renseignée')}</p>
            </div>
            <span class="badge-priorite-assistant ${niveau.classe}">${echapperHtml(niveau.libelle)}</span>
          </header>
          <div class="score-recommandation-assistant">Score ${formaterScoreAssistant_(recommandation.score)}</div>
          ${compteurs.length ? `
            <ul class="compteurs-recommandation-assistant">
              ${compteurs.map(function (ligne) {
                return '<li><strong>' + echapperHtml(ligne[0]) + '</strong> ' +
                  echapperHtml(ligne[1]) + '</li>';
              }).join('')}
            </ul>
          ` : ''}
          <p class="justification-recommandation-assistant">
            ${echapperHtml(recommandation.justification || 'Aucune justification détaillée disponible.')}
          </p>
        </article>
      `;
    }
  ).join('');
}


function afficherDetailsStagiairesAssistant_(details) {
  const corps = document.getElementById('corpsDetailsStagiairesAssistant');
  const preparation = etatApplication.assistantPedagogique?.preparation;
  if (!corps) {
    return;
  }

  const stagiairesParId = {};
  (preparation?.stagiaires || []).forEach(function (stagiaire) {
    stagiairesParId[stagiaire.uuid] = stagiaire;
  });

  if (!details.length) {
    corps.innerHTML = '<tr><td colspan="6" class="etat-vide">Aucun détail individuel disponible.</td></tr>';
    return;
  }

  corps.innerHTML = details.map(function (detail) {
    const stagiaire = stagiairesParId[detail.uuid] || {
      nom: 'Stagiaire',
      prenom: 'non identifié'
    };
    return `
      <tr>
        <td><strong>${echapperHtml(stagiaire.nom)} ${echapperHtml(stagiaire.prenom)}</strong></td>
        <td>${echapperHtml(detail.nombreRecommandationsIndividuelles)}</td>
        <td>${echapperHtml(detail.nombreItemsPrioritaires)}</td>
        <td>${echapperHtml(detail.nombrePointsFaibles)}</td>
        <td>${formaterDerniereSeanceAssistant_(detail.joursDepuisDerniereSeance)}</td>
        <td>
          <button
            type="button"
            class="bouton-secondaire bouton-ouvrir-fiche-assistant"
            data-stagiaire-id="${echapperHtml(detail.uuid)}"
            onclick="ouvrirFicheStagiaireDepuisAssistant(this.dataset.stagiaireId)"
          >Ouvrir la fiche</button>
        </td>
      </tr>
    `;
  }).join('');
}


function ouvrirFicheStagiaireDepuisAssistant(uuid) {
  const preparation = etatApplication.assistantPedagogique?.preparation;
  const stagiaire = (preparation?.stagiaires || []).find(
    function (element) {
      return element.uuid === uuid;
    }
  );

  if (!stagiaire) {
    afficherToast('Stagiaire introuvable.', true);
    return;
  }

  const indexExistant = etatApplication.stagiaires.findIndex(
    function (element) {
      return element.uuid === uuid;
    }
  );
  if (indexExistant === -1) {
    etatApplication.stagiaires.push(Object.assign({
      dateDebutPreparation: '',
      dateStage: '',
      grade: '',
      telephone: '',
      email: '',
      aUnePhoto: false,
      notesAdministratives: ''
    }, stagiaire));
  }

  consulterStagiaire(uuid);
}


function afficherItemsGroupeAssistant_(identifiant, items, messageVide) {
  const zone = document.getElementById(identifiant);
  if (!zone) {
    return;
  }
  if (!items.length) {
    zone.innerHTML = '<p class="etat-vide">' + echapperHtml(messageVide) + '</p>';
    return;
  }

  zone.innerHTML = items.map(function (item) {
    return `
      <article class="item-groupe-assistant">
        <div>
          <strong>${echapperHtml(item.item)}</strong>
          <small>${echapperHtml(item.categorie || 'Catégorie non renseignée')}</small>
        </div>
        <span>${formaterScoreAssistant_(item.scoreMoyen)}</span>
      </article>
    `;
  }).join('');
}


function formaterScoreAssistant_(valeur) {
  const nombre = Number(valeur);
  if (!Number.isFinite(nombre)) {
    return '—';
  }
  return nombre.toLocaleString('fr-FR', {
    maximumFractionDigits: 1
  });
}


function formaterAncienneteAssistant_(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') {
    return 'Non calculable';
  }
  return formaterScoreAssistant_(valeur) + ' j';
}


function formaterDerniereSeanceAssistant_(jours) {
  if (jours === null || jours === undefined) {
    return 'Aucune séance';
  }
  if (Number(jours) === 0) {
    return 'Aujourd’hui';
  }
  return 'Il y a ' + echapperHtml(jours) + ' jour(s)';
}


function afficherErreurAssistantPedagogique_(message, estErreur) {
  const zone = document.getElementById('erreurAssistantPedagogique');
  if (!zone) {
    return;
  }
  zone.textContent = String(message || 'Une erreur est survenue.');
  zone.classList.toggle('avertissement', !estErreur);
  zone.classList.remove('masque');
}


function masquerErreurAssistantPedagogique_() {
  const zone = document.getElementById('erreurAssistantPedagogique');
  if (zone) {
    zone.textContent = '';
    zone.classList.add('masque');
    zone.classList.remove('avertissement');
  }
}


/* =====================================================
   STATISTIQUES
===================================================== */

function initialiserPageStatistiques() {
  etatApplication.statistiques = null;
  etatApplication.chargementStatistiquesEnCours = false;
  definirDatesPeriodeStatistiques_('ANNEE_EN_COURS');
  chargerStatistiques(false);
}


function changerPeriodeStatistiques() {
  const periode = document.getElementById('periodeStatistiques')?.value ||
    'ANNEE_EN_COURS';
  definirDatesPeriodeStatistiques_(periode);
}


function definirDatesPeriodeStatistiques_(periode) {
  const debut = document.getElementById('dateDebutStatistiques');
  const fin = document.getElementById('dateFinStatistiques');

  if (!debut || !fin) {
    return;
  }

  const aujourdHui = new Date();
  let dateDebut;
  let dateFin;

  if (periode === 'MOIS_EN_COURS') {
    dateDebut = new Date(
      aujourdHui.getFullYear(),
      aujourdHui.getMonth(),
      1
    );
    dateFin = new Date(
      aujourdHui.getFullYear(),
      aujourdHui.getMonth() + 1,
      0
    );
  } else if (periode === 'DOUZE_DERNIERS_MOIS') {
    dateDebut = new Date(
      aujourdHui.getFullYear(),
      aujourdHui.getMonth() - 11,
      1
    );
    dateFin = aujourdHui;
  } else if (periode === 'ANNEE_PRECEDENTE') {
    dateDebut = new Date(aujourdHui.getFullYear() - 1, 0, 1);
    dateFin = new Date(aujourdHui.getFullYear() - 1, 11, 31);
  } else if (periode === 'PERSONNALISEE') {
    debut.disabled = false;
    fin.disabled = false;
    if (!debut.value) {
      debut.value = datePourChampStatistiques_(
        new Date(aujourdHui.getFullYear(), 0, 1)
      );
    }
    if (!fin.value) {
      fin.value = datePourChampStatistiques_(aujourdHui);
    }
    return;
  } else {
    dateDebut = new Date(aujourdHui.getFullYear(), 0, 1);
    dateFin = new Date(aujourdHui.getFullYear(), 11, 31);
  }

  debut.disabled = true;
  fin.disabled = true;
  debut.value = datePourChampStatistiques_(dateDebut);
  fin.value = datePourChampStatistiques_(dateFin);
}


function datePourChampStatistiques_(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}


function lireFiltresStatistiques_(forcerActualisation) {
  return {
    periode: document.getElementById('periodeStatistiques')?.value ||
      'ANNEE_EN_COURS',
    dateDebut: document.getElementById('dateDebutStatistiques')?.value || '',
    dateFin: document.getElementById('dateFinStatistiques')?.value || '',
    formationId: document.getElementById('formationStatistiques')?.value || '',
    formateurId: document.getElementById('formateurStatistiques')?.value || '',
    inclureFormateursSansActivite: Boolean(
      document.getElementById('inclureFormateursSansActiviteStatistiques')
        ?.checked
    ),
    inclureItemsInactifs: Boolean(
      document.getElementById('inclureItemsInactifsStatistiques')?.checked
    ),
    forcerActualisation: Boolean(forcerActualisation)
  };
}


function chargerStatistiques(forcerActualisation) {
  if (etatApplication.chargementStatistiquesEnCours) {
    return;
  }

  const generation = ++etatApplication.generationStatistiques;
  etatApplication.chargementStatistiquesEnCours = true;
  basculerChargementStatistiques_(true);

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (
        generation !== etatApplication.generationStatistiques ||
        etatApplication.pageActive !== 'Statistiques'
      ) {
        return;
      }

      etatApplication.chargementStatistiquesEnCours = false;
      etatApplication.statistiques = resultat;
      basculerChargementStatistiques_(false);
      afficherStatistiques(resultat || {});
    })
    .withFailureHandler(function (erreur) {
      if (
        generation !== etatApplication.generationStatistiques ||
        etatApplication.pageActive !== 'Statistiques'
      ) {
        return;
      }

      etatApplication.chargementStatistiquesEnCours = false;
      basculerChargementStatistiques_(false);
      afficherErreurStatistiques_(extraireMessageErreur(erreur));
    })
    .getDonneesStatistiques(
      lireFiltresStatistiques_(forcerActualisation),
      obtenirJetonUtilisateurApplication()
    );
}


function basculerChargementStatistiques_(actif) {
  const zone = document.getElementById('chargementStatistiques');
  const bouton = document.getElementById('boutonActualiserStatistiques');

  zone?.classList.toggle('masque', !actif);
  if (bouton) {
    bouton.disabled = actif;
    bouton.textContent = actif ? 'Calcul en cours…' : 'Actualiser';
  }
}


function afficherStatistiques(donnees) {
  remplirOptionsStatistiques_(donnees.options || {}, donnees.filtres || {});
  afficherMetadonneesStatistiques_(donnees.meta || {}, donnees.filtres || {});
  afficherAvertissementsStatistiques_(donnees.meta || {}, donnees.avertissements || []);

  const indicateurs = donnees.indicateurs || {};
  const fma = indicateurs.fmaRealisees || {};
  definirTexteStatistiques_('statFmaRealisees', Number(fma.valeur) || 0);

  const evolution = document.getElementById('statEvolutionFma');
  if (evolution) {
    if (fma.evolutionCalculable) {
      const valeur = Number(fma.evolutionPourcentage) || 0;
      evolution.textContent = (valeur > 0 ? '+' : '') + valeur +
        ' % par rapport à la période précédente';
      evolution.className = valeur > 0
        ? 'evolution-statistique-positive'
        : valeur < 0
          ? 'evolution-statistique-negative'
          : '';
    } else {
      evolution.textContent =
        'Évolution non calculable : aucune donnée sur la période précédente';
      evolution.className = '';
    }
  }

  definirTexteStatistiques_(
    'statStagiairesAccompagnes',
    Number(indicateurs.stagiairesAccompagnes) || 0
  );
  definirTexteStatistiques_(
    'statPreparationsCloturees',
    Number(indicateurs.preparationsCloturees) || 0
  );
  definirTexteStatistiques_(
    'statVolumeHeures',
    formaterHeuresStatistiques_(indicateurs.volumeHoraireFormateurs)
  );

  const intervalles = indicateurs.tempsEntreSeances || {};
  definirTexteStatistiques_(
    'statTempsMoyen',
    intervalles.calculable
      ? intervalles.moyenneJours + ' jours'
      : 'Non calculable'
  );
  definirTexteStatistiques_(
    'statDetailsIntervalles',
    intervalles.calculable
      ? 'Médiane : ' + intervalles.medianeJours + ' jours · ' +
        intervalles.nombreIntervalles + ' intervalle(s)'
      : intervalles.message || 'Données insuffisantes.'
  );

  afficherFormateursStatistiques_(donnees.formateurs || {});
  afficherEvolutionMensuelleStatistiques_(
    Array.isArray(donnees.evolutionMensuelle)
      ? donnees.evolutionMensuelle
      : []
  );
  afficherItemsStatistiques_(donnees.items || {});
}


function remplirOptionsStatistiques_(options, filtres) {
  remplirSelectObjetsStatistiques_(
    'formationStatistiques',
    Array.isArray(options.formations) ? options.formations : [],
    'idFormation',
    'libelle',
    'Toutes les formations',
    filtres.formationId
  );
  remplirSelectObjetsStatistiques_(
    'formateurStatistiques',
    Array.isArray(options.formateurs) ? options.formateurs : [],
    'idFormateur',
    'nomComplet',
    'Tous les formateurs',
    filtres.formateurId
  );
}


function remplirSelectObjetsStatistiques_(
  identifiant,
  valeurs,
  cleValeur,
  cleLibelle,
  libelleTous,
  valeurSelectionnee
) {
  const select = document.getElementById(identifiant);
  if (!select) {
    return;
  }

  select.innerHTML = '';
  const tous = document.createElement('option');
  tous.value = '';
  tous.textContent = libelleTous;
  select.appendChild(tous);

  valeurs.forEach(function (valeur) {
    const option = document.createElement('option');
    option.value = String(valeur[cleValeur] || '');
    option.textContent = String(valeur[cleLibelle] || '') +
      (valeur.actif === false ? ' (inactif)' : '');
    select.appendChild(option);
  });
  select.value = String(valeurSelectionnee || '');
}


function afficherMetadonneesStatistiques_(meta, filtres) {
  const zone = document.getElementById('metadonneesCalculStatistiques');
  if (!zone) {
    return;
  }

  const date = meta.calculeA ? new Date(meta.calculeA) : null;
  const dateLisible = date && !isNaN(date.getTime())
    ? date.toLocaleString('fr-FR')
    : 'date inconnue';
  const periode = filtres.dateFinEffective &&
    filtres.dateFinEffective !== filtres.dateFin
    ? ' · fin effective : ' + afficherDateFrancaise(filtres.dateFinEffective)
    : '';
  const cache = meta.cacheUtilise
    ? ' · cache de ' + Number(meta.ageCacheSecondes || 0) + ' s'
    : '';

  zone.textContent = 'Calcul du ' + dateLisible + ' · ' +
    Number(meta.dureeCalculMs || 0) + ' ms' + cache + periode;
}


function afficherAvertissementsStatistiques_(meta, avertissements) {
  const zone = document.getElementById('avertissementsStatistiques');
  if (!zone) {
    return;
  }

  const liste = Array.isArray(meta.avertissements) &&
    meta.avertissements.length
    ? meta.avertissements
    : avertissements;

  if (!liste || !liste.length) {
    zone.classList.add('masque');
    zone.innerHTML = '';
    return;
  }

  zone.classList.remove('masque');
  zone.innerHTML = '<strong>Données partielles ou anomalies détectées</strong>' +
    '<ul>' + liste.slice(0, 10).map(function (message) {
      return '<li>' + echapperHtml(message) + '</li>';
    }).join('') + '</ul>';
}


function afficherFormateursStatistiques_(donnees) {
  const lignes = Array.isArray(donnees.lignes) ? donnees.lignes : [];
  const corps = document.getElementById('corpsFormateursStatistiques');

  if (corps) {
    corps.innerHTML = lignes.length
      ? lignes.map(function (ligne) {
        return '<tr>' +
          '<td><strong>' + echapperHtml(ligne.nomComplet) + '</strong></td>' +
          '<td>' + Number(ligne.nombreSeances || 0) + '</td>' +
          '<td>' + echapperHtml(formaterHeuresStatistiques_(ligne.totalHeures)) + '</td>' +
          '<td>' + Number(ligne.nombreStagiairesDistincts || 0) + '</td>' +
          '<td>' + Number(ligne.moyenneStagiairesParSeance || 0) + '</td>' +
          '<td>' + echapperHtml(
            afficherDateFrancaise(ligne.derniereSeance) || '—'
          ) + '</td></tr>';
      }).join('')
      : creerLigneVideStatistiques_(6, 'Aucune activité formateur sur cette période.');
  }

  rendreGraphiqueBarresHorizontalesStatistiques_(
    'graphiqueHeuresFormateursStatistiques',
    Array.isArray(donnees.graphiqueHeures) ? donnees.graphiqueHeures : [],
    'Heures de formation par formateur',
    '#1b6ca8',
    ' h'
  );
}


function afficherEvolutionMensuelleStatistiques_(mois) {
  const corps = document.getElementById('corpsEvolutionStatistiques');
  if (corps) {
    corps.innerHTML = mois.length
      ? mois.map(function (ligne) {
        return '<tr><td>' + echapperHtml(ligne.libelle) + '</td>' +
          '<td>' + Number(ligne.nombreSeances || 0) + '</td>' +
          '<td>' + echapperHtml(
            formaterHeuresStatistiques_(ligne.volumeHeures)
          ) + '</td></tr>';
      }).join('')
      : creerLigneVideStatistiques_(3, 'Aucun mois exploitable dans la période.');
  }

  rendreGraphiqueBarresMensuellesStatistiques_(
    'graphiqueEvolutionSeancesStatistiques',
    mois.map(function (ligne) {
      return { libelle: ligne.libelle, valeur: ligne.nombreSeances };
    }),
    '#1b6ca8',
    ' séance(s)'
  );
  rendreGraphiqueBarresMensuellesStatistiques_(
    'graphiqueEvolutionHeuresStatistiques',
    mois.map(function (ligne) {
      return { libelle: ligne.libelle, valeur: ligne.volumeHeures };
    }),
    '#d78322',
    ' h'
  );
}


function afficherItemsStatistiques_(donnees) {
  const categories = Array.isArray(donnees.repartitionCategories)
    ? donnees.repartitionCategories
    : [];
  const corpsCategories = document.getElementById(
    'corpsCategoriesStatistiques'
  );

  if (corpsCategories) {
    corpsCategories.innerHTML = categories.length
      ? categories.map(function (categorie) {
        return '<tr><td><strong>' + echapperHtml(categorie.libelle) +
          '</strong>' + (categorie.actif ? '' : ' <small>(historique)</small>') +
          '</td><td>' + Number(categorie.nombreSeances || 0) +
          '</td><td>' + Number(categorie.occurrences || 0) +
          '</td><td>' + Number(categorie.pourcentage || 0) + ' %</td></tr>';
      }).join('')
      : creerLigneVideStatistiques_(
        4,
        'Aucun item travaillé sur cette période.'
      );
  }

  rendreGraphiqueBarresHorizontalesStatistiques_(
    'graphiqueCategoriesStatistiques',
    categories.map(function (categorie) {
      return {
        libelle: categorie.libelle,
        valeur: categorie.occurrences
      };
    }),
    'Occurrences d’items par catégorie',
    '#d78322',
    ''
  );

  afficherClassementItemsStatistiques_(
    'corpsItemsPlusStatistiques',
    Array.isArray(donnees.plusTravailles) ? donnees.plusTravailles : []
  );
  afficherClassementItemsStatistiques_(
    'corpsItemsMoinsStatistiques',
    Array.isArray(donnees.moinsTravailles) ? donnees.moinsTravailles : []
  );

  const source = donnees.sources || {};
  definirTexteStatistiques_(
    'sourceItemsStatistiques',
    'Source principale : ' +
      Number(source.occurrencesItemsSessions || 0) +
      ' occurrence(s) ITEMS_SESSIONS · repli historique : ' +
      Number(source.occurrencesEvaluationsHistoriques || 0) +
      ' occurrence(s) EVALUATIONS.'
  );
}


function afficherClassementItemsStatistiques_(identifiant, lignes) {
  const corps = document.getElementById(identifiant);
  if (!corps) {
    return;
  }

  corps.innerHTML = lignes.length
    ? lignes.map(function (ligne) {
      return '<tr><td><strong>' + echapperHtml(ligne.intitule) +
        '</strong>' + (ligne.actif ? '' : ' <small>(inactif)</small>') +
        '</td><td>' + echapperHtml(ligne.categorie) +
        '</td><td>' + Number(ligne.nombreSeances || 0) +
        '</td><td>' + echapperHtml(
          afficherDateFrancaise(ligne.derniereDate) || 'Jamais'
        ) + '</td></tr>';
    }).join('')
    : creerLigneVideStatistiques_(4, 'Aucun item dans ce classement.');
}


function rendreGraphiqueBarresHorizontalesStatistiques_(
  identifiant,
  donnees,
  titre,
  couleur,
  suffixe
) {
  const zone = document.getElementById(identifiant);
  if (!zone) {
    return;
  }

  if (!donnees.length || !donnees.some(function (ligne) {
    return Number(ligne.valeur) > 0;
  })) {
    zone.innerHTML = creerEtatVideGraphiqueStatistiques_(
      'Aucune donnée à représenter.'
    );
    return;
  }

  const largeur = 900;
  const largeurLibelle = 260;
  const hauteurLigne = 42;
  const hauteur = 44 + donnees.length * hauteurLigne;
  const maximum = Math.max.apply(null, donnees.map(function (ligne) {
    return Number(ligne.valeur) || 0;
  }));
  const barres = donnees.map(function (ligne, index) {
    const valeur = Number(ligne.valeur) || 0;
    const y = 40 + index * hauteurLigne;
    const largeurBarre = maximum
      ? Math.max(2, valeur / maximum * (largeur - largeurLibelle - 90))
      : 0;
    const libelle = tronquerLibelleStatistiques_(ligne.libelle, 34);
    return '<g><title>' + echapperHtml(ligne.libelle + ' : ' + valeur + suffixe) +
      '</title><text x="4" y="' + (y + 17) +
      '" class="texte-graphique-statistiques">' + echapperHtml(libelle) +
      '</text><rect x="' + largeurLibelle + '" y="' + y +
      '" width="' + largeurBarre + '" height="24" rx="5" fill="' +
      couleur + '"></rect><text x="' +
      (largeurLibelle + largeurBarre + 8) + '" y="' + (y + 17) +
      '" class="valeur-graphique-statistiques">' + valeur +
      echapperHtml(suffixe) + '</text></g>';
  }).join('');

  zone.innerHTML = '<div class="defilement-graphique-statistiques">' +
    '<svg role="img" aria-label="' + echapperHtml(titre) +
    '" viewBox="0 0 ' + largeur + ' ' + hauteur +
    '" style="min-width:720px;height:' + hauteur + 'px">' +
    '<text x="4" y="22" class="titre-graphique-svg-statistiques">' +
    echapperHtml(titre) + '</text>' + barres + '</svg></div>';
}


function rendreGraphiqueBarresMensuellesStatistiques_(
  identifiant,
  donnees,
  couleur,
  suffixe
) {
  const zone = document.getElementById(identifiant);
  if (!zone) {
    return;
  }

  if (!donnees.length) {
    zone.innerHTML = creerEtatVideGraphiqueStatistiques_(
      'Aucune période à représenter.'
    );
    return;
  }

  const largeur = Math.max(720, donnees.length * 64 + 70);
  const hauteur = 290;
  const base = 225;
  const maximum = Math.max(1, ...donnees.map(function (ligne) {
    return Number(ligne.valeur) || 0;
  }));
  const largeurBarre = Math.min(34, (largeur - 70) / donnees.length * 0.6);
  const espace = (largeur - 70) / donnees.length;
  const barres = donnees.map(function (ligne, index) {
    const valeur = Number(ligne.valeur) || 0;
    const hauteurBarre = valeur / maximum * 170;
    const x = 50 + index * espace + (espace - largeurBarre) / 2;
    const y = base - hauteurBarre;
    return '<g><title>' + echapperHtml(
      ligne.libelle + ' : ' + valeur + suffixe
    ) + '</title><rect x="' + x + '" y="' + y + '" width="' +
      largeurBarre + '" height="' + hauteurBarre + '" rx="4" fill="' +
      couleur + '"></rect><text x="' + (x + largeurBarre / 2) +
      '" y="' + (base + 18) +
      '" text-anchor="middle" class="mois-graphique-statistiques">' +
      echapperHtml(tronquerLibelleStatistiques_(ligne.libelle, 9)) +
      '</text><text x="' + (x + largeurBarre / 2) + '" y="' +
      Math.max(20, y - 6) +
      '" text-anchor="middle" class="valeur-graphique-statistiques">' +
      valeur + '</text></g>';
  }).join('');

  zone.innerHTML = '<div class="defilement-graphique-statistiques">' +
    '<svg role="img" viewBox="0 0 ' + largeur + ' ' + hauteur +
    '" style="min-width:' + largeur + 'px;height:' + hauteur + 'px">' +
    '<line x1="45" y1="' + base + '" x2="' + (largeur - 10) +
    '" y2="' + base + '" class="axe-graphique-statistiques"></line>' +
    barres + '</svg></div>';
}


function creerEtatVideGraphiqueStatistiques_(message) {
  return '<div class="etat-vide etat-vide-graphique-statistiques">' +
    echapperHtml(message) + '</div>';
}


function creerLigneVideStatistiques_(colonnes, message) {
  return '<tr><td colspan="' + Number(colonnes) + '" class="etat-vide">' +
    echapperHtml(message) + '</td></tr>';
}


function tronquerLibelleStatistiques_(valeur, longueur) {
  const texte = String(valeur || '');
  return texte.length > longueur
    ? texte.slice(0, longueur - 1) + '…'
    : texte;
}


function formaterHeuresStatistiques_(valeur) {
  const nombre = Number(valeur || 0);
  return nombre.toLocaleString('fr-FR', {
    minimumFractionDigits: nombre % 1 ? 1 : 0,
    maximumFractionDigits: 2
  }) + ' h';
}


function definirTexteStatistiques_(identifiant, valeur) {
  const element = document.getElementById(identifiant);
  if (element) {
    element.textContent = String(valeur);
  }
}


function reinitialiserFiltresStatistiques() {
  const periode = document.getElementById('periodeStatistiques');
  if (periode) {
    periode.value = 'ANNEE_EN_COURS';
  }
  ['formationStatistiques', 'formateurStatistiques'].forEach(
    function (identifiant) {
      const element = document.getElementById(identifiant);
      if (element) {
        element.value = '';
      }
    }
  );
  [
    'inclureFormateursSansActiviteStatistiques',
    'inclureItemsInactifsStatistiques'
  ].forEach(function (identifiant) {
    const element = document.getElementById(identifiant);
    if (element) {
      element.checked = false;
    }
  });
  definirDatesPeriodeStatistiques_('ANNEE_EN_COURS');
  chargerStatistiques(true);
}


function afficherErreurStatistiques_(message) {
  afficherToast(message, true);
  const zone = document.getElementById('avertissementsStatistiques');
  if (zone) {
    zone.classList.remove('masque');
    zone.innerHTML = '<strong>Calcul impossible</strong><p>' +
      echapperHtml(message) + '</p>';
  }
}

</script>

function activerDiagnosticConnexionProchaineConnexion() {
  if (
    !estAdministrateurApplication() ||
    !obtenirJetonAdministrateurApplication()
  ) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  try {
    sessionStorage.setItem(
      CLE_DIAGNOSTIC_CONNEXION_PROCHAINE_,
      '1'
    );
  } catch (erreur) {
    afficherToast(
      'Le navigateur refuse l’activation temporaire du diagnostic.',
      true
    );
    return;
  }

  const zone = document.getElementById(
    'resultatDiagnosticConnexionAdministration'
  );
  if (zone) {
    zone.className = 'avertissement-diagnostic-administration';
    zone.textContent =
      'Diagnostic activé pour une seule tentative. Déconnecte la session formateur, ou verrouille un accès admin direct, puis connecte le formateur à mesurer.';
  }
  afficherToast(
    'Diagnostic activé pour la prochaine connexion formateur.',
    false
  );
}


function afficherDiagnosticConnexionAdministration_() {
  const zone = document.getElementById(
    'resultatDiagnosticConnexionAdministration'
  );
  if (!zone) return;

  const rapport = etatApplication.dernierDiagnosticConnexion;
  if (!rapport) {
    zone.className = 'etat-vide';
    zone.textContent =
      'Aucune mesure de connexion disponible dans cette session navigateur.';
    return;
  }

  const serveur = rapport.serveur || {};
  const client = rapport.client || {};
  const sessionServeur = Number(serveur.creationSessionMs || 0) +
    Number(serveur.ecritureScriptPropertiesMs || 0);
  const contexte = Number(
    serveur.constructionContexteUtilisateurMs || 0
  ) + Number(client.chargementContexteUtilisateurMs || 0);

  zone.className = '';
  zone.innerHTML = `
    <div class="grille-diagnostic-administration">
      ${creerCarteDiagnosticConnexion_(
        'PBKDF2 + pepper',
        serveur.derivationPbkdf2PepperMs
      )}
      ${creerCarteDiagnosticConnexion_(
        'Session serveur',
        sessionServeur
      )}
      ${creerCarteDiagnosticConnexion_(
        'Contexte utilisateur',
        contexte
      )}
      ${creerCarteDiagnosticConnexion_(
        'Chargement accueil',
        client.chargementAccueilMs
      )}
      ${creerCarteDiagnosticConnexion_(
        'Rendu client',
        client.renduClientMs
      )}
      ${creerCarteDiagnosticConnexion_(
        'Total interface utilisable',
        client.totalJusquaInterfaceUtilisableMs
      )}
    </div>
    <details class="details-diagnostic-connexion-administration">
      <summary>Détail complet des mesures</summary>
      <div class="liste-diagnostic-connexion-administration">
        ${creerLignesDiagnosticConnexion_(serveur, 'Serveur')}
        ${creerLignesDiagnosticConnexion_(client, 'Client')}
      </div>
    </details>
  `;
}


function creerCarteDiagnosticConnexion_(libelle, duree) {
  return `
    <article class="carte-diagnostic-administration">
      <span>${echapperHtml(libelle)}</span>
      <strong>${formaterDureeDiagnosticConnexion_(duree)}</strong>
    </article>
  `;
}


function creerLignesDiagnosticConnexion_(metriques, origine) {
  return Object.keys(metriques || {}).map(function (cle) {
    return `
      <div>
        <span>${echapperHtml(origine + ' · ' + cle)}</span>
        <strong>${formaterDureeDiagnosticConnexion_(metriques[cle])}</strong>
      </div>
    `;
  }).join('');
}


function formaterDureeDiagnosticConnexion_(duree) {
  const valeur = Number(duree);
  return Number.isFinite(valeur) && valeur >= 0
    ? Math.round(valeur).toLocaleString('fr-FR') + ' ms'
    : 'Non mesuré';
}


function mettreAJourDisponibiliteBenchmarkPbkdf2Administration_(
  sessionValidee
) {
  const bouton = document.getElementById(
    'boutonBenchmarkPbkdf2Administration'
  );
  if (!bouton) return;

  const disponible = Boolean(
    sessionValidee &&
    estAdministrateurApplication() &&
    obtenirJetonAdministrateurApplication() &&
    !etatApplication.benchmarkPbkdf2AdministrationEnCours
  );
  bouton.disabled = !disponible;
  bouton.textContent = etatApplication.benchmarkPbkdf2AdministrationEnCours
    ? 'Benchmark en cours…'
    : 'Tester les performances PBKDF2';
}


function executerBenchmarkPbkdf2Administration() {
  const bouton = document.getElementById(
    'boutonBenchmarkPbkdf2Administration'
  );
  const zone = document.getElementById(
    'resultatBenchmarkPbkdf2Administration'
  );
  const jetonAdministrateur =
    obtenirJetonAdministrateurApplication();

  if (
    !bouton ||
    !zone ||
    etatApplication.benchmarkPbkdf2AdministrationEnCours
  ) {
    return;
  }

  if (!estAdministrateurApplication() || !jetonAdministrateur) {
    bouton.disabled = true;
    afficherErreurBenchmarkPbkdf2Administration_(
      'Une session administrateur valide est nécessaire pour lancer ce test.'
    );
    return;
  }

  etatApplication.benchmarkPbkdf2AdministrationEnCours = true;
  bouton.disabled = true;
  bouton.textContent = 'Benchmark en cours…';
  zone.classList.remove('masque');
  zone.innerHTML = `
    <div class="etat-vide">
      Mesure en cours sur le runtime Apps Script…
    </div>
  `;

  google.script.run
    .withSuccessHandler(function (resultat) {
      etatApplication.benchmarkPbkdf2AdministrationEnCours = false;
      afficherResultatsBenchmarkPbkdf2Administration_(resultat || {});
      mettreAJourDisponibiliteBenchmarkPbkdf2Administration_(true);
    })
    .withFailureHandler(function (erreur) {
      etatApplication.benchmarkPbkdf2AdministrationEnCours = false;
      const messageServeur = extraireMessageErreur(erreur);
      const sessionRefusee = String(messageServeur || '').includes(
        'Accès réservé à l’administrateur.'
      );
      const messagePublic = sessionRefusee
        ? 'La session administrateur a expiré ou a été verrouillée. Déverrouille de nouveau l’administration.'
        : 'Le benchmark PBKDF2 n’a pas pu être exécuté sur le runtime Apps Script. Réessaie ultérieurement.';
      afficherErreurBenchmarkPbkdf2Administration_(
        messagePublic
      );
      afficherToast(messagePublic, true);
      mettreAJourDisponibiliteBenchmarkPbkdf2Administration_(
        !sessionRefusee
      );
    })
    .benchmarkerDerivationMotDePasseFormateur(
      jetonAdministrateur
    );
}


function afficherResultatsBenchmarkPbkdf2Administration_(resultat) {
  const zone = document.getElementById(
    'resultatBenchmarkPbkdf2Administration'
  );
  if (!zone) return;

  const durees = resultat && resultat.durees
    ? resultat.durees
    : {};
  const iterationsConfiguration = Number(
    resultat && resultat.iterationsConfiguration
  );
  const configurationDisponible = Number.isInteger(
    iterationsConfiguration
  ) && iterationsConfiguration > 0;
  const iterations = [500, 1000, 1500, 2000];

  zone.className = '';
  zone.innerHTML = `
    <div class="grille-diagnostic-administration">
      ${iterations.map(function (nombreIterations) {
        const duree = durees[String(nombreIterations)];
        const mesureDisponible = typeof duree === 'number' &&
          Number.isFinite(duree) && duree >= 0;
        return `
          <article class="carte-diagnostic-administration">
            <span>${nombreIterations.toLocaleString('fr-FR')} itérations</span>
            <strong>${mesureDisponible
              ? Math.round(duree).toLocaleString('fr-FR') + ' ms'
              : 'Non mesuré'}</strong>
          </article>
        `;
      }).join('')}
    </div>
    <p class="avertissement-diagnostic-administration">
      Configuration actuellement utilisée :
      <strong>${configurationDisponible
        ? iterationsConfiguration.toLocaleString('fr-FR') + ' itérations'
        : 'Non disponible'}</strong>
    </p>
  `;
}


function afficherErreurBenchmarkPbkdf2Administration_(message) {
  const zone = document.getElementById(
    'resultatBenchmarkPbkdf2Administration'
  );
  if (!zone) return;

  zone.className = 'erreur-sauvegarde-administration';
  zone.innerHTML = `
    <strong>Benchmark interrompu</strong>
    <span>${echapperHtml(message)}</span>
  `;
}


function ouvrirReinitialisationProduction() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const modal = document.getElementById(
    'modalReinitialisationProduction'
  );
  if (!modal) return;

  etatApplication.reinitialisationProduction = {
    preview: null,
    resultat: null,
    enCours: true,
    rafraichirApresFermeture: false
  };

  const boutonFermer = document.getElementById(
    'boutonFermerReinitialisationProduction'
  );
  const boutonAnnuler = document.getElementById(
    'boutonAnnulerReinitialisationProduction'
  );
  const boutonConfirmer = document.getElementById(
    'boutonConfirmerReinitialisationProduction'
  );
  if (boutonFermer) boutonFermer.disabled = true;
  if (boutonAnnuler) boutonAnnuler.classList.remove('masque');
  if (boutonConfirmer) {
    boutonConfirmer.onclick =
      confirmerEtExecuterReinitialisationProduction;
  }

  document.getElementById(
    'texteConfirmationReinitialisationProduction'
  ).value = '';
  document.getElementById(
    'motDePasseReinitialisationProduction'
  ).value = '';
  document.getElementById(
    'confirmationReinitialisationProduction'
  ).classList.add('masque');
  document.getElementById(
    'contenuReinitialisationProduction'
  ).innerHTML = `
    <div class="etat-vide">
      Analyse des données métier et des références…
    </div>
  `;

    true,
    'Prévisualisation…',
    'bouton-danger'
  );

  modal.classList.remove('masque');
  document.body.classList.add('modal-ouverte');

  google.script.run
    .withSuccessHandler(function (preview) {

      if (!etat) return;
      etat.preview = preview;
      etat.enCours = false;
      afficherPrevisualisationReinitialisationProduction_(preview);
      document.getElementById(
        'confirmationReinitialisationProduction'
      ).classList.remove('masque');
      configurerBoutonsReinitialisationProduction_(
        false,
        'Confirmer la mise en production',
        'bouton-danger'
      );
      if (boutonFermer) boutonFermer.disabled = false;
      mettreAJourConfirmationReinitialisationProduction();

    .withFailureHandler(function (erreur) {
      afficherErreurReinitialisationProduction_(
        extraireMessageErreur(erreur)
      );

      obtenirJetonAdministrateurApplication()

    'boutonConfirmerReinitialisationProduction'

function confirmerEtExecuterReinitialisationProduction() {
  const etat = etatApplication.reinitialisationProduction;
  if (!etat || !etat.preview || etat.enCours) return;

  const champMotDePasse = document.getElementById(
    'motDePasseReinitialisationProduction'
  );
  let motDePasse = String(champMotDePasse?.value || '');
  const texte = String(document.getElementById(
    'texteConfirmationReinitialisationProduction'
  )?.value || '').trim();

  etat.enCours = true;
  if (champMotDePasse) champMotDePasse.value = '';
  document.getElementById(
    'boutonFermerReinitialisationProduction'
  ).disabled = true;
  configurerBoutonsReinitialisationProduction_(
    true,
    'Validation du mot de passe…',
    'bouton-danger'
  );

  google.script.run
    .withSuccessHandler(function (confirmation) {
      motDePasse = '';
      executerReinitialisationProduction_(
        confirmation.confirmationId
      );
    })
    .withFailureHandler(function (erreur) {
      motDePasse = '';
      afficherErreurReinitialisationProduction_(
        extraireMessageErreur(erreur)
      );
    })
    .confirmerReinitialisationProduction(
      etat.preview.previewId,
      texte,
      motDePasse,
      obtenirJetonAdministrateurApplication()
    );
}

    'contenuReinitialisationProduction'
  ).innerHTML = `
    <div class="etat-vide">
      Sauvegarde complète, suppression transactionnelle et diagnostic final…
    </div>
  `;
  configurerBoutonsReinitialisationProduction_(

function afficherDiagnosticBaseAdministration(rapport) {
  rapport = rapport || {};
  const resume = rapport.resume || {};
  const migrations = Array.isArray(rapport.migrations)
    ? rapport.migrations
    : [];
  const feuilles = Array.isArray(rapport.feuilles)
    ? rapport.feuilles
    : [];
  const erreurs = Array.isArray(rapport.erreurs)
    ? rapport.erreurs
    : [];
  const valeurs = {
    versionSchemaAdministration:
      String(rapport.versionSchema || 0) +
      ' / ' + String(rapport.versionCible || 0),
    nombreMigrationsAdministration:
      migrations.filter(function (migration) {
        return migration.executee;
      }).length + ' / ' + migrations.length,
    integriteFeuillesAdministration:
      Number(resume.feuillesConformes || 0) +
      ' / ' + Number(resume.nombreFeuilles || feuilles.length),
    nombreErreursAdministration:
      String(Number(resume.totalErreurs || erreurs.length))
  };

  Object.keys(valeurs).forEach(function (identifiant) {
    const element = document.getElementById(identifiant);

    if (element) {
      element.textContent = valeurs[identifiant];
    }
  });

  const listeMigrations = document.getElementById(
    'listeMigrationsAdministration'
  );

  if (listeMigrations) {
    listeMigrations.innerHTML = migrations.length
      ? migrations.map(function (migration) {
        return `
          <div class="ligne-diagnostic-administration ${migration.executee ? 'diagnostic-ok' : 'diagnostic-attente'}">
            <span>${migration.executee ? '✔' : '○'}</span>
            <span>
              <strong>Migration ${Number(migration.version) || 0}</strong>
              <small>${echapperHtml(migration.nom || '')}</small>
            </span>
          </div>
        `;
      }).join('')
      : '<div class="etat-vide">Aucune migration déclarée.</div>';
  }

  const listeFeuilles = document.getElementById(
    'listeFeuillesAdministration'
  );

  if (listeFeuilles) {
    listeFeuilles.innerHTML = feuilles.map(function (feuille) {
      return `
        <div class="ligne-diagnostic-administration ${feuille.conforme ? 'diagnostic-ok' : 'diagnostic-erreur'}">
          <span>${feuille.conforme ? '✔' : '!'}</span>
          <span>
            <strong>${echapperHtml(feuille.nom || '')}</strong>
            <small>
              ${feuille.conforme
                ? Number(feuille.nombreLignes || 0) + ' ligne(s) de données'
                : 'Colonnes manquantes : ' + echapperHtml(
                  (feuille.colonnesManquantes || []).join(', ')
                )}
            </small>
          </span>
        </div>
      `;
    }).join('');
  }

  const listeErreurs = document.getElementById(
    'listeErreursAdministration'
  );

  if (listeErreurs) {
    if (!erreurs.length) {
      listeErreurs.innerHTML = `
        <div class="etat-integrite-valide-administration">
          ✔ Aucune erreur d’intégrité détectée.
        </div>
      `;
    } else {
      listeErreurs.innerHTML = `
        <div class="liste-erreurs-integrite-administration">
          ${erreurs.map(function (erreur) {
            return `
              <div>
                <strong>${echapperHtml(erreur.feuille || erreur.type || 'Erreur')}</strong>
                <span>${echapperHtml(erreur.message || '')}</span>
              </div>
            `;
          }).join('')}
        </div>
        ${rapport.limiteErreursAtteinte
          ? '<p class="avertissement-diagnostic-administration">Le rapport est limité aux 500 premières erreurs.</p>'
          : ''}
      `;
    }
  }
}

function telechargerDerniereSauvegardeAdministration() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const etat = etatApplication.sauvegardesAdministration || {};
  const sauvegarde = etat.derniereSauvegarde;
  const bouton = document.getElementById(
    'boutonTelechargerDerniereSauvegarde'
  );

  if (!sauvegarde || !sauvegarde.backupId) {
    afficherToast('Aucune sauvegarde à télécharger.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Vérification…';
  }

  definirEtatProgressionSauvegardeAdministration_(
    'Vérification du fichier et création du jeton temporaire…',
    'en-cours'
  );

  google.script.run
    .withSuccessHandler(function (autorisation) {
      definirEtatProgressionSauvegardeAdministration_(
        'Téléchargement sécurisé du JSON original…',
        'en-cours'
      );

      google.script.run
        .withSuccessHandler(function (fichier) {
          try {
            declencherTelechargementSauvegarde_(fichier);
            definirEtatProgressionSauvegardeAdministration_(
              'Téléchargement préparé. Le jeton à usage unique a été invalidé.',
              'succes'
            );
            afficherToast('Téléchargement prêt.', false);
          } catch (erreur) {
            const message = extraireMessageErreur(erreur);
            definirEtatProgressionSauvegardeAdministration_(
              message,
              'erreur'
            );
            afficherToast(message, true);
          } finally {
            if (bouton) {
              bouton.disabled = false;
              bouton.textContent =
                'Télécharger la dernière sauvegarde';
            }
          }
        })
        .withFailureHandler(function (erreur) {
          if (bouton) {
            bouton.disabled = false;
            bouton.textContent =
              'Télécharger la dernière sauvegarde';
          }

          const message = extraireMessageErreur(erreur);
          definirEtatProgressionSauvegardeAdministration_(
            message,
            'erreur'
          );
          afficherToast(message, true);
        })
        .telechargerSauvegarde(
          autorisation.token,
          obtenirJetonAdministrateurApplication()
        );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent =
          'Télécharger la dernière sauvegarde';
      }

      const message = extraireMessageErreur(erreur);
      definirEtatProgressionSauvegardeAdministration_(
        message,
        'erreur'
      );
      afficherToast(message, true);
    })
    .preparerTelechargementSauvegarde(
      sauvegarde.backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function declencherTelechargementSauvegarde_(fichier) {
  const binaire = window.atob(fichier.contentBase64 || '');
  const octets = new Uint8Array(binaire.length);

  for (let i = 0; i < binaire.length; i++) {
    octets[i] = binaire.charCodeAt(i);
  }

  const blob = new Blob(
    [octets],
    { type: fichier.mimeType || 'application/json' }
  );
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');

  lien.href = url;
  lien.download = fichier.fileName || 'PrepFormation.json';
  lien.style.display = 'none';
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  window.setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 1000);
}


function definirEtatProgressionSauvegardeAdministration_(
  message,
  statut
) {
  const zone = document.getElementById(

  );

  if (!zone) {
    return;
  }

  zone.textContent = message;
  zone.dataset.statut = statut || '';
}


function formaterTailleSauvegardeAdministration_(octets) {
  const taille = Math.max(0, Number(octets) || 0);

  if (taille < 1024) {
    return taille + ' octet' + (taille > 1 ? 's' : '');
  }

  if (taille < 1024 * 1024) {
    return (taille / 1024).toFixed(1).replace('.', ',') + ' Ko';
  }

  return (taille / (1024 * 1024))
    .toFixed(2)
    .replace('.', ',') + ' Mo';
}


function formaterDateSauvegardeAdministration_(valeur) {
  const date = new Date(valeur);

  if (Number.isNaN(date.getTime())) {
    return String(valeur || 'Date inconnue');
  }

  return date.toLocaleString('fr-FR', {
    dateStyle: 'short',
    timeStyle: 'short'
  });
}


function afficherPlanificationSauvegardesAdministration(config) {
  config = config || {};
  const frequence = document.getElementById(
    'frequenceSauvegardesAutomatiques'
  );
  const heure = document.getElementById(
    'heureSauvegardesAutomatiques'
  );
  const jour = document.getElementById(
    'jourSauvegardesAutomatiques'
  );
  const retention = document.getElementById(
    'retentionSauvegardesAutomatiques'
  );
  const badge = document.getElementById(
    'badgeEtatPlanificationSauvegardes'
  );
  const etat = document.getElementById(
    'etatPlanificationSauvegardesAdministration'
  );

  if (frequence) {
    frequence.value = config.mode || 'DESACTIVE';
  }

  if (heure) {
    heure.value = Number(config.heure || 0);
  }

  if (jour) {
    jour.value = config.jourHebdomadaire || 'LUNDI';
  }

  if (retention) {
    retention.value = String(config.retention || 10);
  }

  mettreAJourVisibilitePlanificationSauvegardes();

  const active = config.mode && config.mode !== 'DESACTIVE';
  const coherent = config.configurationCoherente !== false;

  if (badge) {
    badge.textContent = active
      ? (coherent ? 'Active' : 'À vérifier')
      : 'Désactivée';
    badge.className = 'badge-sauvegarde ' + (
      active && coherent
        ? 'badge-sauvegarde-conforme'
        : 'badge-sauvegarde-anomalies'
    );
  }

  if (etat) {
    etat.innerHTML = `
      <div><span>Fréquence</span><strong>${echapperHtml(libelleFrequenceSauvegardeAutomatique_(config.mode))}</strong></div>
      <div><span>Prochaine exécution estimée</span><strong>${config.prochaineExecutionEstimee ? echapperHtml(formaterDateSauvegardeAdministration_(config.prochaineExecutionEstimee)) : '—'}</strong></div>
      <div><span>Dernière exécution</span><strong>${config.lastExecutionAt ? echapperHtml(formaterDateSauvegardeAdministration_(config.lastExecutionAt)) : 'Jamais'}</strong></div>
      <div><span>Dernier résultat</span><strong>${echapperHtml(config.lastResult || 'JAMAIS_EXECUTEE')}${config.lastDurationMs ? ' · ' + Number(config.lastDurationMs) + ' ms' : ''}</strong></div>
      <p>${echapperHtml(config.lastMessage || config.precisionHoraire || 'Les horaires Apps Script sont approximatifs.')}</p>
      ${!coherent ? '<p class="avertissement-planification-sauvegardes">La configuration et les déclencheurs installés ne correspondent pas. Enregistre à nouveau la configuration.</p>' : ''}
    `;
  }

  const boutonDesactiver = document.getElementById(
    'boutonDesactiverSauvegardesAutomatiques'
  );

  if (boutonDesactiver) {
    boutonDesactiver.disabled = !active &&
      !Number(config.nombreDeclencheursPrepFormation || 0);
  }
}


function libelleFrequenceSauvegardeAutomatique_(mode) {
  const libelles = {
    DESACTIVE: 'Désactivées',
    TOUTES_LES_6_HEURES: 'Toutes les 6 heures',
    TOUTES_LES_12_HEURES: 'Toutes les 12 heures',
    QUOTIDIENNE: 'Tous les jours',
    HEBDOMADAIRE: 'Toutes les semaines'
  };

  return libelles[mode] || 'Désactivées';
}


function mettreAJourVisibilitePlanificationSauvegardes() {
  const frequence = document.getElementById(
    'frequenceSauvegardesAutomatiques'
  );
  const mode = frequence ? frequence.value : 'DESACTIVE';
  const champHeure = document.getElementById(
    'champHeureSauvegardesAutomatiques'
  );
  const champJour = document.getElementById(
    'champJourSauvegardesAutomatiques'
  );

  champHeure?.classList.toggle(
    'masque',
    !['QUOTIDIENNE', 'HEBDOMADAIRE'].includes(mode)
  );
  champJour?.classList.toggle(
    'masque',
    mode !== 'HEBDOMADAIRE'
  );
}


function enregistrerPlanificationSauvegardesAdministration() {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const bouton = document.getElementById(
    'boutonEnregistrerSauvegardesAutomatiques'
  );
  const configuration = {
    mode: document.getElementById(
      'frequenceSauvegardesAutomatiques'
    )?.value || 'DESACTIVE',
    heure: Number(document.getElementById(
      'heureSauvegardesAutomatiques'
    )?.value || 0),
    jourHebdomadaire: document.getElementById(
      'jourSauvegardesAutomatiques'
    )?.value || 'LUNDI',
    retention: Number(document.getElementById(
      'retentionSauvegardesAutomatiques'
    )?.value || 10)
  };

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Enregistrement…';
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Enregistrer';
      }

      etatApplication.sauvegardesAdministration =
        etatApplication.sauvegardesAdministration || {};
      etatApplication.sauvegardesAdministration.planification = resultat;
      afficherPlanificationSauvegardesAdministration(resultat);
      afficherToast('Planification enregistrée.', false);
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Enregistrer';
      }

      afficherToast(extraireMessageErreur(erreur), true);
    })
    .enregistrerConfigurationSauvegardesAutomatiques(
      configuration,
      obtenirJetonAdministrateurApplication()
    );
}


function desactiverSauvegardesAutomatiquesAdministration() {
  if (!window.confirm(
    'Désactiver les sauvegardes automatiques et retirer le déclencheur PrepFormation ?'
  )) {
    return;
  }

  const bouton = document.getElementById(
    'boutonDesactiverSauvegardesAutomatiques'
  );

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Désactivation…';
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (bouton) {
        bouton.textContent = 'Désactiver';
      }

      etatApplication.sauvegardesAdministration =
        etatApplication.sauvegardesAdministration || {};
      etatApplication.sauvegardesAdministration.planification = resultat;
      afficherPlanificationSauvegardesAdministration(resultat);
      afficherToast('Sauvegardes automatiques désactivées.', false);
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Désactiver';
      }

      afficherToast(extraireMessageErreur(erreur), true);
    })
    .desactiverSauvegardesAutomatiques(
      obtenirJetonAdministrateurApplication()
    );
}


function afficherInventaireSauvegardesAdministration(inventaire) {
  const zone = document.getElementById(
    'listeSauvegardesRestaurabiliteAdministration'
  );
  if (!zone) {
    return;
  }

  inventaire = inventaire || {};

  document.querySelectorAll('[data-filtre-sauvegarde]').forEach(
    function (bouton) {
      bouton.classList.toggle(
        'actif',
        bouton.dataset.filtreSauvegarde ===
          etatApplication.filtreSauvegardesAdministration
      );
    }
  );

  afficherResumeInventaireSauvegardesAdministration_(
    inventaire.resume || {}
  );

  if (inventaire.erreur) {
    zone.innerHTML = `
      <div class="erreur-sauvegarde-administration">
        <strong>Inventaire indisponible</strong>
        <span>${echapperHtml(inventaire.erreur)}</span>
      </div>
    `;
    return;
  }

  const toutesLesSauvegardes = Array.isArray(inventaire.sauvegardes)
    ? inventaire.sauvegardes
    : [];
  const sauvegardes = filtrerListeSauvegardesAdministration_(
    toutesLesSauvegardes,
    etatApplication.filtreSauvegardesAdministration
  );

  if (!toutesLesSauvegardes.length) {
    zone.innerHTML = `
      <div class="etat-vide etat-vide-sauvegarde">
        Aucune sauvegarde JSON valide pour cette installation.
      </div>
    `;
    return;
  }

  if (!sauvegardes.length) {
    zone.innerHTML = `
      <div class="etat-vide etat-vide-sauvegarde">
        Aucune sauvegarde ne correspond à ce filtre.
      </div>
    `;
    return;
  }

  zone.innerHTML = `
    ${Number(inventaire.fichiersIgnores || 0) > 0
      ? `<div class="avertissement-inventaire-sauvegardes">
          ${Number(inventaire.fichiersIgnores)} fichier(s) JSON invalide(s), incomplet(s) ou étrangers à l’installation ont été ignorés.
        </div>`
      : ''}
    ${sauvegardes.map(function (sauvegarde) {
      const counts = sauvegarde.counts || {};
      const statut = sauvegarde.rapportObsolete
        ? 'OBSOLETE'
        : (sauvegarde.statutRestaurabilite || 'NON_TESTEE');
      const id = echapperHtml(sauvegarde.backupId || '');

      return `
        <article class="carte-inventaire-sauvegarde">
          <div class="entete-carte-inventaire-sauvegarde">
            <div>
              <span class="sur-titre-sauvegarde">
                ${echapperHtml(sauvegarde.type || 'MANUELLE')}
              </span>
              <h4>${echapperHtml(
                formaterDateSauvegardeAdministration_(
                  sauvegarde.createdAt
                )
              )}</h4>
              <p>${echapperHtml(
                sauvegarde.comment || 'Sans commentaire'
              )}</p>
            </div>
            <div class="badges-resultat-sauvegarde">
              <span class="badge-sauvegarde ${sauvegarde.integrityStatus === 'CONFORME' ? 'badge-sauvegarde-conforme' : 'badge-sauvegarde-anomalies'}">
                ${sauvegarde.integrityStatus === 'CONFORME'
                  ? 'Conforme'
                  : 'Avec anomalies'}
              </span>
              ${construireBadgeRestaurabiliteAdministration_(statut)}
            </div>
          </div>

          <div class="metadonnees-inventaire-sauvegarde">
            <span>App <strong>${echapperHtml(sauvegarde.applicationVersion)}</strong></span>
            <span>Schéma <strong>${echapperHtml(sauvegarde.schemaVersion)}</strong></span>
            <span><strong>${Number(sauvegarde.nombreFeuilles || 0)}</strong> feuilles</span>
            <span><strong>${Number(counts.totalRows || 0).toLocaleString('fr-FR')}</strong> lignes</span>
            <span><strong>${Number(counts.totalCells || 0).toLocaleString('fr-FR')}</strong> cellules</span>
            <span><strong>${echapperHtml(
              formaterTailleSauvegardeAdministration_(
                sauvegarde.fileSizeBytes
              )
            )}</strong></span>
          </div>

          <div class="compteurs-inventaire-sauvegarde">
            ${construireCompteurSauvegardeAdministration_('Stagiaires', counts.stagiaires)}
            ${construireCompteurSauvegardeAdministration_('Formateurs', counts.formateurs)}
            ${construireCompteurSauvegardeAdministration_('Séances', counts.sessions)}
            ${construireCompteurSauvegardeAdministration_('Évaluations', counts.evaluations)}
          </div>

          <div class="pied-carte-inventaire-sauvegarde">
            <span>
              ${sauvegarde.derniereDateTest
                ? 'Dernier test : ' + echapperHtml(
                  formaterDateSauvegardeAdministration_(
                    sauvegarde.derniereDateTest
                  )
                )
                : 'Aucun test de restaurabilité'}
            </span>
            <div class="actions-carte-inventaire-sauvegarde">
              <button type="button" class="bouton-secondaire" onclick="consulterSauvegardeRestaurabiliteAdministration('${id}')">Consulter</button>
              <button type="button" class="bouton-secondaire" onclick="telechargerSauvegardeInventaireAdministration('${id}', this)">Télécharger</button>
              <button type="button" class="bouton-principal" onclick="testerSauvegardeRestaurabiliteAdministration('${id}', this)">Tester la restauration</button>
              <button
                type="button"
                class="bouton-danger"
                data-restauration-action="true"
                onclick="preparerRestaurationAdministration('${id}', this)"
                ${sauvegarde.restaurationAutorisee ? '' : 'disabled'}
                title="${sauvegarde.restaurationAutorisee ? 'Prévisualiser puis restaurer' : 'Un test concluant et actuel est obligatoire'}"
              >Préparer la restauration</button>
              <button
                type="button"
                class="bouton-danger bouton-suppression-sauvegarde"
                onclick="ouvrirSuppressionSauvegardeAdministration('${id}')"
                ${sauvegarde.suppressionAutorisee === false ? 'disabled' : ''}
                title="${sauvegarde.protegeeOperationActive ? 'Sauvegarde protégée par une restauration active' : 'Placer dans la corbeille Drive'}"
              >Supprimer</button>
            </div>
          </div>
        </article>
      `;
    }).join('')}
  `;
}


function afficherResumeInventaireSauvegardesAdministration_(resume) {
  const zone = document.getElementById(
    'resumeInventaireSauvegardesAdministration'
  );

  if (!zone) {
    return;
  }

  resume = resume || {};
  zone.innerHTML = `
    <div><strong>${Number(resume.nombreTotal || 0).toLocaleString('fr-FR')}</strong><span>Sauvegardes</span></div>
    <div><strong>${echapperHtml(formaterTailleSauvegardeAdministration_(resume.espaceTotalOctets))}</strong><span>Espace total</span></div>
    <div><strong>${resume.plusAncienne ? echapperHtml(formaterDateSauvegardeAdministration_(resume.plusAncienne)) : '—'}</strong><span>Plus ancienne</span></div>
    <div><strong>${resume.plusRecente ? echapperHtml(formaterDateSauvegardeAdministration_(resume.plusRecente)) : '—'}</strong><span>Plus récente</span></div>
  `;
}


function filtrerListeSauvegardesAdministration_(sauvegardes, filtre) {
  const typeParFiltre = {
    MANUELLES: 'MANUELLE',
    AUTOMATIQUES: 'AUTO_PLANIFIEE',
    SECURITE: 'AUTO_AVANT_RESTAURATION'
  };
  const type = typeParFiltre[filtre];

  return type
    ? sauvegardes.filter(function (sauvegarde) {
      return sauvegarde.type === type;
    })
    : sauvegardes.slice();
}


function filtrerSauvegardesAdministration(filtre) {
  etatApplication.filtreSauvegardesAdministration = filtre || 'TOUTES';

  document.querySelectorAll('[data-filtre-sauvegarde]').forEach(
    function (bouton) {
      bouton.classList.toggle(
        'actif',
        bouton.dataset.filtreSauvegarde ===
          etatApplication.filtreSauvegardesAdministration
      );
    }
  );

  afficherInventaireSauvegardesAdministration(
    ((etatApplication.sauvegardesAdministration || {}).inventaire) || {}
  );
}


function construireBadgeRestaurabiliteAdministration_(statut) {
  const libelles = {
    RESTAURABLE: 'Restaurable',
    RESTAURABLE_AVEC_MIGRATIONS: 'Restaurable avec migrations',
    NON_RESTAURABLE: 'Non restaurable',
    AVEC_AVERTISSEMENTS: 'Avec avertissements',
    OBSOLETE: 'Test obsolète',
    NON_TESTEE: 'Non testée'
  };

  return `
    <span class="badge-restaurabilite badge-restaurabilite-${echapperHtml(
      String(statut || 'NON_TESTEE').toLowerCase().replace(/_/g, '-')
    )}">
      ${echapperHtml(libelles[statut] || statut || 'Non testée')}
    </span>
  `;
}


function actualiserInventaireSauvegardesAdministration(
  afficherNotification
) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  const zone = document.getElementById(
    'listeSauvegardesRestaurabiliteAdministration'
  );

  if (zone) {
    zone.innerHTML = '<div class="etat-vide">Vérification des fichiers Drive…</div>';
  }

  google.script.run
    .withSuccessHandler(function (inventaire) {
      etatApplication.sauvegardesAdministration =
        etatApplication.sauvegardesAdministration || {};
      etatApplication.sauvegardesAdministration.inventaire =
        inventaire;
      afficherInventaireSauvegardesAdministration(inventaire);

      if (afficherNotification !== false) {
        afficherToast('Inventaire actualisé.', false);
      }
    })
    .withFailureHandler(function (erreur) {
      const message = extraireMessageErreur(erreur);

      afficherInventaireSauvegardesAdministration({
        sauvegardes: [],
        erreur: message
      });
      afficherToast(message, true);
    })
    .listerSauvegardesRestaurabilite(
      obtenirJetonAdministrateurApplication()
    );
}


function consulterSauvegardeRestaurabiliteAdministration(backupId) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  ouvrirModalRestaurabiliteSauvegarde_(
    'Consultation de la sauvegarde',
    'Vérification du JSON signé en cours…'
  );

  google.script.run
    .withSuccessHandler(function (consultation) {
      etatApplication.backupIdRestaurabiliteActif = backupId;
      etatApplication.consultationRestaurabiliteActive = consultation;
      afficherConsultationSauvegardeRestaurabilite_(consultation);
    })
    .withFailureHandler(function (erreur) {
      const message = extraireMessageErreur(erreur);

      afficherErreurModalRestaurabilite_(message);
      afficherToast(message, true);
    })
    .consulterSauvegardeRestaurabilite(
      backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function testerSauvegardeRestaurabiliteAdministration(
  backupId,
  bouton
) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Test en cours…';
  }

  ouvrirModalRestaurabiliteSauvegarde_(
    'Test de restaurabilité',
    'Validation, migrations en mémoire et comparaison avec la base actuelle…'
  );
  definirEtatProgressionSauvegardeAdministration_(
    'Test de restaurabilité en lecture seule…',
    'en-cours'
  );

  google.script.run
    .withSuccessHandler(function (rapport) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Tester la restauration';
      }

      etatApplication.backupIdRestaurabiliteActif = backupId;
      afficherRapportRestaurabiliteSauvegarde_(rapport);
      definirEtatProgressionSauvegardeAdministration_(
        rapport.statut === 'NON_RESTAURABLE'
          ? 'Test terminé : sauvegarde non restaurable.'
          : 'Test de restaurabilité terminé.',
        rapport.statut === 'NON_RESTAURABLE'
          ? 'erreur'
          : (rapport.statut === 'AVEC_AVERTISSEMENTS'
            ? 'avertissement'
            : 'succes')
      );
      actualiserInventaireSauvegardesAdministration(false);
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Tester la restauration';
      }

      const message = extraireMessageErreur(erreur);

      afficherErreurModalRestaurabilite_(message);
      definirEtatProgressionSauvegardeAdministration_(
        message,
        'erreur'
      );
      afficherToast(message, true);
    })
    .testerRestaurabiliteSauvegarde(
      backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function telechargerSauvegardeInventaireAdministration(
  backupId,
  bouton
) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Vérification…';
  }

  google.script.run
    .withSuccessHandler(function (autorisation) {
      google.script.run
        .withSuccessHandler(function (fichier) {
          declencherTelechargementSauvegarde_(fichier);

          if (bouton) {
            bouton.disabled = false;
            bouton.textContent = 'Télécharger';
          }

          afficherToast('Téléchargement prêt.', false);
        })
        .withFailureHandler(function (erreur) {
          if (bouton) {
            bouton.disabled = false;
            bouton.textContent = 'Télécharger';
          }

          afficherToast(extraireMessageErreur(erreur), true);
        })
        .telechargerSauvegarde(
          autorisation.token,
          obtenirJetonAdministrateurApplication()
        );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Télécharger';
      }

      afficherToast(extraireMessageErreur(erreur), true);
    })
    .preparerTelechargementSauvegarde(
      backupId,
      obtenirJetonAdministrateurApplication()
    );
}


function ouvrirSuppressionSauvegardeAdministration(backupId) {
  const inventaire = (
    (etatApplication.sauvegardesAdministration || {}).inventaire || {}
  );
  const sauvegarde = (inventaire.sauvegardes || []).find(
    function (element) {
      return element.backupId === backupId;
    }
  );

  if (!sauvegarde) {
    afficherToast('Sauvegarde introuvable dans l’inventaire.', true);
    return;
  }

  if (sauvegarde.suppressionAutorisee === false) {
    afficherToast(
      'Cette sauvegarde est protégée par une restauration active.',
      true
    );
    return;
  }

  etatApplication.backupSuppressionAdministration = sauvegarde;
  const resume = document.getElementById(
    'resumeSuppressionSauvegardeAdministration'
  );
  const champ = document.getElementById(
    'confirmationSuppressionSauvegardeAdministration'
  );
  const modal = document.getElementById(
    'modalSuppressionSauvegardeAdministration'
  );

  if (resume) {
    resume.innerHTML = `
      <div><span>Date</span><strong>${echapperHtml(formaterDateSauvegardeAdministration_(sauvegarde.createdAt))}</strong></div>
      <div><span>Type</span><strong>${echapperHtml(sauvegarde.type || '')}</strong></div>
      <div><span>Commentaire</span><strong>${echapperHtml(sauvegarde.comment || 'Sans commentaire')}</strong></div>
    `;
  }

  if (champ) {
    champ.value = '';
  }

  mettreAJourConfirmationSuppressionSauvegardeAdministration();
  modal?.classList.remove('masque');
  document.body.classList.add('modal-ouverte');
  window.setTimeout(function () {
    champ?.focus();
  }, 0);
}


function fermerModalSuppressionSauvegardeAdministration() {
  document.getElementById(
    'modalSuppressionSauvegardeAdministration'
  )?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
  etatApplication.backupSuppressionAdministration = null;
}


function mettreAJourConfirmationSuppressionSauvegardeAdministration() {
  const champ = document.getElementById(
    'confirmationSuppressionSauvegardeAdministration'
  );
  const bouton = document.getElementById(
    'boutonConfirmerSuppressionSauvegardeAdministration'
  );

  if (bouton) {
    bouton.disabled = !champ || champ.value.trim() !== 'SUPPRIMER';
  }
}


function confirmerSuppressionSauvegardeAdministration() {
  const sauvegarde = etatApplication.backupSuppressionAdministration;
  const champ = document.getElementById(
    'confirmationSuppressionSauvegardeAdministration'
  );
  const bouton = document.getElementById(
    'boutonConfirmerSuppressionSauvegardeAdministration'
  );

  if (!sauvegarde || !sauvegarde.backupId) {
    afficherToast('Sauvegarde introuvable.', true);
    return;
  }

  if (!champ || champ.value.trim() !== 'SUPPRIMER') {
    afficherToast('Saisis exactement le mot SUPPRIMER.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Placement dans la corbeille…';
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (bouton) {
        bouton.textContent = 'Placer dans la corbeille';
      }

      fermerModalSuppressionSauvegardeAdministration();
      afficherToast(resultat.message, false);
      initialiserPageAdministration();
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Placer dans la corbeille';
      }

      afficherToast(extraireMessageErreur(erreur), true);
    })
    .supprimerSauvegardeAdministration(
      sauvegarde.backupId,
      champ.value,
      obtenirJetonAdministrateurApplication()
    );
}

function construireListeAlertesRestaurabilite_(elements, erreur) {
  if (!elements.length) {
    return `<div class="${erreur ? 'etat-vide' : 'etat-integrite-valide-administration'}">${erreur ? 'Aucune erreur bloquante.' : '✓ Aucun avertissement.'}</div>`;
  }

  return `<div class="liste-alertes-restaurabilite ${erreur ? 'liste-alertes-restaurabilite-erreurs' : ''}">${elements.map(function (element) {
    return `<div><strong>${echapperHtml(element.code || 'Information')}</strong><span>${echapperHtml(element.message || '')}</span></div>`;
  }).join('')}</div>`;
}


function construireDetailIdentifiantsRestaurabilite_(detail) {
  detail = detail || {};
  const exemples = Array.isArray(detail.exemples)
    ? detail.exemples
    : [];

  if (!Number(detail.total || 0)) {
    return '0';
  }

  return `
    <details>
      <summary>${Number(detail.total)} identifiant(s)</summary>
      <small>${echapperHtml(exemples.join(', '))}${Number(detail.total) > exemples.length ? '…' : ''}</small>
    </details>
  `;
}


function construireDetailColonnesRestaurabilite_(feuille) {
  if (feuille.entetesIdentiques) {
    return 'Identiques';
  }

  const absentes = feuille.colonnesAbsentesActuelles || [];
  const supplementaires =
    feuille.colonnesSupplementairesActuelles || [];

  return `
    <details>
      <summary>Différentes</summary>
      <small>
        Absentes actuellement : ${echapperHtml(absentes.join(', ') || 'aucune')}<br>
        Supplémentaires actuellement : ${echapperHtml(supplementaires.join(', ') || 'aucune')}
      </small>
    </details>
  `;
}


function mettreAJourBoutonRestaurationConsultation_(rapport) {
  const bouton = document.getElementById(
    'boutonRestaurerDepuisConsultation'
  );

  if (!bouton) {
    return;
  }

  const autorise = Boolean(
    rapport &&
    rapport.obsolete !== true &&
    [
      'RESTAURABLE',
      'RESTAURABLE_AVEC_MIGRATIONS'
    ].includes(rapport.statut)
  );

  bouton.disabled = !autorise;
  bouton.title = autorise
    ? 'Prévisualiser puis confirmer la restauration'
    : 'Un test concluant et actuel est obligatoire';
}


function preparerRestaurationDepuisConsultationAdministration() {
  const backupId = etatApplication.backupIdRestaurabiliteActif;

  if (!backupId) {
    afficherToast('Aucune sauvegarde sélectionnée.', true);
    return;
  }

  fermerModalRestaurabiliteSauvegarde();
  preparerRestaurationAdministration(backupId, null);
}


function preparerRestaurationAdministration(backupId, bouton) {
  if (!estAdministrateurApplication()) {
    afficherToast('Accès réservé à l’administrateur.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Préparation…';
  }

  ouvrirModalPreparationRestaurationAdministration_();

  google.script.run
    .withSuccessHandler(function (previsualisation) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Préparer la restauration';
      }

      etatApplication.previewRestaurationActive = previsualisation;
      afficherPrevisualisationRestaurationAdministration_(
        previsualisation
      );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Préparer la restauration';
      }

      const message = extraireMessageErreur(erreur);
      afficherErreurPreparationRestaurationAdministration_(message);
      afficherToast(message, true);
    })
    .preparerRestaurationSauvegarde(
      backupId,
      obtenirJetonAdministrateurApplication()
    );
}

function afficherErreurPreparationRestaurationAdministration_(message) {
  const contenu = document.getElementById(
    'contenuPreparationRestaurationAdministration'
  );

  if (contenu) {
    contenu.innerHTML = `
      <div class="erreur-sauvegarde-administration">
        <strong>Restauration impossible</strong>
        <span>${echapperHtml(message)}</span>
      </div>
    `;
  }
}


function confirmerEtExecuterRestaurationAdministration() {
  const preview = etatApplication.previewRestaurationActive;
  const texte = document.getElementById(
    'texteConfirmationRestauration'
  );
  const caseSecurite = document.getElementById(
    'confirmerSauvegardeSecuriteRestauration'
  );
  const champMotDePasse = document.getElementById(
    'motDePasseConfirmationRestauration'
  );
  const bouton = document.getElementById(
    'boutonConfirmerRestaurationAdministration'
  );

  if (!preview || !preview.previewId) {
    afficherToast('Le plan de restauration n’est plus disponible.', true);
    return;
  }

  if (String(texte?.value || '').trim() !== 'RESTAURER') {
    afficherToast('Saisis exactement le mot RESTAURER.', true);
    return;
  }

  if (!caseSecurite?.checked) {
    afficherToast(
      'Confirme la sauvegarde automatique de sécurité.',
      true
    );
    return;
  }

  const motDePasse = String(champMotDePasse?.value || '');

  if (!motDePasse) {
    afficherToast('Saisis le mot de passe administrateur.', true);
    return;
  }

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Confirmation…';
  }

  if (champMotDePasse) {
    champMotDePasse.value = '';
  }

  google.script.run
    .withSuccessHandler(function (confirmation) {
      demarrerExecutionRestaurationAdministration_(
        confirmation.confirmationId
      );
    })
    .withFailureHandler(function (erreur) {
      if (bouton) {
        bouton.disabled = false;
        bouton.textContent = 'Confirmer et restaurer';
      }

      afficherToast(extraireMessageErreur(erreur), true);
    })
    .confirmerRestaurationSauvegarde(
      preview.previewId,
      'RESTAURER',
      true,
      motDePasse,
      obtenirJetonAdministrateurApplication()
    );
}


function demarrerExecutionRestaurationAdministration_(confirmationId) {
  const bouton = document.getElementById(
    'boutonConfirmerRestaurationAdministration'
  );

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Restauration en cours…';
  }

  etatApplication.restaurationModaleFermable = false;
  etatApplication.rafraichirRestaurationApresFermeture = false;

  afficherProgressionRestaurationDansModal_({
    etape: 'SAUVEGARDE_SECURITE',
    statut: 'EN_COURS',
    progression: 5
  });
  basculerInterfacePendantRestauration_(true);
  demarrerSuiviRestaurationAdministration_();

  google.script.run
    .withSuccessHandler(function (resultat) {
      if (resultat.recuperationRequise) {
        afficherErreurPreparationRestaurationAdministration_(
          resultat.message
        );
        terminerInterfaceRestaurationAdministration_();
        afficherToast(resultat.message, true);
        return;
      }

      etatApplication.restaurationAdministration = {
        operationActive: null,
        derniereOperation: {
          backupId: resultat.backupId,
          backupIdSecurite: resultat.backupIdSecurite,
          statut: 'TERMINEE',
          etape: 'TERMINEE',
          progression: 100,
          versionSchemaFinale: resultat.versionSchema,
          dureeMs: resultat.dureeMs
        },
        ecrituresBloquees: false
      };
      afficherResultatRestaurationAdministration_(resultat);
      afficherEtatRestaurationAdministration(
        etatApplication.restaurationAdministration
      );
      terminerInterfaceRestaurationAdministration_();
      afficherToast(resultat.message, false);
    })
    .withFailureHandler(function (erreur) {
      const message = extraireMessageErreur(erreur);
      afficherErreurPreparationRestaurationAdministration_(message);
      terminerInterfaceRestaurationAdministration_();
      afficherToast(message, true);
    })
    .executerRestaurationConfirmee(
      confirmationId,
      obtenirJetonAdministrateurApplication()
    );
}


function demarrerSuiviRestaurationAdministration_() {
  arreterSuiviRestaurationAdministration_();
  const generation = etatApplication.generationSuiviRestauration;

  etatApplication.minuterieProgressionRestauration =
    window.setInterval(function () {
      actualiserEtatRestaurationAdministration_(true, generation);
    }, 2500);
}


function arreterSuiviRestaurationAdministration_() {
  if (etatApplication.minuterieProgressionRestauration) {
    window.clearInterval(
      etatApplication.minuterieProgressionRestauration
    );
    etatApplication.minuterieProgressionRestauration = null;
  }

  etatApplication.generationSuiviRestauration++;
}


function actualiserEtatRestaurationAdministration_(
  silencieux,
  generationSuivi
) {
  google.script.run
    .withSuccessHandler(function (etat) {
      if (
        Number.isInteger(generationSuivi) &&
        generationSuivi !==
          etatApplication.generationSuiviRestauration
      ) {
        return;
      }

      etatApplication.restaurationAdministration = etat;
      afficherEtatRestaurationAdministration(etat);

      if (estEtatRestaurationTerminalInterface_(etat)) {
        terminerInterfaceRestaurationAdministration_();
        return;
      }

      if (etat.operationActive) {
        afficherProgressionRestaurationDansModal_(
          etat.operationActive
        );
      }
    })
    .withFailureHandler(function (erreur) {
      if (!silencieux) {
        afficherToast(extraireMessageErreur(erreur), true);
      }
    })
    .getEtatRestaurationAdministration(
      obtenirJetonAdministrateurApplication()
    );
}


function afficherEtatRestaurationAdministration(etat) {
  const zone = document.getElementById(
    'etatRestaurationAdministration'
  );

  if (!zone) {
    return;
  }

  etat = etat || {};
  const active = etat.operationActive;

  if (active) {
    const interrompue = Boolean(etat.restaurationInterrompue);

    zone.innerHTML = `
      <div class="carte-etat-restauration ${interrompue ? 'restauration-interrompue' : ''}">
        <div>
          <strong>${interrompue ? 'Restauration interrompue' : 'Restauration en cours'}</strong>
          <span>
            Étape ${echapperHtml(libelleEtapeRestauration_(active.etape))}
            · ${Number(active.progression || 0)} %
          </span>
          <small>Sauvegarde cible ${echapperHtml(active.backupId || '')}</small>
        </div>
        <div class="barre-progression-restauration"><span style="width:${Math.max(0, Math.min(100, Number(active.progression || 0)))}%"></span></div>
        ${etat.repriseRollbackDisponible
          ? `<button type="button" class="bouton-danger" data-autorise-pendant-restauration="true" onclick="reprendreRollbackRestaurationAdministration()">Reprendre le rollback</button>`
          : ''}
        ${etat.repriseFinalisationDisponible
          ? `<button type="button" class="bouton-principal" data-autorise-pendant-restauration="true" onclick="reprendreFinalisationRestaurationAdministration()">Reprendre la finalisation</button>`
          : ''}
        ${(etat.feuillesTechniquesDetectees || []).length
          ? `<div class="liste-feuilles-techniques-restauration"><strong>Feuilles techniques détectées</strong><span>${(etat.feuillesTechniquesDetectees || []).map(echapperHtml).join(', ')}</span></div>`
          : ''}
      </div>
    `;
    basculerInterfacePendantRestauration_(true);
    return;
  }

  basculerInterfacePendantRestauration_(false);
  const derniere = etat.derniereOperation;

  zone.innerHTML = derniere
    ? `<div class="derniere-restauration-administration">
        <strong>Dernière opération : ${echapperHtml(derniere.statut || '')}</strong>
        <span>${echapperHtml(derniere.backupId || '')}${derniere.dureeMs ? ' · ' + echapperHtml(formaterDureeRestauration_(derniere.dureeMs)) : ''}</span>
      </div>`
    : '';
}


function basculerInterfacePendantRestauration_(bloquer) {
  if (
    bloquer &&
    etatApplication.restaurationModaleFermable
  ) {
    return;
  }

  document.querySelectorAll(
    '.page-administration button, ' +
    '#modalPreparationRestaurationAdministration button'
  ).forEach(
    function (bouton) {
      if (bouton.dataset.autorisePendantRestauration === 'true') {
        return;
      }

      if (bloquer) {
        if (!Object.prototype.hasOwnProperty.call(
          bouton.dataset,
          'etaitDesactiveRestauration'
        )) {
          bouton.dataset.etaitDesactiveRestauration = bouton.disabled
            ? 'true'
            : 'false';
        }
        bouton.disabled = true;
      } else if (Object.prototype.hasOwnProperty.call(
        bouton.dataset,
        'etaitDesactiveRestauration'
      )) {
        if (bouton.dataset.etaitDesactiveRestauration === 'false') {
          bouton.disabled = false;
        }
        delete bouton.dataset.etaitDesactiveRestauration;
      }
    }
  );
}


function afficherProgressionRestaurationDansModal_(operation) {
  if (etatApplication.restaurationModaleFermable) {
    return;
  }

  const contenu = document.getElementById(
    'contenuPreparationRestaurationAdministration'
  );
  const confirmation = document.getElementById(
    'confirmationRestaurationAdministration'
  );

  if (!contenu) {
    return;
  }

  const etapes = [
    ['SAUVEGARDE_SECURITE', 'Sauvegarde de sécurité'],
    ['STAGING', 'Écriture du staging'],
    ['VALIDATION_STAGING', 'Validation du staging'],
    ['BASCULEMENT', 'Basculement'],
    ['MIGRATIONS', 'Migrations'],
    ['DIAGNOSTIC', 'Diagnostic final'],
    ['FINALISATION', 'Finalisation']
  ];
  const position = etapes.findIndex(function (etape) {
    return etape[0] === operation.etape;
  });

  confirmation?.classList.add('masque');
  contenu.innerHTML = `
    <div class="progression-detaillee-restauration">
      <h3>Restauration sécurisée en cours</h3>
      <div class="barre-progression-restauration"><span style="width:${Math.max(0, Math.min(100, Number(operation.progression || 0)))}%"></span></div>
      <div class="liste-etapes-restauration">
        ${etapes.map(function (etape, index) {
          const classe = index < position
            ? 'etape-terminee'
            : (index === position ? 'etape-active' : 'etape-attente');
          return `<div class="${classe}"><span>${index < position ? '✓' : (index === position ? '●' : '○')}</span><strong>${echapperHtml(etape[1])}</strong></div>`;
        }).join('')}
      </div>
      <p>Les consultations restent possibles. Toutes les écritures métier sont bloquées côté serveur.</p>
    </div>
  `;
}


function afficherResultatRestaurationAdministration_(resultat) {
  const contenu = document.getElementById(
    'contenuPreparationRestaurationAdministration'
  );
  const confirmation = document.getElementById(
    'confirmationRestaurationAdministration'
  );
  confirmation?.classList.add('masque');

  if (contenu) {
    contenu.innerHTML = `
      <div class="resultat-restauration-reussie">
        <strong>✓ Restauration terminée avec succès</strong>
        <span>Sauvegarde restaurée : ${echapperHtml(resultat.backupId)}</span>
        <span>Sauvegarde de sécurité : ${echapperHtml(resultat.backupIdSecurite)}</span>
        <span>Schéma : ${Number(resultat.versionSchema)} · Durée : ${echapperHtml(formaterDureeRestauration_(resultat.dureeMs))}</span>
      </div>
    `;
  }
}


function terminerInterfaceRestaurationAdministration_() {
  arreterSuiviRestaurationAdministration_();

  const etat = etatApplication.restaurationAdministration || {};
  etat.operationActive = null;
  etatApplication.restaurationAdministration = etat;
  etatApplication.restaurationModaleFermable = true;
  etatApplication.rafraichirRestaurationApresFermeture = true;
  rechargerFavorisApresRestauration_();

  basculerInterfacePendantRestauration_(false);
  afficherEtatRestaurationAdministration(etat);

  const boutonFermer = document.getElementById(
    'boutonFermerModalPreparationRestauration'
  );
  const boutonAnnuler = document.getElementById(
    'boutonAnnulerPreparationRestauration'
  );

  configurerBoutonFermetureRestaurationAdministration_();

  if (boutonFermer) {
    boutonFermer.disabled = false;
  }

  if (boutonAnnuler) {
    boutonAnnuler.disabled = false;
  }
}


function configurerBoutonFermetureRestaurationAdministration_() {
  const bouton = document.getElementById(
    'boutonConfirmerRestaurationAdministration'
  );

  if (!bouton) {
    return null;
  }

  bouton.removeAttribute('disabled');
  bouton.disabled = false;
  bouton.classList.remove(
    'bouton-danger',
    'bouton-restauration-en-cours',
    'restauration-en-cours',
    'etat-en-cours'
  );
  bouton.classList.add('bouton-principal');
  bouton.textContent = 'Fermer';
  bouton.removeAttribute('onclick');
  bouton.onclick = function () {
    fermerModalPreparationRestaurationAdministration();
  };
  delete bouton.dataset.etaitDesactiveRestauration;

  return bouton;
}


function estEtatRestaurationTerminalInterface_(etat) {
  if (!etat || etat.operationActive || !etat.derniereOperation) {
    return false;
  }

  return [
    'TERMINEE',
    'TERMINEE_AVEC_NETTOYAGE',
    'ECHEC',
    'ECHEC_ROLLBACK_TERMINE'
  ].includes(String(etat.derniereOperation.statut || ''));
}


function reinitialiserControlesModalRestaurationAdministration_() {
  const bouton = document.getElementById(
    'boutonConfirmerRestaurationAdministration'
  );

  if (bouton) {
    bouton.disabled = true;
    bouton.textContent = 'Confirmer et restaurer';
    bouton.classList.remove('bouton-principal');
    bouton.classList.add('bouton-danger');
    bouton.onclick = confirmerEtExecuterRestaurationAdministration;
  }
}


function reprendreRollbackRestaurationAdministration() {
  if (!window.confirm(
    'Reprendre le rollback automatique et rétablir les données initiales ?'
  )) {
    return;
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(resultat.message, !resultat.succes);
      actualiserEtatRestaurationAdministration_();
    })
    .withFailureHandler(function (erreur) {
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .reprendreRollbackRestauration(
      obtenirJetonAdministrateurApplication()
    );
}


function reprendreFinalisationRestaurationAdministration() {
  if (!window.confirm(
    'Reprendre la vérification et le nettoyage final de la restauration ?'
  )) {
    return;
  }

  google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(resultat.message, !resultat.succes);
      actualiserEtatRestaurationAdministration_();
    })
    .withFailureHandler(function (erreur) {
      afficherToast(extraireMessageErreur(erreur), true);
    })
    .reprendreFinalisationRestauration(
      obtenirJetonAdministrateurApplication()
    );
}


function libelleEtapeRestauration_(etape) {
  const libelles = {
    INITIALISATION: 'initialisation',
    SAUVEGARDE_SECURITE: 'sauvegarde de sécurité',
    STAGING: 'staging',
    VALIDATION_STAGING: 'validation',
    BASCULEMENT: 'basculement',
    MIGRATIONS: 'migrations',
    DIAGNOSTIC: 'diagnostic',
    FINALISATION: 'finalisation',
    ROLLBACK: 'rollback',
    ROLLBACK_INCOMPLET: 'rollback incomplet',
    NETTOYAGE_INCOMPLET: 'finalisation incomplète',
    FEUILLES_TECHNIQUES_ORPHELINES: 'diagnostic technique requis',
    RECUPERATION_AUTOMATIQUE: 'récupération automatique'
  };

  return libelles[etape] || String(etape || 'inconnue');
}


function formaterDureeRestauration_(millisecondes) {
  const secondes = Math.max(0, Math.round(
    Number(millisecondes || 0) / 1000
  ));

  if (secondes < 60) {
    return secondes + ' s';
  }

  return Math.floor(secondes / 60) + ' min ' +
    String(secondes % 60).padStart(2, '0') + ' s';
}

function afficherFormationsAdministration() {
  const corps = document.getElementById(
    'corpsTableauFormationsAdministration'
  );
  const compteur = document.getElementById(
    'compteurFormationsAdministration'
  );

  if (!corps) {
    return;
  }

  const formations = etatApplication.formationsAdministration;

  if (compteur) {
    compteur.textContent =
      formations.length +
      (formations.length > 1 ? ' formations' : ' formation') +
      ' · ' +
      formations.filter(function (formation) {
        return formation.actif;
      }).length +
      ' actives';
  }

  if (!formations.length) {
    corps.innerHTML = `
      <tr><td colspan="5" class="etat-vide">Aucune formation.</td></tr>
    `;
    return;
  }

  corps.innerHTML = formations.map(function (formation) {
    return `
      <tr>
        <td><strong>${formation.ordre}</strong></td>
        <td>${echapperHtml(formation.libelle)}</td>
        <td>
          <span class="badge-statut ${formation.actif ? 'badge-vert' : 'badge-gris'}">
            ${formation.actif ? 'Active' : 'Inactive'}
          </span>
        </td>
        <td>
          ${formation.utilisee
            ? '<span class="badge-statut badge-orange">Historique existant</span>'
            : '<span class="badge-statut badge-gris">Non utilisée</span>'}
        </td>
        <td class="colonne-actions">

            'FORMATION',
            formation.idFormation,
            'bouton-favori-tableau'
          )}
          <button
            type="button"

            class="bouton-action-statut-referentiel"

            type="button"
            class="bouton-danger bouton-suppression-formation"

function nouvelleFormationAdministration() {

  document.getElementById('libelleFormationAdministration').value = '';

    etatApplication.formationsAdministration.length + 1;
  document.getElementById('actifFormationAdministration').checked = true;
  document.getElementById(
    'titreModalFormationAdministration'

      return element.idFormation === idFormation;

  if (!formation) {
    afficherToast('Formation introuvable.', true);

  document.getElementById('idFormationAdministration').value =
    formation.idFormation;

    formation.libelle;

    'titreModalFormationAdministration'
  ).textContent = 'Modifier la formation';

    'modalFormationAdministration'
  ).classList.remove('masque');
  document.body.classList.add('modal-ouverte');
}

function fermerModalFormationAdministration() {
  document.getElementById(
    'modalFormationAdministration'
  )?.classList.add('masque');
  document.body.classList.remove('modal-ouverte');
}

function soumettreFormationAdministration(evenement) {
  evenement.preventDefault();

  const bouton = document.getElementById(
    'boutonEnregistrerFormationAdministration'
  );
  const donnees = {
    idFormation: document.getElementById(
      'idFormationAdministration'
    ).value,
    libelle: document.getElementById(
      'libelleFormationAdministration'
    ).value,
    ordre: document.getElementById(
      'ordreFormationAdministration'
    ).value,
    actif: document.getElementById(
      'actifFormationAdministration'
    ).checked
  };

  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer';
      fermerModalFormationAdministration();
      afficherToast(resultat.message, false);
      initialiserPageAdministration();

    .withFailureHandler(function (erreur) {
      bouton.disabled = false;

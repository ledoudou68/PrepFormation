<script>

'use strict';

const etatApplication = {
  pageActive: 'Accueil',
  stagiaires: [],
  formateurs: [],
  formations: [],
  statutsStagiaires: [],
  sessions: [],
  stagiairesSession: [],
  formateursSession: [],
  formationsSession: [],
  referentielSession: [],
  formationReferentielSession: '',
  itemsTravaillesSession: {},
  validationsSession: {},
  formationsReferentiel: [],
  categoriesReferentiel: [],
  itemsReferentiel: [],
  itemsReferentielEnCours: {},
  formationReferentielActive: ''
};

document.addEventListener(
  'DOMContentLoaded',
  initialiserInterface
);

function initialiserInterface() {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.addEventListener('click', function () {
        chargerPage(bouton.dataset.page);
      });
    });

  chargerPage('Accueil');
}

function chargerPage(nomPage) {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (html) {
      document.getElementById('contenu').innerHTML = html;

      etatApplication.pageActive = nomPage;

      activerBoutonMenu(nomPage);
      fermerMenuMobile();
      masquerLoader();
      initialiserPageActive(nomPage);
    })
    .withFailureHandler(gererErreurServeur)
    .getPage(nomPage);
}

function initialiserPageActive(nomPage) {
  if (nomPage === 'Stagiaires') {
    initialiserPageStagiaires();
  }

  if (nomPage === 'Formateurs') {
    initialiserPageFormateurs();
  }

  if (nomPage === 'Sessions') {
    initialiserPageSessions();
  }

  if (nomPage === 'Referentiel') {
    initialiserPageReferentiel();
  }
}

function activerBoutonMenu(nomPage) {
  document
    .querySelectorAll('.menu-item')
    .forEach(function (bouton) {
      bouton.classList.toggle(
        'actif',
        bouton.dataset.page === nomPage
      );
    });
}

function afficherLoader() {
  document
    .getElementById('loader')
    .classList
    .remove('masque');
}

function masquerLoader() {
  document
    .getElementById('loader')
    .classList
    .add('masque');
}

function afficherToast(message, erreur) {
  const toast = document.getElementById('toast');

  toast.textContent = message;
  toast.classList.toggle('erreur', Boolean(erreur));
  toast.classList.add('visible');

  window.clearTimeout(afficherToast.timer);

  afficherToast.timer = window.setTimeout(function () {
    toast.classList.remove('visible');
  }, 3500);
}

function extraireMessageErreur(erreur) {
  if (!erreur) {
    return 'Une erreur inconnue est survenue.';
  }

  return erreur.message || String(erreur);
}

function gererErreurServeur(erreur) {
  masquerLoader();

  afficherToast(
    extraireMessageErreur(erreur),
    true
  );
}

function basculerMenu() {
  document
    .getElementById('menuLateral')
    .classList
    .toggle('ouvert');
}

function fermerMenuMobile() {
  document
    .getElementById('menuLateral')
    .classList
    .remove('ouvert');
}

/* =====================================================
   STAGIAIRES
===================================================== */

function initialiserPageStagiaires() {
  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargement() {
    chargementsTermines++;

    if (
      chargementsTermines === 3 &&
      !erreurRencontree
    ) {
      remplirFiltresStagiaires();
      afficherListeStagiaires();
      masquerLoader();
    }
  }

  function erreurChargement(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (stagiaires) {
      etatApplication.stagiaires =
        Array.isArray(stagiaires) ? stagiaires : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStagiaires();

  google.script.run
    .withSuccessHandler(function (formations) {
      etatApplication.formations =
        Array.isArray(formations) ? formations : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getFormations();

  google.script.run
    .withSuccessHandler(function (statuts) {
      etatApplication.statutsStagiaires =
        Array.isArray(statuts) ? statuts : [];

      terminerChargement();
    })
    .withFailureHandler(erreurChargement)
    .getStatutsStagiaires();
}

function remplirFiltresStagiaires() {
  remplirSelect(
    'filtreFormationStagiaire',
    etatApplication.formations,
    'Toutes les formations'
  );

  remplirSelect(
    'filtreStatutStagiaire',
    etatApplication.statutsStagiaires,
    'Tous les statuts'
  );

  remplirSelect(
    'stagiaireFormation',
    etatApplication.formations,
    'Sélectionner une formation'
  );

  remplirSelect(
    'stagiaireStatut',
    etatApplication.statutsStagiaires,
    null
  );
}

function remplirSelect(
  identifiant,
  valeurs,
  premiereOption
) {
  const select = document.getElementById(identifiant);

  if (!select) {
    return;
  }

  const valeurActuelle = select.value;

  select.innerHTML = '';

  if (premiereOption !== null) {
    const optionInitiale =
      document.createElement('option');

    optionInitiale.value = '';
    optionInitiale.textContent = premiereOption;

    select.appendChild(optionInitiale);
  }

  valeurs.forEach(function (valeur) {
    const option = document.createElement('option');

    option.value = valeur;
    option.textContent = valeur;

    select.appendChild(option);
  });

  if (
    [...select.options].some(function (option) {
      return option.value === valeurActuelle;
    })
  ) {
    select.value = valeurActuelle;
  }
}

function afficherListeStagiaires() {
  const corps = document.getElementById(
    'corpsTableauStagiaires'
  );

  if (!corps) {
    return;
  }

  const stagiaires = obtenirStagiairesFiltres();

  const compteur = document.getElementById(
    'compteurStagiaires'
  );

  if (compteur) {
    compteur.textContent =
      stagiaires.length +
      (stagiaires.length > 1
        ? ' stagiaires affichés'
        : ' stagiaire affiché');
  }

  if (stagiaires.length === 0) {
    corps.innerHTML = `
      <tr>
        <td colspan="6" class="etat-vide">
          Aucun stagiaire ne correspond aux critères.
        </td>
      </tr>
    `;

    return;
  }

  corps.innerHTML = stagiaires
    .map(function (stagiaire) {
      return creerLigneStagiaire(stagiaire);
    })
    .join('');
}

function obtenirStagiairesFiltres() {
  const recherche = String(
    document.getElementById('rechercheStagiaire')
      ?.value || ''
  )
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');

  const formation = String(
    document.getElementById(
      'filtreFormationStagiaire'
    )?.value || ''
  );

  const statut = String(
    document.getElementById(
      'filtreStatutStagiaire'
    )?.value || ''
  );

  return etatApplication.stagiaires.filter(
    function (stagiaire) {
      const identite =
        (stagiaire.nom + ' ' + stagiaire.prenom)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');

      const correspondRecherche =
        !recherche || identite.includes(recherche);

      const correspondFormation =
        !formation ||
        stagiaire.formation === formation;

      const correspondStatut =
        !statut ||
        stagiaire.statut === statut;

      return (
        correspondRecherche &&
        correspondFormation &&
        correspondStatut
      );
    }
  );
}

function filtrerStagiaires() {
  afficherListeStagiaires();
}

function creerLigneStagiaire(stagiaire) {
  const classeStatut =
    obtenirClasseStatut(stagiaire.statut);

  const dateStage = afficherDateFrancaise(
    stagiaire.dateStage
  );

  const dateDebut = afficherDateFrancaise(
    stagiaire.dateDebutPreparation
  );

  return `
    <tr>
      <td>
        <div class="nom-principal">
          ${echapperHtml(stagiaire.nom)}
          ${echapperHtml(stagiaire.prenom)}
        </div>
      </td>

      <td>
        ${echapperHtml(stagiaire.formation)}
      </td>

      <td>
        ${dateDebut || '—'}
      </td>

      <td>
        <strong>${dateStage || '—'}</strong>
      </td>

      <td>
        <span class="badge-statut ${classeStatut}">
          ${echapperHtml(stagiaire.statut)}
        </span>
      </td>

      <td class="colonne-actions">
        <button
          type="button"
          class="bouton-icone bouton-consulter"
          onclick="consulterStagiaire('${stagiaire.uuid}')"
          title="Consulter"
          aria-label="Consulter la fiche de ${echapperHtml(stagiaire.prenom)} ${echapperHtml(stagiaire.nom)}"
        >
          👁
        </button>

        <button
          type="button"
          class="bouton-icone"
          onclick="modifierStagiaire('${stagiaire.uuid}')"
          title="Modifier"
        >
          ✎
        </button>
      </td>
    </tr>
  `;
}


function consulterStagiaire(uuid) {
  const stagiaire = etatApplication.stagiaires.find(
    function (element) {
      return element.uuid === uuid;
    }
  );

  if (!stagiaire) {
    afficherToast('Stagiaire introuvable.', true);
    return;
  }

  fermerFicheStagiaire();

  const modal = document.createElement('div');

  modal.id = 'modalFicheStagiaire';
  modal.className = 'fiche-consultation-overlay';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute(
    'aria-labelledby',
    'titreFicheConsultationStagiaire'
  );
  modal.dataset.uuid = uuid;

  const photo = stagiaire.photoUrl
    ? `
      <img
        src="${echapperHtml(stagiaire.photoUrl)}"
        alt="Photo de ${echapperHtml(stagiaire.prenom)} ${echapperHtml(stagiaire.nom)}"
        onerror="this.parentElement.innerHTML='<span>Photo indisponible</span>'"
      >
    `
    : `
      <span class="initiales-stagiaire">
        ${echapperHtml(
          (stagiaire.prenom || '').charAt(0) +
          (stagiaire.nom || '').charAt(0)
        )}
      </span>
    `;

  modal.innerHTML = `
    <article class="fiche-consultation">

      <header class="fiche-consultation-barre">

        <div class="fiche-consultation-titre">
          <span class="fiche-consultation-icone">👨‍🚒</span>
          <div>
            <h2 id="titreFicheConsultationStagiaire">
              Fiche stagiaire
            </h2>
            <p>Consultation du parcours de préparation</p>
          </div>
        </div>

        <button
          type="button"
          class="bouton-fermer-modal bouton-fermer-fiche"
          onclick="fermerFicheStagiaire()"
          aria-label="Fermer"
        >
          ×
        </button>

      </header>

      <main class="fiche-consultation-corps">

        <section class="fiche-profil">

          <div class="fiche-consultation-photo">
            ${photo}
          </div>

          <div class="fiche-profil-contenu">

            <div class="fiche-identite-entete">
              <div>
                <p class="fiche-sur-titre">
                  ${echapperHtml(
                    stagiaire.grade || 'Grade non renseigné'
                  )}
                </p>
                <h1>
                  ${echapperHtml(stagiaire.prenom)}
                  ${echapperHtml(stagiaire.nom)}
                </h1>
              </div>

              <span class="badge-statut badge-statut-fiche ${obtenirClasseStatut(stagiaire.statut)}">
                ${echapperHtml(stagiaire.statut)}
              </span>
            </div>

            <dl class="fiche-informations">

              ${creerInformationFiche(
                'Nom',
                stagiaire.nom
              )}

              ${creerInformationFiche(
                'Prénom',
                stagiaire.prenom
              )}

              ${creerInformationFiche(
                'Grade',
                stagiaire.grade
              )}

              ${creerInformationFiche(
                'Téléphone',
                stagiaire.telephone
              )}

              ${creerInformationFiche(
                'E-mail',
                stagiaire.email
              )}

              ${creerInformationFiche(
                'Formation',
                stagiaire.formation
              )}

              ${creerInformationFiche(
                'Début de préparation',
                afficherDateFrancaise(
                  stagiaire.dateDebutPreparation
                )
              )}

              ${creerInformationFiche(
                'Date du stage',
                afficherDateFrancaise(
                  stagiaire.dateStage
                )
              )}

              ${creerInformationFiche(
                'Échéance',
                calculerEcheanceStage(
                  stagiaire.dateStage
                ),
                'information-echeance'
              )}

            </dl>

          </div>

        </section>

        <section
          class="grille-synthese-stagiaire"
          aria-label="Synthèse du parcours"
        >

          ${creerCarteSyntheseStagiaire(
            '📅',
            'Sessions réalisées',
            'valeurSessionsRealisees'
          )}

          ${creerCarteSyntheseStagiaire(
            '⏱',
            'Heures de formation',
            'valeurHeuresFormation'
          )}

          ${creerCarteSyntheseStagiaire(
            '✓',
            'Taux de présence',
            'valeurTauxPresence'
          )}

          ${creerCarteSyntheseStagiaire(
            '★',
            'Évaluations',
            'valeurEvaluations'
          )}

        </section>

        <section class="bloc fiche-bloc">

          <div class="fiche-bloc-entete">
            <div>
              <h2>Suivi pédagogique</h2>
              <p>
                Progression par catégorie et item du référentiel.
              </p>
            </div>
          </div>

          <div id="suiviPedagogiqueFicheStagiaire">
            <div class="etat-suivi-pedagogique">
              Chargement du suivi pédagogique…
            </div>
          </div>

        </section>

        <section class="bloc fiche-bloc">

          <div class="fiche-bloc-entete">
            <div>
              <h2>Sessions suivies</h2>
              <p>Historique des séances de préparation.</p>
            </div>
          </div>

          <div class="tableau-responsive">
            <table class="tableau tableau-sessions-fiche">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Horaires</th>
                  <th>Formation</th>
                  <th>Thème</th>
                  <th>Items travaillés</th>
                  <th>Durée</th>
                </tr>
              </thead>
              <tbody id="corpsSessionsFicheStagiaire">
                <tr>
                  <td colspan="6" class="etat-vide">
                    Chargement des sessions…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </section>

        <section class="bloc fiche-bloc">

          <div class="fiche-bloc-entete">
            <div>
              <h2>Notes administratives</h2>
              <p>Informations utiles au suivi du stagiaire.</p>
            </div>
          </div>

          <div class="fiche-notes-administratives">
            ${echapperHtml(
              stagiaire.notesAdministratives ||
              'Aucune note administrative.'
            )}
          </div>

        </section>

      </main>

    </article>
  `;

  document.body.appendChild(modal);
  document.body.classList.add('modal-ouverte');

  document.addEventListener(
    'keydown',
    gererClavierFicheStagiaire
  );

  modal
    .querySelector('.bouton-fermer-fiche')
    .focus();

  google.script.run
    .withSuccessHandler(function (suivi) {
      mettreAJourSuiviFicheStagiaire(
        uuid,
        suivi
      );
    })
    .withFailureHandler(function (erreur) {
      gererErreurSuiviFicheStagiaire(
        uuid,
        erreur
      );
    })
    .getSuiviStagiaire(uuid);
}

function creerInformationFiche(
  libelle,
  valeur,
  classeSupplementaire
) {
  return `
    <div class="fiche-information ${classeSupplementaire || ''}">
      <dt>${echapperHtml(libelle)}</dt>
      <dd>${echapperHtml(valeur || '—')}</dd>
    </div>
  `;
}

function creerCarteSyntheseStagiaire(
  icone,
  libelle,
  identifiantValeur
) {
  return `
    <div class="carte carte-synthese-stagiaire">
      <div class="carte-synthese-icone">
        ${icone}
      </div>
      <div>
        <div class="carte-titre">
          ${echapperHtml(libelle)}
        </div>
        <div
          id="${identifiantValeur}"
          class="carte-valeur"
        >
          —
        </div>
      </div>
    </div>
  `;
}

function mettreAJourSuiviFicheStagiaire(
  uuid,
  suivi
) {
  const modal = document.getElementById(
    'modalFicheStagiaire'
  );

  if (!modal || modal.dataset.uuid !== uuid) {
    return;
  }

  const synthese = suivi && suivi.synthese
    ? suivi.synthese
    : {};

  document.getElementById(
    'valeurSessionsRealisees'
  ).textContent = String(
    Number(synthese.sessionsRealisees) || 0
  );

  document.getElementById(
    'valeurHeuresFormation'
  ).textContent = formaterHeuresFormation(
    synthese.heuresFormation
  );

  document.getElementById(
    'valeurTauxPresence'
  ).textContent = synthese.tauxPresence === null ||
    synthese.tauxPresence === undefined
    ? '—'
    : Math.round(Number(synthese.tauxPresence)) + ' %';

  document.getElementById(
    'valeurEvaluations'
  ).textContent = String(
    Number(synthese.evaluations) || 0
  );

  afficherSessionsFicheStagiaire(
    Array.isArray(suivi && suivi.sessions)
      ? suivi.sessions
      : []
  );

  afficherSuiviPedagogiqueFicheStagiaire(
    Array.isArray(suivi && suivi.suiviPedagogique)
      ? suivi.suiviPedagogique
      : []
  );
}

function afficherSuiviPedagogiqueFicheStagiaire(
  categories
) {
  const zone = document.getElementById(
    'suiviPedagogiqueFicheStagiaire'
  );

  if (!zone) {
    return;
  }

  if (!categories.length) {
    zone.innerHTML = `
      <div class="etat-suivi-pedagogique">
        Aucun item pédagogique configuré pour cette formation.
      </div>
    `;
    return;
  }

  zone.innerHTML = categories
    .map(function (categorie) {
      const lignes = categorie.items
        .map(function (item) {
          const classeStatut = item.statut === 'Acquis'
            ? 'badge-vert'
            : item.statut === 'Travaillé'
              ? 'badge-orange'
              : 'badge-gris';

          return `
            <tr>
              <td>
                <strong>${echapperHtml(item.intitule)}</strong>
                ${item.actif
                  ? ''
                  : '<small class="item-historique-fiche">Item inactif conservé dans l’historique</small>'}
              </td>
              <td class="nombre-seances-item-fiche">
                ${Number(item.nombreSeances) || 0}
              </td>
              <td>
                <span class="badge-statut ${classeStatut}">
                  ${echapperHtml(item.statut)}
                </span>
              </td>
              <td>
                ${echapperHtml(
                  afficherDateFrancaise(
                    item.derniereDate
                  ) || '—'
                )}
              </td>
              <td class="commentaire-item-fiche">
                ${echapperHtml(
                  item.dernierCommentaire || '—'
                )}
              </td>
            </tr>
          `;
        })
        .join('');

      return `
        <section class="categorie-suivi-pedagogique">
          <h3>${echapperHtml(categorie.intitule)}</h3>
          <div class="tableau-responsive">
            <table class="tableau tableau-suivi-pedagogique">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Séances</th>
                  <th>Statut</th>
                  <th>Dernier travail</th>
                  <th>Dernier commentaire</th>
                </tr>
              </thead>
              <tbody>${lignes}</tbody>
            </table>
          </div>
        </section>
      `;
    })
    .join('');
}

function afficherSessionsFicheStagiaire(sessions) {
  const corps = document.getElementById(
    'corpsSessionsFicheStagiaire'
  );

  if (!corps) {
    return;
  }

  if (sessions.length === 0) {
    corps.innerHTML = `
      <tr>
        <td colspan="6" class="etat-vide">
          Aucune session suivie pour le moment.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = sessions
    .map(function (session) {
      const horaires = [
        session.heureDebut,
        session.heureFin
      ]
        .filter(Boolean)
        .join(' – ');

      const itemsTravailles = Array.isArray(
        session.itemsTravailles
      ) && session.itemsTravailles.length
        ? session.itemsTravailles
          .map(function (item) {
            return `
              <span class="item-session-fiche">
                ${echapperHtml(item)}
              </span>
            `;
          })
          .join('')
        : '—';

      return `
        <tr>
          <td>
            <strong>
              ${echapperHtml(
                afficherDateFrancaise(session.date) ||
                '—'
              )}
            </strong>
          </td>
          <td>${echapperHtml(horaires || '—')}</td>
          <td>${echapperHtml(session.formation || '—')}</td>
          <td>${echapperHtml(session.theme || '—')}</td>
          <td class="items-session-fiche">
            ${itemsTravailles}
          </td>
          <td>
            ${echapperHtml(
              formaterHeuresFormation(
                session.dureeHeures
              )
            )}
          </td>
        </tr>
      `;
    })
    .join('');
}

function gererErreurSuiviFicheStagiaire(
  uuid,
  erreur
) {
  const modal = document.getElementById(
    'modalFicheStagiaire'
  );

  if (!modal || modal.dataset.uuid !== uuid) {
    return;
  }

  afficherSessionsFicheStagiaire([]);
  afficherSuiviPedagogiqueFicheStagiaire([]);

  afficherToast(
    'Le suivi des sessions n’a pas pu être chargé : ' +
    extraireMessageErreur(erreur),
    true
  );
}

function formaterHeuresFormation(valeur) {
  const nombre = Number(valeur);

  if (!Number.isFinite(nombre)) {
    return '0 h';
  }

  return nombre.toLocaleString(
    'fr-FR',
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  ) + ' h';
}

function gererClavierFicheStagiaire(evenement) {
  if (evenement.key === 'Escape') {
    fermerFicheStagiaire();
  }
}

function fermerFicheStagiaire() {
  const modal = document.getElementById(
    'modalFicheStagiaire'
  );

  if (modal) {
    modal.remove();
  }

  document.removeEventListener(
    'keydown',
    gererClavierFicheStagiaire
  );

  document.body.classList.remove('modal-ouverte');
}

function calculerEcheanceStage(dateIso) {
  if (!dateIso) {
    return '—';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return '—';
  }

  const dateStage = new Date(
    Number(parties[0]),
    Number(parties[1]) - 1,
    Number(parties[2])
  );

  const aujourdHui = new Date();
  aujourdHui.setHours(0, 0, 0, 0);

  const difference = Math.ceil(
    (
      dateStage.getTime() -
      aujourdHui.getTime()
    ) / 86400000
  );

  if (difference > 0) {
    return 'J-' + difference;
  }

  if (difference === 0) {
    return 'J';
  }

  return 'J+' + Math.abs(difference);
}

function afficherDateFrancaise(dateIso) {
  if (!dateIso) {
    return '';
  }

  const parties = String(dateIso).split('-');

  if (parties.length !== 3) {
    return dateIso;
  }

  return (
    parties[2] +
    '/' +
    parties[1] +
    '/' +
    parties[0]
  );
}

function dateDuJourPourChamp() {
  const date = new Date();

  const annee = date.getFullYear();
  const mois = String(date.getMonth() + 1)
    .padStart(2, '0');

  const jour = String(date.getDate())
    .padStart(2, '0');

  return annee + '-' + mois + '-' + jour;
}

function echapperHtml(valeur) {
  return String(valeur ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function chargerDonneesReferentiel() {
  const formation =
    etatApplication.formationReferentielActive;

  if (!formation) {
    return;
  }

  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargementReferentiel() {
    chargementsTermines++;

    if (
      chargementsTermines === 2 &&
      !erreurRencontree &&
      etatApplication.formationReferentielActive ===
        formation
    ) {
      afficherListeCategoriesReferentiel();
      afficherListeItemsReferentiel();

      const boutonItem = document.getElementById(
        'boutonNouvelItemReferentiel'
      );

      if (boutonItem) {
        boutonItem.disabled =
          !etatApplication.categoriesReferentiel.length;
      }

      masquerLoader();
    }
  }

  function erreurChargementReferentiel(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (categories) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.categoriesReferentiel =
        Array.isArray(categories) ? categories : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getCategoriesReferentiel(formation);

  google.script.run
    .withSuccessHandler(function (items) {
      if (
        etatApplication.formationReferentielActive !==
        formation
      ) {
        return;
      }

      etatApplication.itemsReferentiel =
        Array.isArray(items) ? items : [];

      terminerChargementReferentiel();
    })
    .withFailureHandler(erreurChargementReferentiel)
    .getItemsReferentiel(formation);
}

              title="Monter"
              aria-label="Monter ${echapperHtml(item.intitule)}"

            >

            <button
              type="button"
              class="bouton-icone action-referentiel"
              onclick="deplacerItemReferentiel('${item.idItem}', 1)"
              title="Descendre"
              aria-label="Descendre ${echapperHtml(item.intitule)}"
              ${position === itemsCategorie.length - 1 ? 'disabled' : ''}
            >

              type="button"
              class="bouton-icone action-referentiel"
              onclick="modifierItemReferentiel('${item.idItem}')"
              title="Modifier"
              aria-label="Modifier ${echapperHtml(item.intitule)}"
            >

              type="button"
              class="bouton-action-statut-referentiel action-referentiel"
              data-item-id="${echapperHtml(item.idItem)}"
              data-actif-cible="${item.actif ? 'false' : 'true'}"
              onclick="basculerItemReferentiel(this)"
              title="${item.actif ? 'Désactiver' : 'Activer'}"
              aria-label="${item.actif ? 'Désactiver' : 'Activer'} ${echapperHtml(item.intitule)}"
              ${actionEnCours ? 'disabled' : ''}
            >
              <span aria-hidden="true">
                ${actionEnCours ? '…' : item.actif ? '⏸' : '▶'}
              </span>
              ${actionEnCours
                ? 'Mise à jour…'
                : item.actif
                  ? 'Désactiver'
                  : 'Activer'}
            </button>

            ${suppression}
          </td>
        </tr>
      `;
    })
    .join('');
}

function basculerItemReferentiel(cible, actifExplicite) {
  const element = cible && cible.dataset
    ? cible
    : null;

  const idItem = String(
    element ? element.dataset.itemId : cible || ''
  ).trim();

  const item = etatApplication.itemsReferentiel.find(
    function (elementItem) {
      return elementItem.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (etatApplication.itemsReferentielEnCours[idItem]) {
    return;
  }

  const nouvelEtat = element
    ? element.dataset.actifCible === 'true'
    : Boolean(actifExplicite);

  const ancienEtat = Boolean(item.actif);

  etatApplication.itemsReferentielEnCours[idItem] = true;
  item.actif = nouvelEtat;
  afficherListeItemsReferentiel();

  google.script.run
    .withSuccessHandler(function (resultat) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = Boolean(resultat.actif);
      afficherListeItemsReferentiel();

      afficherToast(
        resultat.message || 'Item mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(function (erreur) {
      delete etatApplication.itemsReferentielEnCours[
        idItem
      ];

      item.actif = ancienEtat;
      afficherListeItemsReferentiel();

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .basculerActifItemReferentiel(
      idItem,
      nouvelEtat
    );
}

function supprimerCategorieReferentielInterface(
  idCategorie
) {
  const categorie =
    etatApplication.categoriesReferentiel.find(
      function (element) {
        return element.idCategorie === idCategorie;
      }
    );

  if (!categorie) {
    afficherToast('Catégorie introuvable.', true);
    return;
  }

  if (categorie.utilisee) {
    basculerCategorieReferentiel(idCategorie, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement la catégorie « ' +
    categorie.intitule +
    ' » et ses items jamais utilisés ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerCategorieReferentiel',
    [idCategorie]
  );
}

function supprimerItemReferentielInterface(idItem) {
  const item = etatApplication.itemsReferentiel.find(
    function (element) {
      return element.idItem === idItem;
    }
  );

  if (!item) {
    afficherToast('Item pédagogique introuvable.', true);
    return;
  }

  if (item.utilise) {
    basculerItemReferentiel(idItem, false);
    return;
  }

  const confirmation = window.confirm(
    'Supprimer définitivement l’item « ' +
    item.intitule +
    ' » ?'
  );

  if (!confirmation) {
    return;
  }

  executerActionReferentiel(
    'supprimerItemReferentiel',
    [idItem]
  );
}

function executerActionReferentiel(nomFonction, parametres) {
  afficherLoader();

  const execution = google.script.run
    .withSuccessHandler(function (resultat) {
      afficherToast(
        resultat.message || 'Référentiel mis à jour.',
        false
      );

      chargerDonneesReferentiel();
    })
    .withFailureHandler(gererErreurServeur);

  if (nomFonction === 'deplacerItemReferentiel') {
    execution.deplacerItemReferentiel(
      parametres[0],
      parametres[1]
    );
    return;
  }

  if (nomFonction === 'deplacerCategorieReferentiel') {
    execution.deplacerCategorieReferentiel(
      parametres[0],
      parametres[1]
    );
    return;
  }

  if (
    nomFonction === 'basculerActifCategorieReferentiel'
  ) {
    execution.basculerActifCategorieReferentiel(
      parametres[0],
      parametres[1]
    );
    return;
  }

  if (nomFonction === 'supprimerCategorieReferentiel') {
    execution.supprimerCategorieReferentiel(
      parametres[0]
    );
    return;
  }

  execution.supprimerItemReferentiel(parametres[0]);
}

function initialiserPageSessions() {
  afficherLoader();

  let chargementsTermines = 0;
  let erreurRencontree = false;

  function terminerChargementSession() {
    chargementsTermines++;

    if (
      chargementsTermines === 2 &&
      !erreurRencontree
    ) {
      afficherListeSessions();
      preparerFormulaireSession();
      masquerLoader();
    }
  }

  function erreurChargementSession(erreur) {
    if (erreurRencontree) {
      return;
    }

    erreurRencontree = true;
    gererErreurServeur(erreur);
  }

  google.script.run
    .withSuccessHandler(function (sessions) {
      etatApplication.sessions =
        Array.isArray(sessions) ? sessions : [];

      terminerChargementSession();
    })
    .withFailureHandler(erreurChargementSession)
    .getSessions();

  google.script.run
    .withSuccessHandler(function (preparation) {
      const donnees = preparation || {};

      etatApplication.stagiairesSession =
        Array.isArray(donnees.stagiaires)
          ? donnees.stagiaires
          : [];

      etatApplication.formateursSession =
        Array.isArray(donnees.formateurs)
          ? donnees.formateurs
          : [];

      etatApplication.formationsSession =
        Array.isArray(donnees.formations)
          ? donnees.formations
          : [];

      terminerChargementSession();
    })
    .withFailureHandler(erreurChargementSession)
    .getPreparationSession();
}

function afficherListeSessions() {
  const corps = document.getElementById(
    'corpsTableauSessions'
  );

  if (!corps) {
    return;
  }

  const sessions = etatApplication.sessions;
  const compteur = document.getElementById(
    'compteurSessions'
  );

  if (compteur) {
    compteur.textContent =
      sessions.length +
      (sessions.length > 1
        ? ' séances enregistrées'
        : ' séance enregistrée');
  }

  if (!sessions.length) {
    corps.innerHTML = `
      <tr>
        <td colspan="7" class="etat-vide">
          Aucune séance enregistrée pour le moment.
        </td>
      </tr>
    `;
    return;
  }

  corps.innerHTML = sessions
    .map(function (session) {
      const horaires = [
        session.heureDebut,
        session.heureFin
      ]
        .filter(Boolean)
        .join(' – ');

      const formateurs = Array.isArray(
        session.formateurs
      ) && session.formateurs.length
        ? session.formateurs
          .map(echapperHtml)
          .join('<br>')
        : '—';

      return `
        <tr>
          <td>
            <strong>
              ${echapperHtml(
                afficherDateFrancaise(session.date) || '—'
              )}
            </strong>
          </td>
          <td>${echapperHtml(horaires || '—')}</td>
          <td>
            <span class="badge-formation-session">
              ${echapperHtml(session.formation || '—')}
            </span>
          </td>
          <td>${formateurs}</td>
          <td>
            <span class="nombre-participants-session">
              ${Number(session.nombreStagiaires) || 0}
            </span>
          </td>
          <td>
            ${echapperHtml(
              formaterHeuresFormation(
                session.dureeHeures
              )
            )}
          </td>
          <td class="remarques-tableau-session">
            ${echapperHtml(session.remarques || '—')}
          </td>
        </tr>
      `;
    })
    .join('');
}

  etatApplication.itemsTravaillesSession = {};
  etatApplication.referentielSession = [];
  etatApplication.formationReferentielSession = '';

  afficherItemsTravaillesSession();

      zone.innerHTML = `

        extraireMessageErreur(erreur),

  const formation = String(
    document.getElementById('sessionFormation')
      ?.value || ''
  );

  if (!formation) {
    zone.innerHTML = `
      <div class="etat-selection-session">
        Choisis d’abord une formation.
      </div>
    `;
    mettreAJourCompteursParticipantsSession();
    return;
  }

  const stagiaires = etatApplication.stagiairesSession
    .filter(function (stagiaire) {
      return (
        stagiaire.statut === 'À préparer' &&
        stagiaire.formation === formation
      );
    });

  if (!stagiaires.length) {
    zone.innerHTML = `
      <div class="etat-selection-session">
        Aucun stagiaire « À préparer » pour cette formation.
      </div>
    `;
    mettreAJourCompteursParticipantsSession();
    return;
  }

  zone.innerHTML = stagiaires
    .map(function (stagiaire) {
      return `
        <label class="option-selection-session">
          <input
            type="checkbox"
            name="stagiaireSession"
            value="${echapperHtml(stagiaire.uuid)}"
            onchange="changerStagiairesSession()"
          >
          <span>
            <strong>${echapperHtml(stagiaire.nom)}</strong>
            ${echapperHtml(stagiaire.prenom)}
          </span>
        </label>
      `;
    })
    .join('');

  mettreAJourCompteursParticipantsSession();
}

function changerStagiairesSession() {
  capturerValidationsSession();
  mettreAJourCompteursParticipantsSession();
  afficherValidationsSession();
}

function mettreAJourCompteursParticipantsSession() {
  const nombreFormateurs = document.querySelectorAll(
    'input[name="formateurSession"]:checked'
  ).length;

  const nombreStagiaires = document.querySelectorAll(
    'input[name="stagiaireSession"]:checked'
  ).length;

  const compteurFormateurs = document.getElementById(
    'compteurFormateursSession'
  );

  const compteurStagiaires = document.getElementById(
    'compteurStagiairesSession'
  );

  if (compteurFormateurs) {
    compteurFormateurs.textContent =
      nombreFormateurs +
      (nombreFormateurs > 1
        ? ' sélectionnés'
        : ' sélectionné');
  }

  if (compteurStagiaires) {
    compteurStagiaires.textContent =
      nombreStagiaires +
      (nombreStagiaires > 1
        ? ' sélectionnés'
        : ' sélectionné');
  }
}

function obtenirIdsStagiairesSession() {
  return [...document.querySelectorAll(
    'input[name="stagiaireSession"]:checked'
  )].map(function (champ) {
    return champ.value;
  });
}

function obtenirItemsTravaillesSession() {
  const items = [];

  etatApplication.referentielSession.forEach(
    function (categorie) {
      categorie.items.forEach(function (item) {
        if (
          etatApplication.itemsTravaillesSession[
            item.idItem
          ]
        ) {
          items.push(item);
        }
      });
    }
  );

  return items;
}

function afficherItemsTravaillesSession() {
  const zone = document.getElementById(
    'zoneItemsTravaillesSession'
  );

  const aide = document.getElementById(
    'aideItemsTravaillesSession'
  );

  if (!zone || !aide) {
    return;
  }

  const formation = String(
    document.getElementById('sessionFormation')
      ?.value || ''
  );

  if (!formation) {
    aide.textContent =
      'Choisis une formation pour charger son référentiel.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item à afficher.
      </div>
    `;
    return;
  }

  if (
    etatApplication.formationReferentielSession !==
    formation
  ) {
    aide.textContent = 'Chargement du référentiel…';
    return;
  }

  if (!etatApplication.referentielSession.length) {
    aide.textContent =
      'La séance peut être enregistrée sans item travaillé.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item pédagogique configuré pour cette formation.
      </div>
    `;
    return;
  }

  const nombreSelectionne =
    obtenirItemsTravaillesSession().length;

  aide.textContent = nombreSelectionne
    ? nombreSelectionne +
      (nombreSelectionne > 1
        ? ' items sélectionnés pour toute la séance.'
        : ' item sélectionné pour toute la séance.')
    : 'Coche uniquement les items réellement travaillés pendant la séance.';

  zone.innerHTML = etatApplication.referentielSession
    .map(function (categorie) {
      return creerCategorieItemsTravaillesSession(
        categorie
      );
    })
    .join('');
}

function creerCategorieItemsTravaillesSession(categorie) {
  const toutSelectionne = categorie.items.every(
    function (item) {
      return Boolean(
        etatApplication.itemsTravaillesSession[
          item.idItem
        ]
      );
    }
  );

  const nombreSelectionne = categorie.items.filter(
    function (item) {
      return Boolean(
        etatApplication.itemsTravaillesSession[
          item.idItem
        ]
      );
    }
  ).length;

  const items = categorie.items
    .map(function (item) {
      const description = item.description
        ? `
          <small>${echapperHtml(item.description)}</small>
        `
        : '';

      return `
        <label class="ligne-item-travaille-session">
          <input
            type="checkbox"
            value="${echapperHtml(item.idItem)}"
            ${etatApplication.itemsTravaillesSession[item.idItem]
              ? 'checked'
              : ''}
            onchange="changerItemTravailleSession(this)"
          >
          <span class="libelle-item-referentiel-session">
            <span>${echapperHtml(item.libelle)}</span>
            ${description}
          </span>
        </label>
      `;
    })
    .join('');

  return `
    <div class="categorie-referentiel-session categorie-items-travailles-session">
      <div class="entete-categorie-items-session">
        <h4>${echapperHtml(categorie.libelle)}</h4>
        <div>
          <span class="compteur-categorie-items-session">
            ${nombreSelectionne}/${categorie.items.length}
          </span>
          <button
            type="button"
            class="bouton-lien-session"
            onclick="basculerCategorieItemsSession('${echapperHtml(categorie.idCategorie)}', ${!toutSelectionne})"
          >
            ${toutSelectionne ? 'Tout décocher' : 'Tout cocher'}
          </button>
        </div>
      </div>
      <div class="liste-items-referentiel-session">
        ${items}
      </div>
    </div>
  `;
}

function changerItemTravailleSession(champ) {
  capturerValidationsSession();

  if (champ.checked) {
    etatApplication.itemsTravaillesSession[
      champ.value
    ] = true;
  } else {
    delete etatApplication.itemsTravaillesSession[
      champ.value
    ];
  }

  afficherItemsTravaillesSession();
  afficherValidationsSession();
}

function basculerCategorieItemsSession(
  idCategorie,
  selectionner
) {
  capturerValidationsSession();

  const categorie =
    etatApplication.referentielSession.find(
      function (element) {
        return element.idCategorie === idCategorie;
      }
    );

  if (!categorie) {
    return;
  }

  categorie.items.forEach(function (item) {
    if (selectionner) {
      etatApplication.itemsTravaillesSession[
        item.idItem
      ] = true;
    } else {
      delete etatApplication.itemsTravaillesSession[
        item.idItem
      ];
    }
  });

  afficherItemsTravaillesSession();
  afficherValidationsSession();
}

function afficherValidationsSession() {
  const zone = document.getElementById(
    'zoneValidationsSession'
  );

  const aide = document.getElementById(
    'aideValidationsSession'
  );

  if (!zone || !aide) {
    return;
  }

  const idsStagiaires = obtenirIdsStagiairesSession();
  const itemsTravailles = obtenirItemsTravaillesSession();

  if (!idsStagiaires.length) {
    aide.textContent =
      'Sélectionne les stagiaires présents.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun stagiaire présent sélectionné.
      </div>
    `;
    return;
  }

  if (!itemsTravailles.length) {
    aide.textContent =
      'Sélectionne les items travaillés pendant la séance.';

    zone.innerHTML = `
      <div class="etat-referentiel-session">
        Aucun item travaillé sélectionné.
      </div>
    `;
    return;
  }

  const idsItems = new Set(
    itemsTravailles.map(function (item) {
      return item.idItem;
    })
  );

  const categories = etatApplication.referentielSession
    .map(function (categorie) {
      return {
        idCategorie: categorie.idCategorie,
        libelle: categorie.libelle,
        items: categorie.items.filter(function (item) {
          return idsItems.has(item.idItem);
        })
      };
    })
    .filter(function (categorie) {
      return categorie.items.length;
    });

  const stagiaires = idsStagiaires
    .map(function (idStagiaire) {
      return etatApplication.stagiairesSession.find(
        function (stagiaire) {
          return stagiaire.uuid === idStagiaire;
        }
      );
    })
    .filter(Boolean);

  aide.textContent =
    'Pour chaque présent, indique seulement les acquis et les commentaires utiles.';

  zone.innerHTML = stagiaires
    .map(function (stagiaire, indexStagiaire) {
      return creerValidationsStagiaireSession(
        stagiaire,
        categories,
        indexStagiaire === 0
      );
    })
    .join('');
}

function creerValidationsStagiaireSession(
  stagiaire,
  categories,
  ouvert
) {
  const contenu = categories
    .map(function (categorie) {
      const items = categorie.items
        .map(function (item) {
          return creerItemValidationSession(
            stagiaire.uuid,
            item
          );
        })
        .join('');

      return `
        <div class="categorie-referentiel-session">
          <h4>${echapperHtml(categorie.libelle)}</h4>
          <div class="liste-items-referentiel-session">
            ${items}
          </div>
        </div>
      `;
    })
    .join('');

  const nombreItems = categories.reduce(
    function (total, categorie) {
      return total + categorie.items.length;
    },
    0
  );

  return `
    <details
      class="referentiel-stagiaire-session"
      data-stagiaire-id="${echapperHtml(stagiaire.uuid)}"
      ${ouvert ? 'open' : ''}
    >
      <summary>
        <span>
          ${echapperHtml(stagiaire.prenom)}
          <strong>${echapperHtml(stagiaire.nom)}</strong>
        </span>
        <span class="resume-referentiel-stagiaire">
          ${nombreItems}
          ${nombreItems > 1 ? 'items travaillés' : 'item travaillé'}
        </span>
      </summary>
      <div class="contenu-referentiel-stagiaire">
        ${contenu}
      </div>
    </details>
  `;
}

function creerItemValidationSession(
  idStagiaire,
  item
) {
  const cle = idStagiaire + '::' + item.idItem;
  const validation =
    etatApplication.validationsSession[cle] || {};

  const description = item.description
    ? `
      <small>
        ${echapperHtml(item.description)}
      </small>
    `
    : '';

  return `
    <div
      class="ligne-item-referentiel-session"
      data-item-id="${echapperHtml(item.idItem)}"
    >
      <div class="libelle-item-referentiel-session">
        <span>${echapperHtml(item.libelle)}</span>
        ${description}
      </div>

      <label class="validation-item-session validation-acquis-session">
        <input
          type="checkbox"
          class="validation-acquis-session-champ"
          ${validation.acquis ? 'checked' : ''}
          onchange="synchroniserValidationItemSession(this)"
        >
        <span>Acquis</span>
      </label>

      <input
        type="text"
        class="champ commentaire-item-session"
        value="${echapperHtml(validation.commentaire || '')}"
        placeholder="Commentaire facultatif"
        oninput="synchroniserValidationItemSession(this)"
      >
    </div>
  `;
}

function synchroniserValidationItemSession(champ) {
  const ligne = champ.closest(
    '.ligne-item-referentiel-session'
  );

  if (!ligne) {
    return;
  }

  const blocStagiaire = ligne.closest(
    '.referentiel-stagiaire-session'
  );

  if (!blocStagiaire) {
    return;
  }

  const idStagiaire = blocStagiaire.dataset.stagiaireId;
  const idItem = ligne.dataset.itemId;
  const acquis = ligne.querySelector(
    '.validation-acquis-session-champ'
  ).checked;

  const commentaire = ligne.querySelector(
    '.commentaire-item-session'
  ).value.trim();

  const cle = idStagiaire + '::' + idItem;

  if (acquis || commentaire) {
    etatApplication.validationsSession[cle] = {
      idStagiaire: idStagiaire,
      idItem: idItem,
      acquis: acquis,
      commentaire: commentaire
    };
  } else {
    delete etatApplication.validationsSession[cle];
  }
}

function capturerValidationsSession() {
  document
    .querySelectorAll('.referentiel-stagiaire-session')
    .forEach(function (blocStagiaire) {
      const idStagiaire =
        blocStagiaire.dataset.stagiaireId;

      blocStagiaire
        .querySelectorAll(
          '.ligne-item-referentiel-session'
        )
        .forEach(function (ligne) {
          const idItem = ligne.dataset.itemId;
          const cle = idStagiaire + '::' + idItem;

          const acquis = ligne.querySelector(
            '.validation-acquis-session-champ'
          ).checked;

          const commentaire = ligne.querySelector(
            '.commentaire-item-session'
          ).value.trim();

          if (acquis || commentaire) {
            etatApplication.validationsSession[cle] = {
              idStagiaire: idStagiaire,
              idItem: idItem,
              acquis: acquis,
              commentaire: commentaire
            };
          } else {
            delete etatApplication.validationsSession[cle];
          }
        });
    });
}

function mettreAJourDureeSession() {
  const zone = document.getElementById(
    'indicationDureeSession'
  );

  if (!zone) {
    return;
  }

  const debut = String(
    document.getElementById('sessionHeureDebut')
      ?.value || ''
  );

  const fin = String(
    document.getElementById('sessionHeureFin')
      ?.value || ''
  );

  if (!debut || !fin) {
    zone.textContent = 'Durée calculée : —';
    zone.classList.remove('erreur');
    return;
  }

  const minutesDebut = convertirHeureEnMinutes(debut);
  const minutesFin = convertirHeureEnMinutes(fin);
  const duree = (minutesFin - minutesDebut) / 60;

  if (duree <= 0) {
    zone.textContent =
      'L’heure de fin doit être postérieure au début.';
    zone.classList.add('erreur');
    return;
  }

  zone.textContent =
    'Durée calculée : ' +
    formaterHeuresFormation(duree);

  zone.classList.remove('erreur');
}

function convertirHeureEnMinutes(heure) {
  const parties = String(heure).split(':');

  return (
    Number(parties[0]) * 60 +
    Number(parties[1])
  );
}

function soumettreSession(evenement) {
  evenement.preventDefault();
  capturerValidationsSession();

  const formateurs = [...document.querySelectorAll(
    'input[name="formateurSession"]:checked'
  )].map(function (champ) {
    return champ.value;
  });

  const stagiaires = obtenirIdsStagiairesSession();

  if (!formateurs.length) {
    afficherToast(
      'Sélectionne au moins un formateur.',
      true
    );
    return;
  }

  if (!stagiaires.length) {
    afficherToast(
      'Sélectionne au moins un stagiaire.',
      true
    );
    return;
  }

  const idsStagiaires = new Set(stagiaires);
  const itemsTravailles = obtenirItemsTravaillesSession();
  const idsItemsTravailles = new Set(
    itemsTravailles.map(function (item) {
      return item.idItem;
    })
  );

  const validations = Object.keys(
    etatApplication.validationsSession
  )
    .map(function (cle) {
      return etatApplication.validationsSession[cle];
    })
    .filter(function (validation) {
      return (
        idsStagiaires.has(validation.idStagiaire) &&
        idsItemsTravailles.has(validation.idItem)
      );
    });

  const donnees = {
    date: document.getElementById('sessionDate').value,
    formation: document.getElementById(
      'sessionFormation'
    ).value,
    heureDebut: document.getElementById(
      'sessionHeureDebut'
    ).value,
    heureFin: document.getElementById(
      'sessionHeureFin'
    ).value,
    formateurs: formateurs,
    stagiaires: stagiaires,
    itemsTravailles: itemsTravailles.map(
      function (item) {
        return item.idItem;
      }
    ),
    remarques: document.getElementById(
      'sessionRemarques'
    ).value,
    validations: validations
  };

  const bouton = document.getElementById(
    'boutonEnregistrerSession'
  );

  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';

  google.script.run
    .withSuccessHandler(function (resultat) {
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer la séance';

      fermerModalSession();
      afficherToast(
        resultat.message || 'Séance enregistrée.',
        false
      );

      rechargerSessions();
    })
    .withFailureHandler(function (erreur) {
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer la séance';

      afficherToast(
        extraireMessageErreur(erreur),
        true
      );
    })
    .enregistrerSession(donnees);
}

function rechargerSessions() {
  afficherLoader();

  google.script.run
    .withSuccessHandler(function (sessions) {
      etatApplication.sessions =
        Array.isArray(sessions) ? sessions : [];

      afficherListeSessions();
      masquerLoader();
    })
    .withFailureHandler(gererErreurServeur)
    .getSessions();
}

</script>
